<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ГСВ v1308 ISOLATED</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f1f5f9}
.header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);flex-wrap:wrap;gap:8px}
.btn{padding:9px 14px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px}
.btn-orange{background:#f97316;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-gray{background:#1f2937;color:#fff}.btn-red{background:#dc2626;color:#fff}.btn-blue{background:#2563eb;color:#fff}
#map{height:75vh;width:100%;border:3px solid #111;border-radius:10px}
.leaflet-editing-icon{width:22px!important;height:22px!important;margin-left:-11px!important;margin-top:-11px!important;background:#fff!important;border:3px solid #ef4444!important;border-radius:50%!important;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.4)!important}
.info{background:#dbeafe;padding:8px 10px;font-size:13px;border-left:4px solid #2563eb;margin-top:6px;border-radius:6px}
</style>
</head>
<body>
<div class="header">
<div><b id="deptName">БӨЛҮМ</b> <small style="color:#666">v1308 ISOLATED • Ар бөлүктүн өз аймагы</small> <small id="deptKey" style="color:#f97316"></small></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="btn btn-orange" onclick="startDraw()">📐 Аймак кошуу</button>
<button class="btn btn-blue" onclick="enableEdit()" id="editBtn">✏️ Түзөтүү</button>
<button class="btn btn-green" onclick="saveArea()">💾 Сактоо</button>
<button class="btn btn-red" onclick="clearAll()">🗑️ Өчүр</button>
<button class="btn btn-gray" onclick="location.href='admin.html'">← Артка</button>
</div>
</div>
<div style="padding:8px;display:flex;gap:8px"><div style="background:#fff;padding:8px 12px;border-radius:8px">Аймактар: <b id="s_areas" style="color:#f97316">0</b></div><div style="background:#fff;padding:8px 12px;border-radius:8px">Бөлүм: <b id="s_dept">ГСВ №10</b></div><button class="btn btn-gray" style="padding:4px 8px;font-size:11px" onclick="cleanGlobalKeys()">🧹 Эски жалпы ключтарды тазалоо</button></div>
<div style="padding:0 8px"><div id="map"></div><div class="info" id="info">Жүктөлүүдө...</div></div>
<script>
const urlParams=new URLSearchParams(location.search);
const deptId=urlParams.get('d')||'ГСВ №10';
document.getElementById('deptName').innerText=deptId;
document.getElementById('s_dept').innerText=deptId;
const STORAGE_KEY='gps_area_'+deptId; // МИСАЛЫ: gps_area_ГСВ №10, gps_area_ГСВ №5
document.getElementById('deptKey').innerText='['+STORAGE_KEY+']';
let map=L.map('map').setView([40.114,71.74],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let drawnItems=new L.FeatureGroup(); map.addLayer(drawnItems);
let polygons=[]; let editing=false;

function cleanGlobalKeys(){
 if(confirm('Эски жалпы ключтар dept_area_GSV_10, kadamjay_area өчүрүлсүнбү? Бул баардык бөлүктөрдө чыгып калган аймакты тазалап, ар бөлүктү өзүнчө кылат.')){
   localStorage.removeItem('dept_area_GSV_10'); localStorage.removeItem('kadamjay_area'); localStorage.removeItem('gps_area_ГСВ №10');
   alert('Тазаланды! Эми ар бөлүктү өз-өзүнчө ачып, кайра чийиңиз.');
   location.reload();
 }
}

function updateCount(){ document.getElementById('s_areas').innerText=polygons.length; document.getElementById('info').innerHTML=`📍 <b>${deptId}</b> үчүн ${polygons.length} аймак. Бул аймак тек ушул бөлүккө гана таандык, башка бөлүккө чыкпайт.`; }
function clearAll(){ if(!confirm(`${deptId} - ${polygons.length} аймак өчүрүлсүнбү? Тек ушул бөлүктүн аймагы өчөт.`)) return; drawnItems.clearLayers(); polygons=[]; localStorage.removeItem(STORAGE_KEY); updateCount(); }

function startDraw(){
 let drawer=new L.Draw.Polygon(map,{allowIntersection:false,showArea:true,shapeOptions:{color:'#ff6a00',fillColor:'#ff9a3d',fillOpacity:0.35,weight:4}});
 drawer.enable();
 document.getElementById('info').innerHTML='📐 Чийип жатасыз...';
 map.once(L.Draw.Event.CREATED,function(e){
   let poly=e.layer; drawnItems.addLayer(poly); polygons.push(poly); updateCount();
   document.getElementById('info').innerHTML=`✅ Аймак ${polygons.length} кошулду → 💾 Сактоо басыңыз (тек ${deptId} га сакталат)`;
 });
}
function enableEdit(){
 if(polygons.length===0){ alert('Аймак жок!'); return; }
 if(!editing){
   polygons.forEach(p=>p.editing.enable()); editing=true;
   document.getElementById('editBtn').innerText='✅ Бүтүр'; document.getElementById('editBtn').className='btn btn-green';
   map.dragging.disable();
   document.getElementById('info').innerHTML='🔧 Түзөтүү: чоң ак чекиттерди сүйрөңүз. Карта жылбайт.';
 }else{
   polygons.forEach(p=>p.editing.disable()); editing=false;
   document.getElementById('editBtn').innerText='✏️ Түзөтүү'; document.getElementById('editBtn').className='btn btn-blue';
   map.dragging.enable();
   document.getElementById('info').innerHTML='✅ Бүттү → 💾 Сактоо';
 }
}
function saveArea(){
 if(polygons.length===0){ alert('Аймак жок!'); return; }
 if(editing){ polygons.forEach(p=>p.editing.disable()); editing=false; map.dragging.enable(); document.getElementById('editBtn').innerText='✏️ Түзөтүү'; document.getElementById('editBtn').className='btn btn-blue'; }
 let allAreas=polygons.map(p=>p.getLatLngs()[0].map(ll=>[ll.lat,ll.lng]));
 // === v1308 FIX: ТЕК ӨЗ БӨЛҮГҮНӨ САКТАЙТ ===
 localStorage.setItem(STORAGE_KEY, JSON.stringify(allAreas));
 // ЭСКИ ЖАЛПЫ КЛЮЧТАРДЫ ЖАЗБАЙБЫЗ!
 document.getElementById('info').innerHTML=`💾 ✅ ${allAreas.length} аймак <b>${deptId}</b> үчүн сакталды! Key: ${STORAGE_KEY}. Башка бөлүккө чыкпайт.`;
 alert(`✅ ${deptId} үчүн ${allAreas.length} аймак сакталды!\nKey: ${STORAGE_KEY}\nЭми башка бөлүккө чыкпайт.`);
}
function loadSaved(){
 // === v1308 FIX: ТЕК ӨЗ БӨЛҮГҮНҮН КЛЮЧУН ОКУЙТ ===
 let saved=localStorage.getItem(STORAGE_KEY);
 if(!saved){
   document.getElementById('info').innerHTML=`ℹ️ ${deptId} үчүн аймак жок (Key: ${STORAGE_KEY}). Жаңы чийиңиз. Бул бөлүктүн өз аймагы болот.`;
   updateCount(); return;
 }
 try{
   let data=JSON.parse(saved); let areas=(Array.isArray(data[0])&&typeof data[0][0]==='number')?[data]:data;
   areas.forEach(latlngs=>{ let poly=L.polygon(latlngs,{color:'#ff6a00',fillColor:'#ff9a3d',fillOpacity:0.4,weight:3}).addTo(drawnItems); polygons.push(poly); });
   if(polygons.length>0){ let g=new L.featureGroup(polygons); map.fitBounds(g.getBounds().pad(0.2)); }
   updateCount();
   document.getElementById('info').innerHTML=`✅ ${deptId} үчүн ${polygons.length} аймак жүктөлдү (Key: ${STORAGE_KEY})`;
 }catch(e){ updateCount(); }
}
loadSaved();
</script>
</body>
</html>
