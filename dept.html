<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бөлүм - График</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}.layout{display:grid;grid-template-columns:1.6fr.9fr;gap:10px;padding:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}}#map{height:55vh;border-radius:16px;border:1px solid #e2e8f0}.card{background:#fff;border-radius:14px;padding:12px;border:1px solid #eef2f7;margin-bottom:10px}.btn{border:0;border-radius:9px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:11px}.btn-dark{background:#0f172a;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-ghost{background:#f1f5f9}.select{border:1px solid #e2e8f0;border-radius:8px;padding:6px 8px;font-size:12px}.badge{padding:4px 9px;border-radius:99px;font-size:11px;font-weight:700;display:inline-flex}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.assign{padding:10px;background:#f8fafc;border-radius:12px;margin-bottom:8px;border:1px solid #f1f5f9}table{width:100%;border-collapse:collapse}th{font-size:10px;color:#64748b;text-align:left;padding:5px;border-bottom:1px solid #eef2f7}td{padding:6px 5px;border-bottom:1px solid #f1f5f9;font-size:12px}</style></head><body><header><div style="display:flex;gap:10px;align-items:center"><button class="btn btn-ghost" onclick="location.href='admin.html'">← Башкы</button><div><b id="deptName"></b><br><small id="deptInfo" style="color:#64748b"></small></div></div><button class="btn btn-dark" onclick="exportCSV()">⬇️ Excel</button></header><div class="layout"><div><div id="map"></div><div class="card" style="margin-top:10px"><b>🗺️ Зоналар</b> <small id="zoneCount"></small><div id="zonesList" style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"></div><div class="row" style="margin-top:8px"><input id="zoneName" class="select" placeholder="Зона аты"><button class="btn btn-dark" onclick="startDraw()">✏️ Чийүү</button><button class="btn btn-green" onclick="finishZone()">✅ Сактоо</button></div></div><div class="card" style="border:2px solid #0064e02a"><b>👥 Жумушчу + График бекитүү</b><small style="display:block;color:#64748b">Ар бир жумушчунун келүү/кетүү саатын кой</small><div id="assignList" style="margin-top:10px"></div></div></div><div><div class="card" style="border-left:5px solid #16a34a"><b>🟢 Жумушта</b><div id="inList"></div></div><div class="card" style="border-left:5px solid #ef4444"><b>🔴 Сыртта</b><div id="outList"></div></div><div class="card"><b>🕒 Бүгүн - Келди / Кетти + График</b><div id="historyTable"></div></div><div class="card"><b>📜 Лог</b><div id="logBox" style="font-size:11px;max-height:160px;overflow:auto"></div></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let map=L.map('map').setView([40.13,71.75],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);const deptId=new URLSearchParams(location.search).get('dept')||'kdo';let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'null')||[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let dept=DEPTS.find(d=>d.id==deptId)||DEPTS[0];document.getElementById('deptName').innerText=dept.name;document.getElementById('deptName').style.color=dept.color;let allZones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');let zones=allZones.filter(z=>z.deptId==dept.id);let assignRaw=JSON.parse(localStorage.getItem('kadamjai_assign_v2')||'{}');function normalize(){let n={};Object.keys(assignRaw).forEach(k=>{let v=assignRaw[k];if(typeof v==='string') n[k]={deptId:v,start:'08:00',end:'17:00'};else n[k]=v;});return n;}let assign=normalize();let pts=[],polyTemp=null,drawing=false,zoneLayers=[],markers={},workersCache={},logs=JSON.parse(localStorage.getItem('kadamjai_history_'+dept.id)||'[]'),prev={};function save(){localStorage.setItem('kadamjai_zones_v3',JSON.stringify(allZones));}function saveAssign(){localStorage.setItem('kadamjai_assign_v2',JSON.stringify(assign));localStorage.setItem('kadamjai_assign',JSON.stringify(Object.fromEntries(Object.entries(assign).map(([k,v])=>[k,v.deptId]))));db.ref('osh/assign_v2').set(assign);}function renderZones(){zoneLayers.forEach(l=>map.removeLayer(l));zoneLayers=[];zones.forEach(z=>zoneLayers.push(L.polygon(z.points,{color:dept.color,weight:3,fillColor:dept.color,fillOpacity:.25}).addTo(map)));if(zones.length){try{map.fitBounds(L.latLngBounds(zones.flatMap(z=>z.points)).pad(.15))}catch(e){}}document.getElementById('zoneCount').innerText=zones.length+' зона';document.getElementById('zonesList').innerHTML=zones.map((z,i)=>`<span class="badge" style="background:${dept.color}15;color:${dept.color}">${z.name} <span onclick="delZone(${i})" style="color:#ef4444;cursor:pointer">✕</span></span>`).join('')||'<small>Жок</small>';}renderZones();map.on('click',e=>{if(!drawing)return;pts.push([e.latlng.lat,e.latlng.lng]);if(polyTemp) map.removeLayer(polyTemp);polyTemp=L.polygon(pts,{color:dept.color,dashArray:'6 6'}).addTo(map);});window.startDraw=function(){pts=[];if(polyTemp) map.removeLayer(polyTemp);drawing=true;alert('Картадан чий');};window.finishZone=function(){if(pts.length<3)return alert('3 чекит керек');let nz={id:Date.now().toString(),deptId:dept.id,name:document.getElementById('zoneName').value||`Зона ${zones.length+1}`,points:[...pts]};allZones.push(nz);zones.push(nz);pts=[];if(polyTemp){map.removeLayer(polyTemp);polyTemp=null;}drawing=false;document.getElementById('zoneName').value='';save();renderZones();};window.delZone=function(i){let gid=allZones.findIndex(z=>z.id==zones[i].id);if(gid>-1)allZones.splice(gid,1);zones.splice(i,1);save();renderZones();};function checkInside(lat,lng){for(let z of zones){let p=z.points;let ok=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];let inter=((yi>lng)!=(yj>lng))&&(lat<(xj-xi)*(lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok) return z;}return null;}function addLog(name,type,zone){let t=new Date();logs.unshift({time:t.toLocaleTimeString('ky-KG'),date:t.toLocaleDateString('ky-KG'),ts:Date.now(),name,type,zone});if(logs.length>400) logs=logs.slice(0,400);localStorage.setItem('kadamjai_history_'+dept.id,JSON.stringify(logs));renderHist();}function timeToMin(s){let [h,m]=s.split(':').map(Number);return h*60+m;}function renderHist(){document.getElementById('logBox').innerHTML=logs.slice(0,40).map(l=>`<div style="padding:3px 0;border-bottom:1px solid #f1f5f9"><small>${l.date} ${l.time}</small> <b>${l.name}</b> ${l.type=='in'?'🟢':'🔴'} ${l.zone||''}</div>`).join('');let today=new Date().toLocaleDateString('ky-KG');let byName={};logs.filter(l=>l.date==today).forEach(l=>{if(!byName[l.name]) byName[l.name]={in:null,out:null,inTs:null,outTs:null};if(l.type=='in'&&!byName[l.name].in){byName[l.name].in=l.time;byName[l.name].inTs=l.ts;}if(l.type=='out'){byName[l.name].out=l.time;byName[l.name].outTs=l.ts;}});let html='<table><tr><th>Аты</th><th>График</th><th>Келди</th><th>Кетти</th><th>Статус</th></tr>';Object.keys(byName).forEach(n=>{let wId=Object.keys(workersCache).find(id=>workersCache[id].name==n)||Object.keys(assign).find(id=>id==n);let sch=Object.values(assign).find(a=>{let wid=Object.keys(assign).find(k=>assign[k].deptId==dept.id&&workersCache[k]?.name==n);return wid&&assign[wid];});let a=Object.entries(assign).find(([k,v])=>workersCache[k]?.name==n&&v.deptId==dept.id);let start=a?a[1].start:'08:00';let end=a?a[1].end:'17:00';let status='';if(byName[n].in){let late=timeToMin(byName[n].in.slice(0,5))-timeToMin(start);if(late>10) status='<span style="color:#ef4444">⚠️ Кечикти '+late+'м</span>';else status='<span style="color:#16a34a">✅ Убагында</span>';}html+=`<tr><td><b>${n}</b></td><td>${start}-${end}</td><td style="color:#16a34a">${byName[n].in||'-'}</td><td style="color:#ef4444">${byName[n].out||'жумушта'}</td><td>${status}</td></tr>`;});document.getElementById('historyTable').innerHTML=html||'<small>Жок</small>';}function renderWorkers(){let inH='',outH='',assH='';let assigned=Object.keys(assign).filter(k=>assign[k].deptId==dept.id);assigned.forEach(wId=>{let w=workersCache[wId];let sch=assign[wId];if(w&&w._inside) inH+=`<div class="assign" style="background:${dept.color}10"><b>${w.name}</b><br><small>${w.zone} • График ${sch.start}-${sch.end}</small></div>`;else{let nm=w?w.name:wId;outH+=`<div class="assign" style="background:#fef2f2"><b>${nm}</b><br><small>🔴 Сыртта • График ${sch.start}-${sch.end}</small></div>`;}});Object.keys(workersCache).forEach(wId=>{let w=workersCache[wId];let cur=assign[wId];if(cur&&cur.deptId==dept.id){assH+=`<div class="assign"><div style="display:flex;justify-content:space-between"><b>${w.name}</b><button class="btn btn-red" onclick="unassign('${wId}')">✕</button></div><div class="row" style="margin-top:6px"><label><small>Келүү</small><br><input type="time" id="s-${wId}" value="${cur.start}" class="select" onchange="updateTime('${wId}')"></label><label><small>Кетүү</small><br><input type="time" id="e-${wId}" value="${cur.end}" class="select" onchange="updateTime('${wId}')"></label><small style="color:#16a34a">Бекитилген</small></div></div>`;}else{let label=cur?DEPTS.find(d=>d.id==cur.deptId)?.name||cur.deptId:'Бекитиле элек';assH+=`<div class="assign"><div style="display:flex;justify-content:space-between"><div><b>${w.name}</b><br><small style="color:#64748b">${label}</small></div><button class="btn btn-green" onclick="openAssign('${wId}')">+ Бекитүү</button></div><div id="edit-${wId}" style="display:none;margin-top:8px" class="row"><input type="time" id="ns-${wId}" value="08:00" class="select"><input type="time" id="ne-${wId}" value="17:00" class="select"><button class="btn btn-dark" onclick="doAssign('${wId}')">Сактоо</button></div></div>`;}});if(!Object.keys(workersCache).length) assH='<small style="color:#94a3b8">Азыр эч ким онлайн эмес</small>';document.getElementById('inList').innerHTML=inH||'<small>Жок</small>';document.getElementById('outList').innerHTML=outH||'<small>✅ Баары ордунда</small>';document.getElementById('assignList').innerHTML=assH;document.getElementById('deptInfo').innerText=`${zones.length} зона • ${assigned.length} бекитилген`;renderHist();}window.openAssign=function(wId){document.getElementById('edit-'+wId).style.display='flex';};window.doAssign=function(wId){let s=document.getElementById('ns-'+wId).value||'08:00';let e=document.getElementById('ne-'+wId).value||'17:00';assign[wId]={deptId:dept.id,start:s,end:e};saveAssign();renderWorkers();};window.updateTime=function(wId){let s=document.getElementById('s-'+wId).value;let e=document.getElementById('e-'+wId).value;assign[wId].start=s;assign[wId].end=e;saveAssign();renderHist();};window.unassign=function(wId){delete assign[wId];saveAssign();renderWorkers();};window.exportCSV=function(){let csv='Дата,Убакыт,Аты,Аракет,Зона,График\n'+logs.map(l=>`${l.date},${l.time},${l.name},${l.type},${l.zone||''}`).join('\n');let b=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=dept.name+'.csv';a.click();};db.ref('osh/assign_v2').on('value',s=>{if(s.val()){assignRaw=s.val();assign=normalize();renderWorkers();}});db.ref('osh/workers').on('value',snap=>{workersCache={};Object.values(markers).forEach(m=>map.removeLayer(m));markers={};snap.forEach(ch=>{let v=ch.val();let hit=checkInside(v.lat,v.lng);v._inside=!!hit;v.zone=hit?hit.name:'';if(prev[ch.key]!==v._inside){addLog(v.name,v._inside?'in':'out',v.zone);}prev[ch.key]=v._inside;workersCache[ch.key]=v;if(v._inside){let ic=L.divIcon({html:`<div style="background:${dept.color};color:#fff;padding:4px 8px;border-radius:99px;font-size:11px;font-weight:800;border:2px solid #fff">${v.name} 🟢</div>`,className:'',iconAnchor:[20,10]});markers[ch.key]=L.marker([v.lat,v.lng],{icon:ic}).addTo(map);}});renderWorkers();});renderZones();renderHist();</script></body></html>
