<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бөлүм</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}.layout{display:grid;grid-template-columns:1.6fr.9fr;gap:10px;padding:10px}@media(max-width:900px){.layout{grid-template-columns:1fr}}#map{height:60vh;border-radius:16px;border:1px solid #e2e8f0}.card{background:#fff;border-radius:14px;padding:12px;border:1px solid #eef2f7;margin-bottom:10px}.badge{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;display:inline-flex;gap:5px;background:#f1f5f9}.btn{border:0;border-radius:9px;padding:7px 11px;font-weight:700;cursor:pointer;font-size:12px}.btn-dark{background:#0f172a;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-ghost{background:#f1f5f9}.select{border:1px solid #e2e8f0;border-radius:9px;padding:7px 10px}table{width:100%;border-collapse:collapse}th{font-size:10px;color:#64748b;text-transform:uppercase;text-align:left;padding:6px;border-bottom:1px solid #eef2f7}td{padding:7px 6px;border-bottom:1px solid #f1f5f9;font-size:12px}.assign-row{display:flex;justify-content:space-between;align-items:center;padding:8px;background:#f8fafc;border-radius:10px;margin-bottom:6px}</style></head><body><header><div style="display:flex;gap:10px;align-items:center"><button class="btn btn-ghost" onclick="location.href='admin.html'">← Башкы</button><div><b id="deptName" style="font-size:18px"></b><br><small id="deptInfo" style="color:#64748b"></small></div></div><div style="display:flex;gap:6px"><button class="btn btn-dark" onclick="exportCSV()">⬇️ Excel</button></div></header><div class="layout"><div><div id="map"></div><div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between"><b>🗺️ Зоналар</b><small id="zoneCount"></small></div><div id="zonesList" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"></div><div style="margin-top:10px;display:flex;gap:6px"><input id="zoneName" class="select" placeholder="Жаңы зона аты"><button class="btn btn-dark" onclick="startDraw()">✏️ Чийүү</button><button class="btn btn-green" onclick="finishZone()">✅ Сактоо</button></div></div><div class="card"><b>👥 Бул бөлүмгө жумушчу бекитүү</b><small style="display:block;color:#64748b;margin-bottom:8px">Бекитсең - башкы панелде "Баары / Сыртта" деп чыгат</small><div id="assignList"></div></div></div><div><div class="card" style="border-left:5px solid #16a34a"><b>🟢 Азыр жумушта (<span id="inCount">0</span>)</b><div id="inList" style="margin-top:8px"></div></div><div class="card" style="border-left:5px solid #ef4444"><b>🔴 Сыртта / Ордунда жок (<span id="outCount">0</span>)</b><div id="outList" style="margin-top:8px"></div></div><div class="card"><b>🕒 Келди / Кетти - Бүгүн</b><div id="historyTable" style="margin-top:8px"></div></div><div class="card"><b>📜 Лог</b><div id="logBox" style="font-size:11px;max-height:180px;overflow:auto;margin-top:6px"></div></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let map=L.map('map').setView([40.13,71.75],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);const deptId=new URLSearchParams(location.search).get('dept')||'kdo';let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'null')||[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let dept=DEPTS.find(d=>d.id==deptId)||DEPTS[0];document.getElementById('deptName').innerText=dept.name;document.getElementById('deptName').style.color=dept.color;let allZones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');let zones=allZones.filter(z=>z.deptId==dept.id);let assign=JSON.parse(localStorage.getItem('kadamjai_assign')||'{}');let pts=[],polyTemp=null,drawing=false,zoneLayers=[],markers={},workersCache={},logs=JSON.parse(localStorage.getItem('kadamjai_history_'+dept.id)||'[]'),prev={};function saveZones(){localStorage.setItem('kadamjai_zones_v3',JSON.stringify(allZones));}function saveAssign(){localStorage.setItem('kadamjai_assign',JSON.stringify(assign));db.ref('osh/assign').set(assign);}function renderZones(){zoneLayers.forEach(l=>map.removeLayer(l));zoneLayers=[];zones.forEach(z=>{zoneLayers.push(L.polygon(z.points,{color:dept.color,weight:3,fillColor:dept.color,fillOpacity:.3}).addTo(map));});if(zones.length){try{map.fitBounds(L.latLngBounds(zones.flatMap(z=>z.points)).pad(.2))}catch(e){}}document.getElementById('zoneCount').innerText=zones.length+' зона';document.getElementById('zonesList').innerHTML=zones.map((z,i)=>`<span class="badge">${z.name} <span onclick="delZone(${i})" style="cursor:pointer;color:#ef4444">✕</span></span>`).join('')||'<small style="color:#94a3b8">Зона жок</small>';}renderZones();map.on('click',e=>{if(!drawing)return;pts.push([e.latlng.lat,e.latlng.lng]);if(polyTemp) map.removeLayer(polyTemp);polyTemp=L.polygon(pts,{color:dept.color,dashArray:'6 6'}).addTo(map);});function startDraw(){pts=[];if(polyTemp) map.removeLayer(polyTemp);drawing=true;alert('Картаны басып чийип бүткөндө Сактоо бас');}function finishZone(){if(pts.length<3)return alert('Кеминде 3 чекит');let name=document.getElementById('zoneName').value||`Зона ${zones.length+1}`;let nz={id:Date.now().toString(),deptId:dept.id,name,points:[...pts]};allZones.push(nz);zones.push(nz);pts=[];if(polyTemp){map.removeLayer(polyTemp);polyTemp=null;}drawing=false;document.getElementById('zoneName').value='';saveZones();renderZones();}function delZone(i){let gid=allZones.findIndex(z=>z.id==zones[i].id);if(gid>-1)allZones.splice(gid,1);zones.splice(i,1);saveZones();renderZones();}function checkInside(lat,lng){for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>lng)!=(yj>lng))&&(lat<(xj-xi)*(lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok) return z;}return null;}function addLog(name,type,zoneName){let t=new Date();let e={time:t.toLocaleTimeString('ky-KG'),date:t.toLocaleDateString('ky-KG'),ts:Date.now(),name,type,zoneName};logs.unshift(e);if(logs.length>300) logs=logs.slice(0,300);localStorage.setItem('kadamjai_history_'+dept.id,JSON.stringify(logs));renderHistory();}function renderHistory(){document.getElementById('logBox').innerHTML=logs.slice(0,50).map(l=>`<div style="padding:4px 0;border-bottom:1px solid #f1f5f9"><small style="color:#94a3b8">${l.date} ${l.time}</small> <b>${l.name}</b> ${l.type=='in'?'🟢 кирди':'🔴 чыкты'} ${l.zoneName?`(${l.zoneName})`:''}</div>`).join('')||'Жок';let today=new Date().toLocaleDateString('ky-KG');let byName={};logs.filter(l=>l.date==today).forEach(l=>{if(!byName[l.name]) byName[l.name]={in:null,out:null};if(l.type=='in'&&!byName[l.name].in) byName[l.name].in=l.time;if(l.type=='out') byName[l.name].out=l.time;});let html='<table><tr><th>Аты</th><th>Келди</th><th>Кетти</th></tr>';Object.keys(byName).forEach(n=>{html+=`<tr><td><b>${n}</b></td><td style="color:#16a34a">${byName[n].in||'-'}</td><td style="color:#ef4444">${byName[n].out||'жумушта'}</td></tr>`;});html+='</table>';if(!Object.keys(byName).length) html='<small style="color:#94a3b8">Бүгүн кирип-чыгуу жок</small>';document.getElementById('historyTable').innerHTML=html;}function renderWorkers(){let inHtml='',outHtml='',assignHtml='';let assignedToThis=Object.keys(assign).filter(k=>assign[k]==dept.id);let allWorkerIds=Object.keys(workersCache);assignedToThis.forEach(wId=>{let w=workersCache[wId];let isInside=w&&w._inside;if(isInside){inHtml+=`<div class="assign-row" style="background:${dept.color}12"><b>${w.name}</b><span style="color:${dept.color}">🟢 ${w.zoneName}</span></div>`;}else{let name=w?w.name:wId;outHtml+=`<div class="assign-row" style="background:#fef2f2"><b>${name}</b><span style="color:#ef4444">🔴 Сыртта</span></div>`;}});allWorkerIds.forEach(wId=>{let w=workersCache[wId];let cur=assign[wId];if(cur==dept.id){assignHtml+=`<div class="assign-row"><b>${w.name}</b><div><span class="badge" style="background:${dept.color};color:#fff">Бекитилген</span> <button class="btn btn-red" onclick="unassign('${wId}')">Алып салуу</button></div></div>`;}else{let label=cur?DEPTS.find(d=>d.id==cur)?.name||cur:'Бекитиле элек';assignHtml+=`<div class="assign-row"><b>${w.name}</b><div><small style="color:#64748b">${label}</small> <button class="btn btn-green" onclick="doAssign('${wId}')">+ ${dept.name}га бекитүү</button></div></div>`;}});if(!allWorkerIds.length) assignHtml='<small style="color:#94a3b8">Азыр эч ким онлайн эмес, бирөө кирсе бул жерде чыгат</small>';document.getElementById('inList').innerHTML=inHtml||'<small style="color:#94a3b8">Эч ким жок</small>';document.getElementById('outList').innerHTML=outHtml||'<small style="color:#16a34a">✅ Баары ордунда</small>';document.getElementById('assignList').innerHTML=assignHtml;document.getElementById('inCount').innerText=assignedToThis.filter(id=>workersCache[id]?._inside).length;document.getElementById('outCount').innerText=assignedToThis.filter(id=>!workersCache[id]?._inside).length;document.getElementById('deptInfo').innerText=`${zones.length} зона • ${assignedToThis.length} бекитилген • ${assignedToThis.filter(id=>workersCache[id]?._inside).length} жумушта`;}window.doAssign=function(wId){assign[wId]=dept.id;saveAssign();renderWorkers();};window.unassign=function(wId){delete assign[wId];saveAssign();renderWorkers();};function exportCSV(){let csv='Дата,Убакыт,Аты,Аракет,Зона\n'+logs.map(l=>`${l.date},${l.time},${l.name},${l.type=='in'?'Келди':'Кетти'},${l.zoneName||''}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=dept.name+'_'+Date.now()+'.csv';a.click();}db.ref('osh/assign').on('value',s=>{if(s.val()){assign=s.val();localStorage.setItem('kadamjai_assign',JSON.stringify(assign));renderWorkers();}});function listen(){db.ref('osh/workers').on('value',snap=>{workersCache={};Object.values(markers).forEach(m=>map.removeLayer(m));markers={};snap.forEach(ch=>{let v=ch.val();let hit=checkInside(v.lat,v.lng);v._inside=!!hit;v.zoneName=hit?hit.name:'';if(prev[ch.key]!==v._inside){addLog(v.name,v._inside?'in':'out',v.zoneName);}prev[ch.key]=v._inside;workersCache[ch.key]=v;if(v._inside){let icon=L.divIcon({html:`<div style="background:${dept.color};color:#fff;padding:5px 10px;border-radius:999px;font-weight:800;font-size:11px;border:2px solid white">${v.name} 🟢</div>`,className:'',iconAnchor:[30,12]});markers[ch.key]=L.marker([v.lat,v.lng],{icon}).addTo(map);}});renderWorkers();renderHistory();});}renderHistory();listen();</script></body></html>
