<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бөлүм - Карта</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
#map{height:65vh} @media(min-width:768px){#map{height:75vh}}
.green-pin{width:30px;height:30px;background:#16a34a;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;justify-content:center;align-items:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.green-pin span{transform:rotate(45deg);color:white;font-size:14px}
</style>
</head>
<body class="bg-[#f8fafc] font-sans">
<div class="max-w-[1200px] mx-auto p-2">
<div class="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center mb-2">
<div>
<a href="admin.html?v=1008" class="text-blue-600 text-sm">← Артка админкага</a>
<h1 id="deptTitle" class="font-bold text-[18px]">Бөлүм</h1>
<div id="stats" class="flex gap-2 mt-1 text-[11px]"></div>
</div>
<div class="flex gap-2">
<button onclick="toggleFull()" class="bg-black text-white px-3 py-1.5 rounded-lg text-[12px]">⛶ Толук экран</button>
<button onclick="location.reload()" class="bg-gray-100 px-3 py-1.5 rounded-lg text-sm">🔄</button>
</div>
</div>

<div id="mapWrap" class="rounded-xl overflow-hidden shadow-sm border bg-white relative">
<div id="map" class="w-full"></div>
</div>

<div id="list" class="space-y-2 mt-3"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
const deptName = new URLSearchParams(location.search).get('d') || 'Администрация';
document.getElementById('deptTitle').innerText = deptName;

let map = L.map('map').setView([40.128,71.726],15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers = L.layerGroup().addTo(map);
let geofenceLayer = L.layerGroup().addTo(map);

function greenIcon(){
  return L.divIcon({className:'', html:'<div class="green-pin"><span>📍</span></div>', iconSize:[30,30], iconAnchor:[15,30]});
}

function toggleFull(){
  let w=document.getElementById('mapWrap');
  if(!document.fullscreenElement){ w.requestFullscreen(); setTimeout(()=>map.invalidateSize(),300); }
  else document.exitFullscreen();
}

// 1. Жумуш аймагын чийүү - osh/settings дан алат
db.ref('osh/settings').on('value', sSnap=>{
  geofenceLayer.clearLayers();
  let s=sSnap.val()||{};
  // Эгер полигон сакталган болсо
  if(s.polygon && s.polygon.length>2){
    L.polygon(s.polygon,{color:'#16a34a', fillColor:'#16a34a', fillOpacity:0.15, weight:2, dashArray:'8 8'}).addTo(geofenceLayer).bindPopup('Жумуш аймагы');
    map.fitBounds(s.polygon);
  } else if(s.center){
    // Эгер борбор + радиус болсо
    L.circle([s.center.lat, s.center.lng],{radius:s.radius||500, color:'#16a34a', fillColor:'#16a34a', fillOpacity:0.15, weight:2, dashArray:'8 8'}).addTo(geofenceLayer);
    map.setView([s.center.lat, s.center.lng],15);
  }
});

db.ref('osh/pins').on('value', snapPins=>{
  db.ref('osh/workers').on('value', snapWorkers=>{
    let pins = snapPins.val()||{};
    let workers = snapWorkers.val()||{};
    let allInDept = Object.entries(pins).filter(([k,v])=>v.bolum==deptName);
    let workersInDept = Object.values(workers).filter(w=>w.bolum==deptName);

    document.getElementById('stats').innerHTML=`<span class="bg-green-100 text-green-700 px-2 py-1 rounded font-bold">Жумушта ${workersInDept.length}</span><span class="bg-gray-100 px-2 py-1 rounded">Бардыгы ${allInDept.length}</span>`;

    markers.clearLayers();
    let bounds=[];
    let html="";
    allInDept.forEach(([pin,p])=>{
      let w=workersInDept.find(x=>x.pin==pin);
      if(w && w.lat){
        L.marker([w.lat,w.lng],{icon:greenIcon()}).addTo(markers).bindPopup(`<b>${p.name}</b><br>#${pin}<br><span style="color:green">🟢 Жумушта</span><br>${new Date(w.time).toLocaleTimeString()}`);
        bounds.push([w.lat,w.lng]);
      }
      html+=`<div class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${w?'border-l-green-500':'border-l-gray-300'} flex justify-between">
        <div><div class="font-bold text-[14px]">${p.name} <span class="text-[11px] text-gray-500">#${pin}</span></div>
        <div class="text-[11px] ${w?'text-green-600 font-bold':'text-gray-400'}">${w?'🟢 Жумушта - '+new Date(w.time).toLocaleTimeString():'⚪ Сыртта'}</div></div>
        ${w?`<button onclick="kick('${Object.keys(workers).find(k=>workers[k].pin==pin)}')" class="text-[11px] bg-red-50 text-red-600 px-2 py-1 rounded">Чыгаруу</button>`:''}
      </div>`;
    });
    if(bounds.length>0) map.fitBounds(bounds,{padding:[40,40], maxZoom:17});
    document.getElementById('list').innerHTML=html||'<div class="bg-white p-6 rounded-xl text-center text-gray-400">Кызматкер жок</div>';
  });
});
window.kick=function(k){ if(confirm('Чыгарабызбы?')) db.ref('osh/workers/'+k).remove(); }
</script>
</body>
</html>
