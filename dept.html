<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бөлүм</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] p-3 font-sans">
<div class="max-w-[900px] mx-auto">
<div class="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center mb-3">
<div>
<a href="admin.html?v=1008" class="text-blue-600 text-sm">← Артка</a>
<h1 id="deptTitle" class="font-bold text-[18px] mt-1">Бөлүм</h1>
<div id="stats" class="flex gap-2 mt-2 text-[11px]"></div>
</div>
<button onclick="location.reload()" class="bg-gray-100 px-3 py-1.5 rounded-lg text-sm">🔄</button>
</div>

<div id="list" class="space-y-2"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
const params = new URLSearchParams(location.search);
const deptName = params.get('d') || params.get('dept') || 'Администрация';
document.getElementById('deptTitle').innerText = deptName;

db.ref('osh/pins').on('value', snapPins=>{
  db.ref('osh/workers').on('value', snapWorkers=>{
    let pins = snapPins.val()||{};
    let workers = snapWorkers.val()||{};
    let allInDept = Object.entries(pins).filter(([k,v])=>v.bolum==deptName);
    let workersInDept = Object.values(workers).filter(w=>w.bolum==deptName);

    document.getElementById('stats').innerHTML = `
      <span class="bg-green-100 text-green-700 px-2 py-1 rounded">Жумушта ${workersInDept.length}</span>
      <span class="bg-gray-100 px-2 py-1 rounded">Бардыгы ${allInDept.length}</span>
      <span class="bg-red-50 text-red-600 px-2 py-1 rounded">Сыртта ${allInDept.length - workersInDept.length}</span>
    `;

    let html="";
    allInDept.forEach(([pin, p])=>{
      let w = workersInDept.find(x=>x.pin==pin);
      let isInside =!!w;
      html+=`<div class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${isInside?'border-l-green-500':'border-l-gray-300'} flex justify-between items-center">
        <div>
          <div class="font-bold text-[14px]">${p.name} <span class="text-[11px] text-gray-500">#${pin}</span></div>
          <div class="text-[11px] ${isInside?'text-green-600':'text-gray-500'}">${isInside?'🟢 Жумушта - '+new Date(w.time).toLocaleTimeString():'⚪ Сыртта'}</div>
          ${w?`<div class="text-[10px] text-gray-400">📍 ${w.lat?.toFixed(4)}, ${w.lng?.toFixed(4)}</div>`:''}
        </div>
        <div class="text-right">
          ${isInside?`<button onclick="kick('${w.pin}','${Object.keys(workers).find(k=>workers[k].pin==pin)}')" class="text-[11px] bg-red-50 text-red-600 px-2 py-1 rounded">Чыгаруу</button>`:`<span class="text-[10px] text-gray-400">Жок</span>`}
        </div>
      </div>`;
    });
    if(allInDept.length==0) html=`<div class="bg-white p-6 rounded-xl text-center text-gray-400">Бул бөлүмдө кызматкер жок</div>`;
    document.getElementById('list').innerHTML=html;
  });
});

window.kick=function(pin, workerKey){
  if(!confirm('Чыгарабызбы?')) return;
  db.ref('osh/workers/'+workerKey).remove();
}
</script>
</body>
</html>
