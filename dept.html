<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бөлүм</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:12px 16px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000}.layout{display:grid;grid-template-columns:1.6fr.9fr;gap:10px;padding:10px}#map{height:65vh;border-radius:16px;border:1px solid #e2e8f0}.card{background:#fff;border-radius:14px;padding:12px;border:1px solid #eef2f7;margin-bottom:10px}.badge{padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;display:inline-flex;gap:5px}.btn{border:0;border-radius:9px;padding:8px 12px;font-weight:700;cursor:pointer}.select{border:1px solid #e2e8f0;border-radius:9px;padding:7px 10px}table{width:100%;border-collapse:collapse}th{font-size:10px;color:#64748b;text-transform:uppercase;text-align:left;padding:6px;border-bottom:1px solid #eef2f7}td{padding:7px 6px;border-bottom:1px solid #f1f5f9;font-size:12px}</style></head><body><header><div style="display:flex;gap:10px;align-items:center"><button class="btn" style="background:#f1f5f9" onclick="location.href='admin.html'">← Артка</button><div><b id="deptName" style="font-size:18px"></b><br><small id="deptInfo" style="color:#64748b"></small></div></div><div><button class="btn" style="background:#0f172a;color:#fff" onclick="exportCSV()">⬇️ Excel</button></div></header><div class="layout"><div><div id="map"></div><div class="card" style="margin-top:10px"><div style="display:flex;justify-content:space-between"><b>🗺️ Ушул бөлүмдүн зоналары</b><small id="zoneCount"></small></div><div id="zonesList" style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"></div><div style="margin-top:10px;display:flex;gap:6px"><input id="zoneName" class="select" placeholder="Жаңы зона аты"><button class="btn" style="background:#0f172a;color:#fff" onclick="startDraw()">✏️ Чийүү</button><button class="btn" style="background:#16a34a;color:#fff" onclick="finishZone()">✅ Сактоо</button></div></div></div><div><div class="card"><b>👷 Азыр жумушта</b><div id="inList"></div></div><div class="card"><b>🕒 Келди / Кетти - Бүгүн</b><div id="historyTable"></div></div><div class="card" id="logCard"><b>📜 Лог</b><div id="logBox" style="font-size:11px;max-height:200px;overflow:auto;margin-top:6px"></div></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh",storageBucket:"gps-tracker-osh.firebasestorage.app",messagingSenderId:"588347508048",appId:"1:588347508048:web:1b6fd5417ff8f4e5f29855"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let map=L.map('map').setView([40.13,71.75],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);const urlParams=new URLSearchParams(location.search);const deptId=urlParams.get('dept')||'kdo';let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'null')||[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let dept=DEPTS.find(d=>d.id==deptId)||DEPTS[0];document.getElementById('deptName').innerText=dept.name;document.getElementById('deptName').style.color=dept.color;let allZones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');let zones=allZones.filter(z=>z.deptId==dept.id);let pts=[],polyTemp=null,drawing=false,zoneLayers=[],markers={},workersCache={},logs=JSON.parse(localStorage.getItem('kadamjai_history_'+dept.id)||'[]'),prev={};function saveZones(){localStorage.setItem('kadamjai_zones_v3',JSON.stringify(allZones));}function renderZones(){zoneLayers.forEach(l=>map.removeLayer(l));zoneLayers=[];zones.forEach(z=>{let ly=L.polygon(z.points,{color:dept.color,weight:3,fillColor:dept.color,fillOpacity:.3}).addTo(map);zoneLayers.push(ly);});if(zones.length){try{map.fitBounds(L.latLngBounds(zones.flatMap(z=>z.points)).pad(.2))}catch(e){}}document.getElementById('zoneCount').innerText=zones.length+' зона';document.getElementById('zonesList').innerHTML=zones.map((z,i)=>`<span class="badge" style="background:${dept.color}15;color:${dept.color}">${z.name} <span onclick="delZone(${i})" style="cursor:pointer">✕</span></span>`).join('')||'<small>Зона жок</small>';}renderZones();map.on('click',e=>{if(!drawing)return;pts.push([e.latlng.lat,e.latlng.lng]);if(polyTemp) map.removeLayer(polyTemp);polyTemp=L.polygon(pts,{color:dept.color,dashArray:'6 6'}).addTo(map);});function startDraw(){pts=[];if(polyTemp) map.removeLayer(polyTemp);drawing=true;alert('Картаны басып чий');}function finishZone(){if(pts.length<3)return alert('3 чекит');let name=document.getElementById('zoneName').value||`Зона ${zones.length+1}`;let nz={id:Date.now().toString(),deptId:dept.id,name,points:[...pts]};allZones.push(nz);zones.push(nz);pts=[];if(polyTemp){map.removeLayer(polyTemp);polyTemp=null;}drawing=false;document.getElementById('zoneName').value='';saveZones();renderZones();}function delZone(i){let globalIdx=allZones.findIndex(z=>z.id==zones[i].id);if(globalIdx>-1)allZones.splice(globalIdx,1);zones.splice(i,1);saveZones();renderZones();}function checkInside(lat,lng){for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>lng)!=(yj>lng))&&(lat<(xj-xi)*(lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok) return z;}return null;}function addLog(name,type,zoneName){let t=new Date();let entry={time:t.toLocaleTimeString('ky-KG'),date:t.toLocaleDateString('ky-KG'),ts:Date.now(),name,type,zoneName};logs.unshift(entry);if(logs.length>300) logs=logs.slice(0,300);localStorage.setItem('kadamjai_history_'+dept.id,JSON.stringify(logs));renderHistory();}function renderHistory(){document.getElementById('logBox').innerHTML=logs.slice(0,50).map(l=>`<div style="padding:4px 0;border-bottom:1px solid #f1f5f9"><small style="color:#94a3b8">${l.date} ${l.time}</small> <b>${l.name}</b> ${l.type=='in'?'🟢 кирди':'🔴 чыкты'} ${l.zoneName?`(${l.zoneName})`:''}</div>`).join('')||'Жок';let today=new Date().toLocaleDateString('ky-KG');let todayLogs=logs.filter(l=>l.date==today);let byName={};todayLogs.forEach(l=>{if(!byName[l.name]) byName[l.name]={in:null,out:null};if(l.type=='in'&&!byName[l.name].in) byName[l.name].in=l.time;if(l.type=='out') byName[l.name].out=l.time;});let html='<table><tr><th>Аты</th><th>Келди</th><th>Кетти</th></tr>';Object.keys(byName).forEach(n=>{html+=`<tr><td><b>${n}</b></td><td style="color:#16a34a">${byName[n].in||'-'}</td><td style="color:#ef4444">${byName[n].out||'азыр жумушта'}</td></tr>`;});html+='</table>';document.getElementById('historyTable').innerHTML=html;let inHtml='<div style="margin-top:6px">';Object.keys(workersCache).filter(k=>workersCache[k].inside).forEach(k=>{let w=workersCache[k];inHtml+=`<div style="padding:6px;background:${dept.color}08;border-radius:8px;margin-bottom:4px"><b>${w.name}</b> <small>• ${w.zoneName}</small></div>`;});inHtml+='</div>';if(!Object.values(workersCache).some(w=>w.inside)) inHtml='<small style="color:#94a3b8">Азыр эч ким жок</small>';document.getElementById('inList').innerHTML=inHtml;document.getElementById('deptInfo').innerText=zones.length+' зона • '+Object.values(workersCache).filter(w=>w.inside).length+' жумушта';}function exportCSV(){let csv='Дата,Убакыт,Аты,Аракет,Зона\n'+logs.map(l=>`${l.date},${l.time},${l.name},${l.type=='in'?'Келди':'Кетти'},${l.zoneName||''}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=dept.name+'_'+Date.now()+'.csv';a.click();}function listen(){db.ref('osh/workers').on('value',snap=>{workersCache={};Object.values(markers).forEach(m=>map.removeLayer(m));markers={};snap.forEach(ch=>{let v=ch.val();let hit=checkInside(v.lat,v.lng);if(!hit)return;v.inside=true;v.zoneName=hit.name;if(prev[ch.key]!==true){addLog(v.name,'in',hit.name);}prev[ch.key]=true;workersCache[ch.key]=v;let icon=L.divIcon({html:`<div style="background:${dept.color};color:#fff;padding:5px 10px;border-radius:999px;font-weight:800;font-size:11px;border:2px solid white">${v.name} 🟢</div>`,className:'',iconAnchor:[30,12]});markers[ch.key]=L.marker([v.lat,v.lng],{icon}).addTo(map);});snap.forEach(ch=>{let v=ch.val();let hit=checkInside(v.lat,v.lng);if(hit)return;if(prev[ch.key]===true){addLog(v.name,'out','');}prev[ch.key]=false;});renderHistory();});}renderHistory();listen();</script></body></html>
