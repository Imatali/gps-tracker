<!DOCTYPE html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бөлүм</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:60vh}.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;justify-content:center;align-items:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.4)}.g{background:#16a34a}.r{background:#dc2626}.pin span{transform:rotate(45deg);color:white;font-size:12px;font-weight:bold}</style></head><body class="bg-[#f8fafc] p-2 font-sans"><div class="max-w-[1200px] mx-auto"><div class="bg-white p-3 rounded-xl shadow-sm mb-2"><a href="admin.html?v=1008" class="text-blue-600 text-sm">← Артка</a><h1 id="t" class="font-bold text-[18px]">Бөлүм</h1><div id="stats" class="flex gap-2 mt-1 text-[11px]"></div><div class="flex gap-2 mt-3"><button onclick="setF('all')" id="b_all" class="px-3 py-1.5 rounded-full text-[11px] bg-black text-white">Баары</button><button onclick="setF('in')" id="b_in" class="px-3 py-1.5 rounded-full text-[11px] bg-green-50 text-green-700 border">🟢 Ичинде</button><button onclick="setF('out')" id="b_out" class="px-3 py-1.5 rounded-full text-[11px] bg-red-50 text-red-700 border">🔴 Сыртында</button><button onclick="toggleFull()" class="ml-auto bg-gray-100 px-3 py-1.5 rounded-lg text-[11px]">⛶ Толук</button></div></div><div id="mapWrap" class="rounded-xl overflow-hidden shadow border bg-white"><div id="map" class="w-full"></div></div><div id="list" class="space-y-2 mt-3"></div></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
const dept=new URLSearchParams(location.search).get('d')||'Администрация';document.getElementById('t').innerText=dept;
let map=L.map('map').setView([40.128,71.726],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let gL=L.layerGroup().addTo(map),mL=L.layerGroup().addTo(map);let filter='all',allData=[],poly=[],center=null,radius=500;
function ic(c){return L.divIcon({className:'',html:`<div class="pin ${c}"><span>${c=='g'?'✔':'✖'}</span></div>`,iconSize:[28,28],iconAnchor:[14,28]})}
function isInside(lat,lng){if(poly.length>2){let x=lng,y=lat,inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][1],yi=poly[i][0],xj=poly[j][1],yj=poly[j][0];let intersect=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);if(intersect)inside=!inside}return inside}if(center){let d=map.distance([lat,lng],[center.lat,center.lng]);return d<=radius}return true}
function setF(f){filter=f;document.querySelectorAll('[id^=b_]').forEach(b=>b.classList.remove('bg-black','text-white'));document.getElementById('b_'+f).classList.add('bg-black','text-white');render();}
function toggleFull(){let w=document.getElementById('mapWrap');if(!document.fullscreenElement)w.requestFullscreen();else document.exitFullscreen();setTimeout(()=>map.invalidateSize(),300)}
db.ref('osh/settings').on('value',s=>{gL.clearLayers();let v=s.val()||{};poly=v.polygon||[];center=v.center||null;radius=v.radius||500;if(poly.length>2){L.polygon(poly,{color:'#16a34a',fillOpacity:.12,weight:3}).addTo(gL);map.fitBounds(poly)}else if(center){L.circle([center.lat,center.lng],{radius:radius,color:'#16a34a',fillOpacity:.12}).addTo(gL);map.setView([center.lat,center.lng],16)}});
db.ref('osh/pins').on('value',ps=>{db.ref('osh/workers').on('value',ws=>{let pins=ps.val()||{},workers=ws.val()||{};allData=Object.entries(pins).filter(([k,v])=>v.bolum==dept).map(([pin,p])=>{let w=Object.values(workers).find(x=>x.pin==pin);let inn=w?isInside(w.lat,w.lng):false;return{pin,name:p.name,w,inn}});render();})});
function render(){mL.clearLayers();let bounds=[],filtered=allData.filter(d=>{if(filter=='all')return true;if(filter=='in')return d.w&&d.inn;if(filter=='out')return!d.w||!d.inn});let inC=0,outC=0;allData.forEach(d=>{if(d.w&&d.inn)inC++;else outC++;});document.getElementById('stats').innerHTML=`<span class="bg-green-100 text-green-700 px-2 py-1 rounded">Ичинде ${inC}</span><span class="bg-red-100 text-red-700 px-2 py-1 rounded">Сыртында ${outC}</span><span class="bg-gray-100 px-2 py-1 rounded">Баары ${allData.length}</span>`;let html="";filtered.forEach(d=>{if(d.w){let c=d.inn?'g':'r';L.marker([d.w.lat,d.w.lng],{icon:ic(c)}).addTo(mL).bindPopup(`<b>${d.name}</b><br>#${d.pin}<br>${d.inn?'🟢 Ичинде':'🔴 Сыртында'}`);bounds.push([d.w.lat,d.w.lng]);}html+=`<div class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${d.w?(d.inn?'border-l-green-500':'border-l-red-500'):'border-l-gray-300'} flex justify-between"><div><div class="font-bold text-[13px]">${d.name} <span class="text-[10px] text-gray-500">#${d.pin}</span></div><div class="text-[11px] ${d.w?(d.inn?'text-green-600':'text-red-600'):'text-gray-400'}">${d.w?(d.inn?'🟢 Аймак ичинде':'🔴 Аймак сыртында'):'⚪ Жумушта эмес'}</div></div></div>`});if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:17});document.getElementById('list').innerHTML=html||'<div class="bg-white p-6 rounded-xl text-center text-gray-400">Тизме бош</div>';}
</script></body></html>
