<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оңдолду</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:10px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between}#map{height:50vh;border-radius:12px;border:1px solid #e2e8f0}.card{background:#fff;border-radius:12px;padding:10px;border:1px solid #eef2f7;margin-top:8px}.btn{border:0;border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:11px}.btn-dark{background:#0f172a;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-red{background:#fee2e2;color:#ef4444}.assign{padding:8px;background:#f8fafc;border-radius:9px;margin-bottom:5px;border:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center}</style></head><body><header><button class="btn" onclick="location.href='admin.html'">← Башкы</button><div><b id="deptName"></b><br><small id="info"></small></div><button class="btn btn-dark" onclick="location.reload()">↻</button></header><div style="padding:10px"><div id="map"></div><div class="card"><b>👥 Жумушчулар - Иматали маселеси оңдолду</b><div id="list" style="margin-top:8px"></div></div></div><script>
const cfg={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};
firebase.initializeApp(cfg);const db=firebase.database();
let map=L.map('map').setView([40.13,71.75],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
const deptId=new URLSearchParams(location.search).get('dept')||'kdo';
let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'[]');
let dept=DEPTS.find(d=>d.id==deptId)||{id:deptId,name:deptId,color:'#0064e0'};
document.getElementById('deptName').innerText=dept.name;
let allZones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');
let zones=allZones.filter(z=>z.deptId==dept.id);
let workers={};let markers=[];

// ЖАҢЫ ТАЗА САКТОО - V3
function getAssign(){return JSON.parse(localStorage.getItem('kadamjai_assign_v3')||'{}');}
function saveAssign(obj){localStorage.setItem('kadamjai_assign_v3',JSON.stringify(obj));db.ref('osh/assign_v3').set(obj);}

function renderZones(){markers.forEach(m=>map.removeLayer(m));markers=[];zones.forEach(z=>markers.push(L.polygon(z.points,{color:dept.color,weight:3,fillColor:dept.color,fillOpacity:.25}).addTo(map)));}renderZones();

function render(){
let assign=getAssign();
let html='';
Object.keys(workers).forEach(wId=>{
let w=workers[wId];
let cur=assign[wId];
if(cur && cur.deptId==dept.id){
// Ушул бөлүмдө
html+=`<div class="assign" style="background:#dcfce7;border-color:#16a34a"><b>${w.name} ✅ Ушул бөлүмдө</b><button class="btn btn-red" onclick="unassign('${wId}')">Алып салуу</button></div>`;
}else if(cur){
// БАШКА БӨЛҮМДӨ - мына ушул жер оңдолду
let other=DEPTS.find(d=>d.id==cur.deptId)?.name||cur.deptId;
html+=`<div class="assign" style="background:#fef3c7"><div><b>${w.name}</b><br><small style="color:#92400e">📌 Азыр ${other}да</small></div><button class="btn btn-green" onclick="moveHere('${wId}')">Ушул жакка которуу</button></div>`;
}else{
// Бош
html+=`<div class="assign"><b>${w.name} - бош</b><button class="btn btn-dark" onclick="moveHere('${wId}')">Бекитүү</button></div>`;
}
});
document.getElementById('list').innerHTML=html||'Эч ким жок';
document.getElementById('info').innerText=`${zones.length} зона • ${Object.keys(assign).filter(k=>assign[k].deptId==dept.id).length} бекитилген`;
}

window.moveHere=function(wId){
let a=getAssign();
a[wId]={deptId:dept.id,start:'08:00',end:'17:00'};
saveAssign(a);
render();
};
window.unassign=function(wId){
let a=getAssign();delete a[wId];saveAssign(a);render();
};

// Firebaseден окуу
db.ref('osh/assign_v3').on('value',s=>{if(s.val()){localStorage.setItem('kadamjai_assign_v3',JSON.stringify(s.val()));render();}});
// Миграция эскиден
let oldV2=JSON.parse(localStorage.getItem('kadamjai_assign_v2')||'null');
if(oldV2 &&!localStorage.getItem('kadamjai_assign_v3')){saveAssign(oldV2);}

db.ref('osh/workers').on('value',snap=>{
workers={};snap.forEach(ch=>{workers[ch.key]=ch.val();});render();
});
</script></body></html>
