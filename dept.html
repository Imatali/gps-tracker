<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бөлүм v1100 IDEAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="icon.png?v=1100">
</head>
<body class="bg-[#f8fafc] p-3 font-sans">
<div class="max-w-[1200px] mx-auto">
<div class="bg-white p-4 rounded-xl shadow-sm mb-3">
<div class="flex justify-between items-center flex-wrap gap-2">
<div class="flex items-center gap-2">
<a href="admin.html?v=1100" class="bg-gray-100 border px-3 py-2 rounded-lg text-[12px]">← Артка</a>
<img src="logo.png?v=1100" class="w-8 h-8 rounded-full border">
<div><h1 id="deptName" class="font-black text-[16px]">Бөлүм</h1><p class="text-[11px] text-gray-500">v1100 IDEAL • <span id="today"></span></p></div>
</div>
<div class="flex gap-2">
<a href="reports.html?v=1100" class="bg-purple-600 text-white px-3 py-2 rounded-lg text-[13px]">📊 Отчет</a>
<a href="worker.html?v=1100" target="_blank" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-[13px]">👷 Жумушчу</a>
</div>
</div>

<div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-4">
<div class="bg-white border-2 border-gray-200 p-3 rounded-xl text-center"><div class="text-[10px] font-bold text-gray-600">БАРДЫГЫ</div><div id="c_all" class="text-[26px] font-black">0</div></div>
<div class="bg-green-50 border border-green-200 p-3 rounded-xl text-center"><div class="text-[10px] font-bold text-green-800">ЖУМУШТА</div><div id="c_in" class="text-[26px] font-black text-green-700">0</div></div>
<div class="bg-red-50 border border-red-200 p-3 rounded-xl text-center"><div class="text-[10px] font-bold text-red-800">СЫРТТА</div><div id="c_out" class="text-[26px] font-black text-red-700">0</div></div>
<div class="bg-orange-50 border border-orange-200 p-3 rounded-xl text-center"><div class="text-[10px] font-bold text-orange-800">КЕЧИККЕН</div><div id="c_late" class="text-[26px] font-black text-orange-700">0</div></div>
<div class="bg-blue-50 border border-blue-200 p-3 rounded-xl text-center"><div class="text-[10px] font-bold text-blue-800">ЭРТЕ КЕТКЕН</div><div id="c_early" class="text-[26px] font-black text-blue-700">0</div></div>
</div>
<div class="mt-3 flex gap-2"><input id="search" oninput="render()" placeholder="🔍 Аты / ПИН издөө..." class="border rounded-lg px-3 py-2 text-[13px] w-full bg-yellow-50"></div>
</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
<table class="w-full text-[13px]" id="tbl">
<thead class="bg-gray-50 text-[11px]"><tr><th class="p-2 text-left">Аты</th><th class="p-2">ПИН</th><th class="p-2">Статус</th><th class="p-2">Кирди</th><th class="p-2">Чыкты</th><th class="p-2">GPS</th><th class="p-2">Тел</th></tr></thead>
<tbody id="tbody"><tr><td colspan=7 class="p-6 text-center text-gray-400">Жүктөлүүдө...</td></tr></tbody>
</table>
</div>
<div class="text-center text-[11px] text-gray-400 mt-3">dept.html v1100 IDEAL</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
const urlParams=new URLSearchParams(location.search);
let deptName=decodeURIComponent(urlParams.get('d')||'');
if(!deptName){ deptName=localStorage.getItem('lastDept')||'Администрация'; }
localStorage.setItem('lastDept', deptName);
document.getElementById('deptName').innerText=deptName.toUpperCase();
document.getElementById('today').innerText=new Date().toLocaleDateString('ky-KG');
let todayStr=new Date().toISOString().slice(0,10);
let allPins={}, allWorkers={}, allLogs={};

db.ref('osh/pins').on('value', s=>{ allPins=s.val()||{}; render(); });
db.ref('osh/workers').on('value', s=>{ allWorkers=s.val()||{}; render(); });
db.ref('osh/logs/'+todayStr).on('value', s=>{ allLogs=s.val()||{}; render(); });

function render(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  let pins=Object.entries(allPins).filter(([pin, v])=> v.bolum===deptName );
  if(q) pins=pins.filter(([pin,v])=> (v.name+' '+pin).toLowerCase().includes(q) );

  let c_all=pins.length, c_in=0, c_out=0, c_late=0, c_early=0;
  let html='';
  pins.forEach(([pin, info])=>{
    let worker=Object.values(allWorkers).find(w=>w.pin==pin);
    let log=allLogs[pin];
    let isIn=!!worker;
    if(isIn) c_in++; else c_out++;
    if(log?.late) c_late++;
    if(log?.earlyLeave) c_early++;

    let status=isIn?'🟢 Жумушта':'🔴 Сыртта';
    let cls=isIn?'bg-green-100 text-green-700':'bg-red-100 text-red-700';
    if(log?.late){ status='🕘 Кечикти'; cls='bg-orange-100 text-orange-800'; }
    if(log?.earlyLeave){ status='🏃 Эрте кетти'; cls='bg-blue-100 text-blue-800'; }

    let firstIn=log?.firstIn||'-';
    let lastOut=log?.lastOut||'-';
    let gps=worker?`${worker.lat.toFixed(4)}, ${worker.acc}м`:'-';
    let phone=info.deviceId?`✅ ${info.deviceId.slice(0,6)}`:'❌ Жок';

    html+=`<tr class="border-t hover:bg-gray-50"><td class="p-2 font-medium">${info.name}</td><td class="p-2 font-bold">${pin}</td><td class="p-2"><span class="px-2 py-1 rounded-full text-[11px] font-bold ${cls}">${status}</span></td><td class="p-2">${firstIn}</td><td class="p-2">${lastOut}</td><td class="p-2 text-[11px]">${gps}</td><td class="p-2 text-[11px]">${phone}</td></tr>`;
  });
  if(pins.length==0) html='<tr><td colspan=7 class="p-6 text-center text-gray-400">Бул бөлүмдө кызматкер жок</td></tr>';
  document.getElementById('tbody').innerHTML=html;
  document.getElementById('c_all').innerText=c_all;
  document.getElementById('c_in').innerText=c_in;
  document.getElementById('c_out').innerText=c_out;
  document.getElementById('c_late').innerText=c_late;
  document.getElementById('c_early').innerText=c_early;
}
</script>
</body>
</html>
