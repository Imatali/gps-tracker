<!DOCTYPE html>
<html lang="ky"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бөлүм v1100 IDEAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-[#f8fafc] p-2 font-sans">
<div class="max-w-[1400px] mx-auto">
<div class="bg-white p-3 rounded-xl shadow flex justify-between items-center flex-wrap gap-2">
<div class="flex items-center gap-2">
<a href="admin.html?v=1100" class="bg-gray-100 px-3 py-1.5 rounded-lg text-[13px]">← Артка</a>
<div><div id="dName" class="font-black uppercase text-[14px]">БӨЛҮМ</div><div class="text-[10px] text-gray-500">v1100 IDEAL • <span id="today"></span></div></div>
</div>
<div class="flex gap-2">
<a href="reports.html?v=1100" class="bg-purple-600 text-white px-3 py-1.5 rounded-lg text-[12px]">📊 Отчет</a>
<a href="worker.html?v=1100" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-[12px]">👷 Жумушчу</a>
</div>
</div>

<div class="grid grid-cols-2 md:grid-cols-5 gap-2 mt-2">
<div class="bg-white border p-2 rounded-xl text-center"><div class="text-[10px] font-bold">БАРДЫГЫ</div><div id="c_all" class="text-[22px] font-black">0</div></div>
<div class="bg-emerald-50 border border-emerald-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold text-emerald-800">ЖУМУШТА</div><div id="c_in" class="text-[22px] font-black text-emerald-700">0</div></div>
<div class="bg-red-50 border border-red-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold text-red-800">СЫРТТА</div><div id="c_out" class="text-[22px] font-black text-red-700">0</div></div>
<div class="bg-orange-50 border border-orange-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold text-orange-800">КЕЧИККЕН</div><div id="c_late" class="text-[22px] font-black text-orange-700">0</div></div>
<div class="bg-blue-50 border border-blue-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold text-blue-800">ЭРТЕ КЕТКЕН</div><div id="c_early" class="text-[22px] font-black text-blue-700">0</div></div>
</div>

<div class="grid grid-cols-1 lg:grid-cols-3 gap-2 mt-2">
<div class="lg:col-span-2 bg-white rounded-xl shadow p-2">
<div class="flex justify-between items-center mb-2"><h3 class="font-bold text-[13px]">📍 Карта</h3><button onclick="loadMap()" class="bg-gray-100 px-2 py-1 rounded text-[11px]">🔄 Жаңылоо</button></div>
<div id="map" style="height:360px; border-radius:10px;"></div>
</div>
<div class="bg-white rounded-xl shadow p-2">
<h3 class="font-bold text-[13px] mb-2">👥 Кызматкерлер</h3>
<input id="search" oninput="render()" placeholder="🔍 Аты / ПИН издөө..." class="w-full border rounded-lg px-3 py-2 text-[13px] bg-yellow-50 mb-2">
<div class="overflow-auto max-h-[360px]">
<table class="w-full text-[12px]" id="tbl"></table>
</div>
</div>
</div>

<div class="text-[10px] text-gray-400 text-center mt-3">dept.html v1100 IDEAL • Карта менен</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let deptName="";
try{
  let url=new URL(window.location.href);
  deptName=url.searchParams.get('d')||localStorage.getItem('lastDept')||'Администрация';
  deptName=decodeURIComponent(deptName);
}catch(e){deptName=localStorage.getItem('lastDept')||'Администрация';}
// Тазалоо: &v=1100 кошулуп калса алып салуу
if(deptName.includes('&v=')) deptName=deptName.split('&v=')[0];
if(deptName.includes('?v=')) deptName=deptName.split('?v=')[0];
document.getElementById('dName').innerText=deptName;
document.getElementById('today').innerText=new Date().toLocaleDateString('ky-KG');
let todayStr=new Date().toISOString().slice(0,10);
let allPins={}, allWorkers={}, allLogs={};
let map=L.map('map').setView([40.53,72.8],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let markers=[];

db.ref('osh/pins').on('value',s=>{allPins=s.val()||{}; render();});
db.ref('osh/workers').on('value',s=>{allWorkers=s.val()||{}; render();});
db.ref('osh/logs/'+todayStr).on('value',s=>{allLogs=s.val()||{}; render();});

function loadMap(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  Object.entries(allWorkers).forEach(([id,w])=>{
    if(w.bolum!=deptName) return;
    if(w.lat && w.lng){
      let m=L.marker([w.lat,w.lng]).addTo(map).bindPopup(`<b>${w.name||id}</b><br>${w.bolum}<br>⏰ ${w.lastTime||''}`);
      markers.push(m);
    }
  });
}

function render(){
  let q=(document.getElementById('search').value||'').toLowerCase();
  // Фильтр: ушул бөлүмдүн ПИНдери
  let pinsOfDept=Object.entries(allPins).filter(([pin,info])=>info.bolum==deptName);
  let workersOfDept=Object.values(allWorkers).filter(w=>w.bolum==deptName);

  let all=pinsOfDept.length;
  let inside=workersOfDept.length;
  let out=Math.max(0,all-inside);
  let late=0, early=0;
  pinsOfDept.forEach(([pin,info])=>{
    let log=allLogs[pin];
    if(log){ if(log.late) late++; if(log.earlyLeave) early++; }
  });
  document.getElementById('c_all').innerText=all;
  document.getElementById('c_in').innerText=inside;
  document.getElementById('c_out').innerText=out;
  document.getElementById('c_late').innerText=late;
  document.getElementById('c_early').innerText=early;

  let html='<tr class="bg-gray-50 text-[10px]"><th class="p-1 text-left">Аты</th><th class="p-1">ПИН</th><th class="p-1">Статус</th><th class="p-1">Кирди</th><th class="p-1">Чыкты</th><th class="p-1">GPS</th></tr>';
  let filtered=pinsOfDept.filter(([pin,info])=>{
    if(!q) return true;
    return (info.name+' '+pin).toLowerCase().includes(q);
  });
  if(filtered.length==0) html+='<tr><td colspan=6 class="p-4 text-center text-gray-400">Бул бөлүмдө кызматкер жок же ПИН бериле элек</td></tr>';
  filtered.forEach(([pin,info])=>{
    let w=Object.values(allWorkers).find(x=>x.pin==pin);
    let log=allLogs[pin]||{};
    let status=w?'🟢 Жумушта':'🔴 Сыртта';
    if(log.late) status+=' 🕘Кеч';
    if(log.earlyLeave) status+=' 🏃Эрте';
    let gps=w && w.lat?`<a target="_blank" href="https://maps.google.com/?q=${w.lat},${w.lng}" class="text-blue-600 underline">Карта</a>`:'-';
    html+=`<tr class="border-t"><td class="p-1 font-medium">${info.name}</td><td class="p-1"><b>${pin}</b></td><td class="p-1 text-[11px]">${status}</td><td class="p-1">${log.timeIn||'-'}</td><td class="p-1">${log.timeOut||'-'}</td><td class="p-1">${gps}</td></tr>`;
  });
  document.getElementById('tbl').innerHTML=html;
  loadMap();
}
render();
</script>
</body></html>
