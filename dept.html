<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бөлүм — Firebase FIX</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#172033}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;background:#fff;box-shadow:0 2px 6px #0001}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.orange{background:#f97316;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.dark{background:#1f2937;color:#fff}.main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:12px;min-width:0}.worker{padding:10px;border:1px solid #e2e8f0;border-radius:9px;margin-top:8px;background:#f8fafc}.muted{font-size:12px;color:#64748b}#map{height:75vh;border-radius:10px}#msg{font-size:12px;margin-top:8px;padding:8px;background:#dbeafe;border-radius:8px}#status{font-size:12px;color:#64748b;margin-top:8px}@media(max-width:700px){.main{grid-template-columns:1fr}#map{height:50vh}}
</style>
</head>
<body>
<div class="head"><div><strong id="dName">Бөлүм</strong><div class="muted">Firebase боюнча бөлүм • v1101</div></div><div><button class="btn orange" id="drawBtn">📐 Аймак кошуу</button> <button class="btn green" id="saveBtn">💾 Сактоо</button> <button class="btn red" id="clearBtn">🗑️ Өчүр</button> <button class="btn dark" id="backBtn">← Админ</button></div></div>
<div class="main"><div class="card"><strong>👥 <span id="dLabel"></span> — <span id="wCnt">0</span> кызматкер</strong><div id="status">Firebase'ден жүктөлүүдө...</div><div id="wList"></div></div><div class="card"><div id="map"></div><div id="msg">Карта жүктөлүүдө...</div></div></div>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const deptId = params.get('d');
const title = document.getElementById('dName');
const label = document.getElementById('dLabel');
const status = document.getElementById('status');
const count = document.getElementById('wCnt');
const workerList = document.getElementById('wList');
const msg = document.getElementById('msg');
const normalize = value => String(value == null ? '' : value).normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase();
if (!deptId) { title.textContent='Бөлүм көрсөтүлгөн жок'; status.textContent='admin.html аркылуу бөлүмдү тандаңыз (d параметри жок).'; }
else { title.textContent=deptId; label.textContent=deptId; }
const storageKey = 'gps_area_' + deptId;
const map = L.map('map',{doubleClickZoom:false}).setView([40.114,71.74],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let areas=[];
let tempPoly=null;
let drawing=false;
let points=[];
function safeText(node,value){node.textContent=String(value==null?'':value);}
function addWorker(name,pin,department){
  const item=document.createElement('div');item.className='worker';
  const main=document.createElement('strong');safeText(main,name||'Аты жок');
  const sub=document.createElement('div');sub.className='muted';safeText(sub,'PIN: '+pin+' • '+department);
  item.append(main,sub);workerList.appendChild(item);
}
function showWorkers(data){
  workerList.replaceChildren();
  const entries=Object.entries(data||{});
  const list=entries.filter(([pin,w])=>{
    if(!w||typeof w!=='object')return false;
    // Админ түзгөн PIN жазуусунда bolum бөлүмдүн негизги аталышы.
    const name=w.bolum||w.dept||w.department||'';
    return normalize(name)===normalize(deptId);
  });
  count.textContent=String(list.length);
  status.textContent='Firebase: '+entries.length+' PIN текшерилди';
  if(!list.length){const empty=document.createElement('div');empty.className='muted';empty.style.marginTop='12px';empty.textContent='Бул бөлүмдө кызматкер табылган жок. Админ панелинен PIN жазуусунун бөлүмүн текшериңиз.';workerList.appendChild(empty);}
  list.forEach(([pin,w])=>addWorker(w.name,pin,w.bolum||w.dept||''));
}
try {
  firebase.initializeApp({databaseURL:'https://gps-tracker-osh-default-rtdb.firebaseio.com'});
  if(deptId){firebase.database().ref('osh/pins').on('value',snap=>showWorkers(snap.val()),error=>{status.textContent='Firebase окуу катасы: '+error.message;});}
} catch(error){status.textContent='Firebase баштоо катасы: '+error.message;}
function savedAreas(){
 try{const raw=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(raw)||!raw.length)return[];return typeof raw[0]?.[0]==='number'?[raw]:raw;}catch{return[];}
}
function addPolygon(coords){if(!Array.isArray(coords)||coords.length<3)return;const p=L.polygon(coords,{color:'#ff6a00',fillColor:'#ff9a3d',fillOpacity:.35,weight:3}).addTo(map);areas.push(p);}
function loadAreas(){savedAreas().forEach(addPolygon);if(areas.length){map.fitBounds(L.featureGroup(areas).getBounds().pad(.2));msg.textContent=areas.length+' аймак жүктөлдү';}else msg.textContent='Бул браузерде аймак сакталган эмес';}
function stopDrawing(){map.off('click',addPoint);map.off('dblclick',finishDrawing);drawing=false;}
function addPoint(e){points.push([e.latlng.lat,e.latlng.lng]);if(tempPoly)map.removeLayer(tempPoly);tempPoly=L.polygon(points,{color:'#ff6a00',dashArray:'6,6',fillOpacity:.2}).addTo(map);msg.textContent=points.length+' чекит тандалды. Бүткөндө картаны эки жолу басыңыз.';}
function finishDrawing(){stopDrawing();if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}if(points.length>=3){addPolygon(points);msg.textContent='Аймак чийилди. Сактоо баскычын басыңыз.';}else msg.textContent='Кеминде 3 чекит керек';}
document.getElementById('drawBtn').onclick=()=>{if(drawing)stopDrawing();drawing=true;points=[];if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}map.on('click',addPoint);map.on('dblclick',finishDrawing);msg.textContent='Картаны басып кеминде 3 чекит коюңуз, анан эки жолу басыңыз';};
document.getElementById('saveBtn').onclick=()=>{if(!deptId){alert('Бөлүм тандалган эмес');return;}if(!areas.length){alert('Сактай турган аймак жок');return;}localStorage.setItem(storageKey,JSON.stringify(areas.map(p=>p.getLatLngs()[0].map(ll=>[ll.lat,ll.lng]))));msg.textContent='Аймак ушул браузерде сакталды: '+storageKey;};
document.getElementById('clearBtn').onclick=()=>{if(!confirm('Бул браузердеги '+deptId+' аймактарын өчүрөсүзбү?'))return;stopDrawing();if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}areas.forEach(p=>map.removeLayer(p));areas=[];localStorage.removeItem(storageKey);msg.textContent='Аймактар ушул браузерден өчүрүлдү';};
document.getElementById('backBtn').onclick=()=>location.href='admin.html?v=1101';
loadAreas();
</script>
</body>
</html>
