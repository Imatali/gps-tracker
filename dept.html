<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бөлүм</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>#map{height:60vh}.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;justify-content:center;align-items:center;border:3px solid white;box-shadow:0 2px 8px rgba(0,0,0,.4)}.g{background:#16a34a}.r{background:#dc2626}.pin span{transform:rotate(45deg);color:white;font-size:12px;font-weight:bold}</style></head><body class="bg-[#f8fafc] p-2 font-sans"><div class="max-w-[1200px] mx-auto"><div class="bg-white p-3 rounded-xl shadow-sm mb-2"><div class="flex justify-between"><div><a href="admin.html?v=1008" class="text-blue-600 text-sm">← Админка</a><h1 id="t" class="font-bold text-[18px]">Бөлүм</h1><div id="stats" class="flex gap-2 mt-1 text-[11px]"></div></div><a id="drawBtn" href="#" class="bg-green-600 text-white px-3 py-2 rounded-lg text-[12px] h-fit font-bold">📐 Аймактар (+)</a></div><div class="flex gap-2 mt-3"><button onclick="setF('all')" id="b_all" class="px-3 py-1.5 rounded-full text-[11px] bg-black text-white">Баары</button><button onclick="setF('in')" id="b_in" class="px-3 py-1.5 rounded-full text-[11px] bg-green-50 text-green-700 border">🟢 Ичинде</button><button onclick="setF('out')" id="b_out" class="px-3 py-1.5 rounded-full text-[11px] bg-red-50 text-red-700 border">🔴 Сыртында</button><button onclick="toggleFull()" class="ml-auto bg-gray-100 px-3 py-1.5 rounded-lg text-[11px]">⛶ Толук</button></div></div><div id="mapWrap" class="rounded-xl overflow-hidden shadow border bg-white"><div id="map" class="w-full"></div></div><div id="list" class="space-y-2 mt-3"></div></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
const dept=new URLSearchParams(location.search).get('d')||'Администрация';document.getElementById('t').innerText=dept;document.getElementById('drawBtn').href='geofence.html?d='+encodeURIComponent(dept)+'&v=1012';
let map=L.map('map').setView([40.128,71.726],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let gL=L.layerGroup().addTo(map),mL=L.layerGroup().addTo(map);let filter='all',allData=[],areas=[];
function ic(c){return L.divIcon({className:'',html:`<div class="pin ${c}"><span>${c=='g'?'✔':'✖'}</span></div>`,iconSize:[28,28],iconAnchor:[14,28]})}
function pointInPoly(lat,lng,poly){let x=lng,y=lat,inside=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][1],yi=poly[i][0],xj=poly[j][1],yj=poly[j][0];let inter=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);if(inter)inside=!inside}return inside}
function isInsideAny(lat,lng){if(!areas.length)return true;for(let a of areas){if(a.polygon){if(pointInPoly(lat,lng,a.polygon))return true}else if(a.center){if(map.distance([lat,lng],[a.center.lat,a.center.lng])<= (a.radius||500))return true}}return false}
function setF(f){filter=f;document.querySelectorAll('[id^=b_]').forEach(b=>b.classList.remove('bg-black','text-white'));document.getElementById('b_'+f).classList.add('bg-black','text-white');render();}
function toggleFull(){let w=document.getElementById('mapWrap');if(!document.fullscreenElement)w.requestFullscreen();else document.exitFullscreen();setTimeout(()=>map.invalidateSize(),300)}
db.ref('osh/settings/geofences/'+dept).on('value',s=>{
  gL.clearLayers();let v=s.val();areas=Array.isArray(v)?v:(v?(v.polygon||v.center?[v]:[]):[]);
  areas.forEach(a=>{if(a.polygon)L.polygon(a.polygon,{color:'#16a34a',fillOpacity:.15,weight:3}).addTo(gL);else if(a.center)L.circle([a.center.lat,a.center.lng],{radius:a.radius,color:'#16a34a',fillOpacity:.15}).addTo(gL)});
  if(areas.length)try{map.fitBounds(gL.getBounds(),{padding:[20,20]})}catch(e){}
  // кайра текшерүү
  if(allData.length)render();
});
db.ref('osh/pins').on('value',ps=>{db.ref('osh/workers').on('value',ws=>{let pins=ps.val()||{},workers=ws.val()||{};allData=Object.entries(pins).filter(([k,v])=>v.bolum==dept).map(([pin,p])=>{let w=Object.values(workers).find(x=>x.pin==pin);return{pin,name:p.name,w,inn:w?isInsideAny(w.lat,w.lng):false}});render();})});
function render(){mL.clearLayers();let b=[],f=allData.filter(d=>{if(filter=='all')return true;if(filter=='in')return d.w&&d.inn;if(filter=='out')return!d.w||!d.inn});let inc=allData.filter(d=>d.w&&d.inn).length,outc=allData.length-inc;document.getElementById('stats').innerHTML=`<span class="bg-green-100 text-green-700 px-2 py-1 rounded">Ичинде ${inc} / ${areas.length} аймак</span><span class="bg-red-100 text-red-700 px-2 py-1 rounded">Сыртында ${outc}</span>`;let h="";f.forEach(d=>{if(d.w){L.marker([d.w.lat,d.w.lng],{icon:ic(d.inn?'g':'r')}).addTo(mL).bindPopup(`<b>${d.name}</b><br>#${d.pin}<br>${d.inn?'🟢 Ичинде':'🔴 Сыртында'}`);b.push([d.w.lat,d.w.lng])}h+=`<div class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${d.w?(d.inn?'border-l-green-500':'border-l-red-500'):'border-l-gray-300'}"><div class="font-bold text-[13px]">${d.name} <span class="text-[10px] text-gray-500">#${d.pin}</span></div><div class="text-[11px] ${d.w?(d.inn?'text-green-600':'text-red-600'):'text-gray-400'}">${d.w?(d.inn?'🟢 '+areas.length+' аймактын биринде':'🔴 Бардык ${areas.length} аймактан сыртта'):'⚪ Жок'}</div></div>`});if(b.length)map.fitBounds(b,{padding:[30,30],maxZoom:17});document.getElementById('list').innerHTML=h||'<div class="bg-white p-6 text-center text-gray-400">Бош</div>';}
</script></body></html>
