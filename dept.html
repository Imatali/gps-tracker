<!DOCTYPE html>
<html lang="ky"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бөлүм - v1100 FIXED v2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f1f5f9}.head{display:flex;justify-content:space-between;padding:10px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);flex-wrap:wrap;gap:6px}.btn{padding:7px 12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:12px}.b-blue{background:#2563eb;color:#fff}.b-green{background:#16a34a;color:#fff}.b-red{background:#dc2626;color:#fff}.b-gray{background:#1f2937;color:#fff}.b-orange{background:#f97316;color:#fff}
.main{display:grid;grid-template-columns:320px 1fr;gap:8px;padding:8px}#map{height:82vh;border:3px solid #111;border-radius:10px}.card{background:#fff;border-radius:12px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.w{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:8px;margin-bottom:6px;display:flex;gap:8px}.av{width:38px;height:38px;border-radius:50%;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#16a34a}
@media(max-width:700px){.main{grid-template-columns:1fr}#map{height:55vh}}
</style></head><body>
<div class="head"><div><b id="dName">БӨЛҮМ</b> <small id="dInfo" style="color:#f97316"></small><br><small style="color:#64748b">v1100 FIXED v2 • Ар бөлүм өзүнчө</small></div>
<div style="display:flex;gap:5px;flex-wrap:wrap">
<button class="btn b-orange" onclick="drawArea()">📐 Аймак кошуу</button>
<button class="btn b-green" onclick="saveArea()">💾 Сактоо</button>
<button class="btn b-red" onclick="clearArea()">🗑️ Өчүр</button>
<button class="btn b-gray" onclick="location.href='admin.html?v=1100FIXED2'">← Админ</button>
</div></div>
<div class="main"><div class="card"><b>👥 <span id="dLabel">ГСВ</span> • <span id="wCnt">0</span> жумушчу</b><div id="wList" style="margin-top:8px"></div><div style="font-size:10px;color:#94a3b8;margin-top:8px">Бул бөлүмдүн ачкычы: <b id="key"></b><br>Тек ушул бөлүмдүн жумушчусу чыгат</div></div><div class="card" style="padding:4px"><div id="map"></div><div id="msg" style="font-size:11px;padding:6px;color:#2563eb;background:#dbeafe;margin-top:4px;border-radius:6px">Жүктөлүүдө...</div></div></div>
<script>
const deptId=decodeURIComponent(new URLSearchParams(location.search).get('d')||'ГСВ №10');
document.getElementById('dName').innerText=deptId;document.getElementById('dLabel').innerText=deptId;
const STORAGE_KEY='gps_area_'+deptId;
document.getElementById('key').innerText=STORAGE_KEY;document.getElementById('dInfo').innerText='['+STORAGE_KEY+']';
let map=L.map('map').setView([40.114,71.74],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let areas=[];let tempPoly=null;
function getWorkers(){try{return JSON.parse(localStorage.getItem('gps_workers')||'[]')}catch(e){return []}}
function render(){
 let all=getWorkers();
 let list=all.filter(w=>w.dept===deptId); // STRICT - тек ушул бөлүм!
 document.getElementById('wCnt').innerText=list.length;
 let h='';
 if(!list.length) h=`<div style="color:#94a3b8;font-size:12px;padding:10px;text-align:center">ℹ️ ${deptId} да жумушчу жок.<br>admin.html дан кошуңуз.</div>`;
 list.forEach(w=>{
   h+=`<div class="w"><div class="av">${(w.name||'--').substring(0,2).toUpperCase()}</div><div><b>${w.name} • ${w.pin}</b><br><small style="color:#64748b">📞 ${w.dept}<br>🟢 Текст</small></div></div>`;
 });
 document.getElementById('wList').innerHTML=h;
}
function getSaved(){ let s=localStorage.getItem(STORAGE_KEY); if(!s) return []; try{ let d=JSON.parse(s); return (Array.isArray(d[0])&&typeof d[0][0]==='number')?[d]:d; }catch(e){return []} }
function loadAreas(){
 let arr=getSaved(); areas=[];
 arr.forEach(ll=>{
  let p=L.polygon(ll,{color:'#ff6a00',fillColor:'#ff9a3d',fillOpacity:0.35,weight:3}).addTo(map);
  areas.push(p);
 });
 if(areas.length){ let g=new L.featureGroup(areas); map.fitBounds(g.getBounds().pad(0.2)); document.getElementById('msg').innerText=`✅ ${deptId} үчүн ${areas.length} аймак жүктөлдү`; }
 else document.getElementById('msg').innerText=`ℹ️ ${deptId} үчүн аймак жок. 📐 басып чийип 💾 Сактоо басыңыз`;
}
function drawArea(){
 if(tempPoly) map.removeLayer(tempPoly);
 let pts=[];
 document.getElementById('msg').innerText='🖱️ Картаны басып аймак чийиңиз. Бүткөндө 2 жолу басыңыз';
 function onClick(e){ pts.push([e.latlng.lat,e.latlng.lng]); if(tempPoly) map.removeLayer(tempPoly); tempPoly=L.polygon(pts,{color:'#ff6a00',dashArray:'6,6',fillOpacity:0.2}).addTo(map); }
 map.on('click',onClick);
 map.once('dblclick',()=>{
   map.off('click',onClick);
   if(pts.length>=3){ let p=L.polygon(pts,{color:'#ff6a00',fillColor:'#ff9a3d',fillOpacity:0.35,weight:3}).addTo(map); areas.push(p); if(tempPoly) map.removeLayer(tempPoly); tempPoly=null; document.getElementById('msg').innerText=`✅ ${pts.length} чекит чийилди. 💾 Сактоо басыңыз`; }else{document.getElementById('msg').innerText='❌ Кеминде 3 чекит керек';}
 });
}
function saveArea(){
 if(!areas.length){alert('Аймак жок!');return;}
 let all=areas.map(p=>p.getLatLngs()[0].map(ll=>[ll.lat,ll.lng]));
 localStorage.setItem(STORAGE_KEY,JSON.stringify(all));
 document.getElementById('msg').innerText=`✅ ${deptId} үчүн ${all.length} аймак сакталды! Key: ${STORAGE_KEY}`;
 alert(`✅ ${deptId} үчүн ${all.length} аймак сакталды!\nБашка бөлүмгө чыкпайт!`);
}
function clearArea(){ if(!confirm(deptId+' - аймактар өчүрүлсүнбү?')) return; areas.forEach(p=>map.removeLayer(p)); areas=[]; localStorage.removeItem(STORAGE_KEY); document.getElementById('msg').innerText=`🗑️ ${deptId} аймактары өчүрүлдү`; }
render();loadAreas();
</script></body></html>
