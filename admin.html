<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кадамжай ЖДПБ - Админ</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{margin:0;font-family:system-ui;background:#f1f5f9}.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;box-shadow:0 1px 3px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:10px}.card{background:#fff;border-radius:12px;padding:12px;border-top:4px solid #6366f1}.add{border:2px dashed #94a3b8;display:grid;place-items:center;color:#1d4ed8;min-height:120px;cursor:pointer}.filters{background:#fff;margin:8px;padding:10px;border-radius:12px;display:flex;gap:8px}</style>
</head>
<body>
<div class="header"><b>📍 Кадамжай - <span id="cntTop">0</span> бөлүм</b><div><button onclick="fixAll()">🔧 Оңдоо</button> <button onclick="restore()">♻️ Калыбына</button></div></div>
<div class="filters"><input id="searchMain" oninput="render()" placeholder="🔍 Издөө..." style="flex:1;padding:8px;border-radius:20px;border:1px solid #ddd"><button onclick="addDept()" style="background:#1d4ed8;color:#fff;border:0;padding:8px 14px;border-radius:8px">+ Бөлүм</button></div>
<div id="grid" class="grid"></div>

<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let departments=[], allWorkers={};

db.ref('osh/departments').on('value',snap=>{
 let v=snap.val(); if(!v){departments=[]; render(); return;}
 departments = Array.isArray(v) ? v : Object.values(v);
 render();
});
db.ref('osh/workers').on('value',snap=>{
 allWorkers={}; snap.forEach(c=>allWorkers[c.key]=c.val()); render();
});

function getStats(id){
 let arr = Object.values(allWorkers).filter(w => String(w.deptId) === String(id));
 return {total:arr.length, work:arr.filter(w=>w.inside!==false).length, out:arr.filter(w=>w.inside===false).length, arr:arr};
}

function render(){
 let q=(document.getElementById('searchMain').value||'').toLowerCase();
 let g=document.getElementById('grid'); g.innerHTML='';
 departments.filter(d=>d.name&&d.name.toLowerCase().includes(q)).forEach(d=>{
  let s=getStats(d.id);
  g.innerHTML+=`<div class="card" style="border-top-color:${d.color}"><div style="display:flex;justify-content:space-between"><b>${d.name}</b><span onclick="delDept(${d.id})" style="cursor:pointer">❌</span></div><div style="margin-top:8px;font-size:13px">Жалпы: <b>${s.total}</b><br>🟢 Иште ${s.work} | 🔴 Сыртта ${s.out}</div></div>`;
 });
 g.innerHTML+=`<div class="card add" onclick="addDept()">➕ Бөлүм кошуу</div>`;
 document.getElementById('cntTop').innerText=departments.length;
}

function addDept(){
 let n=prompt("Жаңы бөлүм аты:");
 if(!n)return;
 departments.push({id:Date.now(), name:n.trim(), color:"#64748b"});
 db.ref('osh/departments').set(departments);
}

function delDept(id){
 if(!confirm("Өчүрөбүзбү?"))return;
 departments=departments.filter(d=>String(d.id)!==String(id));
 db.ref('osh/departments').set(departments);
}

// ЭСКИ КАТАЛГАНДАРДЫ ОҢДОО - бир жолу басылат
function fixAll(){
 let updates={};
 Object.entries(allWorkers).forEach(([key,w])=>{
  if(!w.deptId || w.deptId==0){
   let dep=departments.find(d=>d.name===w.bolum);
   if(dep){ updates['osh/workers/'+key+'/deptId']=dep.id; }
  }
 });
 if(Object.keys(updates).length==0) return alert('Баары туура, оңдоонун кереги жок');
 db.ref().update(updates).then(()=>alert('✅ Оңдолду! Эми ар ким өз бөлүмүндө гана көрүнөт'));
}

function restore(){
 if(!confirm("9 бөлүм калыбына келтирилсинби?"))return;
 let base=[
  {id:1,name:"Администрация",color:"#6366f1"},
  {id:2,name:"Бухгалтерия",color:"#f59e0b"},
  {id:3,name:"КДО",color:"#0ea5e9"},
  {id:4,name:"Терапия",color:"#8b5cf6"},
  {id:5,name:"ГСВ №1",color:"#10b981"},
  {id:6,name:"ГСВ №2",color:"#06b6d4"},
  {id:7,name:"ГСВ №3",color:"#ef4444"},
  {id:8,name:"ГСВ №7",color:"#f97316"},
  {id:9,name:"ГСВ №9",color:"#64748b"}
 ];
 db.ref('osh/departments').set(base);
}
</script>
</body>
</html>
