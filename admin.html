<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадамжай ЖДПБ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9}
.header{background:white;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:20}
.header h1{margin:0 0 10px;font-size:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px}
.card{background:white;border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-top:4px solid #6366f1;cursor:pointer}
.card:hover{transform:translateY(-2px)}
#deptDetail{display:none;padding:16px}
#map{height:400px;border-radius:12px;margin:12px 0;background:#ddd}
.workers.worker{background:white;padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between}
.badge{padding:3px 8px;border-radius:12px;color:white;font-size:11px}
.btn{padding:8px 14px;border:0;border-radius:8px;background:#6366f1;color:white;cursor:pointer}
.btn-back{background:#e5e7eb;color:#111}
</style>
</head>
<body>
<div class="header">
  <h1>Кадамжай ЖДПБ <span id="count">7 / 7</span></h1>
  <div class="filters" id="mainFilters">
    <select id="filterDept"><option value="all">Бардык бөлүмдөр</option></select>
    <select id="filterStatus"><option value="all">Бардык</option><option value="late">Кечиккендер</option><option value="early">Эрте кеткендер</option><option value="absent">Келбегендер</option><option value="working">Жумушта</option></select>
    <input id="search" placeholder="Издөө...">
  </div>
</div>

<div id="mainView">
  <div class="grid" id="deptGrid"></div>
  <div class="workers" id="allWorkers"></div>
</div>

<div id="deptDetail">
  <button class="btn btn-back" onclick="closeDept()">← Артка</button>
  <h2 id="detailTitle"></h2>
  <div id="map"></div>
  <div id="detailWorkers"></div>
</div>

<script>
const firebaseConfig={databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};
firebase.initializeApp(firebaseConfig);
const ALLOWED={admin:{name:"Администрация",color:"#6366f1"},buh:{name:"Бухгалтерия",color:"#f59e0b"},gsv1:{name:"ГСВ №1",color:"#10b981"},gsv2:{name:"ГСВ №2",color:"#f59e0b"},gsv3:{name:"ГСВ №3",color:"#ef4444"},kdo:{name:"КДО",color:"#2563eb"},terapia:{name:"Терапия",color:"#10b981"}};
function cleanId(id){return (id||'').toString().replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase();}
firebase.database().ref('depts').once('value').then(s=>{Object.keys(s.val()||{}).forEach(k=>{if(!ALLOWED[cleanId(k)]) firebase.database().ref('depts/'+k).remove();});});
firebase.database().ref('osh/depts').once('value').then(s=>{Object.keys(s.val()||{}).forEach(k=>{if(!ALLOWED[cleanId(k)]) firebase.database().ref('osh/depts/'+k).remove();});});

let allWorkers={},map=null,markers=[],selectedDept='all',selectedStatus='all';
function init(){
  const sel=document.getElementById('filterDept');
  Object.keys(ALLOWED).forEach(id=>{let o=document.createElement('option');o.value=id;o.textContent=ALLOWED[id].name;sel.appendChild(o);});
  sel.onchange=e=>{selectedDept=e.target.value;render();};
  document.getElementById('filterStatus').onchange=e=>{selectedStatus=e.target.value;render();};
  document.getElementById('search').oninput=render;
  firebase.database().ref('osh/workers').on('value',s=>{allWorkers=s.val()||{};render(); if(document.getElementById('deptDetail').style.display!=='none') openDept(currentDept);});
  render();
}
let currentDept=null;
function render(){
  const counts={};Object.keys(ALLOWED).forEach(k=>counts[k]=0);
  Object.values(allWorkers).forEach(w=>{const d=cleanId(w.deptId);if(counts[d]!==undefined) counts[d]++;});
  let html='';Object.keys(ALLOWED).forEach(id=>{
    if(selectedDept!=='all'&&selectedDept!==id) return;
    const inf=ALLOWED[id];
    html+=`<div class="card" style="border-top-color:${inf.color}" onclick="openDept('${id}')"><b>${inf.name}</b><br><small>${id}</small><div style="margin-top:8px">Жумушта: ${counts[id]||0} • Бардыгы: ${counts[id]||0}</div><div style="margin-top:8px;color:${inf.color};font-size:13px">Картаны ачуу →</div></div>`;
  });
  document.getElementById('deptGrid').innerHTML=html;
  renderWorkerList('allWorkers',null);
}
function renderWorkerList(containerId, deptFilter){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const statusFilter=selectedStatus;
  let html='';Object.entries(allWorkers).forEach(([wid,w])=>{
    const d=cleanId(w.deptId);if(deptFilter&&d!==deptFilter) return;
    if(selectedDept!=='all'&&!deptFilter&&d!==selectedDept) return;
    if(q&&!(w.name||'').toLowerCase().includes(q)) return;
    const color=ALLOWED[d]?ALLOWED[d].color:'#999';
    html+=`<div class="worker"><div><b>${w.name||wid}</b><br><small style="color:${color}">${ALLOWED[d]?ALLOWED[d].name:d}</small></div><span class="badge" style="background:${color}">${d}</span></div>`;
  });
  document.getElementById(containerId).innerHTML=html||'<div style="padding:20px;color:#999">Тизме бош</div>';
}
function openDept(id){
  currentDept=id;const info=ALLOWED[id];
  document.getElementById('mainView').style.display='none';
  document.getElementById('mainFilters').style.display='none';
  document.getElementById('deptDetail').style.display='block';
  document.getElementById('detailTitle').innerHTML=`${info.name} <small style="color:${info.color}">${id}</small>`;
  renderWorkerList('detailWorkers',id);
  setTimeout(()=>{
    if(!map){map=L.map('map').setView([40.1,71.7],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);}
    markers.forEach(m=>map.removeLayer(m));markers=[];
    Object.values(allWorkers).forEach(w=>{
      const d=cleanId(w.deptId);if(d!==id) return;
      if(w.lat&&w.lng){const m=L.marker([w.lat,w.lng]).addTo(map).bindPopup(w.name||'');markers.push(m);}
    });
    if(markers.length) {const g=L.featureGroup(markers);map.fitBounds(g.getBounds().pad(0.2));}
    map.invalidateSize();
  },100);
}
function closeDept(){
  document.getElementById('deptDetail').style.display='none';
  document.getElementById('mainView').style.display='block';
  document.getElementById('mainFilters').style.display='flex';
}
init();
</script>
</body>
</html>
