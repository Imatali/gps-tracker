<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>body{margin:0;font-family:sans-serif;background:#f8fafc}#map{height:65vh}.panel{padding:10px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001;margin-bottom:10px}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.b1{background:#16a34a;color:#fff}.b2{background:#e5e7eb}.in{color:#16a34a;font-weight:bold}.out{color:#dc2626;font-weight:bold}</style></head><body><div id="map"></div><div class="panel"><div class="card"><button class="btn b1" onclick="startDraw()">✏️ Чийүү</button> <button class="btn b2" onclick="finish()">✅ Шилтеме түз</button> <button class="btn b2" onclick="showAll()">👁️ Баарын көрсөт</button><div id="linkBox" style="margin-top:10px;word-break:break-all"></div></div><div class="card" id="tblBox"></div></div><script>
const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh",storageBucket:"gps-tracker-osh.firebasestorage.app",messagingSenderId:"588347508048",appId:"1:588347508048:web:1b6fd5417ff8f4e5f29855"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let map=L.map('map').setView([40.12,71.7],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let pts=[],poly=null,drawing=false,zones=[],markers={},lastWorkers=[];
map.on('click',e=>{if(!drawing)return;pts.push([e.latlng.lat,e.latlng.lng]);if(poly)map.removeLayer(poly);poly=L.polygon(pts,{color:'#16a34a'}).addTo(map);});
function startDraw(){pts=[];if(poly)map.removeLayer(poly);drawing=true;alert('Чий!');}
function finish(){drawing=false;if(pts.length<3){alert('3 чекит керек');return;}zones=[pts];let data=btoa(unescape(encodeURIComponent(JSON.stringify(zones))));let base=location.href.replace('admin.html','worker.html');let link=base+'#zones='+data;document.getElementById('linkBox').innerHTML=`<a href="${link}" target="_blank">${link}</a><br><button class="btn b1" onclick="navigator.clipboard.writeText('${link}')">📋 Көчүрүү</button>`;localStorage.setItem('myzones',JSON.stringify(zones));listen();}
function checkInside(lat,lng,polys){for(let p of polys){let ok=false;for(let i=0,j=p.length-1;i<p.length;j=i++){let xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];let inter=((yi>lng)!=(yj>lng))&&(lat<(xj-xi)*(lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok)return true;}return false;}
function showAll(){let b=L.latLngBounds([]);if(poly)b.extend(poly.getBounds());lastWorkers.forEach(w=>b.extend([w.lat,w.lng]));if(b.isValid())map.fitBounds(b.pad(0.2));}
function listen(){let saved=localStorage.getItem('myzones');let z=zones.length?zones:(saved?JSON.parse(saved):[]);if(z[0]&&!poly){poly=L.polygon(z[0],{color:'#16a34a',fillOpacity:0.2}).addTo(map);}db.ref('osh/workers').on('value',snap=>{let html='<h3>👷 Жумушчулар</h3><table width=100%><tr><th>Аты</th><th>Статус</th><th>Убакыт</th></tr>';lastWorkers=[];snap.forEach(ch=>{let v=ch.val();lastWorkers.push(v);let inn=z[0]?checkInside(v.lat,v.lng,[z[0]]):false;let cls=inn?'in':'out';let txt=inn?'🟢 ИЧТЕ':'🔴 СЫРТТА';html+=`<tr style="cursor:pointer" onclick="map.flyTo([${v.lat},${v.lng}],15)"><td><b>${v.name}</b><br>${v.lat.toFixed(4)},${v.lng.toFixed(4)}</td><td class="${cls}">${txt}<br>${v.acc}м</td><td>${new Date(v.ts).toLocaleTimeString()}</td></tr>`;if(markers[ch.key])map.removeLayer(markers[ch.key]);let icon=L.divIcon({html:`<div style="background:${inn?'#16a34a':'#dc2626'};color:#fff;padding:5px 10px;border-radius:14px;font-weight:bold;border:2px solid white;box-shadow:0 2px 8px #0008">${v.name} ${inn?'🟢':'🔴'}</div>`,className:''});markers[ch.key]=L.marker([v.lat,v.lng],{icon}).addTo(map).bindPopup(`${v.name} - ${txt}`);});html+='</table>';document.getElementById('tblBox').innerHTML=html;if(lastWorkers.length)showAll();});}
listen();
</script></body></html>
