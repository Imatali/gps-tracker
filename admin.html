<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадамжай ЖДПБ - 4 Бөлүм</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}header{position:sticky;top:0;z-index:1000;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px}.logo{display:flex;gap:10px;align-items:center}.lb{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,#0f172a,#0064e0);display:grid;place-items:center;color:#fff;font-weight:800}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:10px}.stat{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #eef2f7}.stat small{font-size:10px;color:var(--muted);text-transform:uppercase}.stat b{font-size:20px;display:block}.layout{display:grid;grid-template-columns:1.7fr.9fr;gap:10px;padding:0 10px 10px}#map{height:68vh;border-radius:18px;border:1px solid #e2e8f0}.card{background:#fff;border-radius:16px;padding:12px;border:1px solid #eef2f7;margin-bottom:10px}.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;font-size:13px}.btn-dark{background:#0f172a;color:#fff}.btn-ghost{background:#f1f5f9}.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 11px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid #00000012;cursor:pointer}.select{border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;font-weight:600;background:#fff}.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}</style></head><body><header><div class="logo"><div class="lb">К</div><div><b>Кадамжай ЖДПБ</b><br><small style="color:#64748b">КДО • ГСВ №1 • №2 • №3</small></div></div><div class="row"><div style="width:9px;height:9px;background:#16a34a;border-radius:50%"></div><small>ТҮЗ ЭФИР</small></div></header><div class="stats" id="statsBox"></div><div class="layout"><div><div id="map"></div><div class="card" style="margin-top:10px"><b>🗺️ 4 Бөлүмдү тандап зона чий</b><div id="deptChips" class="row" style="margin-top:8px"></div><div class="row" style="margin-top:12px"><select id="deptSelect" class="select"></select><input id="zoneName" class="select" placeholder="Зона аты: мисалы Базар" style="min-width:160px"><button class="btn btn-dark" onclick="startDraw()">✏️ Чийүү баштоо</button><button class="btn" style="background:#16a34a;color:#fff" onclick="finishZone()">✅ Бөлүмгө сактоо</button><button class="btn btn-ghost" onclick="clearAllZones()">🗑️ Тазалоо</button></div><div id="linkBox" style="margin-top:10px"></div><div id="zonesList" class="row" style="margin-top:10px"></div></div></div><div><div class="card"><div class="row" style="justify-content:space-between"><b>👷 Жумушчулар</b><input id="search" class="select" placeholder="Издөө" oninput="render()"></div><div id="deptFilter" class="row" style="margin-top:8px"></div><div id="workersTable" style="margin-top:8px"></div></div><div class="card"><b>📜 Лог</b><div id="logBox" style="font-size:11px;margin-top:6px;max-height:200px;overflow:auto"></div></div></div></div><script>const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh",storageBucket:"gps-tracker-osh.firebasestorage.app",messagingSenderId:"588347508048",appId:"1:588347508048:web:1b6fd5417ff8f4e5f29855"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let map=L.map('map').setView([40.13,71.75],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);const DEPTS=[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let zones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');let pts=[],polyTemp=null,drawing=false,zoneLayers=[],markers={},workersCache={},filterDept='all';function renderDepts(){document.getElementById('deptSelect').innerHTML=DEPTS.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');document.getElementById('deptChips').innerHTML=DEPTS.map(d=>`<span class="badge" style="background:${d.color}15;color:${d.color};border-color:${d.color}30"><span style="width:8px;height:8px;background:${d.color};border-radius:50%;display:inline-block"></span>${d.name}</span>`).join('');document.getElementById('deptFilter').innerHTML=`<span class="badge" onclick="setF('all')" style="${filterDept=='all'?'background:#0f172a;color:#fff':''}">Баары</span>`+DEPTS.map(d=>`<span class="badge" onclick="setF('${d.id}')" style="background:${filterDept==d.id?d.color:'#fff'};color:${filterDept==d.id?'#fff':d.color}">${d.name}</span>`).join('');}function setF(id){filterDept=id;renderDepts();render();}renderDepts();function save(){localStorage.setItem('kadamjai_zones_v3',JSON.stringify(zones));}function renderZones(){zoneLayers.forEach(l=>map.removeLayer(l));zoneLayers=[];zones.forEach(z=>{let dept=DEPTS.find(d=>d.id==z.deptId)||DEPTS[0];let ly=L.polygon(z.points,{color:dept.color,weight:3,fillColor:dept.color,fillOpacity:.25}).addTo(map);ly.bindPopup(`<b>${z.name}</b><br>${dept.name}`);zoneLayers.push(ly);});document.getElementById('zonesList').innerHTML=zones.map((z,i)=>{let d=DEPTS.find(dd=>dd.id==z.deptId);return `<span class="badge" style="background:${d.color}15;color:${d.color}">${z.name} (${d.name}) <span onclick="delZone(${i})">✕</span></span>`}).join('')||'<small style="color:#94a3b8">Зона жок - жогорудан бөлүм тандап чий</small>';save();genLink();renderStats();}function delZone(i){zones.splice(i,1);renderZones();}function clearAllZones(){if(!confirm('Баарын өчүрөбү?'))return;zones=[];renderZones();}map.on('click',e=>{if(!drawing)return;pts.push([e.latlng.lat,e.latlng.lng]);if(polyTemp) map.removeLayer(polyTemp);polyTemp=L.polygon(pts,{color:'#0064e0',dashArray:'6 6',fillOpacity:.08}).addTo(map);});function startDraw(){pts=[];if(polyTemp) map.removeLayer(polyTemp);drawing=true;alert('Картаны басып зона чийип бүткөндө 2 жолу басып кой');}function finishZone(){if(pts.length<3){alert('Кеминде 3 чекит керек');return;}let deptId=document.getElementById('deptSelect').value;let name=document.getElementById('zoneName').value||`Зона ${zones.length+1}`;zones.push({id:Date.now().toString(),deptId,name,points:[...pts]});pts=[];if(polyTemp){map.removeLayer(polyTemp);polyTemp=null;}drawing=false;document.getElementById('zoneName').value='';renderZones();}function genLink(){if(!zones.length){document.getElementById('linkBox').innerHTML='';return;}let payload={depts:DEPTS,zones};let data=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));let base=location.href.replace('admin.html','worker.html');let link=base.split('?')[0].split('#')[0]+'#data='+data;document.getElementById('linkBox').innerHTML=`<div style="background:#f1f5f9;padding:10px;border-radius:10px"><b>🔗 Жумушчу шилтемеси (4 бөлүм менен):</b><div style="margin:6px 0;word-break:break-all;background:#fff;padding:6px;border-radius:8px;border:1px dashed #cbd5e1;font-size:11px"><a href="${link}" target="_blank">${link}</a></div><button class="btn btn-dark" onclick="navigator.clipboard.writeText('${link}');alert('Көчүрүлдү!')">📋 Көчүрүү</button></div>`;}function checkInside(lat,lng){for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>lng)!=(yj>lng))&&(lat<(xj-xi)*(lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok) return z;}return null;}function renderStats(){let total=Object.keys(workersCache).length;let inC=Object.values(workersCache).filter(w=>w.inside).length;let html=`<div class="stat"><small>Бардыгы</small><b>${total}</b></div><div class="stat"><small>Жумушта</small><b style="color:#16a34a">${inC}</b></div>`;DEPTS.forEach(d=>{let c=Object.values(workersCache).filter(w=>w.deptId==d.id).length;html+=`<div class="stat" style="border-left:5px solid ${d.color}"><small>${d.name}</small><b style="color:${d.color}">${c}</b></div>`;});document.getElementById('statsBox').innerHTML=html;}function listen(){db.ref('osh/workers').on('value',snap=>{workersCache={};snap.forEach(ch=>{let v=ch.val();let hit=checkInside(v.lat,v.lng);v.inside=!!hit;v.deptId=hit?hit.deptId:null;v.deptName=hit?(DEPTS.find(d=>d.id==hit.deptId)?.name||''):'';v.zoneName=hit?hit.name:'';workersCache[ch.key]=v;if(markers[ch.key]) map.removeLayer(markers[ch.key]);let col=v.inside?(DEPTS.find(d=>d.id==v.deptId)?.color||'#16a34a'):'#ef4444';let icon=L.divIcon({html:`<div style="background:${col};color:white;padding:5px 10px;border-radius:999px;font-weight:800;font-size:11px;border:2px solid white;white-space:nowrap">${v.name} ${v.inside?'🟢':'🔴'} ${v.deptName?'• '+v.deptName:''}</div>`,className:'',iconAnchor:[30,12]});markers[ch.key]=L.marker([v.lat,v.lng],{icon}).addTo(map);});renderStats();render();});}function render(){let q=(document.getElementById('search').value||'').toLowerCase();let arr=Object.values(workersCache);if(filterDept!=='all') arr=arr.filter(w=>w.deptId==filterDept);if(q) arr=arr.filter(w=>w.name.toLowerCase().includes(q));let html='<table style="width:100%;font-size:12px"><tr><th>Аты</th><th>Бөлүм</th></tr>';arr.forEach(w=>{let d=DEPTS.find(dd=>dd.id==w.deptId);let col=d?d.color:'#64748b';html+=`<tr onclick="map.flyTo([${w.lat},${w.lng}],16)" style="cursor:pointer"><td><b>${w.name}</b></td><td><span style="color:${col};font-weight:700">${w.deptName?`📍 ${w.zoneName} • ${w.deptName}`:'🔴 Сыртта'}</span></td></tr>`;});html+='</table>';document.getElementById('workersTable').innerHTML=html||'Жок';}renderZones();listen();genLink();</script></body></html>
