<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадамжай ЖДПБ</title><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}@media(min-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}.card{background:#fff;border-radius:18px;padding:14px;border:1px solid #eef2f7;cursor:pointer;position:relative;overflow:hidden}.top{height:6px;position:absolute;top:0;left:0;right:0}.stat{display:flex;gap:6px;margin-top:10px}.mini{flex:1;background:#f8fafc;border-radius:10px;padding:7px 9px;border:1px solid #f1f5f9}.mini small{font-size:9px;color:#64748b;display:block}.mini b{font-size:16px}.btn{border:0;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer}.btn-dark{background:#0f172a;color:#fff}.btn-red{background:#ef4444;color:#fff}.inp{border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px}</style></head><body><header><div><b style="font-size:20px">🏥 Кадамжай ЖДПБ</b><br><small style="color:#64748b">Башкы панель - Бөлүмдөр</small></div><div id="totalBox" style="text-align:right"></div></header><div style="padding:12px"><div style="background:#fff;border-radius:14px;padding:12px;border:1px solid #eef2f7;display:flex;gap:6px;flex-wrap:wrap;align-items:center"><b>➕ Жаңы бөлүм:</b><input id="newName" class="inp" placeholder="Аты: ГСВ №4" style="flex:1;min-width:140px"><input id="newColor" type="color" value="#8b5cf6" style="width:44px;height:38px;border-radius:9px;border:1px solid #e2e8f0"><button class="btn btn-dark" onclick="addDept()">+ Кошуу</button></div></div><div class="grid" id="grid"></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>const cfg={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};firebase.initializeApp(cfg);const db=firebase.database();let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'null')||[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let zones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');let assign=JSON.parse(localStorage.getItem('kadamjai_assign_v2')||'{}');if(Object.keys(assign).length&&typeof Object.values(assign)[0]==='string'){let n={};Object.keys(assign).forEach(k=>n[k]={deptId:assign[k],start:'08:00',end:'17:00'});assign=n;}let workers={};function save(){localStorage.setItem('kadamjai_depts_final',JSON.stringify(DEPTS));}window.addDept=function(){let name=document.getElementById('newName').value.trim();if(!name) return alert('Атын жаз! Мисалы: ГСВ №4');let color=document.getElementById('newColor').value;let id=name.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,10)+Date.now().toString().slice(-3);DEPTS.push({id,name,color});save();document.getElementById('newName').value='';render();};window.delDept=function(e,id){e.stopPropagation();if(!confirm('Чын эле өчүрөсүңбү? Зоналары да өчөт!')) return;DEPTS=DEPTS.filter(d=>d.id!=id);let all=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');all=all.filter(z=>z.deptId!=id);localStorage.setItem('kadamjai_zones_v3',JSON.stringify(all));zones=all;save();render();};function render(){let stats={};DEPTS.forEach(d=>stats[d.id]={total:0,in:0});Object.keys(workers).forEach(wId=>{let v=assign[wId];let deptId=v?v.deptId:null;if(!deptId) return;if(!stats[deptId]) stats[deptId]={total:0,in:0};stats[deptId].total++;if(workers[wId]._inside && workers[wId]._insideDept==deptId) stats[deptId].in++;});document.getElementById('grid').innerHTML=DEPTS.map(d=>{let s=stats[d.id]||{total:0,in:0};let out=s.total-s.in;let zc=zones.filter(z=>z.deptId==d.id).length;return `<div class="card" onclick="location.href='dept.html?dept=${d.id}'"><div class="top" style="background:${d.color}"></div><div style="display:flex;justify-content:space-between"><b>${d.name}</b><div style="display:flex;gap:4px"><small style="background:${d.color}15;color:${d.color};padding:3px 8px;border-radius:99px">${zc} зона</small><button class="btn btn-red" style="padding:2px 6px" onclick="delDept(event,'${d.id}')">✕</button></div></div><div class="stat"><div class="mini"><small>🟢 ЖУМУШТА</small><b style="color:${d.color}">${s.in}</b></div><div class="mini"><small>🔴 СЫРТТА</small><b style="color:${out>0?'#ef4444':'#16a34a'}">${out}</b></div><div class="mini"><small>👥 БААРЫ</small><b>${s.total}</b></div></div><div style="margin-top:8px;font-size:11px;color:#64748b">${s.total==0?'⚠️ Бекитиле элек':out>0?`⚠️ ${out} адам жок`:'✅ Баары ордунда'}</div><button class="btn" style="background:${d.color};color:#fff;width:100%;margin-top:10px">Ачуу →</button></div>`}).join('');let allIn=Object.values(stats).reduce((a,b)=>a+b.in,0);let allTot=Object.values(stats).reduce((a,b)=>a+b.total,0);document.getElementById('totalBox').innerHTML=`<b>🟢 ${allIn} жумушта</b><br><small>🔴 ${allTot-allIn} сыртта • 👥 ${allTot} бекитилген</small>`;}db.ref('osh/workers').on('value',snap=>{workers={};snap.forEach(ch=>{let v=ch.val();let hitDept=null;for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>v.lng)!=(yj>v.lng))&&(v.lat<(xj-xi)*(v.lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok){hitDept=z.deptId;break;}}v._inside=!!hitDept;v._insideDept=hitDept;workers[ch.key]=v;});render();});render();</script></body></html>
