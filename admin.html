<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадамжай ЖДПБ - Бөлүмдөр</title><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:14px 18px;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px}@media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}.dept-card{background:#fff;border-radius:18px;padding:16px;border:1px solid #eef2f7;cursor:pointer;transition:.2s;position:relative;overflow:hidden}.dept-card:hover{transform:translateY(-4px);box-shadow:0 10px 30px #00000010}.dept-card b{font-size:18px}.top-line{height:6px;position:absolute;top:0;left:0;right:0}.stat-row{display:flex;gap:8px;margin-top:12px}.mini{background:#f1f5f9;border-radius:10px;padding:8px 10px;flex:1}.mini small{font-size:10px;color:#64748b;display:block}.mini b{font-size:18px}.btn{border:0;background:#0f172a;color:#fff;padding:8px 12px;border-radius:10px;font-weight:700;cursor:pointer;margin-top:10px;width:100%}</style></head><body><header><div><b style="font-size:20px">🏥 Кадамжай ЖДПБ</b><br><small style="color:#64748b">Бөлүмдү тандаңыз - Башкы панель</small></div><div id="totalBox"></div></header><div class="grid" id="deptGrid"></div><div style="padding:12px"><div style="background:#fff;border-radius:16px;padding:12px"><b>⚙️ Бөлүм кошуу</b><div style="display:flex;gap:6px;margin-top:8px"><input id="newName" placeholder="Аты: ГСВ №4" style="flex:1;padding:8px;border:1px solid #e2e8f0;border-radius:8px"><input id="newColor" type="color" value="#8b5cf6"><button onclick="addDept()" style="background:#0f172a;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700">+ Кошуу</button></div></div></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh",storageBucket:"gps-tracker-osh.firebasestorage.app",messagingSenderId:"588347508048",appId:"1:588347508048:web:1b6fd5417ff8f4e5f29855"};firebase.initializeApp(firebaseConfig);const db=firebase.database();let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'null')||[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let zones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');function save(){localStorage.setItem('kadamjai_depts_final',JSON.stringify(DEPTS));}function addDept(){let n=document.getElementById('newName').value.trim();if(!n)return alert('Атын жаз');let c=document.getElementById('newColor').value;let id=n.toLowerCase().replace(/[^a-z0-9]/g,'')+Date.now().toString().slice(-3);DEPTS.push({id,name:n,color:c});save();renderGrid();document.getElementById('newName').value='';}function renderGrid(){document.getElementById('deptGrid').innerHTML=DEPTS.map(d=>{let zoneCount=zones.filter(z=>z.deptId==d.id).length;return `<div class="dept-card" onclick="location.href='dept.html?dept=${d.id}'"><div class="top-line" style="background:${d.color}"></div><div style="width:40px;height:40px;background:${d.color}15;color:${d.color};border-radius:12px;display:grid;place-items:center;font-weight:800">${d.name[0]}</div><b style="margin-top:10px;display:block">${d.name}</b><small style="color:#64748b">${zoneCount} зона • ${d.color}</small><div class="stat-row"><div class="mini"><small>Жумушта</small><b id="in-${d.id}" style="color:${d.color}">0</b></div><div class="mini"><small>Зона</small><b>${zoneCount}</b></div></div><button class="btn" style="background:${d.color}">Ачуу →</button></div>`}).join('');}renderGrid();db.ref('osh/workers').on('value',snap=>{let counts={};snap.forEach(ch=>{let v=ch.val();let hit=null;for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>v.lng)!=(yj>v.lng))&&(v.lat<(xj-xi)*(v.lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok){hit=z;break;}}if(hit){counts[hit.deptId]=(counts[hit.deptId]||0)+1;}});DEPTS.forEach(d=>{let el=document.getElementById('in-'+d.id);if(el) el.innerText=counts[d.id]||0;});let total=snap.numChildren();document.getElementById('totalBox').innerHTML=`<b>${total} кызматкер түз эфирде</b>`;});</script></body></html>
