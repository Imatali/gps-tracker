<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кадамжай ЖДПБ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{margin:0;font-family:system-ui;background:#f1f5f9}.header{background:#fff;padding:12px;display:flex;justify-content:space-between;box-shadow:0 1px 3px #0001}.filters{background:#fff;margin:8px;padding:8px;border-radius:12px;display:flex;gap:6px;flex-wrap:wrap}.f{border:1px solid #ddd;padding:6px 10px;border-radius:8px;background:#fff;cursor:pointer}.f.active{background:#1d4ed8;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:8px}.card{background:#fff;border-radius:10px;padding:12px;border-top:4px solid #6366f1;box-shadow:0 1px 3px #0001;cursor:pointer}.add{border:2px dashed #94a3b8;display:grid;place-items:center;color:#1d4ed8;min-height:120px}</style>
</head>
<body>
<div class="header"><b>📍 Кадамжай ЖДПБ <span id="cnt">8/8</span></b><button onclick="localStorage.clear();location.reload()">♻️ Тазалоо</button></div>
<div class="filters">
<button class="f active">🏢 Бөлүм 8</button>
<button class="f">⏰ Кечиккендер 0</button>
<button class="f">↩️ Эрте кеткендер 0</button>
<button class="f">🚫 Келбегендер 0</button>
<input id="search" oninput="render()" placeholder="Издөө..." style="margin-left:auto;border:1px solid #ddd;border-radius:20px;padding:6px 12px">
<button onclick="addDept()" style="background:#1d4ed8;color:#fff;border:0;padding:6px 12px;border-radius:8px">+ Бөлүм</button>
</div>
<div id="grid" class="grid"></div>
<script>
const db=firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"}).database();

// КҮЧТӨП ТАЗАЛОО - 70 БОЛСО ӨЧҮРӨТ
let saved = JSON.parse(localStorage.getItem('departments')||'null');
if(!saved || saved.length!=8 || saved.some(d=>!d.name || d.name.includes('undefined'))){
 localStorage.clear();
 saved = null;
}
let departments = saved || [
 {id:1,name:"Администрация",color:"#6366f1"},
 {id:2,name:"Бухгалтерия",color:"#f59e0b"},
 {id:3,name:"КДО",color:"#0ea5e9"},
 {id:4,name:"Терапия",color:"#8b5cf6"},
 {id:5,name:"ГСВ №1",color:"#10b981"},
 {id:6,name:"ГСВ №2",color:"#06b6d4"},
 {id:7,name:"ГСВ №3",color:"#ef4444"},
 {id:8,name:"ГСВ №7",color:"#f97316"},
];
localStorage.setItem('departments',JSON.stringify(departments));

let allWorkers={};
db.ref('osh/workers').on('value',s=>{ allWorkers={}; s.forEach(c=>allWorkers[c.key]=c.val()); render(); });

function render(){
 let q=(document.getElementById('search')?.value||'').toLowerCase();
 let g=document.getElementById('grid'); g.innerHTML='';
 departments.filter(d=>d.name.toLowerCase().includes(q)).forEach(d=>{
  let total=Object.values(allWorkers).filter(w=>String(w.deptId)==String(d.id)||w.bolum==d.name).length;
  g.innerHTML+=`<div class="card" style="border-top-color:${d.color}"><b>${d.name}</b><div style="font-size:12px;margin-top:6px">ЖУМУШТА<br><b>${total}</b><br>🟢 СЫРТТА<br>0<br>👥 БАРДЫГЫ<br><b>${total}</b></div><div style="margin-top:6px"><span style="background:#dcfce7;padding:2px 6px;border-radius:6px;font-size:10px">✅ Тартип</span></div></div>`;
 });
 g.innerHTML+=`<div class="card add" onclick="addDept()">➕ Бөлүм кошуу</div>`;
}
function addDept(){let n=prompt("Жаңы бөлүм:"); if(!n)return; departments.push({id:Date.now(),name:n,color:"#64748b"}); localStorage.setItem('departments',JSON.stringify(departments)); render();}
render();
</script>
</body>
</html>
