<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кадамжай ЖДПБ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f1f5f9}
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.filters{background:#fff;margin:8px;padding:10px;border-radius:12px;display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin:8px}
.card{background:#fff;border-radius:12px;padding:12px;border-top:4px solid #6366f1;cursor:pointer}
.add{border:2px dashed #94a3b8;display:grid;place-items:center;color:#1d4ed8;min-height:140px}
</style>
</head>
<body>
<div class="header"><b>📍 Кадамжай ЖДПБ - <span id="cntTop">0</span> бөлүм</b><button onclick="restore()">♻️ Калыбына келтирүү</button></div>
<div class="filters">
<input id="searchMain" oninput="render()" placeholder="🔍 Издөө..." style="border:1px solid #ddd;border-radius:20px;padding:7px 12px;flex:1">
<button onclick="addDept()" style="background:#1d4ed8;color:#fff;border:0;padding:8px 14px;border-radius:8px;cursor:pointer">+ Бөлүм кошуу</button>
</div>
<div id="grid" class="grid"></div>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let departments=[];
let allWorkers={};

db.ref('osh/departments').on('value',snap=>{
 let val=snap.val();
 if(!val){ departments=[]; render(); return; }
 // Firebase объект же массив кайтарса дагы массивге айландырабыз
 departments = Array.isArray(val) ? val : Object.values(val);
 render();
});

db.ref('osh/workers').on('value',snap=>{allWorkers={};snap.forEach(c=>allWorkers[c.key]=c.val());render();});

function getStats(id){let name=departments.find(d=>d.id==id)?.name;let arr=Object.values(allWorkers).filter(w=>String(w.deptId)==String(id)||w.bolum==name);return{total:arr.length,work:arr.filter(w=>w.inside!==false).length,out:arr.filter(w=>w.inside===false).length};}

function render(){
 let q=(document.getElementById('searchMain').value||'').toLowerCase();
 let g=document.getElementById('grid');g.innerHTML='';
 if(!departments || !departments.filter){ departments=[]; }
 departments.filter(d=>d.name&&d.name.toLowerCase().includes(q)).forEach(d=>{
  let s=getStats(d.id);
  g.innerHTML+=`<div class="card" style="border-top-color:${d.color}" onclick="location.href='dept.html?id=${d.id}'"><div style="display:flex;justify-content:space-between"><b>${d.name}</b><span onclick="event.stopPropagation();delDept(${d.id})">❌</span></div><div style="font-size:12px;margin-top:8px">ЖУМУШТА ${s.total} | 🟢 ${s.work} 🔴 ${s.out}</div></div>`;
 });
 g.innerHTML+=`<div class="card add" onclick="addDept()">➕ Бөлүм кошуу</div>`;
 document.getElementById('cntTop').innerText=departments.length;
 if(departments.length==0){ g.innerHTML+='<div style="grid-column:1/-1;text-align:center;padding:20px">Бөлүм жок. "Калыбына келтирүү" бас</div>'; }
}

function addDept(){
 let n=prompt("Жаңы бөлүм аты:");
 if(!n)return;
 departments.push({id:Date.now(),name:n.trim(),color:"#64748b"});
 db.ref('osh/departments').set(departments);
}

function delDept(id){if(!confirm("Өчүрүлсүнбү?"))return;departments=departments.filter(d=>d.id!=id);db.ref('osh/departments').set(departments);}

function restore(){
 if(!confirm("8 бөлүм + ГСВ №9 калыбына келтирилсинби?"))return;
 let base=[
  {id:1,name:"Администрация",color:"#6366f1"},
  {id:2,name:"Бухгалтерия",color:"#f59e0b"},
  {id:3,name:"КДО",color:"#0ea5e9"},
  {id:4,name:"Терапия",color:"#8b5cf6"},
  {id:5,name:"ГСВ №1",color:"#10b981"},
  {id:6,name:"ГСВ №2",color:"#06b6d4"},
  {id:7,name:"ГСВ №3",color:"#ef4444"},
  {id:8,name:"ГСВ №7",color:"#f97316"},
  {id:9,name:"ГСВ №9",color:"#64748b"}
 ];
 db.ref('osh/departments').set(base).then(()=>alert('Даяр!'));
}
</script>
</body>
</html>
