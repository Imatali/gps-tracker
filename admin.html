<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадамжай ЖДПБ - Админ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#f1f5f9}
.header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px #0001;position:sticky;top:0;z-index:20;flex-wrap:wrap;gap:8px}
.filters{background:#fff;margin:8px;padding:10px 12px;border-radius:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f{border:1px solid #e2e8f0;background:#f8fafc;padding:8px 14px;border-radius:20px;font-weight:600;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:10px}
.card{background:#fff;border-radius:14px;padding:14px;border-top:5px solid #6366f1;cursor:pointer;box-shadow:0 2px 6px #0001;position:relative;min-height:140px}
.add{border:2px dashed #94a3b8;display:grid;place-items:center;color:#1d4ed8;min-height:140px;cursor:pointer;background:#fff}
#deptPage{display:none;margin:8px}.layout{display:grid;grid-template-columns:330px 1fr;gap:12px}
.panel{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px #0001}
#map{height:580px;border-radius:10px;margin-top:10px}
.back{padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;cursor:pointer;margin-bottom:10px}
.del{position:absolute;top:8px;right:8px;cursor:pointer;background:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<b>📍 Кадамжай ЖДПБ - <span id="cntTop">0</span> бөлүм | <span id="cntPeople">0</span> адам катталган</b>
<div style="display:flex;gap:6px">
<button onclick="clearWorkers()" style="padding:7px 12px;border-radius:8px;border:1px solid #fca5a5;background:#fff;color:#ef4444;font-weight:600">🗑️ Баарын тазалоо</button>
<button onclick="restore()" style="padding:7px 12px;border-radius:8px;border:1px solid #ddd;background:#fff">♻️ Калыбына келтирүү</button>
</div>
</div>

<div id="mainPage">
<div class="filters">
<button class="f" style="background:#1d4ed8;color:#fff">🏢 Бөлүм <span id="f_dep">0</span></button>
<button class="f">👥 Адам <span id="f_peo">0</span></button>
<button class="f">🟢 Ичте <span id="f_in">0</span></button>
<button class="f">🔴 Сыртта <span id="f_out">0</span></button>
<div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">
<input id="searchMain" oninput="render()" placeholder="🔍 Издөө..." style="border:1px solid #ddd;border-radius:20px;padding:8px 14px;min-width:180px">
<button onclick="addDept()" style="background:#1d4ed8;color:#fff;border:0;padding:8px 16px;border-radius:20px;font-weight:700">+ Бөлүм</button>
</div>
</div>
<div id="grid" class="grid"></div>
<div class="panel" style="margin:10px">
<b>📋 Базадагы бардык катталгандар (текшерүү үчүн):</b>
<div id="rawList" style="font-size:13px;margin-top:10px;line-height:2"></div>
</div>
</div>

<div id="deptPage">
<button class="back" onclick="showMain()">← Артка</button>
<div class="layout">
<div class="panel">
<h3 id="deptName"></h3>
<div>Жалпы: <b id="d_total">0</b> | 🟢 <b id="d_work">0</b> | 🔴 <b id="d_out">0</b></div>
<input id="empSearch" oninput="loadDept()" placeholder="🔍 Кызматкер издөө..." style="width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-top:12px">
<div id="empList" style="margin-top:12px"></div>
</div>
<div class="panel">
<div style="display:flex;gap:10px">
<div style="flex:1;background:#dbeafe;padding:14px;border-radius:12px;text-align:center">Жалпы<br><b id="stTotal" style="font-size:20px">0</b></div>
<div style="flex:1;background:#dcfce7;padding:14px;border-radius:12px;text-align:center">Ичте<br><b id="stWork" style="font-size:20px">0</b></div>
<div style="flex:1;background:#ffedd5;padding:14px;border-radius:12px;text-align:center">Сыртта<br><b id="stAlert" style="font-size:20px">0</b></div>
</div>
<div id="map"></div>
</div>
</div>
</div>

<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let departments=[], allWorkers={}, selected=null, map=null, markers=[];

db.ref('osh/departments').on('value',s=>{
 let v=s.val(); 
 if(!v){ departments=[]; render(); return; }
 departments=Array.isArray(v)?v.filter(Boolean):Object.values(v);
 render();
});

db.ref('osh/workers').on('value',s=>{
 allWorkers={};
 s.forEach(c=>{ allWorkers[c.key]=c.val(); });
 render();
 if(selected) loadDept();
});

function getStats(id){
 let dep=departments.find(d=>String(d.id)===String(id));
 if(!dep) return {total:0,work:0,out:0,arr:[]};
 // deptId же bolum аты боюнча издөө
 let arr=Object.values(allWorkers).filter(w=> String(w.deptId)===String(id) || (w.bolum && w.bolum===dep.name) );
 return {total:arr.length, work:arr.filter(w=>w.inside!==false).length, out:arr.filter(w=>w.inside===false).length, arr:arr};
}

function render(){
 let q=(document.getElementById('searchMain').value||'').toLowerCase();
 let g=document.getElementById('grid'); g.innerHTML='';
 let totalPeople=Object.keys(allWorkers).length;
 let totalIn=Object.values(allWorkers).filter(w=>w.inside!==false).length;
 document.getElementById('cntTop').innerText=departments.length;
 document.getElementById('cntPeople').innerText=totalPeople;
 document.getElementById('f_dep').innerText=departments.length;
 document.getElementById('f_peo').innerText=totalPeople;
 document.getElementById('f_in').innerText=totalIn;
 document.getElementById('f_out').innerText=totalPeople-totalIn;

 // Текшерүү тизмеси
 let raw=document.getElementById('rawList'); raw.innerHTML='';
 if(totalPeople===0){ raw.innerHTML='<span style="color:#94a3b8">Азырынча эч ким жок. worker.html менен катталыңыз</span>'; }
 else {
   Object.entries(allWorkers).forEach(([key,w])=>{
     raw.innerHTML+=`• <b>${w.name}</b> → ${w.bolum} (deptId:${w.deptId}) <small style="color:#94a3b8">${key.slice(0,8)}</small><br>`;
   });
 }

 departments.filter(d=>d&&d.name&&d.name.toLowerCase().includes(q)).forEach(d=>{
  let s=getStats(d.id);
  g.innerHTML+=`<div class="card" style="border-top-color:${d.color||'#6366f1'}" onclick="openDept('${d.id}')">
  <span class="del" onclick="event.stopPropagation();delDept('${d.id}')">❌</span>
  <b>${d.name}</b>
  <div style="font-size:13px;margin-top:12px;line-height:1.8">
  ЖУМУШТА<br><b style="font-size:22px">${s.total}</b><br>🟢 ИЧТЕ ${s.work}<br>🔴 СЫРТТА ${s.out}
  </div></div>`;
 });
 g.innerHTML+=`<div class="card add" onclick="addDept()">➕ Бөлүм кошуу</div>`;
}

function addDept(){ let n=prompt("Жаңы бөлүм аты:"); if(!n) return; departments.push({id:Date.now(), name:n.trim(), color:"#64748b"}); db.ref('osh/departments').set(departments); }
function delDept(id){ if(!confirm("Бул бөлүмдү өчүрөбүзбү?")) return; departments=departments.filter(d=>String(d.id)!==String(id)); db.ref('osh/departments').set(departments); }
function showMain(){ document.getElementById('mainPage').style.display='block'; document.getElementById('deptPage').style.display='none'; selected=null; }
function openDept(id){ selected=departments.find(d=>String(d.id)===String(id)); document.getElementById('mainPage').style.display='none'; document.getElementById('deptPage').style.display='block'; document.getElementById('deptName').innerText=selected.name; setTimeout(()=>{initMap(); loadDept();},300); }
function initMap(){ if(map){ map.remove(); map=null; } map=L.map('map').setView([40.105,71.73],14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
function loadDept(){
 if(!selected) return;
 let s=getStats(selected.id);
 document.getElementById('d_total').innerText=s.total;
 document.getElementById('d_work').innerText=s.work;
 document.getElementById('d_out').innerText=s.out;
 document.getElementById('stTotal').innerText=s.total;
 document.getElementById('stWork').innerText=s.work;
 document.getElementById('stAlert').innerText=s.out;
 markers.forEach(m=>{ try{map.removeLayer(m)}catch(e){} }); markers=[];
 let list=document.getElementById('empList'); list.innerHTML='';
 let q=(document.getElementById('empSearch').value||'').toLowerCase();
 let filtered=s.arr.filter(w=>w.name.toLowerCase().includes(q));
 if(filtered.length===0) list.innerHTML='<div style="color:#94a3b8;padding:10px">Бул бөлүмдө эч ким жок</div>';
 filtered.forEach(w=>{
   list.innerHTML+=`<div style="padding:10px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between"><div><b>${w.name}</b><br><small>${w.bolum}</small></div><div>${w.inside!==false?'🟢':'🔴'}</div></div>`;
   if(map&&w.lat) markers.push(L.marker([w.lat,w.lng]).addTo(map).bindPopup(w.name+' - '+w.bolum));
 });
}
function clearWorkers(){ if(!confirm("Баардык катталган адамдарды өчүрөбүзбү?")) return; db.ref('osh/workers').remove().then(()=>alert('✅ Тазаланды')); }
function restore(){
 let base=[{id:1,name:"Администрация",color:"#6366f1"},{id:2,name:"Бухгалтерия",color:"#f59e0b"},{id:3,name:"КДО",color:"#0ea5e9"},{id:4,name:"Терапия",color:"#8b5cf6"},{id:5,name:"ГСВ №1",color:"#10b981"},{id:6,name:"ГСВ №2",color:"#06b6d4"},{id:7,name:"ГСВ №3",color:"#ef4444"},{id:8,name:"ГСВ №7",color:"#f97316"},{id:9,name:"ГСВ №9",color:"#64748b"},{id:10,name:"ГСВ №10",color:"#14b8a6"}];
 db.ref('osh/departments').set(base);
}
</script>
</body>
</html>
