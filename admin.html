<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадамжай - Башкы бет</title><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:12px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}.chip{padding:7px 11px;border-radius:99px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:11px;font-weight:700}.chip.active{background:#0f172a;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}.card{background:#fff;border-radius:16px;padding:12px;border:1px solid #eef2f7;cursor:pointer;position:relative;overflow:hidden}.top{height:5px;position:absolute;top:0;left:0;right:0}.mini{flex:1;background:#f8fafc;border-radius:8px;padding:5px;text-align:center}.badge{font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;display:inline-block;margin-top:5px}.btn{border:0;padding:8px 12px;border-radius:9px;font-weight:700;cursor:pointer}.btn-dark{background:#0f172a;color:#fff}.inp{border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px}</style></head><body><header><div style="display:flex;justify-content:space-between"><div><b>🏥 Кадамжай ЖДПБ</b> <span id="cnt" style="background:#0f172a;color:#fff;padding:3px 9px;border-radius:99px;font-size:11px"></span></div><button class="btn btn-dark" onclick="addDept()">+ Бөлүм</button></div></header><div class="grid" id="grid"></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
const cfg={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};firebase.initializeApp(cfg);const db=firebase.database();
let DEPTS=[];let assign={};let workers={};
function save(){let obj={};DEPTS.forEach(d=>obj[d.id]={name:d.name,color:d.color});db.ref('osh/depts').set(obj);localStorage.setItem('kadamjai_depts_final',JSON.stringify(DEPTS));}
window.addDept=function(){let n=prompt('Бөлүм аты?');if(!n)return;let id=n.toLowerCase().replace(/[^a-z0-9а-яёүң]+/g,'_').slice(0,20)+'_'+Date.now().toString().slice(-4);DEPTS.push({id:id,name:n,color:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')});save();};
db.ref('osh/depts').on('value',s=>{let v=s.val();if(v){DEPTS=Object.keys(v).map(k=>({id:k,name:v[k].name||v[k],color:v[k].color||'#8b5cf6'}));localStorage.setItem('kadamjai_depts_final',JSON.stringify(DEPTS));render();}else if(DEPTS.length==0){DEPTS=[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'admin',name:'Администрация',color:'#8b5cf6'},{id:'terapia',name:'Терапия',color:'#16a34a'}];save();}});
db.ref('osh/assign_v3').on('value',s=>{assign=s.val()||{};let changed=false;Object.values(assign).forEach(a=>{if(a.deptId &&!DEPTS.find(d=>d.id===a.deptId)){DEPTS.push({id:a.deptId,name:a.deptName||a.deptId,color:'#'+Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')});changed=true;}});if(changed)save();render();});
db.ref('osh/workers').on('value',s=>{workers=s.val()||{};render();});
function render(){
 let html='';
 DEPTS.forEach(d=>{
   let assigned=Object.keys(assign).filter(k=>assign[k].deptId===d.id);
   let inCount=0;
   assigned.forEach(wId=>{if(workers[wId]) inCount++;});
   html+=`<div class="card" onclick="location.href='dept.html?dept=${d.id}'"><div class="top" style="background:${d.color}"></div><b>${d.name}</b><br><small style="color:#64748b">${d.id}</small><div style="display:flex;gap:6px;margin-top:8px"><div class="mini" style="background:#dcfce7">🟢 ${inCount}</div><div class="mini" style="background:#f1f5f9">👥 ${assigned.length}</div></div></div>`;
 });
 document.getElementById('grid').innerHTML=html||'Бөлүм жок';
 document.getElementById('cnt').innerText=DEPTS.length;
}
</script></body></html>
