<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<title>Кадамжай ЖДПБ Админ</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.card{background:white;border-radius:12px;padding:16px;margin:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:inline-block;width:260px;vertical-align:top}
h1{font-size:20px}
</style>
</head>
<body>
<h1>Кадамжай ЖДПБ <span id="count"></span></h1>
<div id="list"></div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "gps-tracker-osh.firebaseapp.com",
  databaseURL: "https://gps-tracker-osh-default-rtdb.firebaseio.com",
  projectId: "gps-tracker-osh"
};
firebase.initializeApp(firebaseConfig);

const ALLOWED = {
  admin:{name:"Администрация",color:"#6366f1"},
  buh:{name:"Бухгалтерия",color:"#f59e0b"},
  gsv1:{name:"ГСВ №1",color:"#16a34a"},
  gsv2:{name:"ГСВ №2",color:"#f59e0b"},
  gsv3:{name:"ГСВ №3",color:"#ef4444"},
  kdo:{name:"КДО",color:"#0064e0"},
  terapia:{name:"Терапия",color:"#10b981"}
};

// ТАЗАЛОО: эски бузук бөлүмдөрдү автоматтык өчүрүү
function cleanDepts(path){
  firebase.database().ref(path).once('value').then(s=>{
    const data=s.val()||{};
    Object.keys(data).forEach(k=>{
      const cleanK = k.replace(/[\u200B-\u200D\uFEFF]/g,'').trim();
      if(cleanK!== k ||!ALLOWED[k]){
        if(k!==cleanK && ALLOWED[cleanK]){ /* дубликат */ }
        if(!ALLOWED[k]){
          console.log('Бузук бөлүм өчүрүлдү:',k);
          firebase.database().ref(path+'/'+k).remove();
        }
      }
    });
  });
}
cleanDepts('depts');
cleanDepts('osh/depts');

function render(){
  firebase.database().ref('osh/depts').on('value', snap=>{
    let depts = snap.val() || ALLOWED;
    // Тек гана уруксат берилгендерди көрсөт
    let html='';
    Object.keys(ALLOWED).forEach(id=>{
      const d = depts[id] || ALLOWED[id];
      html+=`<div class="card" style="border-top:4px solid ${d.color}">
        <b>${d.name}</b><br> <small>${id}</small>
        <div id="c-${id}">жүктөлүүдө...</div>
      </div>`;
    });
    document.getElementById('list').innerHTML=html;
    document.getElementById('count').innerText = Object.keys(ALLOWED).length+' / '+Object.keys(ALLOWED).length;
    countWorkers();
  });
}
function countWorkers(){
  firebase.database().ref('osh/workers').on('value', s=>{
    const workers=s.val()||{};
    const counts={};
    Object.keys(ALLOWED).forEach(k=>counts[k]=0);
    Object.values(workers).forEach(w=>{
      let dept = (w.deptId||'').replace(/[\u200B-\u200D\uFEFF]/g,'').trim();
      if(counts[dept]!==undefined) counts[dept]++;
    });
    Object.keys(counts).forEach(k=>{
      const el=document.getElementById('c-'+k);
      if(el) el.innerText = `Жумушта: ${counts[k]} | Бардыгы: ${counts[k]}`;
    });
  });
}
render();
localStorage.removeItem('depts_cache');
</script>
</body>
</html>
