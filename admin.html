<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ - Ош Трекер</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>body{margin:0;font-family:sans-serif;background:#f8fafc}#map{height:50vh}.panel{padding:10px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001;margin-bottom:10px}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.b1{background:#16a34a;color:#fff}.b2{background:#e5e7eb}.in{color:#16a34a;font-weight:bold}.out{color:#dc2626;font-weight:bold}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #eee;font-size:13px;text-align:left}</style></head><body><div id="map"></div><div class="panel"><div class="card"><button class="btn b1" onclick="startDraw()">✏️ Чийүүнү баштоо</button> <button class="btn b2" onclick="finish()">✅ Бүтүр жана шилтеме түз</button><div id="linkBox" style="margin-top:10px;word-break:break-all"></div></div><div class="card"><h3>👷 Жумушчулар (түз эфир)</h3><table id="tbl"><tr><th>Аты</th><th>Статус / Карта</th><th>Убакыт</th></tr></table></div></div><script>
const firebaseConfig = { apiKey: "AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME", authDomain: "gps-tracker-osh.firebaseapp.com", databaseURL: "https://gps-tracker-osh-default-rtdb.firebaseio.com", projectId: "gps-tracker-osh", storageBucket: "gps-tracker-osh.firebasestorage.app", messagingSenderId: "588347508048", appId: "1:588347508048:web:1b6fd5417ff8f4e5f29855" };
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let map=L.map('map').setView([40.53,72.8],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let pts=[], poly=null, drawing=false, zones=[];
map.on('click', e=>{ if(!drawing) return; pts.push([e.latlng.lat,e.latlng.lng]); if(poly) map.removeLayer(poly); poly=L.polygon(pts,{color:'#16a34a'}).addTo(map); });
function startDraw(){ pts=[]; if(poly) map.removeLayer(poly); drawing=true; alert('Картаны басып аймакты чий!'); }
function finish(){ drawing=false; if(pts.length<3){alert('Кеминде 3 чекит!');return;} zones=[pts]; let data=btoa(unescape(encodeURIComponent(JSON.stringify(zones)))); let base=location.href.replace('admin.html','worker.html'); let link=base+'#zones='+data; document.getElementById('linkBox').innerHTML=`<b>Жумушчу шилтемеси:</b><br><a href="${link}" target="_blank">${link}</a><br><button class="btn b1" style="margin-top:8px" onclick="navigator.clipboard.writeText('${link}')">📋 Көчүрүү</button>`; localStorage.setItem('myzones', JSON.stringify(zones)); listen(); }
function checkInside(lat,lng,polys){ for(let poly of polys){ let ok=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; let inter=((yi>lng)!=(yj>lng)) && (lat < (xj-xi)*(lng-yi)/(yj-yi)+xi); if(inter) ok=!ok; } if(ok) return true; } return false; }
function listen(){ let saved=localStorage.getItem('myzones'); let z = zones.length?zones:(saved?JSON.parse(saved):[]); if(z.length==0) return; db.ref('osh/workers').on('value', snap=>{ let tb=document.getElementById('tbl'); tb.innerHTML='<tr><th>Аты</th><th>Статус</th><th>Убакыт</th></tr>'; snap.forEach(ch=>{ let v=ch.val(); let inn=checkInside(v.lat,v.lng,[z[0]]); let cls=inn?'in':'out'; let txt=inn?'🟢 ИЧТЕ':'🔴 СЫРТТА'; tb.innerHTML+=`<tr><td><b>${v.name}</b><br>${v.lat.toFixed(4)},${v.lng.toFixed(4)}</td><td class="${cls}">${txt}<br><small>${v.acc}м тактык</small></td><td>${new Date(v.ts).toLocaleTimeString()}</td></tr>`; }); }); }
listen();
</script></body></html>
