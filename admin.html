<!DOCTYPE html>
<html lang="ky"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Админ v5.1 EXPORT</title><link rel="icon" href="icon.png"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#f8fafc;padding:10px}.header{background:#fff;border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:8px;flex-wrap:wrap;gap:8px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}@media(max-width:600px){.grid{grid-template-columns:1fr 1fr}}.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-top:4px solid #3b82f6;position:relative}.card h4{font-weight:900;margin-bottom:8px}.badge{position:absolute;right:8px;top:8px;color:#94a3b8;cursor:pointer;font-weight:bold}.pins{background:#fff;border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}.input{padding:9px;border:1px solid #e2e8f0;border-radius:10px;width:100%;font-size:12px}.btn{padding:10px 16px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:12px}.btn-blue{background:#2563eb;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-orange{background:#ea580c;color:#fff}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th{padding:8px;text-align:left;color:#64748b;font-size:10px;border-bottom:1px solid #e2e8f0}td{padding:7px;border-bottom:1px solid #f1f5f9}.vfix{background:#d1fae5;color:#065f46;padding:4px 10px;border-radius:10px;font-size:11px;font-weight:bold}.worker-link{background:#f0fdf4;border:2px solid #16a34a;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}</style></head><body>
<div class="header"><div style="display:flex;gap:10px;align-items:center"><img src="icon.png" style="width:36px;height:36px;border-radius:8px"><div><b>Кадамжай ЖДПБ</b> <span class="vfix">v5.1 EXPORT</span><br><small>Бөлүм: <span id="deptCnt">0</span> | Жумушчу: <span id="workCnt">0</span></small></div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-green" onclick="location.href='worker.html?v=5'">👷 Жумушчу</button><button class="btn btn-orange" onclick="exportJson()">📤 workers.json экспорт</button></div></div>
<div class="grid" id="grid"></div>
<div class="worker-link"><div><b>Бир шилтеме:</b> <code>worker.html?v=5</code></div><button class="btn" style="background:#fff;border:1px solid #bbf7d0" onclick="navigator.clipboard.writeText(location.origin+location.pathname.replace('admin.html','worker.html')+'?v=5')">📋 Көчүрүү</button></div>
<div class="pins"><b>👥 ПИН берүү v5.1</b><div style="display:grid;grid-template-columns:1.2fr 140px 90px 1fr;gap:6px;margin:10px 0"><input id="w_name" placeholder="Аты-жөнү" class="input"><select id="w_dept" class="input"></select><input id="w_pin" placeholder="ПИН 6666" class="input"><button class="btn btn-blue" onclick="saveWorker()">+ Берүү</button></div><table><thead><tr><th>Аты</th><th>Бөлүм</th><th>ПИН</th><th>Бекитүү</th><th>Аракет</th></tr></thead><tbody id="pinTbody"></tbody></table></div>
<script>
let DEPTS=["Администрация","Бухгалтерия","КДО","ГСВ №1","ГСВ №2","ГСВ №3","ГСВ №7","ГСВ №9","ГСВ №10","ГСВ №11","ГСВ №12","ГСВ №13","ГСВ №14","ГСВ №15","ГСВ №16","ГСВ №17"];
function getDepts(){try{let d=JSON.parse(localStorage.getItem('gps_depts')||'null');return d&&d.length?d:DEPTS}catch(e){return DEPTS}}
function getWorkers(){try{return JSON.parse(localStorage.getItem('gps_workers')||'[]')}catch(e){return[]}}
function saveDepts(d){localStorage.setItem('gps_depts',JSON.stringify(d))}
function renderDept(){document.getElementById('w_dept').innerHTML=getDepts().map(d=>`<option>${d}</option>`).join('')}
function renderCards(){let workers=getWorkers();let html='';getDepts().forEach(d=>{let cnt=workers.filter(w=>w.dept===d).length;html+=`<div class="card"><span class="badge" onclick="deleteDept('${d}')">✕</span><h4>${d}</h4><b style="color:#2563eb;font-size:20px">${cnt}</b> жумушчу</div>`});document.getElementById('grid').innerHTML=html;document.getElementById('deptCnt').innerText=getDepts().length;document.getElementById('workCnt').innerText=workers.length}
function deleteDept(n){if(!confirm(n+' өчүрүү?'))return;saveDepts(getDepts().filter(d=>d!==n));renderCards();renderDept();renderTable()}
function saveWorker(){let name=document.getElementById('w_name').value.trim(),dept=document.getElementById('w_dept').value,pin=document.getElementById('w_pin').value.trim();if(!name||!pin){alert('Аты жана ПИН керек');return;}let ws=getWorkers();ws=ws.filter(w=>w.pin!==pin);ws.push({name,dept,pin,deviceId:null,phone:'',lastLat:0,lastLng:0});localStorage.setItem('gps_workers',JSON.stringify(ws));document.getElementById('w_name').value='';document.getElementById('w_pin').value='';renderCards();renderTable();alert('✅ Кошулду! Эми 📤 экспорт басыңыз')}
function renderTable(){let ws=getWorkers();document.getElementById('pinTbody').innerHTML=ws.map(w=>`<tr><td><b>${w.name}</b></td><td>${w.dept}</td><td><b>${w.pin}</b></td><td>${w.deviceId?`<span style="background:#dcfce7;padding:3px 7px;border-radius:8px;font-size:10px">📱</span>`:`<span style="background:#fef3c7;padding:3px 7px;border-radius:8px;font-size:10px">⏳</span>`}</td><td><span style="color:#2563eb;cursor:pointer" onclick="resetWorker('${w.pin}')">🔄</span> | <span style="color:#ef4444;cursor:pointer" onclick="deleteWorker('${w.pin}')">✕</span></td></tr>`).join('')}
function deleteWorker(pin){localStorage.setItem('gps_workers',JSON.stringify(getWorkers().filter(w=>w.pin!==pin)));renderCards();renderTable()}
function resetWorker(pin){let np=prompt('Жаңы ПИН:',pin);if(!np)return;let ws=getWorkers();let i=ws.findIndex(w=>w.pin===pin);ws[i].pin=np.trim();ws[i].deviceId=null;localStorage.setItem('gps_workers',JSON.stringify(ws));renderTable()}
function exportJson(){let ws=getWorkers();let blob=new Blob([JSON.stringify(ws,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='workers.json';a.click();alert('✅ workers.json жүктөлдү! GitHubга жүктөңүз')}
renderDept();renderCards();renderTable();
</script></body></html>
