<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ - ПИН</title>
<style>
body{font-family:system-ui;background:#f1f5f9;margin:0;padding:12px}
.card{background:#fff;padding:16px;border-radius:12px;margin-bottom:12px;max-width:1000px;margin:auto;box-shadow:0 2px 10px #0001}
input,select,button{padding:10px;border-radius:8px;border:1px solid #ddd;font-size:14px}
button{border:0;cursor:pointer;font-weight:700}
.btn-blue{background:#2563eb;color:#fff} .btn-red{background:#ef4444;color:#fff} .btn-orange{background:#f59e0b;color:#fff;padding:6px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;margin-top:10px} th,td{border:1px solid #e5e7eb;padding:8px;font-size:13px}
th{background:#f8fafc} a.topbtn{padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
<h3 style="margin:0">👥 Админ</h3>
<div>
<a class="topbtn" style="background:#e0f2fe;color:#0284c7" href="index.html">🏠 Башкы бет</a>
<a class="topbtn" style="background:#dcfce7;color:#16a34a" href="worker.html?v=1007" target="_blank">👷 Жумушчу баракча</a>
</div>
</div>

<div class="card">
<div style="display:flex;gap:8px;flex-wrap:wrap">
<input id="nameInput" placeholder="Аты-жөнү" style="flex:1;min-width:150px">
<select id="deptInput"><option>Администрация</option><option>Бухгалтерия</option><option>Техотдел</option><option>Охрана</option><option>Клиника</option></select>
<button class="btn-blue" onclick="addWorker()">+ ПИН берүү</button>
<button class="btn-red" onclick="clearAll()">🗑 Тазалоо</button>
</div>
<table id="pinsTable"></table>
</div>

<div class="card"><h3 id="workersTitle">Азыр жумушта: 0</h3><table id="workersTable"></table></div>
<div class="card" style="font-size:10px;color:#888">v1007 | байланыштырылган</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
window.addWorker=function(){let n=document.getElementById('nameInput').value.trim();let b=document.getElementById('deptInput').value;if(!n){alert('Аты жаз');return;}let pin=Math.floor(1000+Math.random()*9000).toString();db.ref('osh/pins/'+pin).set({name:n,bolum:b,deptId:1,deviceId:null,created:Date.now()}).then(()=>{alert('ПИН: '+pin);document.getElementById('nameInput').value='';});}
window.clearAll=function(){if(!confirm('Баарын өчүрөбү?'))return;db.ref('osh/pins').remove();db.ref('osh/workers').remove();}
db.ref('osh/pins').on('value',snap=>{let h='<tr><th>Аты</th><th>ПИН</th><th>Байланыш</th><th>Өчүрүү</th></tr>';snap.forEach(c=>{let p=c.key;let v=c.val();let s=v.deviceId?`✅ ${v.deviceId}<br><button class="btn-orange" onclick="resetPin('${p}')">🔄 Сброс</button>`:`❌ Байлана элек<br><button class="btn-orange" onclick="resetPin('${p}')">🔄 Сброс</button>`;h+=`<tr><td>${v.name}<br><small>${v.bolum}</small></td><td><b>${p}</b></td><td>${s}</td><td><button class="btn-red" onclick="delPin('${p}')">❌</button></td></tr>`;});document.getElementById('pinsTable').innerHTML=h;});
db.ref('osh/workers').on('value',snap=>{let h='<tr><th>Аты</th><th>Убакыт</th><th></th></tr>';let cnt=0;snap.forEach(c=>{cnt++;let v=c.val();let t=v.time?new Date(v.time).toLocaleString():'';h+=`<tr><td>${v.name}</td><td>${t}</td><td><button class="btn-red" onclick="delWorker('${c.key}')">Чыгаруу</button></td></tr>`;});document.getElementById('workersTable').innerHTML=h;document.getElementById('workersTitle').innerText='Азыр жумушта: '+cnt;});
window.delPin=function(p){if(confirm(p+' өчүрөбү?'))db.ref('osh/pins/'+p).remove();}
window.delWorker=function(k){db.ref('osh/workers/'+k).remove();}
window.resetPin=function(p){if(!confirm(p+' Сброс?'))return;db.ref('osh/pins/'+p).update({deviceId:null}).then(()=>alert('✅ Сброс болду'));}
</script>
</body>
</html>
