<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кечиккендер фильтр</title><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:12px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:20}.filterBar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;background:#f8fafc;padding:10px;border-radius:12px;border:1px solid #eef2f7}.chip{padding:7px 11px;border-radius:99px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-size:11px;font-weight:700}.chip.active{background:#0f172a;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}@media(min-width:800px){.grid{grid-template-columns:repeat(3,1fr)}}.card{background:#fff;border-radius:16px;padding:12px;border:1px solid #eef2f7;cursor:pointer;position:relative;overflow:hidden}.top{height:5px;position:absolute;top:0;left:0;right:0}.stat{display:flex;gap:4px;margin-top:8px}.mini{flex:1;background:#f8fafc;border-radius:8px;padding:5px;text-align:center}.mini small{font-size:8px;color:#64748b;display:block}.mini b{font-size:13px}.badge{font-size:10px;padding:3px 7px;border-radius:99px;font-weight:700;display:inline-block;margin-top:6px}.btn{border:0;padding:8px 12px;border-radius:9px;font-weight:700;cursor:pointer}.btn-dark{background:#0f172a;color:#fff}.inp{border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px}</style></head><body><header><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b style="font-size:18px">🏥 Кадамжай ЖДПБ</b> <span id="cnt" style="background:#0f172a;color:#fff;padding:3px 9px;border-radius:99px;font-size:11px"></span><br><small id="totalBox" style="color:#64748b"></small></div><div style="display:flex;gap:6px"><input id="search" class="inp" placeholder="🔍 Издөө..." oninput="render()" style="width:150px"><button class="btn btn-dark" onclick="addDept()">+ Бөлүм</button></div></div><div class="filterBar"><b style="width:100%;font-size:11px;color:#64748b">🔎 ФИЛЬТР:</b><button class="chip active" id="f-all" onclick="setFilter('all')">Баары</button><button class="chip" id="f-late" onclick="setFilter('late')">⏰ Кечиккендер</button><button class="chip" id="f-early" onclick="setFilter('early')">🏃 Эрте кеткен</button><button class="chip" id="f-absent" onclick="setFilter('absent')">🚫 Келбегендер</button><button class="chip" id="f-in" onclick="setFilter('in')">🟢 Жумушта бар</button><button class="chip" id="f-out" onclick="setFilter('out')">🔴 Сыртта бар</button></div><div style="display:flex;gap:6px;margin-top:8px"><input id="newName" class="inp" placeholder="Жаңы: ГСВ №4" style="flex:1"><input id="newColor" type="color" value="#8b5cf6"><button class="btn btn-dark" onclick="addDept2()">Кошуу</button></div></header><div class="grid" id="grid"></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>const cfg={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};firebase.initializeApp(cfg);const db=firebase.database();let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'null')||[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let zones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');let assign=JSON.parse(localStorage.getItem('kadamjai_assign_v2')||'{}');let workers={};let filter='all';function toMin(t){let [h,m]=t.split(':').map(Number);return h*60+m;}function getDeptDayStats(deptId){let logs=JSON.parse(localStorage.getItem('kadamjai_history_'+deptId)||'[]');let today=new Date().toLocaleDateString('ky-KG');let todays=logs.filter(l=>l.date==today);let byName={};todays.forEach(l=>{if(!byName[l.name]) byName[l.name]={firstIn:null,lastOut:null,firstInMin:null,lastOutMin:null};if(l.type=='in'&&!byName[l.name].firstIn){byName[l.name].firstIn=l.time;byName[l.name].firstInMin=toMin(l.time.slice(0,5));}if(l.type=='out'){byName[l.name].lastOut=l.time;byName[l.name].lastOutMin=toMin(l.time.slice(0,5));}});let assigned=Object.keys(assign).filter(k=>assign[k].deptId==deptId);let late=0,early=0,absent=0;assigned.forEach(wId=>{let name=workers[wId]?workers[wId].name:wId;let sch=assign[wId];let b=byName[name];if(!b||!b.firstIn){absent++;}else{if(b.firstInMin>toMin(sch.start)+10) late++; if(b.lastOutMin&&b.lastOutMin<toMin(sch.end)-10) early++;}});return {late,early,absent,total:assigned.length,byName};}function save(){localStorage.setItem('kadamjai_depts_final',JSON.stringify(DEPTS));}window.setFilter=function(f){filter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));document.getElementById('f-'+f).classList.add('active');render();};window.addDept=function(){let n=prompt('Аты?','ГСВ №4');if(!n)return;DEPTS.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12)+Date.now().toString().slice(-3),name:n,color:'#'+Math.floor(Math.random()*16777215).toString(16)});save();render();};window.addDept2=function(){let n=document.getElementById('newName').value.trim();if(!n)return;let c=document.getElementById('newColor').value;DEPTS.push({id:n.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12)+Date.now().toString().slice(-3),name:n,color:c});save();document.getElementById('newName').value='';render();};window.delDept=function(e,id){e.stopPropagation();if(!confirm('Өчүрөбү?'))return;DEPTS=DEPTS.filter(d=>d.id!=id);let all=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');all=all.filter(z=>z.deptId!=id);localStorage.setItem('kadamjai_zones_v3',JSON.stringify(all));zones=all;save();render();};function render(){let q=(document.getElementById('search').value||'').toLowerCase();let stats={};DEPTS.forEach(d=>stats[d.id]={total:0,in:0,...getDeptDayStats(d.id)});Object.keys(workers).forEach(wId=>{let v=assign[wId];let did=v?v.deptId:null;if(!did||!stats[did])return;if(workers[wId]._insideDept==did) stats[did].in++;});let list=DEPTS.filter(d=>{if(q&&!d.name.toLowerCase().includes(q))return false;let s=stats[d.id];if(filter=='late'&&s.late==0)return false;if(filter=='early'&&s.early==0)return false;if(filter=='absent'&&s.absent==0)return false;if(filter=='in'&&s.in==0)return false;if(filter=='out'&&(s.total-s.in)==0)return false;return true;});document.getElementById('cnt').innerText=list.length+' / '+DEPTS.length;document.getElementById('grid').innerHTML=list.map(d=>{let s=stats[d.id];let out=s.total-s.in;let zc=zones.filter(z=>z.deptId==d.id).length;let warn='';if(s.late>0) warn+=`<span class="badge" style="background:#fef3c7;color:#d97706">⏰ ${s.late} кечиккен</span> `;if(s.early>0) warn+=`<span class="badge" style="background:#ffedd5;color:#ea580c">🏃 ${s.early} эрте кеткен</span> `;if(s.absent>0) warn+=`<span class="badge" style="background:#fee2e2;color:#dc2626">🚫 ${s.absent} келбеген</span>`;return `<div class="card" onclick="location.href='dept.html?dept=${d.id}'"><div class="top" style="background:${d.color}"></div><div style="display:flex;justify-content:space-between"><b style="font-size:13px">${d.name}</b><span style="display:flex;gap:3px"><small style="background:${d.color}15;color:${d.color};padding:2px 6px;border-radius:99px;font-size:10px">${zc}з</small><span onclick="delDept(event,'${d.id}')" style="color:#ef4444">✕</span></span></div><div class="stat"><div class="mini"><small>🟢</small><b>${s.in}</b></div><div class="mini"><small>🔴</small><b>${out}</b></div><div class="mini"><small>👥</small><b>${s.total}</b></div></div><div>${warn||'<span class="badge" style="background:#dcfce7;color:#16a34a">✅ Тартип</span>'}</div></div>`}).join('')||`<div style="grid-column:1/-1;text-align:center;padding:30px;color:#94a3b8">Бул фильтрде эч ким жок</div>`;let allIn=Object.values(stats).reduce((a,b)=>a+b.in,0);let allTot=Object.values(stats).reduce((a,b)=>a+b.total,0);let allLate=Object.values(stats).reduce((a,b)=>a+b.late,0);let allEarly=Object.values(stats).reduce((a,b)=>a+b.early,0);let allAbs=Object.values(stats).reduce((a,b)=>a+b.absent,0);document.getElementById('totalBox').innerHTML=`🟢 ${allIn} жумушта • 🔴 ${allTot-allIn} сыртта • ⏰ ${allLate} кечиккен • 🏃 ${allEarly} эрте кеткен • 🚫 ${allAbs} келбеген`;}db.ref('osh/workers').on('value',snap=>{workers={};snap.forEach(ch=>{let v=ch.val();let hit=null;for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>v.lng)!=(yj>v.lng))&&(v.lat<(xj-xi)*(v.lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok){hit=z.deptId;break;}}v._inside=!!hit;v._insideDept=hit;workers[ch.key]=v;});render();});render();</script></body></html>
