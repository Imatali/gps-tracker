<!DOCTYPE html>
<html lang="ky"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Админ ФИНАЛ</title><style>body{font-family:Arial;background:#f8fafc;padding:10px} .card{background:#fff;padding:14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);margin-bottom:10px} input,select{padding:10px;border:1px solid #ddd;border-radius:8px;width:100%} button{padding:10px 16px;border:none;border-radius:8px;font-weight:bold;cursor:pointer} .b{color:#fff;background:#2563eb} .r{background:#fee2e2;color:#b91c1c} table{width:100%;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #eee;text-align:left;font-size:13px}</style></head><body>
<div class="card"><b>Кадамжай ЖДПБ - Админ ФИНАЛ</b> <span style="background:#dcfce7;padding:3px 8px;border-radius:8px;font-size:11px">ИШТЕЙТ</span><div style="margin-top:8px"><a href="worker.html" style="background:#16a34a;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none">👷 Жумушчу бети</a></div></div>
<div class="card"><b>Жаңы жумушчу кошуу</b><div style="display:grid;grid-template-columns:1fr 1fr 100px 100px;gap:6px;margin-top:8px">
<input id="n" placeholder="Аты"><select id="d"><option>Администрация</option><option>Бухгалтерия</option><option>КДО</option><option>ГСВ №1</option><option>ГСВ №2</option><option>ГСВ №3</option><option>ГСВ №7</option><option>ГСВ №9</option><option>ГСВ №10</option><option>ГСВ №11</option><option>ГСВ №12</option><option>ГСВ №13</option><option>ГСВ №14</option><option>ГСВ №15</option><option>ГСВ №16</option><option>ГСВ №17</option></select><input id="p" placeholder="ПИН 6666"><button class="b" onclick="add()">+ Кошуу</button></div></div>
<div class="card"><b>Жумушчулар тизмеси</b><table><thead><tr><th>Аты</th><th>Бөлүм</th><th>ПИН</th><th>Өчүрүү</th></tr></thead><tbody id="tb"></tbody></table>
<div style="margin-top:10px"><button onclick="clearAll()" class="r">🗑️ Баарын тазалоо</button> <button onclick="exp()" style="background:#f3f4f6">📥 workers.json жүктөө (кааласаң)</button></div></div>
<script>
function get(){return JSON.parse(localStorage.getItem('gps_workers')||'[]')}
function save(v){localStorage.setItem('gps_workers',JSON.stringify(v))}
function render(){let t=document.getElementById('tb');t.innerHTML=get().map(w=>`<tr><td><b>${w.name}</b></td><td>${w.dept}</td><td><b>${w.pin}</b></td><td><button class="r" onclick="del('${w.pin}')">✕</button></td></tr>`).join('')}
function add(){let name=document.getElementById('n').value.trim(),dept=document.getElementById('d').value,pin=document.getElementById('p').value.trim();if(!name||!pin)return alert('Аты жана ПИН жаз');let ws=get().filter(x=>x.pin!==pin);ws.push({name,dept,pin});save(ws);document.getElementById('n').value='';document.getElementById('p').value='';render();alert('Кошулду: '+name)}
function del(pin){if(!confirm('Өчүрөйүнбү?'))return;save(get().filter(x=>x.pin!==pin));render()}
function clearAll(){if(!confirm('Баарын өчүрүп нөлдөн баштайбызбы?'))return;localStorage.removeItem('gps_workers');render()}
function exp(){let b=new Blob([JSON.stringify(get(),null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='workers.json';a.click()}
render();
</script></body></html>
