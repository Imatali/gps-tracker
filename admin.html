<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадамжай ЖДПБ | Meta AI тарабынан</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
:root{--green:#16a34a;--red:#ef4444;--bg:#f6f7fb;--card:#ffffff;--text:#0f172a;--muted:#64748b;--meta:#0064e0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.logo{display:flex;gap:12px;align-items:center}.logo-badge{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0064e0,#7c3aed);display:grid;place-items:center;color:white;font-weight:800}
.logo h1{margin:0;font-family:Manrope;font-size:18px;line-height:1}.logo p{margin:0;font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 2px 12px #00000008;border:1px solid #eef2f7}
.stat small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.stat b{font-size:26px;display:block;margin-top:4px}
.stat.in b{color:var(--green)}.stat.out b{color:var(--red)}
.layout{display:grid;grid-template-columns:1.6fr.9fr;gap:14px;padding:0 14px 14px}
@media(max-width:900px){.layout{grid-template-columns:1fr}#map{height:55vh!important}}
#map{height:72vh;border-radius:20px;box-shadow:0 8px 30px #00000012;border:1px solid #e2e8f0}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 2px 12px #00000008;border:1px solid #eef2f7;margin-bottom:12px}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--text);color:white}.btn-green{background:var(--green);color:white}.btn-ghost{background:#f1f5f9}
.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;font-size:12px;font-weight:700}
.badge.in{background:#dcfce7;color:#14532d}.badge.out{background:#fee2e2;color:#991b1b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.input{border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px;width:100%;font-weight:600}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:left;padding:10px 6px;border-bottom:1px solid #eef2f7}
td{padding:10px 6px;border-bottom:1px solid #f1f5f9;font-size:13px}tr:hover{background:#f8fafc}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 #16a34a88;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #16a34a88}70%{box-shadow:0 0 0 10px #16a34a00}100%{box-shadow:0 0 0 0 #16a34a00}}
.meta-footer{padding:18px;text-align:center;color:var(--muted);font-size:12px}.meta-footer b{color:var(--meta)}
</style>
</head>
<body>
<header>
<div class="logo"><div class="logo-badge">К</div><div><h1>Кадамжай ЖДПБ</h1><p>Powered by Meta AI • Кадамжай</p></div></div>
<div class="row"><span class="pulse"></span><small style="font-weight:700;color:var(--muted)">ТҮЗ ЭФИР</small><button class="btn btn-ghost" onclick="toggleSound()" id="soundBtn">🔔 Үн: Күйүк</button></div>
</header>
<div class="stats">
<div class="stat in"><small>🟢 Жумушта</small><b id="cIn">0</b></div>
<div class="stat out"><small>🔴 Сыртта</small><b id="cOut">0</b></div>
<div class="stat"><small>👷 Бардыгы</small><b id="cAll">0</b></div>
</div>
<div class="layout">
<div>
<div id="map"></div>
<div class="card" style="margin-top:12px">
<div class="row" style="justify-content:space-between"><b>🗺️ Зоналарды башкаруу</b></div>
<div class="row" style="margin-top:10px">
<button class="btn btn-green" onclick="startDraw()">✏️ Жаңы зона</button>
<button class="btn btn-primary" onclick="finishZone()">✅ Сактоо</button>
<button class="btn btn-ghost" onclick="clearZones()">🗑️ Тазалоо</button>
<button class="btn btn-ghost" onclick="showAll()">👁️ Баарын көрсөт</button>
</div>
<div id="linkBox" style="margin-top:12px"></div>
<div id="zonesList" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"></div>
</div>
</div>
<div>
<div class="card"><div class="row" style="justify-content:space-between"><b>👷 Жумушчулар</b><input id="search" class="input" style="max-width:130px" placeholder="Издөө..." oninput="render()"></div><div id="workersTable" style="margin-top:8px;max-height:42vh;overflow:auto"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>📜 Тарых</b><div class="row"><button class="btn btn-ghost" onclick="exportCSV()">⬇️ Excel</button><button class="btn btn-ghost" onclick="clearLog()">Тазалоо</button></div></div><div id="logBox" style="max-height:22vh;overflow:auto;margin-top:8px;font-size:12px"></div></div>
<div class="card" style="background:linear-gradient(135deg,#0064e0,#7c3aed);color:white;border:0"><b>✨ Meta AI менен жасалды</b><p style="margin:6px 0 0;font-size:12px;opacity:.9">Бул система Кадамжай ЖДПБ үчүн Meta AI тарабынан атайын иштелип чыкты. meta.ai</p></div>
</div>
</div>
<div class="meta-footer">Сделано с ❤️ в Кадамжае • <b>Meta AI x Кадамжай ЖДПБ</b></div>
<audio id="alertSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=wrong-answer-129254.mp3"></audio>
<script>
const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh",storageBucket:"gps-tracker-osh.firebasestorage.app",messagingSenderId:"588347508048",appId:"1:588347508048:web:1b6fd5417ff8f4e5f29855"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let map=L.map('map',{zoomControl:false}).setView([40.13,71.75],12);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
let pts=[],polyTemp=null,drawing=false,zones=JSON.parse(localStorage.getItem('kadamjai_zones')||'[]'),zoneLayers=[],markers={},workersCache={},soundOn=true,logs=JSON.parse(localStorage.getItem('kadamjai_logs')||'[]'),prevInside={};
function renderZones(){zoneLayers.forEach(l=>map.removeLayer(l));zoneLayers=[];zones.forEach((z,i)=>{let ly=L.polygon(z,{color:'#16a34a',weight:2,fillColor:'#16a34a',fillOpacity:.18}).addTo(map);ly.bindPopup(`Зона #${i+1}`);zoneLayers.push(ly);});let html='';zones.forEach((z,i)=>{html+=`<span class="badge in">Зона ${i+1} <span onclick="delZone(${i})" style="cursor:pointer;margin-left:6px">✕</span></span>`});document.getElementById('zonesList').innerHTML=html||'<small style="color:#94a3b8">Зона жок</small>';if(zones.length) localStorage.setItem('kadamjai_zones',JSON.stringify(zones));}
renderZones();if(zones.length) map.fitBounds(L.latLngBounds(zones.flat()).pad(.2));
map.on('click',e=>{if(!drawing)return;pts.push([e.latlng.lat,e.latlng.lng]);if(polyTemp) map.removeLayer(polyTemp);polyTemp=L.polygon(pts,{color:'#0064e0',dashArray:'6 6',fillOpacity:.1}).addTo(map);});
map.on('dblclick',()=>{if(drawing) finishZone();});
function startDraw(){pts=[];if(polyTemp) map.removeLayer(polyTemp);drawing=true;alert('Картаны басып чий, бүтүрүү үчүн эки жолу бас');}
function finishZone(){if(pts.length<3){alert('3 чекит керек');return;}zones.push([...pts]);pts=[];if(polyTemp){map.removeLayer(polyTemp);polyTemp=null;}drawing=false;renderZones();genLink();addLog('Жаңы зона кошулду');}
function clearZones(){if(!confirm('Бардыгын өчүрөбү?'))return;zones=[];renderZones();localStorage.removeItem('kadamjai_zones');document.getElementById('linkBox').innerHTML='';}
function delZone(i){zones.splice(i,1);renderZones();genLink();}
function genLink(){if(!zones.length) return;let data=btoa(unescape(encodeURIComponent(JSON.stringify(zones))));let base=location.href.replace('admin.html','worker.html');let link=base.split('?')[0]+'#zones='+data;document.getElementById('linkBox').innerHTML=`<div style="background:#f1f5f9;padding:12px;border-radius:12px"><b>🔗 Жумушчу шилтемеси:</b><div style="margin:8px 0;word-break:break-all;background:white;padding:8px;border-radius:8px;border:1px dashed #cbd5e1"><a href="${link}" target="_blank">${link}</a></div><div class="row"><button class="btn btn-green" onclick="navigator.clipboard.writeText('${link}');alert('Көчүрүлдү!')">📋 Көчүрүү</button></div></div>`;}
function checkInside(lat,lng){for(let poly of zones){let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>lng)!=(yj>lng))&&(lat<(xj-xi)*(lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok)return true;}return false;}
function addLog(text){logs.unshift({t:new Date().toLocaleString('ky-KG'),text});if(logs.length>200) logs=logs.slice(0,200);localStorage.setItem('kadamjai_logs',JSON.stringify(logs));renderLog();}
function renderLog(){document.getElementById('logBox').innerHTML=logs.map(l=>`<div style="padding:6px 0;border-bottom:1px solid #f1f5f9"><small style="color:#94a3b8">${l.t}</small> — ${l.text}</div>`).join('')||'<small>Тарых жок</small>';}
renderLog();function clearLog(){logs=[];localStorage.removeItem('kadamjai_logs');renderLog();}
function exportCSV(){let csv='Убакыт,Аты,Статус,Координат,Тактык\n'+Object.values(workersCache).map(w=>`${new Date(w.ts).toLocaleString()},${w.name},${w.inside?'Жумушта':'Сыртта'},${w.lat} ${w.lng},${w.acc}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kadamjai_'+Date.now()+'.csv';a.click();}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').innerText=soundOn?'🔔 Үн: Күйүк':'🔕 Үн: Өчүк';}
function showAll(){let b=L.latLngBounds([]);zones.forEach(z=>z.forEach(p=>b.extend(p)));Object.values(workersCache).forEach(w=>b.extend([w.lat,w.lng]));if(b.isValid()) map.fitBounds(b.pad(.2));}
function listen(){db.ref('osh/workers').on('value',snap=>{workersCache={};let cIn=0,cOut=0;snap.forEach(ch=>{let v=ch.val();workersCache[ch.key]=v;let inn=zones.length?checkInside(v.lat,v.lng):true;v.inside=inn;if(inn) cIn++; else cOut++;if(prevInside[ch.key]!==undefined && prevInside[ch.key]!==inn){if(!inn){if(soundOn) document.getElementById('alertSound').play().catch(()=>{});addLog(`🔴 ${v.name} СЫРТКА ЧЫКТЫ!`);} else {addLog(`🟢 ${v.name} ЖУМУШКА КИРДИ`);}}prevInside[ch.key]=inn;if(markers[ch.key]) map.removeLayer(markers[ch.key]);let color=inn?'#16a34a':'#ef4444';let icon=L.divIcon({html:`<div style="background:${color};color:white;padding:6px 12px;border-radius:999px;font-weight:800;font-size:12px;border:2.5px solid white;box-shadow:0 4px 12px #0003;white-space:nowrap">${v.name} ${inn?'🟢':'🔴'}</div>`,className:'',iconAnchor:[30,15]});markers[ch.key]=L.marker([v.lat,v.lng],{icon}).addTo(map).bindPopup(`<b>${v.name}</b><br>${inn?'🟢 Жумушта':'🔴 Сыртта'}`);});document.getElementById('cIn').innerText=cIn;document.getElementById('cOut').innerText=cOut;document.getElementById('cAll').innerText=cIn+cOut;render();});}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let arr=Object.values(workersCache).sort((a,b)=> (a.inside===b.inside?0:a.inside?-1:1));if(q) arr=arr.filter(w=>w.name.toLowerCase().includes(q));let html='<table><tr><th>Аты</th><th>Статус</th><th>Убакыт</th></tr>';arr.forEach(w=>{html+=`<tr style="cursor:pointer" onclick="map.flyTo([${w.lat},${w.lng}],16)"><td><b>${w.name}</b><br><small style="color:#64748b">${w.lat.toFixed(4)},${w.lng.toFixed(4)}</small></td><td><span class="badge ${w.inside?'in':'out'}">${w.inside?'🟢 Жумушта':'🔴 Сыртта'}</span><br><small>${w.acc}м</small></td><td><small>${new Date(w.ts).toLocaleTimeString()}</small></td></tr>`});html+='</table>';if(!arr.length) html='<div style="padding:20px;text-align:center;color:#94a3b8">Жумушчу жок</div>';document.getElementById('workersTable').innerHTML=html;}
listen();genLink();
</script>
</body>
</html>
