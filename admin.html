<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ Панель v1022</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>#map{height:50vh}</style></head><body class="bg-[#f1f5f9] font-sans"><div class="max-w-[1300px] mx-auto p-3">

<div class="bg-white p-4 rounded-xl shadow flex justify-between items-center">
<div><h1 class="font-bold text-[18px]">🏥 Админ Панель</h1><p class="text-[11px] text-gray-500">Бөлүмдү танда → Карта → PIN бер</p></div>
<div class="flex gap-2"><a href="reports.html?v=1020" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-[11px] font-bold">📊 Табель / Excel</a><input id="search" oninput="renderDepts()" placeholder="🔍 Бөлүм издөө..." class="border px-3 py-2 rounded-lg text-[12px] w-[150px]"></div>
</div>

<div id="deptGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 mt-3"></div>

<div id="detail" class="hidden mt-3">
<div class="bg-white rounded-xl shadow overflow-hidden">
<div class="p-3 flex justify-between items-center bg-gray-50"><h2 id="detailTitle" class="font-bold"></h2><div class="flex gap-2"><button onclick="startDraw()" class="bg-black text-white px-3 py-1.5 rounded-lg text-[11px]">✏️ Чийүү</button><button onclick="saveZones()" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-[11px]">✅ Сактоо</button><button onclick="clearZones()" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-[11px]">🗑️</button><button onclick="closeDetail()" class="bg-gray-200 px-3 py-1.5 rounded-lg text-[11px]">✕</button></div></div>
<div id="map"></div>
<div class="p-3 grid grid-cols-1 md:grid-cols-2 gap-3">
<div><h3 class="font-bold text-[13px] mb-2">👷 Бул бөлүмдө иштегендер (🟢 Ичинде / 🔴 Сыртта)</h3><div id="liveList" class="space-y-1 max-h-[300px] overflow-auto"></div></div>
<div class="bg-[#f8fafc] p-3 rounded-xl border"><h3 class="font-bold text-[13px] mb-2">➕ PIN берүү - <span id="pinDept"></span></h3><div class="flex gap-1 mb-2"><input id="pin" placeholder="PIN мисалы: 4520" class="border p-2 rounded-lg text-[12px] w-[80px]"><input id="name" placeholder="Аты" class="border p-2 rounded-lg text-[12px] flex-1"></div><div class="grid grid-cols-4 gap-1 mb-2 text-[10px]"><label>Кирүү<input id="s1" value="08:00" class="border w-full p-1 rounded"></label><label>Обед кетүү<input id="s2" value="12:00" class="border w-full p-1 rounded"></label><label>Обед келүү<input id="s3" value="13:00" class="border w-full p-1 rounded"></label><label>Чыгуу<input id="s4" value="17:00" class="border w-full p-1 rounded"></label></div><button onclick="addPin()" class="bg-black text-white w-full py-2 rounded-lg text-[12px] font-bold">Сактоо</button><div id="pinList" class="mt-3 space-y-1"></div></div>
</div>
</div>
</div>

</div>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
const DEPARTMENTS=["Администрация","ГСВ №1","ГСВ №2","ГСВ №3","УОЗ и УМСП","Лаборатория","КДП","Бухгалтерия"];
let map, pts=[], polys=[], drawing=false, currentZones=[], activeDept=null;
function initMap(){ if(map) return; map=L.map('map').setView([40.53,72.8],14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); map.on('click', e=>{ if(!drawing) return; pts.push([e.latlng.lat,e.latlng.lng]); if(polys.length>currentZones.length) map.removeLayer(polys.pop()); let pg=L.polygon(pts,{color:'#f59e0b',dashArray:'5,5'}).addTo(map); polys.push(pg); }); }
function renderDepts(){ let q=document.getElementById('search').value.toLowerCase(); let grid=document.getElementById('deptGrid'); grid.innerHTML=''; DEPARTMENTS.filter(d=>d.toLowerCase().includes(q)).forEach(d=>{ let div=document.createElement('div'); div.className='bg-white p-4 rounded-xl shadow hover:shadow-md cursor-pointer border-l-4 border-l-blue-500'; div.innerHTML=`<div class="font-bold text-[13px]">${d}</div><div class="text-[11px] text-gray-500 mt-1"><span id="count-${d}">жүктөлүүдө...</span> • <span id="zone-${d}">0 аймак</span></div><div class="mt-2 text-[11px] text-blue-600">Картаны ачуу →</div>`; div.onclick=()=>openDept(d); grid.appendChild(div); loadDeptStats(d); }); }
function loadDeptStats(d){ db.ref('osh/zones/'+d).once('value',s=>{ let c=(s.val()||[]).length; let el=document.getElementById('zone-'+d); if(el) el.innerText=c+' аймак'; }); db.ref('osh/pins').once('value',s=>{ let v=s.val()||{}; let cnt=Object.values(v).filter(x=>x.bolum==d).length; let el=document.getElementById('count-'+d); if(el) el.innerText=cnt+' кызматкер'; });}
function openDept(d){ activeDept=d; document.getElementById('detail').classList.remove('hidden'); document.getElementById('detailTitle').innerText=d+' — карта жана кызматкерлер'; document.getElementById('pinDept').innerText=d; initMap(); setTimeout(()=>{ map.invalidateSize(); loadZones(); loadPins(); listenLive(); },100); window.scrollTo({top:document.getElementById('detail').offsetTop,behavior:'smooth'}); }
function closeDetail(){ document.getElementById('detail').classList.add('hidden'); activeDept=null; }
function loadZones(){ polys.forEach(p=>map.removeLayer(p)); polys=[]; db.ref('osh/zones/'+activeDept).once('value',s=>{ currentZones=s.val()||[]; currentZones.forEach(z=>{ let pg=L.polygon(z,{color:'#16a34a',fillOpacity:0.2,weight:3}).addTo(map); polys.push(pg); }); if(currentZones.length){ map.fitBounds(L.featureGroup(polys).getBounds().pad(0.2)); } renderDepts(); });}
function startDraw(){ drawing=true; pts=[]; alert('Эми картаны басып аймак чий! Бүткөндө Сактоо бас'); }
function saveZones(){ if(pts.length>=3) currentZones.push(pts); if(!currentZones.length) return alert('Аймак чийелексиз'); db.ref('osh/zones/'+activeDept).set(currentZones).then(()=>{ pts=[]; drawing=false; loadZones(); alert('✅ Сакталды! Бул бөлүмдө эми '+currentZones.length+' аймак'); });}
function clearZones(){ if(!confirm('Бардык аймак өчсүнбү?')) return; db.ref('osh/zones/'+activeDept).remove(); currentZones=[]; pts=[]; polys.forEach(p=>map.removeLayer(p)); polys=[]; renderDepts(); }
function addPin(){ let pin=document.getElementById('pin').value.trim(), name=document.getElementById('name').value.trim(); if(!pin||!name) return alert('PIN жана Аты керек'); let s1=document.getElementById('s1').value, s2=document.getElementById('s2').value, s3=document.getElementById('s3').value, s4=document.getElementById('s4').value; db.ref('osh/pins/'+pin).set({name:name,bolum:activeDept,schedule:{start:s1,lunchS:s2,lunchE:s3,end:s4}}).then(()=>{ document.getElementById('pin').value=''; document.getElementById('name').value=''; loadPins(); renderDepts(); });}
function loadPins(){ db.ref('osh/pins').once('value',s=>{ let v=s.val()||{}; let html=''; Object.entries(v).filter(([k,i])=>i.bolum==activeDept).forEach(([k,i])=>{ html+=`<div class="flex justify-between bg-white p-2 rounded-lg text-[11px] border"><span>#${k} ${i.name} <span class="text-gray-400">${i.schedule.start}-${i.schedule.end}</span></span><button onclick="db.ref('osh/pins/${k}').remove().then(()=>{loadPins();renderDepts();})" class="text-red-500">x</button></div>`; }); document.getElementById('pinList').innerHTML=html||'<div class="text-[11px] text-gray-400">Азырынча кызматкер жок</div>'; });}
function inside(lat,lng){ for(let poly of currentZones){ let ok=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; let inter=((yi>lng)!=(yj>lng)) && (lat < (xj-xi)*(lng-yi)/(yj-yi)+xi); if(inter) ok=!ok; } if(ok) return true; } return false; }
function listenLive(){ db.ref('osh/workers').on('value', snap=>{ if(!activeDept) return; let html=''; snap.forEach(ch=>{ let v=ch.val(); if(!v||!v.lat) return; // бул жерде PIN ден бөлүмдү текшеребиз
}); db.ref('osh/pins').once('value', ps=>{ let pins=ps.val()||{}; let h=''; snap.forEach(ch=>{ let v=ch.val(); let info=pins[ch.key]; if(!info||info.bolum!=activeDept) return; let isIn=inside(v.lat,v.lng); let cls=isIn?'bg-green-50 border-green-500 text-green-700':'bg-red-50 border-red-500 text-red-700'; h+=`<div class="border-l-4 ${cls} p-2 rounded-lg text-[11px] flex justify-between"><span>${isIn?'🟢':'🔴'} ${info.name} #${ch.key}<br><span class="text-[10px]">${v.lat.toFixed(4)},${v.lng.toFixed(4)} • ${new Date(v.ts).toLocaleTimeString()}</span></span><b>${isIn?'ИЧТЕ':'СЫРТТА'}</b></div>`; }); document.getElementById('liveList').innerHTML=h||'<div class="text-[11px] text-gray-400">Бул бөлүмдө азыр эч ким онлайн эмес</div>'; }); });}
renderDepts();
</script></body></html>
