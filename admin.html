<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ Сулуу v1021</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><style>#map{height:65vh;z-index:1}.leaflet-top{top:60px}</style></head><body class="bg-[#f8fafc] font-sans">
<div class="max-w-[1400px] mx-auto p-2">
<!-- HEADER -->
<div class="bg-white rounded-xl shadow p-3 flex justify-between items-center flex-wrap gap-2">
<div class="flex gap-2 items-center"><h1 class="font-bold text-[18px]">💎 Админ Сулуу</h1><select id="dept" class="border rounded-lg px-2 py-1 text-[12px] font-bold"><option>Администрация</option><option>ГСВ №1</option><option>ГСВ №2</option><option>ГСВ №3</option><option>УОЗ и УМСП</option></select><span id="zoneCount" class="text-[11px] bg-green-100 px-2 py-1 rounded-full">0 аймак</span></div>
<div class="flex gap-1"><a href="reports.html?v=1020" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[11px]">📊 Табель</a><button onclick="startDraw()" class="bg-black text-white px-3 py-1.5 rounded-lg text-[11px]">✏️ Чийүү</button><button onclick="saveZones()" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-[11px]">✅ Сактоо</button><button onclick="clearZones()" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-[11px]">🗑️</button></div>
</div>

<!-- MAP -->
<div class="bg-white rounded-xl shadow mt-2 overflow-hidden relative"><div id="map"></div>
<div class="absolute top-2 left-2 z-[1000] bg-white/90 backdrop-blur px-3 py-2 rounded-lg text-[11px] shadow"><div>🟢 Жашыл = Ичинде</div><div>🔴 Кызыл = Сыртта</div><div>📍 Аймакты чийип, Сактоо баскычын бас</div></div>
</div>

<!-- WORKERS LIVE + PIN -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-2 mt-2">
<div class="md:col-span-2 bg-white rounded-xl shadow p-3"><div class="flex justify-between"><h3 class="font-bold text-[13px]">👷 Онлайн - <span id="deptTitle"></span></h3><span id="liveCount" class="text-[11px]"></span></div><div id="workers" class="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-2"></div></div>
<div class="bg-white rounded-xl shadow p-3"><h3 class="font-bold text-[13px] mb-2">➕ PIN кошуу</h3><input id="pin" placeholder="PIN" class="border w-full p-2 rounded-lg text-[12px] mb-1"><input id="name" placeholder="Аты" class="border w-full p-2 rounded-lg text-[12px] mb-1"><div class="grid grid-cols-4 gap-1 mb-2"><input id="s1" value="08:00" class="border p-1 rounded text-[11px]"><input id="s2" value="12:00" class="border p-1 rounded text-[11px]"><input id="s3" value="13:00" class="border p-1 rounded text-[11px]"><input id="s4" value="17:00" class="border p-1 rounded text-[11px]"></div><button onclick="addPin()" class="bg-black text-white w-full py-2 rounded-lg text-[12px]">Сактоо</button><div id="pinList" class="mt-3 space-y-1 max-h-[300px] overflow-auto"></div></div>
</div>
</div>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
let map=L.map('map').setView([40.53,72.8],14); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let pts=[], polys=[], drawing=false, currentZones=[];
let deptEl=document.getElementById('dept');
function loadZones(){let d=deptEl.value; db.ref('osh/zones/'+d).once('value',s=>{ currentZones=s.val()||[]; drawAll(); document.getElementById('zoneCount').innerText=currentZones.length+' аймак'; });}
function drawAll(){ polys.forEach(p=>map.removeLayer(p)); polys=[]; currentZones.forEach(z=>{ let pg=L.polygon(z,{color:'#16a34a',fillOpacity:0.2,weight:2}).addTo(map); polys.push(pg); }); if(currentZones.length){ map.fitBounds(L.featureGroup(polys).getBounds().pad(0.2)); }}
map.on('click', e=>{ if(!drawing) return; pts.push([e.latlng.lat,e.latlng.lng]); if(polys.length>currentZones.length) map.removeLayer(polys.pop()); let pg=L.polygon(pts,{color:'#f59e0b',dashArray:'5,5'}).addTo(map); polys.push(pg); });
function startDraw(){ drawing=true; pts=[]; alert('Эми картаны басып аймакты чий! 3 чекиттен кийин Сактоо бас'); }
function saveZones(){ if(pts.length<3 && drawing){ alert('Кеминде 3 чекит чий!'); return; } if(pts.length>=3){ currentZones.push(pts); } db.ref('osh/zones/'+deptEl.value).set(currentZones).then(()=>{ pts=[]; drawing=false; drawAll(); document.getElementById('zoneCount').innerText=currentZones.length+' аймак'; alert('✅ Сакталды! Эми бул бөлүмгө '+(currentZones.length)+' аймак бар'); });}
function clearZones(){ if(!confirm('Бардык аймакты өчүрөсүңбү?')) return; db.ref('osh/zones/'+deptEl.value).remove(); currentZones=[]; pts=[]; polys.forEach(p=>map.removeLayer(p)); polys=[]; document.getElementById('zoneCount').innerText='0 аймак'; }
deptEl.onchange=()=>{ loadZones(); loadPins(); listenWorkers(); };
loadZones();

// PIN логика
function addPin(){let pin=document.getElementById('pin').value.trim(), name=document.getElementById('name').value.trim(), s1=document.getElementById('s1').value, s2=document.getElementById('s2').value, s3=document.getElementById('s3').value, s4=document.getElementById('s4').value; if(!pin||!name) return alert('PIN жана Аты'); db.ref('osh/pins/'+pin).set({name:name,bolum:deptEl.value,schedule:{start:s1,lunchS:s2,lunchE:s3,end:s4}}).then(()=>{document.getElementById('pin').value='';document.getElementById('name').value=''; loadPins();});}
function loadPins(){db.ref('osh/pins').once('value',s=>{ let v=s.val()||{}; let html=''; Object.entries(v).filter(([k,i])=>i.bolum==deptEl.value).forEach(([k,i])=>{ html+=`<div class="flex justify-between bg-gray-50 p-2 rounded-lg text-[11px]"><span>#${k} ${i.name}</span><button onclick="db.ref('osh/pins/${k}').remove().then(()=>loadPins())" class="text-red-500">x</button></div>`; }); document.getElementById('pinList').innerHTML=html; });}
loadPins();

// WORKER live check inside
function inside(lat,lng){ for(let poly of currentZones){ let ok=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; let inter=((yi>lng)!=(yj>lng)) && (lat < (xj-xi)*(lng-yi)/(yj-yi)+xi); if(inter) ok=!ok; } if(ok) return true; } return false; }
function listenWorkers(){ db.ref('osh/workers').on('value', snap=>{ let div=document.getElementById('workers'); div.innerHTML=''; let c=0; snap.forEach(ch=>{ let v=ch.val(); if(!v) return; // filter by dept pins
   db.ref('osh/pins/'+ch.key).once('value',ps=>{ let info=ps.val(); if(!info || info.bolum!=deptEl.value) return; });
 }); // simple live all for speed
let html=''; let total=0,inCount=0; snap.forEach(ch=>{ let v=ch.val(); if(!v.lat) return; total++; let isIn=inside(v.lat,v.lng); if(isIn) inCount++; let color=isIn?'bg-green-50 border-green-500':'bg-red-50 border-red-500'; let dot=isIn?'🟢':'🔴'; html+=`<div class="border-l-4 ${color} p-2 rounded-lg shadow-sm"><div class="font-bold text-[12px]">${dot} ${v.name||ch.key} <span class="text-[10px] text-gray-500">#${ch.key}</span></div><div class="text-[10px] text-gray-600">${v.lat.toFixed(5)}, ${v.lng.toFixed(5)} • ${v.acc||0}м • ${new Date(v.ts).toLocaleTimeString()}</div><div class="text-[11px] font-bold ${isIn?'text-green-600':'text-red-600'}">${isIn?'ИЧИНДЕ':'СЫРТТА'}</div></div>`; }); document.getElementById('workers').innerHTML=html||'<div class="text-[11px] text-gray-400">Азыр эч ким онлайн эмес</div>'; document.getElementById('liveCount').innerText=`${inCount} ичинде / ${total} онлайн`; document.getElementById('deptTitle').innerText=deptEl.value; });
}
listenWorkers();
</script></body></html>
