<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>80 Бөлүм</title><style>body{margin:0;background:#f6f7fb;font-family:Inter,sans-serif}header{background:#fff;padding:12px 16px;border-bottom:1px solid #e2e8f0;position:sticky;top:0;z-index:10}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}@media(min-width:1200px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:#fff;border-radius:16px;padding:12px;border:1px solid #eef2f7;cursor:pointer;position:relative;overflow:hidden}.top{height:5px;position:absolute;top:0;left:0;right:0}.stat{display:flex;gap:4px;margin-top:8px}.mini{flex:1;background:#f8fafc;border-radius:8px;padding:5px 7px}.mini small{font-size:8px;color:#64748b;display:block}.mini b{font-size:14px}.btn{border:0;padding:8px 12px;border-radius:9px;font-weight:700;cursor:pointer}.btn-dark{background:#0f172a;color:#fff}.inp{border:1px solid #e2e8f0;border-radius:9px;padding:9px 12px;font-size:14px}</style></head><body><header><div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><div><b style="font-size:20px">🏥 Кадамжай ЖДПБ</b> <span id="countBadge" style="background:#0f172a;color:#fff;padding:3px 8px;border-radius:99px;font-size:12px"></span><br><small style="color:#64748b"><span id="totalBox"></span></small></div><div style="display:flex;gap:6px"><input id="search" class="inp" placeholder="🔍 Бөлүм издөө..." oninput="render()" style="width:160px"><button class="btn btn-dark" onclick="document.getElementById('addBox').style.display=document.getElementById('addBox').style.display=='none'?'flex':'none'">+ Бөлүм</button></div></div><div id="addBox" style="display:none;gap:6px;margin-top:10px;flex-wrap:wrap;background:#f8fafc;padding:10px;border-radius:12px"><input id="newName" class="inp" placeholder="Мисалы: ГСВ №15" style="flex:1"><input id="newColor" type="color" value="#8b5cf6"><button class="btn btn-dark" onclick="addDept()">Кошуу</button><button class="btn" onclick="addMany()">+10 даана тез кошуу</button><small style="width:100%;color:#64748b">80 бөлүм чектелбейт. 200гө чейин кошсоң да болот. Зоналар: ~1000 зонага чейин.</small></div></header><div class="grid" id="grid"></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>const cfg={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};firebase.initializeApp(cfg);const db=firebase.database();let DEPTS=JSON.parse(localStorage.getItem('kadamjai_depts_final')||'null')||[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];let zones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');let assign=JSON.parse(localStorage.getItem('kadamjai_assign_v2')||'{}');let workers={};function save(){localStorage.setItem('kadamjai_depts_final',JSON.stringify(DEPTS));}window.addDept=function(){let n=document.getElementById('newName').value.trim();if(!n)return alert('Ат жаз');let c=document.getElementById('newColor').value;let id=n.toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,12)+Date.now().toString().slice(-3);DEPTS.push({id,name:n,color:c});save();document.getElementById('newName').value='';render();};window.addMany=function(){let base=prompt('Канчадан баштап? Мисалы: 4','4');let cnt=prompt('Канча кошуу? Мисалы: 10','10');let b=parseInt(base)||4;let c=parseInt(cnt)||10;for(let i=0;i<c;i++){let name=`ГСВ №${b+i}`;let id='gsv'+(b+i)+Date.now().toString().slice(-2)+i;DEPTS.push({id,name,color:`#${Math.floor(Math.random()*16777215).toString(16).padStart(6,'0')}`});}save();render();alert(c+' бөлүм кошулду!');};window.delDept=function(e,id){e.stopPropagation();if(!confirm('Өчүрөбү?'))return;DEPTS=DEPTS.filter(d=>d.id!=id);let all=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');all=all.filter(z=>z.deptId!=id);localStorage.setItem('kadamjai_zones_v3',JSON.stringify(all));zones=all;save();render();};function render(){let q=(document.getElementById('search').value||'').toLowerCase();let list=DEPTS.filter(d=>d.name.toLowerCase().includes(q));let stats={};DEPTS.forEach(d=>stats[d.id]={total:0,in:0});Object.keys(workers).forEach(wId=>{let v=assign[wId];let did=v?v.deptId:null;if(!did||!stats[did])return;stats[did].total++;if(workers[wId]._insideDept==did) stats[did].in++;});document.getElementById('countBadge').innerText=list.length+' / '+DEPTS.length+' бөлүм';document.getElementById('grid').innerHTML=list.map(d=>{let s=stats[d.id]||{total:0,in:0};let out=s.total-s.in;let zc=zones.filter(z=>z.deptId==d.id).length;return `<div class="card" onclick="location.href='dept.html?dept=${d.id}'"><div class="top" style="background:${d.color}"></div><div style="display:flex;justify-content:space-between"><b style="font-size:13px">${d.name}</b><span style="display:flex;gap:4px"><small style="background:${d.color}15;color:${d.color};padding:2px 6px;border-radius:99px;font-size:10px">${zc}з</small><span onclick="delDept(event,'${d.id}')" style="cursor:pointer;color:#ef4444">✕</span></span></div><div class="stat"><div class="mini"><small>🟢</small><b style="color:${d.color}">${s.in}</b></div><div class="mini"><small>🔴</small><b style="color:${out>0?'#ef4444':'#16a34a'}">${out}</b></div><div class="mini"><small>👥</small><b>${s.total}</b></div></div></div>`}).join('');let allIn=Object.values(stats).reduce((a,b)=>a+b.in,0);let allTot=Object.values(stats).reduce((a,b)=>a+b.total,0);document.getElementById('totalBox').innerText=`🟢 ${allIn} жумушта • 🔴 ${allTot-allIn} сыртта • 👥 ${allTot} бекитилген`;};db.ref('osh/workers').on('value',snap=>{workers={};snap.forEach(ch=>{let v=ch.val();let hit=null;for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>v.lng)!=(yj>v.lng))&&(v.lat<(xj-xi)*(v.lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok){hit=z.deptId;break;}}v._inside=!!hit;v._insideDept=hit;workers[ch.key]=v;});render();});render();</script></body></html>
