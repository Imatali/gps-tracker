<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админка</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f8fafc] p-3 font-sans"><div class="max-w-[1200px] mx-auto"><div class="bg-white p-4 rounded-xl shadow mb-3 flex justify-between items-center"><div><h1 class="font-bold text-[18px]">👑 Админка</h1><div class="flex gap-2 mt-2"><a href="index.html?v=1013" class="bg-gray-100 px-3 py-1.5 rounded-lg text-[11px]">🗺️ Карта</a><a href="reports.html?v=1013" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold">📊 Отчеттор</a></div></div><div id="total" class="text-[12px] text-gray-500">Жүктөлүүдө...</div></div><div class="bg-white rounded-xl shadow overflow-hidden"><div class="p-3 font-bold text-[14px] border-b">Жумушчулар</div><div class="overflow-x-auto"><table class="w-full text-[12px]"><thead class="bg-gray-50 text-[11px] text-gray-500"><tr><th class="p-2 text-left">PIN</th><th class="p-2 text-left">Аты</th><th class="p-2 text-left">Бөлүм</th><th class="p-2 text-left">График</th><th class="p-2">Амал</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div>

<!-- График Модалка -->
<div id="schedModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
<div class="bg-white rounded-xl p-4 w-[340px]">
<h3 id="schedTitle" class="font-bold mb-3">⏰ График</h3>
<label class="text-[11px] text-gray-500">Жумуш башталышы</label><input id="sc_start" type="time" value="08:00" class="w-full border p-2 rounded mb-2">
<label class="text-[11px] text-gray-500">Обет башталышы</label><input id="sc_lunchS" type="time" value="12:00" class="w-full border p-2 rounded mb-2">
<label class="text-[11px] text-gray-500">Обет бүтүшү</label><input id="sc_lunchE" type="time" value="13:00" class="w-full border p-2 rounded mb-2">
<label class="text-[11px] text-gray-500">Жумуш бүтүшү</label><input id="sc_end" type="time" value="17:00" class="w-full border p-2 rounded mb-4">
<div class="flex gap-2"><button onclick="saveSchedule()" class="flex-1 bg-green-600 text-white py-2 rounded-lg font-bold text-[13px]">💾 Сактоо</button><button onclick="document.getElementById('schedModal').classList.add('hidden')" class="flex-1 bg-gray-100 py-2 rounded-lg text-[13px]">Жабуу</button></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
let curPin=null;
db.ref('osh/pins').on('value',s=>{
 let v=s.val()||{}; let tbody=document.getElementById('tbody'); tbody.innerHTML='';
 let count=Object.keys(v).length; document.getElementById('total').innerText='Баары: '+count+' жумушчу';
 Object.entries(v).forEach(([pin,info])=>{
  let sch=info.schedule?`${info.schedule.start}-${info.schedule.end}`:'08:00-17:00';
  tbody.innerHTML+=`<tr class="border-b"><td class="p-2 font-bold">#${pin}</td><td class="p-2">${info.name||''}</td><td class="p-2"><span class="bg-gray-100 px-2 py-1 rounded text-[10px]">${info.bolum||''}</span></td><td class="p-2 text-[11px]">${sch}<br><span class="text-[10px] text-gray-400">${info.schedule?info.schedule.lunchS+'-'+info.schedule.lunchE:'12:00-13:00'}</span></td><td class="p-2 flex gap-1"><a href="dept.html?d=${encodeURIComponent(info.bolum||'')}&v=1012" class="bg-gray-100 px-2 py-1 rounded text-[10px]">Карта</a><button onclick="editSchedule('${pin}')" class="bg-blue-600 text-white px-2 py-1 rounded text-[10px] font-bold">⏰ График</button><a href="geofence.html?d=${encodeURIComponent(info.bolum||'')}&v=1012" class="bg-green-50 text-green-700 px-2 py-1 rounded text-[10px]">📐 Аймак</a></td></tr>`;
 })
});
function editSchedule(pin){
 curPin=pin;
 db.ref('osh/pins/'+pin+'/schedule').once('value',s=>{
  let v=s.val()||{start:'08:00',lunchS:'12:00',lunchE:'13:00',end:'17:00'};
  document.getElementById('sc_start').value=v.start;
  document.getElementById('sc_lunchS').value=v.lunchS;
  document.getElementById('sc_lunchE').value=v.lunchE;
  document.getElementById('sc_end').value=v.end;
  document.getElementById('schedTitle').innerText='⏰ #'+pin+' графиги';
  document.getElementById('schedModal').classList.remove('hidden');
 })
}
function saveSchedule(){
 let data={start:document.getElementById('sc_start').value,lunchS:document.getElementById('sc_lunchS').value,lunchE:document.getElementById('sc_lunchE').value,end:document.getElementById('sc_end').value};
 db.ref('osh/pins/'+curPin+'/schedule').set(data).then(()=>{alert('Сакталды!');document.getElementById('schedModal').classList.add('hidden')});
}
</script></body></html>
