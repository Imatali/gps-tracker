<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ - GPS Трекер</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:sans-serif;background:#f1f5f9}
#map{height:60vh}
.panel{padding:12px}
button{padding:14px;width:100%;margin:6px 0;border:none;border-radius:12px;font-weight:bold;font-size:16px}
.blue{background:#2563eb;color:#fff}.green{background:#16a34a;color:#fff}
.red{background:#ef4444;color:#fff}.gray{background:#334155;color:#fff}
.card{background:#fff;padding:12px;border-radius:12px;margin-top:10px;box-shadow:0 2px 8px #0001;word-break:break-all}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<h3 style="margin:0">📍 Админ панел</h3>
<p style="font-size:13px;color:#64748b">Чийүүнү башта -> Картаны бас -> Бүтүр -> Шилтеме чыгат</p>
<button class="blue" onclick="startDraw()">✏️ Чийүүнү баштоо</button>
<button class="green" id="btnF" style="display:none" onclick="finish()">✅ Бүтүр жана шилтеме түз</button>
<button class="red" id="btnC" style="display:none" onclick="cancel()">❌ Жокко чыгаруу</button>
<div id="out"></div>
</div>
<script>
let map=L.map('map').setView([40.93,73.05],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let zones=[],cur=[],line=null,dots=[],drawing=false;
function startDraw(){drawing=true;cur=[];dots.forEach(m=>map.removeLayer(m));dots=[];if(line)map.removeLayer(line);document.getElementById('btnF').style.display='block';document.getElementById('btnC').style.display='block';}
function finish(){if(cur.length<3)return alert('Кеминде 3 чекит бас');zones.push(cur);L.polygon(cur,{color:'blue',fillOpacity:0.2}).addTo(map);cancel();let data=btoa(unescape(encodeURIComponent(JSON.stringify(zones))));let base=location.href.replace('admin.html','worker.html');let finalLink=base.split('#')[0]+'#zones='+data;document.getElementById('out').innerHTML='<div class=card><b>✅ Даяр!</b><br><br><input id="lnk" value="'+finalLink+'" readonly><br><button class=green onclick="navigator.clipboard.writeText(document.getElementById(\'lnk\').value);alert(\'Көчүрүлдү!\')">📋 Көчүрүү</button><br><br><small>Бул шилтемени жумушчуга WhatsApp менен жөнөт. Ал ачса ИЧИНДЕ/ТЫШКАРЫ көрүнөт.</small></div>';}
function cancel(){drawing=false;cur=[];dots.forEach(m=>map.removeLayer(m));dots=[];if(line)map.removeLayer(line);line=null;document.getElementById('btnF').style.display='none';document.getElementById('btnC').style.display='none';}
map.on('click',e=>{if(!drawing)return;cur.push([e.latlng.lat,e.latlng.lng]);let m=L.circleMarker(e.latlng,{radius:6,color:'red',fillColor:'red',fillOpacity:1}).addTo(map);dots.push(m);if(line)map.removeLayer(line);line=L.polyline(cur,{color:'blue',dashArray:'6,6'}).addTo(map);});
</script>
</body>
</html>
