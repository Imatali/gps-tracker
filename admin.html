<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ - ПИН системасы</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{font-family:system-ui;background:#f1f5f9;margin:0;padding:10px} .panel{background:#fff;padding:14px;border-radius:12px;margin-bottom:10px} input,select,button{padding:10px;border-radius:8px;border:1px solid #ddd} button{background:#1d4ed8;color:#fff;border:0;font-weight:700} table{width:100%;border-collapse:collapse} th,td{border:1px solid #eee;padding:8px;font-size:13px;text-align:left}</style>
</head>
<body>
<div class="panel">
<h3>👥 Жумушчу кошуу + ПИН берүү</h3>
<input id="wName" placeholder="Аты-жөнү">
<select id="wDept"></select>
<button onclick="addWorker()">+ ПИН менен кошуу</button>
<button onclick="clearAll()" style="background:#ef4444">🗑️ Баарын тазалоо</button>
</div>

<div class="panel">
<b>ПИНдер тизмеси (жумушчуларга ушул ПИНди бересиз)</b>
<table><thead><tr><th>Аты</th><th>Бөлүм</th><th>ПИН</th><th>Телефон байландыбы?</th><th>Өчүрүү</th></tr></thead><tbody id="pinTable"></tbody></table>
</div>

<div class="panel">
<b>Азыр жумушта ким бар: <span id="liveCnt">0</span></b>
<div id="liveList" style="font-size:13px;margin-top:8px"></div>
</div>

<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
const BASE=[{id:1,name:"Администрация"},{id:2,name:"Бухгалтерия"},{id:3,name:"КДО"},{id:4,name:"Терапия"},{id:5,name:"ГСВ №1"},{id:6,name:"ГСВ №2"},{id:7,name:"ГСВ №3"},{id:8,name:"ГСВ №7"},{id:9,name:"ГСВ №9"},{id:10,name:"ГСВ №10"}];
const sel=document.getElementById('wDept');
BASE.forEach(d=>{ let o=document.createElement('option'); o.value=d.id; o.textContent=d.name; o.dataset.name=d.name; sel.appendChild(o); });

function genPin(){ return Math.floor(1000+Math.random()*9000).toString(); }

function addWorker(){
  let name=document.getElementById('wName').value.trim();
  if(!name){ alert('Аты жазылсын'); return; }
  let deptId=sel.value; let deptName=sel.options[sel.selectedIndex].dataset.name;
  let pin=genPin();
  // ПИН кайталанбасын текшерүү
  db.ref('osh/pins/'+pin).once('value').then(s=>{
    if(s.exists()){ addWorker(); return; }
    db.ref('osh/pins/'+pin).set({name:name, bolum:deptName, deptId:deptId, deviceId:null, created:Date.now()}).then(()=>{
      document.getElementById('wName').value=''; alert('✅ '+name+' кошулду. ПИН: '+pin);
    });
  });
}

db.ref('osh/pins').on('value',s=>{
  let tbody=document.getElementById('pinTable'); tbody.innerHTML='';
  let v=s.val()||{};
  Object.entries(v).forEach(([pin,d])=>{
    tbody.innerHTML+=`<tr><td>${d.name}</td><td>${d.bolum}</td><td><b>${pin}</b></td><td>${d.deviceId? '✅ Байланган<br><small>'+d.deviceId.slice(0,8)+'</small><br><button onclick="resetDevice(\''+pin+'\')">Сброс</button>' : '❌ Байлана элек'}</td><td><button onclick="delPin('${pin}')" style="background:#ef4444">❌</button></td></tr>`;
  });
});

function delPin(pin){ if(!confirm('ПИН '+pin+' өчүрүлсүнбү?')) return; db.ref('osh/pins/'+pin).remove(); }
function resetDevice(pin){ if(!confirm('Телефон кулпусун ачабызбы?')) return; db.ref('osh/pins/'+pin+'/deviceId').remove(); alert('Кулпу ачылды'); }
function clearAll(){ if(!confirm('Баардык ПИНдер жана жумуштагылар өчүрүлсүнбү?')) return; db.ref('osh/pins').remove(); db.ref('osh/workers').remove(); }

db.ref('osh/workers').on('value',s=>{
  let v=s.val()||{}; let arr=Object.values(v);
  document.getElementById('liveCnt').innerText=arr.length;
  document.getElementById('liveList').innerHTML=arr.map(w=>`• ${w.name} (${w.bolum}) ПИН:${w.pin} ${w.inside?'🟢':''}`).join('<br>');
});
</script>
</body>
</html>
