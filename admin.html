<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадамжай ЖДПБ - Админ</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f1f5f9}
.header{background:white;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
.header h1{margin:0 0 10px 0;font-size:18px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters select,.filters input{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:16px}
.card{background:white;border-radius:12px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);border-top:4px solid #6366f1;cursor:pointer}
.badge{padding:2px 8px;border-radius:12px;font-size:11px;color:white}
.workers{padding:0 16px 20px}
.worker{background:white;padding:10px 12px;border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="header">
  <h1>Кадамжай ЖДПБ <span id="deptCount">7 / 7</span></h1>
  <div class="filters">
    <select id="filterDept"><option value="all">Бардык бөлүмдөр</option></select>
    <select id="filterStatus">
      <option value="all">Бардык статустар</option>
      <option value="late">Кечиккендер</option>
      <option value="early">Эрте кеткендер</option>
      <option value="absent">Келбегендер</option>
      <option value="working">Жумушта</option>
      <option value="free">Бош</option>
    </select>
    <input id="searchInput" placeholder="Аты боюнча издөө...">
    <select id="filterDate"><option value="today">Бүгүн</option><option value="yesterday">Кечээ</option><option value="week">Апта</option></select>
    <button onclick="clearFilters()" style="padding:8px 12px;border:0;border-radius:8px;background:#e5e7eb">Тазалоо</button>
  </div>
</div>
<div class="grid" id="deptGrid"></div>
<div class="workers" id="workerList"></div>
<script>
const firebaseConfig={databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};
firebase.initializeApp(firebaseConfig);
const ALLOWED={admin:{name:"Администрация",color:"#6366f1"},buh:{name:"Бухгалтерия",color:"#f59e0b"},gsv1:{name:"ГСВ №1",color:"#10b981"},gsv2:{name:"ГСВ №2",color:"#f59e0b"},gsv3:{name:"ГСВ №3",color:"#ef4444"},kdo:{name:"КДО",color:"#2563eb"},terapia:{name:"Терапия",color:"#10b981"}};
function cleanId(id){return (id||'').toString().replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase();}
function autoClean(p){firebase.database().ref(p).once('value').then(s=>{Object.keys(s.val()||{}).forEach(k=>{if(!ALLOWED[cleanId(k)]) firebase.database().ref(p+'/'+k).remove();});});}
autoClean('depts');autoClean('osh/depts');
let allWorkers={},selectedDept='all',selectedStatus='all';
function init(){
  const sel=document.getElementById('filterDept');Object.keys(ALLOWED).forEach(id=>{let o=document.createElement('option');o.value=id;o.textContent=ALLOWED[id].name;sel.appendChild(o);});
  document.getElementById('filterDept').addEventListener('change',e=>{selectedDept=e.target.value;renderAll();});
  document.getElementById('filterStatus').addEventListener('change',e=>{selectedStatus=e.target.value;renderWorkers();});
  document.getElementById('searchInput').addEventListener('input',renderWorkers);
  firebase.database().ref('osh/workers').on('value',snap=>{allWorkers=snap.val()||{};renderAll();});
  renderAll();
}
function getStatus(w){
  if(!w.arrival) return 'absent';
  if(w.isLate) return 'late';
  if(w.isEarly) return 'early';
  if(w.departure) return 'free';
  return 'working';
}
function renderAll(){renderDepts();renderWorkers();}
function renderDepts(){
  const counts={};Object.keys(ALLOWED).forEach(k=>counts[k]=0);
  Object.values(allWorkers).forEach(w=>{const d=cleanId(w.deptId);if(counts[d]!==undefined) counts[d]++;});
  let html='';Object.keys(ALLOWED).forEach(id=>{
    if(selectedDept!=='all'&&selectedDept!==id) return;
    const info=ALLOWED[id];
    html+=`<div class="card" style="border-top-color:${info.color}" onclick="filterByDept('${id}')"><b>${info.name}</b><br><small>${id}</small><div style="margin-top:6px;font-size:13px">Жумушта: ${counts[id]||0}</div></div>`;
  });
  document.getElementById('deptGrid').innerHTML=html;
}
function renderWorkers(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  let html='';Object.entries(allWorkers).forEach(([wid,w])=>{
    const d=cleanId(w.deptId);if(selectedDept!=='all'&&d!==selectedDept) return;
    const st=getStatus(w);if(selectedStatus!=='all'&&st!==selectedStatus) return;
    if(q&&!(w.name||'').toLowerCase().includes(q)) return;
    const color=ALLOWED[d]?ALLOWED[d].color:'#999';
    const statusText={late:'Кечиккен',early:'Эрте кеткен',absent:'Келбеген',working:'Жумушта',free:'Бош'}[st];
    html+=`<div class="worker"><div><b>${w.name||wid}</b><br><small style="color:${color}">${ALLOWED[d]?ALLOWED[d].name:d} • ${statusText}</small></div><span class="badge" style="background:${color}">${d}</span></div>`;
  });
  document.getElementById('workerList').innerHTML=html||'<div style="padding:20px;color:#999">Тизме бош</div>';
}
function filterByDept(id){document.getElementById('filterDept').value=id;selectedDept=id;renderAll();}
function clearFilters(){document.getElementById('filterDept').value='all';document.getElementById('filterStatus').value='all';document.getElementById('searchInput').value='';selectedDept='all';selectedStatus='all';renderAll();}
init();
</script>
</body>
</html>
