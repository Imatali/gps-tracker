<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадамжай ЖДПБ - Бөлүмдөр | Meta AI</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Manrope:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#0f172a;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,sans-serif}
header{position:sticky;top:0;z-index:1000;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
.logo{display:flex;gap:10px;align-items:center}.lb{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#0f172a,#0064e0);display:grid;place-items:center;color:#fff;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:10px}
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border-radius:14px;padding:10px 12px;border:1px solid #eef2f7}
.stat small{font-size:10px;color:#64748b;text-transform:uppercase}.stat b{font-size:20px;display:block}
.layout{display:grid;grid-template-columns:1.6fr.95fr;gap:10px;padding:0 10px 10px}
@media(max-width:900px){.layout{grid-template-columns:1fr}#map{height:50vh!important}}
#map{height:70vh;border-radius:18px;border:1px solid #e2e8f0}
.card{background:#fff;border-radius:16px;padding:12px;border:1px solid #eef2f7;margin-bottom:10px}
.btn{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;font-size:13px}.btn-dark{background:#0f172a;color:#fff}.btn-ghost{background:#f1f5f9}
.badge{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid #00000010}
.select{border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;font-weight:600;background:#fff}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}th{font-size:10px;color:#64748b;text-transform:uppercase;text-align:left;padding:8px 4px;border-bottom:1px solid #eef2f7}
td{padding:8px 4px;border-bottom:1px solid #f1f5f9;font-size:12px}
.pulse{width:9px;height:9px;border-radius:50%;background:#16a34a;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #16a34a88}70%{box-shadow:0 0 0 10px #16a34a00}100%{box-shadow:0 0 0 0 #16a34a00}}
</style>
</head>
<body>
<header>
<div class="logo"><div class="lb">К</div><div><h1 style="margin:0;font-size:16px;font-family:Manrope">Кадамжай ЖДПБ</h1><p style="margin:0;font-size:10px;color:#64748b">4 БӨЛҮМ • META AI</p></div></div>
<div class="row"><span class="pulse"></span><small style="font-weight:700;color:#64748b">ТҮЗ</small><button class="btn btn-ghost" onclick="toggleSound()" id="soundBtn">🔔</button></div>
</header>
<div class="stats" id="statsBox"></div>
<div class="layout">
<div>
<div id="map"></div>
<div class="card" style="margin-top:10px">
<div class="row" style="justify-content:space-between"><b>🗺️ Бөлүмдөр жана Зоналар</b></div>
<div class="row" id="deptChips" style="margin-top:8px"></div>
<div class="row" style="margin-top:10px">
<select id="deptSelect" class="select"></select>
<input id="zoneName" class="select" placeholder="Зона аты (мисалы: Базар)" style="min-width:140px">
<button class="btn btn-dark" onclick="startDraw()">✏️ Чийүү</button>
<button class="btn btn-ghost" style="background:#16a34a;color:#fff" onclick="finishZone()">✅ Сактоо</button>
<button class="btn btn-ghost" onclick="clearAllZones()">🗑️</button>
</div>
<div id="linkBox" style="margin-top:10px"></div>
<div id="zonesList" style="margin-top:8px" class="row"></div>
</div>
</div>
<div>
<div class="card"><div class="row" style="justify-content:space-between"><b>👷 Жумушчулар</b><input id="search" class="select" style="max-width:120px" placeholder="Издөө" oninput="render()"></div><div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap" id="deptFilter"></div><div id="workersTable" style="margin-top:6px;max-height:38vh;overflow:auto"></div></div>
<div class="card"><div class="row" style="justify-content:space-between"><b>📜 Лог</b><div class="row"><button class="btn btn-ghost" onclick="exportCSV()">⬇️ Excel</button><button class="btn btn-ghost" onclick="clearLog()">Тазалоо</button></div></div><div id="logBox" style="max-height:18vh;overflow:auto;margin-top:6px;font-size:11px"></div></div>
<div class="card" style="background:linear-gradient(135deg,#0f172a,#0064e0);color:#fff;border:0"><b>✨ Meta AI x Кадамжай ЖДПБ</b><p style="margin:6px 0 0;font-size:11px;opacity:.9">4 бөлүм: КДО, ГСВ №1-3. Ар бири өз түсү менен.</p></div>
</div>
</div>
<audio id="alertSound" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=wrong-answer-129254.mp3"></audio>
<script>
const firebaseConfig={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh",storageBucket:"gps-tracker-osh.firebasestorage.app",messagingSenderId:"588347508048",appId:"1:588347508048:web:1b6fd5417ff8f4e5f29855"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let map=L.map('map',{zoomControl:false}).setView([40.13,71.75],12);L.control.zoom({position:'topright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
const DEFAULT_DEPTS=[{id:'kdo',name:'КДО',color:'#0064e0'},{id:'gsv1',name:'ГСВ №1',color:'#16a34a'},{id:'gsv2',name:'ГСВ №2',color:'#f59e0b'},{id:'gsv3',name:'ГСВ №3',color:'#ef4444'}];
let depts=JSON.parse(localStorage.getItem('kadamjai_depts')||'null')||DEFAULT_DEPTS;
let zones=JSON.parse(localStorage.getItem('kadamjai_zones_v3')||'[]');
let pts=[],polyTemp=null,drawing=false,zoneLayers=[],markers={},workersCache={},logs=JSON.parse(localStorage.getItem('kadamjai_logs_v3')||'[]'),prev={},soundOn=true,filterDept='all';
function save(){localStorage.setItem('kadamjai_depts',JSON.stringify(depts));localStorage.setItem('kadamjai_zones_v3',JSON.stringify(zones));}
function renderDepts(){let sel=document.getElementById('deptSelect');sel.innerHTML=depts.map(d=>`<option value="${d.id}">${d.name}</option>`).join('');let chips=document.getElementById('deptChips');chips.innerHTML=depts.map(d=>`<span class="badge" style="background:${d.color}20;color:${d.color}"><span style="width:8px;height:8px;background:${d.color};border-radius:50%;display:inline-block"></span>${d.name}</span>`).join('');let f=document.getElementById('deptFilter');f.innerHTML=`<span class="badge" onclick="setF('all')" style="cursor:pointer;${filterDept=='all'?'background:#0f172a;color:#fff':''}">Баары</span>`+depts.map(d=>`<span class="badge" onclick="setF('${d.id}')" style="cursor:pointer;background:${filterDept==d.id?d.color:'#fff'};color:${filterDept==d.id?'#fff':d.color};border-color:${d.color}40">${d.name}</span>`).join('');}
function setF(id){filterDept=id;renderDepts();render();renderStats();}
renderDepts();
function renderZones(){zoneLayers.forEach(l=>map.removeLayer(l));zoneLayers=[];zones.forEach(z=>{let dept=depts.find(d=>d.id==z.deptId)||depts[0];let ly=L.polygon(z.points,{color:dept.color,weight:2,fillColor:dept.color,fillOpacity:.22}).addTo(map);ly.bindPopup(`<b>${z.name}</b><br>${dept.name}`);zoneLayers.push(ly);});let list=document.getElementById('zonesList');list.innerHTML=zones.map((z,i)=>{let d=depts.find(dd=>dd.id==z.deptId)||depts[0];return `<span class="badge" style="background:${d.color}15;color:${d.color}">${z.name} (${d.name}) <span onclick="delZone(${i})" style="cursor:pointer;margin-left:6px">✕</span></span>`}).join('')||'<small style="color:#94a3b8">Зона жок</small>';save();genLink();renderStats();}
renderZones();
map.on('click',e=>{if(!drawing)return;pts.push([e.latlng.lat,e.latlng.lng]);if(polyTemp) map.removeLayer(polyTemp);polyTemp=L.polygon(pts,{color:'#0064e0',dashArray:'6 6',fillOpacity:.08}).addTo(map);});
map.on('dblclick',()=>{if(drawing) finishZone();});
function startDraw(){pts=[];if(polyTemp) map.removeLayer(polyTemp);drawing=true;alert('Картаны басып чий, эки жолу бас');}
function finishZone(){if(pts.length<3){alert('3 чекит керек');return;}let deptId=document.getElementById('deptSelect').value;let name=document.getElementById('zoneName').value||`Зона ${zones.length+1}`;zones.push({id:Date.now().toString(),deptId,name,points:[...pts]});pts=[];if(polyTemp){map.removeLayer(polyTemp);polyTemp=null;}drawing=false;document.getElementById('zoneName').value='';renderZones();addLog(`Жаңы зона: ${name} (${depts.find(d=>d.id==deptId).name})`);}
function clearAllZones(){if(!confirm('Бардыгын өчүрөбү?'))return;zones=[];renderZones();}
function delZone(i){zones.splice(i,1);renderZones();}
function genLink(){if(!zones.length){document.getElementById('linkBox').innerHTML='';return;}let payload={depts,zones};let data=btoa(unescape(encodeURIComponent(JSON.stringify(payload))));let base=location.href.replace('admin.html','worker.html').replace('admin-v3.html','worker.html');let link=base.split('?')[0]+'#data='+data;document.getElementById('linkBox').innerHTML=`<div style="background:#f1f5f9;padding:10px;border-radius:10px"><b>🔗 Жумушчу шилтемеси (4 бөлүм):</b><div style="margin:6px 0;word-break:break-all;background:#fff;padding:6px;border-radius:8px;border:1px dashed #cbd5e1;font-size:11px"><a href="${link}" target="_blank">${link}</a></div><button class="btn btn-dark" onclick="navigator.clipboard.writeText('${link}');alert('Көчүрүлдү!')">📋 Көчүрүү</button></div>`;}
function checkInside(lat,lng){for(let z of zones){let poly=z.points;let ok=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];let inter=((yi>lng)!=(yj>lng))&&(lat<(xj-xi)*(lng-yi)/(yj-yi)+xi);if(inter)ok=!ok;}if(ok) return z;}return null;}
function addLog(text){logs.unshift({t:new Date().toLocaleString('ky-KG'),text});if(logs.length>200) logs=logs.slice(0,200);localStorage.setItem('kadamjai_logs_v3',JSON.stringify(logs));renderLog();}
function renderLog(){document.getElementById('logBox').innerHTML=logs.map(l=>`<div style="padding:5px 0;border-bottom:1px solid #f1f5f9"><small style="color:#94a3b8">${l.t}</small> — ${l.text}</div>`).join('')||'<small>Тарых жок</small>';}
renderLog();function clearLog(){logs=[];localStorage.removeItem('kadamjai_logs_v3');renderLog();}
function exportCSV(){let csv='Убакыт,Аты,Болуму,Статус,Координат\n'+Object.values(workersCache).map(w=>`${new Date(w.ts).toLocaleString()},${w.name},${w.deptName||'-'},${w.inside?'Жумушта':'Сыртта'},${w.lat} ${w.lng}`).join('\n');let blob=new Blob([csv],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='kadamjai_'+Date.now()+'.csv';a.click();}
function toggleSound(){soundOn=!soundOn;document.getElementById('soundBtn').innerText=soundOn?'🔔':'🔕';}
function renderStats(){let box=document.getElementById('statsBox');let total=Object.keys(workersCache).length;let inCount=Object.values(workersCache).filter(w=>w.inside).length;let html=`<div class="stat"><small>Бардыгы</small><b>${total}</b></div><div class="stat"><small>Жумушта</small><b style="color:#16a34a">${inCount}</b></div>`;depts.forEach(d=>{let c=Object.values(workersCache).filter(w=>w.deptId==d.id).length;html+=`<div class="stat" style="border-left:4px solid ${d.color}"><small>${d.name}</small><b style="color:${d.color}">${c}</b></div>`;});box.innerHTML=html;}
function listen(){db.ref('osh/workers').on('value',snap=>{workersCache={};snap.forEach(ch=>{let v=ch.val();let hit=checkInside(v.lat,v.lng);v.inside=!!hit;v.deptId=hit?hit.deptId:null;v.deptName=hit? (depts.find(d=>d.id==hit.deptId)?.name||''):'';
v.zoneName=hit?hit.name:'';if(prev[ch.key]!==undefined && prev[ch.key]!==v.inside){if(!v.inside){if(soundOn) document.getElementById('alertSound').play().catch(()=>{});addLog(`🔴 ${v.name} сыртка чыкты`);} else {addLog(`🟢 ${v.name} кирди: ${v.zoneName} (${v.deptName})`);}}prev[ch.key]=v.inside;workersCache[ch.key]=v;if(markers[ch.key]) map.removeLayer(markers[ch.key]);let col=v.inside? (depts.find(d=>d.id==v.deptId)?.color||'#16a34a'):'#ef4444';let icon=L.divIcon({html:`<div style="background:${col};color:white;padding:5px 10px;border-radius:999px;font-weight:800;font-size:11px;border:2px solid white;white-space:nowrap">${v.name} ${v.inside?'🟢':'🔴'} ${v.deptName?`• ${v.deptName}`:''}</div>`,className:'',iconAnchor:[30,12]});markers[ch.key]=L.marker([v.lat,v.lng],{icon}).addTo(map);});renderStats();render();});}
function render(){let q=(document.getElementById('search').value||'').toLowerCase();let arr=Object.values(workersCache);if(filterDept!=='all') arr=arr.filter(w=>w.deptId==filterDept);if(q) arr=arr.filter(w=>w.name.toLowerCase().includes(q));arr=arr.sort((a,b)=> (a.inside===b.inside?0:a.inside?-1:1));let html='<table><tr><th>Аты</th><th>Бөлүм / Статус</th><th>Убакыт</th></tr>';arr.forEach(w=>{let d=depts.find(dd=>dd.id==w.deptId);let col=d?d.color:'#64748b';html+=`<tr style="cursor:pointer" onclick="map.flyTo([${w.lat},${w.lng}],16)"><td><b>${w.name}</b></td><td><span class="badge" style="background:${w.inside?col+'18':'#fee2e2'};color:${w.inside?col:'#991b1b'}">${w.inside?`🟢 Жумушта`:`🔴 Сыртта`}</span><br><small style="color:${col};font-weight:700">${w.deptName?`📍 ${w.zoneName} • ${w.deptName}`:'—'}</small></td><td><small>${new Date(w.ts).toLocaleTimeString()}</small></td></tr>`;});html+='</table>';if(!arr.length) html='<div style="padding:16px;text-align:center;color:#94a3b8">Жумушчу жок</div>';document.getElementById('workersTable').innerHTML=html;}
listen();genLink();
</script>
</body>
</html>
