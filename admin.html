<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кадамжай ЖДПБ - Админ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#eef2f7;color:#1e293b}
.header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-radius:16px;margin:12px;box-shadow:0 2px 10px #0001}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;color:#0f2d6b;font-size:20px}
.filters{background:#fff;margin:0 12px;padding:10px;border-radius:14px;display:flex;gap:8px;flex-wrap:wrap;box-shadow:0 2px 10px #0001;align-items:center}
.f{padding:9px 14px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;cursor:pointer;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px}
.f.active{background:#155dfc;color:#fff}
.badge{padding:2px 7px;border-radius:12px;font-size:11px;font-weight:700}
.search{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid #ddd;border-radius:24px;padding:8px 14px;background:#f8fafc}
.main{margin:12px;background:#fff;border-radius:16px;padding:16px;box-shadow:0 2px 10px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:14px}
.card{border:1px solid #eef2f7;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;background:#fff;box-shadow:0 1px 6px #0001}
.card:hover{border-color:#155dfc}
.ic{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;font-size:26px;flex-shrink:0}
.add{border:2px dashed #93a4f5;background:#f8faff;justify-content:center;align-items:center;color:#155dfc;font-weight:700;text-align:center}
.dept-view{display:none;margin:12px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:12px}
.left,.right{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001}
#map{height:520px;border-radius:12px;margin-top:10px}
.back{padding:8px 14px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="header"><div class="logo"><div style="width:40px;height:40px;background:#155dfc;border-radius:50%;display:grid;place-items:center;color:#fff">⚙️</div> Кадамжай ЖДПБ - Админ Панель</div><div>🔔 <b>К</b> Админ</div></div>

<div id="mainPage">
<div class="filters">
<button class="f active" id="f_all" onclick="setFilter('all')">🏢 Бөлүм <span class="badge" style="background:#dbeafe" id="c_all">8</span></button>
<button class="f" id="f_late" onclick="setFilter('late')">⏰ Кечиккендер <span class="badge" style="background:#ffedd5" id="c_late">0</span></button>
<button class="f" id="f_early" onclick="setFilter('early')">↩️ Эрте кеткендер <span class="badge" style="background:#fef9c3" id="c_early">0</span></button>
<button class="f" id="f_absent" onclick="setFilter('absent')">🚫 Келбегендер <span class="badge" style="background:#fee2e2" id="c_absent">0</span></button>
<div class="search">🔍 <input id="searchInp" oninput="render()" placeholder="Издөө... бөлүм, кызматкер" style="border:0;outline:0;background:transparent;width:200px"></div>
</div>
<div class="main">
<h2 style="margin:0 0 4px">Бөлүмдөр <small style="font-weight:400;color:#64748b" id="subtitle">Жалпы 8 бөлүм • 0 кызматкер</small></h2>
<div id="grid" class="grid"></div>
</div>
</div>

<div id="deptPage" class="dept-view">
<button class="back" onclick="showMain()">← Артка / Бөлүмдөргө кайтуу</button>
<div class="layout">
<div class="left">
<h3 style="margin:0 0 10px">Бөлүм: <span id="deptName"></span></h3>
<div style="background:#f8fafc;padding:10px;border-radius:10px">
<div>Жалпы кызматкер: <b id="d_total">0</b></div>
<div>🟢 Иште: <b id="d_work">0</b></div>
<div>🟠 Зонадан тышкары: <b id="d_out">0</b></div>
</div>
<h4>Кызматкерлер</h4>
<div id="empList"></div>
</div>
<div class="right">
<div style="display:flex;gap:10px">
<div style="flex:1;background:#dbeafe;border-radius:12px;padding:12px"><div>Жалпы</div><h2 id="stTotal" style="margin:0">0</h2></div>
<div style="flex:1;background:#dcfce7;border-radius:12px;padding:12px"><div>Иште жүрөт</div><h2 id="stWork" style="margin:0">0</h2></div>
<div style="flex:1;background:#ffedd5;border-radius:12px;padding:12px"><div>Эскертүү</div><h2 id="stAlert" style="margin:0">0</h2></div>
</div>
<div id="map"></div>
<small style="color:#64748b">Акыркы жаңыртуу: <span id="lastUp"></span> • Live</small>
</div>
</div>
</div>

<script>
const firebaseConfig={databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();

let departments = JSON.parse(localStorage.getItem('departments')||'null') || [
{id:1,name:"Өндүрүш бөлүмү",icon:"🏭",color:"#dbeafe"},
{id:2,name:"Каржы бөлүмү",icon:"💰",color:"#dcfce7"},
{id:3,name:"Кадрлар бөлүмү",icon:"👥",color:"#ede9fe"},
{id:4,name:"Техникалык бөлүмү",icon:"🛠️",color:"#dbeafe"},
{id:5,name:"Медициналык бөлүмү",icon:"➕",color:"#ccfbf1"},
{id:6,name:"Тапшыруу бөлүмү",icon:"📄",color:"#ffedd5"},
{id:7,name:"Коопсуздук бөлүмү",icon:"🛡️",color:"#1e3a8a"},
{id:8,name:"Логистика бөлүмү",icon:"🚚",color:"#a5f3fc"},
];
localStorage.setItem('departments',JSON.stringify(departments));

let allWorkers={}, currentFilter='all', selected=null, map=null;

db.ref('osh/workers').on('value',snap=>{
 allWorkers={}; snap.forEach(ch=>{ allWorkers[ch.key]=ch.val(); });
 updateCounts(); render(); if(selected) loadDept();
});

function updateCounts(){
 let total=Object.keys(allWorkers).length;
 document.getElementById('subtitle').innerText=`Жалпы ${departments.length} бөлүм • ${total} кызматкер`;
 // Бул жерде кечиккен/эрте/келбеген логикасы кийин Firebase'ге кошулат, азыр 0
}

function render(){
 let q=document.getElementById('searchInp').value.toLowerCase();
 let list=departments.filter(d=>d.name.toLowerCase().includes(q));
 if(currentFilter=='late') list=list.filter(d=>getDeptStats(d.id).late>0);
 if(currentFilter=='absent') list=list.filter(d=>getDeptStats(d.id).absent>0);

 let g=document.getElementById('grid'); g.innerHTML='';
 list.forEach(d=>{
  let st=getDeptStats(d.id);
  g.innerHTML+=`<div class="card" onclick="openDept(${d.id})"><div class="ic" style="background:${d.color}">${d.icon}</div><div><b>${d.name}</b><br><small>Кызматкер: ${st.total} • Бул бөлүмдө чыныгы адамдар Firebase'ден</small><div style="margin-top:6px;font-size:12px">🟢 ${st.work} иште • 🔴 ${st.out} сыртта</div></div></div>`;
 });
 g.innerHTML+=`<div class="card add" onclick="addDept()">➕<br>Бөлүм кошуу<br><small>Жаңы бөлүм кошуу</small></div>`;
}
function getDeptStats(deptId){
 let arr=Object.values(allWorkers).filter(w=>w.deptId==deptId);
 let total=arr.length, work=0, out=0;
 arr.forEach(w=>{ if(w.inside===false) out++; else work++; });
 return {total, work, out, late:0, absent:0};
}
function setFilter(f){ currentFilter=f; document.querySelectorAll('.f').forEach(b=>b.classList.remove('active')); document.getElementById('f_'+f).classList.add('active'); render(); }
function addDept(){ let n=prompt("Жаңы бөлүм аты:"); if(!n) return; departments.push({id:Date.now(),name:n,icon:"🏢",color:"#f1f5f9"}); localStorage.setItem('departments',JSON.stringify(departments)); render(); }
function showMain(){ document.getElementById('mainPage').style.display='block'; document.getElementById('deptPage').style.display='none'; }
function openDept(id){ selected=departments.find(x=>x.id==id); document.getElementById('mainPage').style.display='none'; document.getElementById('deptPage').style.display='block'; document.getElementById('deptName').innerText=selected.name; setTimeout(initMap,200); loadDept(); }
function initMap(){ if(map){map.remove(); map=null;} map=L.map('map').setView([40.115,71.73],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); if(selected && selected.zones && selected.zones[0]){ let p=L.polygon(selected.zones[0],{color:'#155dfc'}).addTo(map); map.fitBounds(p.getBounds()); } document.getElementById('lastUp').innerText=new Date().toLocaleString(); }
function loadDept(){
 let st=getDeptStats(selected.id);
 document.getElementById('d_total').innerText=st.total; document.getElementById('d_work').innerText=st.work; document.getElementById('d_out').innerText=st.out;
 document.getElementById('stTotal').innerText=st.total; document.getElementById('stWork').innerText=st.work; document.getElementById('stAlert').innerText=st.out;
 let el=document.getElementById('empList'); el.innerHTML='';
 Object.values(allWorkers).filter(w=>w.deptId==selected.id).forEach(w=>{
  let isOut=w.inside===false; el.innerHTML+=`<div style="display:flex;gap:8px;padding:8px;border-bottom:1px solid #eee"><div>👤</div><div><b>${w.name}</b><br><small>${w.lat?.toFixed(4)}, ${w.lng?.toFixed(4)}</small></div><div style="margin-left:auto">${isOut?'🔴 Сыртта':'🟢 Ичте'}</div></div>`;
  if(map) L.marker([w.lat,w.lng]).addTo(map).bindPopup(w.name + (isOut?' 🔴 Сыртта':' 🟢 Ичте'));
 });
 if(st.total==0) el.innerHTML='<small style="color:#64748b">Бул бөлүмдө азырынча жумушчу каттала элек. Жумушчу worker.html аркылуу киргенде ушул жерде көрүнөт.</small>';
}
render();
</script>
</body>
</html>
