<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{margin:0;font-family:sans-serif}#map{height:55vh}.panel{padding:12px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001;margin-bottom:10px}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}.b1{background:#16a34a;color:#fff}.b2{background:#e5e7eb}.in{color:#16a34a;font-weight:bold}.out{color:#dc2626;font-weight:bold} table{width:100%;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #eee;font-size:14px}</style>
</head><body>
<div id="map"></div>
<div class="panel">
<div class="card"><button class="btn b1" onclick="startDraw()">✏️ Чийүүнү баштоо</button> <button class="btn b2" onclick="finish()">✅ Бүтүр жана шилтеме түз</button><div id="linkBox" style="margin-top:10px;word-break:break-all"></div></div>
<div class="card"><h3>👷 Жумушчулар (онлайн)</h3><table id="tbl"><tr><th>Аты</th><th>Статус</th><th>Убакыт</th><th>Тактык</th></tr></table></div>
</div>
<script>
const firebaseConfig = { apiKey: "AIzaSyDemoKeyForOshTracker123456", authDomain: "gps-tracker-osh.firebaseapp.com", databaseURL: "https://gps-tracker-osh-default-rtdb.firebaseio.com", projectId: "gps-tracker-osh" };
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let map=L.map('map').setView([40.53,72.8],13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let pts=[], poly=null, drawing=false;
map.on('click', e=>{ if(!drawing) return; pts.push([e.latlng.lat,e.latlng.lng]); if(poly) map.removeLayer(poly); poly=L.polygon(pts,{color:'#16a34a'}).addTo(map); });
function startDraw(){ pts=[]; if(poly) map.removeLayer(poly); drawing=true; alert('Картаны басып аймакты чийе башта!');}
function finish(){ drawing=false; if(pts.length<3){alert('Кеминде 3 чекит!');return;} let zones=[pts]; let data=btoa(unescape(encodeURIComponent(JSON.stringify(zones)))); let base=location.href.replace('admin.html','worker.html'); let link=base+'#zones='+data; document.getElementById('linkBox').innerHTML=`<b>Жумушчу шилтемеси:</b><br><a href="${link}" target="_blank">${link}</a><br><button class="btn b1" style="margin-top:8px" onclick="navigator.clipboard.writeText('${link}')">📋 Көчүрүү</button>`; localStorage.setItem('myzones', JSON.stringify(zones)); listenWorkers(zones); }
function getZones(){ try{return JSON.parse(localStorage.getItem('myzones')||'[]')}catch{return []}}
function listenWorkers(zones){ if(zones.length==0) zones=getZones(); db.ref('osh/workers').on('value', snap=>{ let tb=document.getElementById('tbl'); tb.innerHTML='<tr><th>Аты</th><th>Статус</th><th>Убакыт</th><th>Тактык</th></tr>'; snap.forEach(ch=>{ let v=ch.val(); let inside=false; let lat=v.lat,lng=v.lng; for(let poly of (zones.length?zones:[pts])){ let ok=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; let inter=((yi>lng)!=(yj>lng))&&(lat < (xj-xi)*(lng-yi)/(yj-yi)+xi); if(inter) ok=!ok;} if(ok) inside=true;} let cls=inside?'in':'out'; let txt=inside?'🟢 ИЧТЕ':'🔴 СЫРТТА'; tb.innerHTML+=`<tr><td>${v.name||'Аты жок'}</td><td class="${cls}">${txt}<br><small>${lat.toFixed(4)},${lng.toFixed(4)}</small></td><td>${new Date(v.ts).toLocaleTimeString()}</td><td>${v.acc}м</td></tr>`; }); }); }
listenWorkers([]);
</script></body></html>
