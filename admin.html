<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадамжай - Админ</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
*{box-sizing:border-box;font-family:Inter,sans-serif}
body{margin:0;background:#f6f7fb}
.header{position:sticky;top:0;background:white;border-bottom:1px solid #e5e7eb;padding:12px 16px;z-index:10;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.h-left{font-weight:700;display:flex;gap:8px;align-items:center}
.badge{background:#111;color:white;padding:2px 8px;border-radius:8px;font-size:12px}
.search{border:1px solid #e5e7eb;padding:8px 12px;border-radius:10px;min-width:220px}
.btn{border:0;border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn-black{background:#111;color:white}
.btn-white{background:white;border:1px solid #e5e7eb}
.filters{padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid #e5e7eb;background:white;padding:6px 12px;border-radius:20px;font-size:13px;cursor:pointer}
.chip.active{background:#111;color:white}
.add-row{padding:0 16px 10px;display:flex;gap:8px}
.add-row input{flex:1;padding:11px;border:1px solid #e5e7eb;border-radius:12px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:16px}
.card{background:white;border-radius:16px;padding:14px;border-top:4px solid #ddd;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-weight:700;display:flex;justify-content:space-between}
.del{color:#ef4444;cursor:pointer}
.stat{margin-top:6px;font-size:12px}
.bulk{margin:0 16px 16px;background:white;border-radius:12px;padding:12px;border:1px dashed #d1d5db}
.bulk textarea{width:100%;height:120px;border:1px solid #e5e7eb;border-radius:8px;padding:8px}
#detail{position:fixed;bottom:0;left:0;right:0;background:white;border-top-left-radius:20px;border-top-right-radius:20px;max-height:80vh;overflow:auto;padding:20px;box-shadow:0 -10px 30px rgba(0,0,0,.2);display:none;z-index:99}
</style>
</head>
<body>
<div class="header">
<div class="h-left">📍 Кадамжай <span class="badge" id="deptCount">0</span> <span id="onlineInfo" style="font-weight:400;font-size:13px;color:#6b7280"></span></div>
<div style="display:flex;gap:8px">
<input id="search" class="search" placeholder="🔍 Издөө..." oninput="render()">
<button class="btn btn-white" onclick="document.getElementById('bulkBox').style.display='block'">📋 70ти кошуу</button>
</div>
</div>

<div class="filters">
<div class="chip active" data-f="all" onclick="setFilter('all')">Баары</div>
<div class="chip" data-f="in" onclick="setFilter('in')">Жумушта</div>
<div class="chip" data-f="out" onclick="setFilter('out')">Сыртта</div>
</div>

<div class="add-row">
<input id="newDept" placeholder="Мисалы: ГСВ №7 деп жазып Enter бас" onkeydown="if(event.key==='Enter')addOne()">
<button class="btn btn-black" onclick="addOne()">Кошуу</button>
</div>

<div id="bulkBox" class="bulk" style="display:none">
<b>70 бөлүмдү бир заматта:</b>
<textarea id="bulkText" placeholder="Ар бир сап - бир бөлүм
ГСВ №4
ГСВ №5
ФАП Кара-Кыштак"></textarea>
<div style="display:flex;gap:8px;margin-top:8px">
<button class="btn btn-black" onclick="addBulk()">Баарын кошуу</button>
<button class="btn btn-white" onclick="document.getElementById('bulkBox').style.display='none'">Жабуу</button>
</div>
</div>

<div id="grid" class="grid"></div>
<div id="detail"></div>

<script>
const firebaseConfig={databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const DEPT_REF=db.ref('osh/departments');
const WORK_REF=db.ref('osh/workers');
let departments={}; let workers={}; let filter='all';
const COLORS=['#8b5cf6','#f59e0b','#06b6d4','#ec4899','#10b981','#ef4444','#3b82f6'];
const DEFAULTS={admin:{name:"Администрация",color:COLORS[0]},buh:{name:"Бухгалтерия",color:COLORS[1]},kdo:{name:"КДО",color:COLORS[2]},terapia:{name:"Терапия",color:COLORS[3]},gsv1:{name:"ГСВ №1",color:COLORS[4]},gsv2:{name:"ГСВ №2",color:COLORS[5]},gsv3:{name:"ГСВ №3",color:COLORS[6]}};
function slug(s){return s.toLowerCase().replace(/[^a-z0-9а-яёөүң]+/g,'_').replace(/^_|_$/g,'').slice(0,40)||'dept_'+Date.now();}
function setFilter(f){filter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.f===f));render();}
DEPT_REF.on('value',snap=>{let v=snap.val();if(!v){DEPT_REF.set(DEFAULTS);v=DEFAULTS;}departments=v;updateCount();render();});
WORK_REF.on('value',snap=>{workers=snap.val()||{};updateCount();render();});
function updateCount(){const total=Object.keys(departments).length;const online=Object.values(workers).filter(w=>w.online).length;document.getElementById('deptCount').innerText=total;document.getElementById('onlineInfo').innerText=`${online} жумушта • ${Object.keys(workers).length} адам`;}
function addOne(){const input=document.getElementById('newDept');const name=input.value.trim();if(!name)return;const id=slug(name);if(departments[id]){alert('Бул бөлүм бар');return;}const color=COLORS[Object.keys(departments).length%COLORS.length];DEPT_REF.child(id).set({name,color});input.value='';}
function addBulk(){const text=document.getElementById('bulkText').value.split('\n').map(s=>s.trim()).filter(Boolean);if(!text.length)return;let added=0;text.forEach(name=>{const id=slug(name);if(!departments[id]){DEPT_REF.child(id).set({name,color:COLORS[(Object.keys(departments).length+added)%COLORS.length]});added++;}});alert(added+' бөлүм кошулду');document.getElementById('bulkBox').style.display='none';document.getElementById('bulkText').value='';}
function deleteDept(e,id){e.stopPropagation();if(!confirm('Өчүрөсүзбү?'))return;DEPT_REF.child(id).remove();}
function openDept(id){
  const dept=departments[id];
  const list=Object.entries(workers).filter(([wid,w])=>w.deptId===id);
  let html=`<h3>${dept.name}</h3><p>${list.length} жумушчу</p>`;
  if(list.length===0) html+=`<p>Бул бөлүмгө азырынча эч ким каттала элек. Жумушчу телефондон ушул бөлүмдү тандаш керек.</p>`;
  list.forEach(([wid,w])=>{
    const time=w.lastSeen?new Date(w.lastSeen).toLocaleString():'';
    html+=`<div style="padding:10px;border-bottom:1px solid #eee;display:flex;justify-content:space-between"><span><b>${w.name}</b><br><small>${time}</small></span><span>${w.online?'🟢':'🔴'}</span></div>`;
  });
  html+=`<br><button class="btn btn-black" onclick="document.getElementById('detail').style.display='none'">Жабуу</button>`;
  document.getElementById('detail').innerHTML=html;
  document.getElementById('detail').style.display='block';
}
function render(){
  const grid=document.getElementById('grid');const q=document.getElementById('search').value.toLowerCase();grid.innerHTML='';
  Object.entries(departments).forEach(([id,dept])=>{
    if(q&&!dept.name.toLowerCase().includes(q))return;
    const deptWorkers=Object.values(workers).filter(w=>w.deptId===id);
    const inCount=deptWorkers.filter(w=>w.online).length;
    if(filter==='in'&&inCount===0)return;
    const div=document.createElement('div');div.className='card';div.style.borderTopColor=dept.color;div.onclick=()=>openDept(id);
    div.innerHTML=`<div class="card-title">${dept.name}<span class="del" onclick="deleteDept(event,'${id}')">X</span></div><div class="stat">🟢 ${inCount} | 🔴 ${deptWorkers.length-inCount} | 👥 ${deptWorkers.length}</div><div style="margin-top:6px;font-size:11px;color:#6b7280">Басып кириңиз →</div>`;
    grid.appendChild(div);
  });
}
</script>
</body>
</html>
