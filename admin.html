<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админ - Кадамжай ЖДПБ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#f8fafc}
#map{height:50vh}
.panel{padding:12px}
.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001;margin-bottom:12px}
.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
.b1{background:#16a34a;color:#fff}.b2{background:#e5e7eb}.b3{background:#2563eb;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.dept{padding:10px;border-radius:10px;background:#f1f5f9;cursor:pointer;border:2px solid transparent}
.dept:hover{border-color:#16a34a}
.in{color:#16a34a;font-weight:bold}.out{color:#dc2626;font-weight:bold}
table{width:100%;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #eee;font-size:13px}
</style>
</head>
<body>
<div id="map"></div>
<div class="panel">
<div class="card">
<h3 style="margin:0 0 8px">✏️ Бөлүмдүн аймагын чийүү</h3>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn b1" onclick="startDraw()">Чийүүнү баштоо</button>
<button class="btn b3" onclick="finishDraw()">✅ Бүтүр жана сактоо</button>
<button class="btn b2" onclick="clearDraw()">🗑️ Тазалоо</button>
</div>
<div id="linkBox" style="margin-top:10px;word-break:break-all"></div>
<div style="margin-top:8px"><small>Тандалган бөлүм: <b id="selDept">Тандалган жок</b></small></div>
</div>

<div class="card">
<h3>📂 Бөлүмдөр (70)</h3>
<div id="deptGrid" class="grid"></div>
</div>

<div class="card">
<h3>👷 Жумушчулар онлайн - <span id="selTitle">Бардык бөлүм</span></h3>
<table id="tbl"><tr><th>Аты</th><th>Бөлүм</th><th>Статус</th><th>Убакыт</th></tr></table>
</div>
</div>

<script>
const firebaseConfig = { apiKey: "AIzaSyDemoKeyForOshTracker123456", authDomain: "gps-tracker-osh.firebaseapp.com", databaseURL: "https://gps-tracker-osh-default-rtdb.firebaseio.com", projectId: "gps-tracker-osh" };
firebase.initializeApp(firebaseConfig); const db=firebase.database();

let map=L.map('map').setView([40.115,71.73],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let departments = JSON.parse(localStorage.getItem('departments')||'[]');
if(departments.length==0){
 for(let i=1;i<=70;i++) departments.push({id:i,name:"Бөлүм "+i, zones:[]});
 localStorage.setItem('departments', JSON.stringify(departments));
}
let selectedDept = null;
let pts=[], poly=null, drawing=false, markers=[];

function renderDepts(){
 let g=document.getElementById('deptGrid'); g.innerHTML='';
 departments.forEach(d=>{
   let div=document.createElement('div'); div.className='dept';
   if(selectedDept && selectedDept.id==d.id) div.style.borderColor='#2563eb';
   div.innerHTML=`<b>${d.name}</b><br><small>${d.zones.length?d.zones.length+' аймак':"Аймак жок"}</small>`;
   div.onclick=()=>openDept(d.id);
   g.appendChild(div);
 });
}
function openDept(id){
 selectedDept = departments.find(x=>x.id==id);
 document.getElementById('selDept').innerText=selectedDept.name;
 document.getElementById('selTitle').innerText=selectedDept.name;
 if(selectedDept.zones[0]){ map.fitBounds(L.polygon(selectedDept.zones[0]).getBounds()); }
 renderDepts();
 drawAllZones();
}

function startDraw(){ if(!selectedDept){alert('Алгач бөлүм танда!');return;} pts=[]; if(poly) map.removeLayer(poly); drawing=true; alert('Картаны басып '+selectedDept.name+' үчүн аймак чий!');}
function clearDraw(){ pts=[]; if(poly) map.removeLayer(poly); }
function finishDraw(){
 drawing=false;
 if(pts.length<3){alert('Кеминде 3 чекит чий!');return;}
 selectedDept.zones=[pts];
 localStorage.setItem('departments', JSON.stringify(departments));
 let data=btoa(unescape(encodeURIComponent(JSON.stringify({deptId:selectedDept.id, zones:selectedDept.zones}))));
 let base=location.href.replace('admin.html','worker.html');
 let link=base+'#data='+data;
 document.getElementById('linkBox').innerHTML=`<b>${selectedDept.name} шилтемеси:</b><br><a href="${link}" target="_blank">${link}</a><br><button class="btn b1" style="margin-top:6px" onclick="navigator.clipboard.writeText('${link}')">📋 Көчүрүү</button>`;
 drawAllZones();
 renderDepts();
}

map.on('click', e=>{ if(!drawing) return; pts.push([e.latlng.lat,e.latlng.lng]); if(poly) map.removeLayer(poly); poly=L.polygon(pts,{color:'#16a34a'}).addTo(map); });

function drawAllZones(){
 markers.forEach(m=>map.removeLayer(m)); markers=[];
 departments.forEach(d=>{
   if(d.zones[0]){ let p=L.polygon(d.zones[0],{color: selectedDept && selectedDept.id==d.id? '#2563eb':'#94a3b8', fillOpacity:0.2}).addTo(map); markers.push(p); }
 });
}

function isInside(lat,lng,poly){
 let inside=false;
 for(let i=0,j=poly.length-1;i<poly.length;j=i++){ let xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1]; let inter=((yi>lng)!=(yj>lng)) && (lat < (xj-xi)*(lng-yi)/(yj-yi)+xi); if(inter) inside=!inside; }
 return inside;
}

db.ref('osh/workers').on('value', snap=>{
 let tb=document.getElementById('tbl'); tb.innerHTML='<tr><th>Аты</th><th>Бөлүм</th><th>Статус</th><th>Убакыт</th></tr>';
 snap.forEach(ch=>{
  let v=ch.val();
  if(selectedDept && v.deptId!=selectedDept.id) return;
  let deptName = departments.find(x=>x.id==v.deptId)?.name || 'Белгисиз';
  let inside=false;
  let d = departments.find(x=>x.id==v.deptId);
  if(d && d.zones[0]) inside=isInside(v.lat,v.lng,d.zones[0]);
  let cls=inside?'in':'out'; let txt=inside?'🟢 ИЧТЕ':'🔴 СЫРТТА';
  tb.innerHTML+=`<tr><td>${v.name}</td><td>${deptName}</td><td class="${cls}">${txt}<br><small>${v.lat.toFixed(4)},${v.lng.toFixed(4)}</small></td><td>${new Date(v.ts).toLocaleTimeString()}</td></tr>`;
 });
});

renderDepts(); drawAllZones();
</script>
</body>
</html>
