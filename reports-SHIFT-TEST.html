<!doctype html><html lang="ky"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEST нөөмөт отчету</title><style>body{font:15px system-ui;padding:18px;background:#f1f5f9}main{max-width:950px;margin:auto;background:white;padding:20px;border-radius:12px}input,button{padding:10px;margin:5px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ddd;padding:8px;text-align:left}pre{white-space:pre-wrap}</style><main><h2>Нөөмөт отчету — TEST</h2><p>Бул отчет TEST D1деги жаңы нөөмөттөрдү гана көрсөтөт. Эски каттоолор жана өндүрүштүк табель менен кошулбайт.</p><label>Администратор ачкычы <input type="password" id="key" autocomplete="off"></label><button id="load">Отчетту окуу</button><div id="summary"></div><div style="overflow:auto"><table><thead><tr><th>Кызматкер ID</th><th>Дата</th><th>Нөөмөт</th><th>Статус</th><th>Саат</th><th>АЖ</th></tr></thead><tbody id="rows"></tbody></table></div><pre id="msg"></pre></main><script>const API='https://gps-tracker-test.umataly.workers.dev';document.getElementById('load').onclick=async()=>{const key=document.getElementById('key').value;try{const r=await fetch(API+'/shift-test/report',{headers:{'X-Admin-Key':key}});const v=await r.json();if(!r.ok)throw Error(v.error||r.status);const rows=document.getElementById('rows');rows.replaceChildren();for(const e of v.entries){const tr=document.createElement('tr');for(const val of [e.workerId,e.day,e.shiftId,e.status,e.workedMinutes==null?'—':(e.workedMinutes/60).toFixed(2),e.reviewRequired?'Текшерүү керек':'']){const td=document.createElement('td');td.textContent=val;tr.append(td)}rows.append(tr)}document.getElementById('summary').textContent='Нөөмөт саны: '+v.entries.length+'; Бишкек убактысы; эсеп эмгек акы үчүн бекитилген эмес.';document.getElementById('msg').textContent='';}catch(e){document.getElementById('msg').textContent=e.message}};</script></html>
