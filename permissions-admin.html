
<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Уруксат арыздары — Кадамжай ЖДПБ</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
    }
    h1 { color: #1e293b; }
    p { color: #475569; }
  </style>
</head>
<body>
  
  <main>
    <h1>Уруксат арыздары</h1>
    <p>Кадамжай ЖДПБ — администратор панели</p>
    <p>Арыздардын тизмеси жана башкаруу функциялары ушул жерде жайгашат.</p>
  
<div id="requestsList" style="margin-top:20px"></div>


  <div style="margin-top:20px">
  <label for="adminKey"><b>Администратордун ачкычы</b></label>
  <input
    id="adminKey"
    type="password"
    autocomplete="off"
    placeholder="ADMIN_API_KEY"
    style="width:100%;box-sizing:border-box;padding:12px;margin-top:8px;border:1px solid #ccc;border-radius:8px"
  >
  <button
    type="button"
    id="showRequests"
    style="margin-top:12px;padding:12px 20px;border:0;border-radius:8px;background:#2563eb;color:white"
  >
    Арыздарды көрсөтүү
  </button>
</div>
  </main>  

<script>
const API_URL = "https://gps-tracker-test.umataly.workers.dev";

document.getElementById("showRequests").addEventListener("click", async () => {
  const keyInput = document.getElementById("adminKey");
  const output = document.getElementById("requestsList");
  const button = document.getElementById("showRequests");

  const key = keyInput.value.trim();
  if (!key) {
    output.textContent = "Администратордун ачкычын киргизиңиз.";
    return;
  }

  button.disabled = true;
  output.textContent = "Арыздар жүктөлүүдө...";

  try {
    const response = await fetch(API_URL + "/permission-list", {
      method: "GET",
      headers: { "X-Admin-Key": key },
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        response.status === 403
          ? "Ачкыч туура эмес же уруксат жок."
          : "Сервер катасы: " + response.status
      );
    }

    const data = await response.json();
    output.replaceChildren();

    if (!Array.isArray(data.requests) || data.requests.length === 0) {
      output.textContent = "Арыздар табылган жок.";
      return;
    }

    for (const item of data.requests) {
      const card = document.createElement("div");
      card.style.cssText =
        "border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px";

      const lines = [
        "Арыз №" + item.id,
        "PIN: " + item.pin,
        "Башталышы: " + item.from_time,
        "Аякташы: " + item.to_time,
        "Себеби: " + item.reason,
        "Статус: " + item.status
      ];

      card.textContent = lines.join("\n");
      card.style.whiteSpace = "pre-line";
      
if (item.status === "pending") {
  const actions = document.createElement("div");
  actions.style.marginTop = "12px";

  const approveBtn = document.createElement("button");
  approveBtn.type = "button";
  approveBtn.textContent = "Бекитүү";
  approveBtn.style.marginRight = "10px";

  const rejectBtn = document.createElement("button");
  rejectBtn.type = "button";
  rejectBtn.textContent = "Четке кагуу";

  
approveBtn.addEventListener("click", () => {
  reviewRequest(item.id, "approved");
});

rejectBtn.addEventListener("click", () => {
  reviewRequest(item.id, "rejected");
});

  actions.append(approveBtn, rejectBtn);
  card.appendChild(actions);
}

      output.appendChild(card);
    }
  } catch (error) {
    output.textContent = error.message;
  } finally {
    keyInput.value = "";
    button.disabled = false;
  }
});
</script>

</body>
</html>
