<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Жумушчу v1100 IDEAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- OG for WhatsApp -->
<meta property="og:title" content="Кадамжай ЖДПБ - Жумушчу кирүү">
<meta property="og:description" content="GPS аркылуу кирүү системасы">
<meta property="og:image" content="https://imatali.github.io/gps-tracker/icon.png?v=1100">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<link rel="icon" href="icon.png?v=1100">
<style>.pulse{animation:pulse 2s infinite} @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.5}}</style>
</head>
<body class="bg-[#f0fdf4] min-h-screen flex items-center justify-center p-3 font-sans">
<div class="bg-white w-full max-w-[400px] rounded-[20px] shadow-xl p-5 border">
<!-- HEADER -->
<div class="flex items-center gap-3 mb-4">
<img src="logo.png?v=1100" class="w-10 h-10 rounded-full border bg-white">
<div><h1 class="font-black text-[16px]">Кадамжай ЖДПБ</h1><p class="text-[11px] text-gray-500">Көзөмөл системасы v1100</p></div>
<div id="netStatus" class="ml-auto text-[10px] px-2 py-1 rounded-full bg-gray-100">...</div>
</div>

<!-- LOGIN -->
<div id="loginBox">
<p class="text-[13px] text-gray-600 mb-2">ПИН кодуңузду жазыңыз:</p>
<input id="pinInput" type="number" inputmode="numeric" placeholder="0000" class="w-full border-2 border-blue-200 rounded-xl p-3 text-center text-[22px] font-black tracking-[8px]">
<button onclick="login()" class="w-full mt-3 bg-blue-600 text-white py-3 rounded-xl font-bold">Кирүү →</button>
<p id="loginErr" class="text-[12px] text-red-500 mt-2 text-center"></p>
</div>

<!-- MAIN -->
<div id="mainBox" class="hidden">
<div class="bg-gray-50 rounded-xl p-3 flex justify-between items-center">
<div><div id="wName" class="font-bold text-[14px]"></div><div id="wDept" class="text-[11px] text-gray-500"></div></div>
<button onclick="logout()" class="text-[11px] bg-white border px-2 py-1 rounded">Чыгуу</button>
</div>
<div id="statusCard" class="mt-3 p-4 rounded-xl text-center font-bold text-[18px]">...</div>
<div class="mt-2 text-center text-[11px] text-gray-500"><span id="gpsText">GPS күтүлүүдө...</span> | <span id="accText"></span></div>
<div class="mt-3 grid grid-cols-2 gap-2 text-[11px]">
<div class="bg-blue-50 p-2 rounded-lg">Кирди: <b id="tIn">--:--</b></div>
<div class="bg-orange-50 p-2 rounded-lg">Чыкты: <b id="tOut">--:--</b></div>
</div>
<div id="queueInfo" class="mt-2 text-[10px] text-amber-600 text-center hidden">📦 Offline сакталды: <span id="qCount">0</span></div>
</div>
<div class="text-center text-[10px] text-gray-400 mt-4">v1100 IDEAL • Battery Saver • Offline Support</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const VERSION="v1100";
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let myPin = localStorage.getItem('myPin1100');
let myData = null;
let watchId = null;
let queue = JSON.parse(localStorage.getItem('gpsQueue1100')||'[]');
let wakeLock = null;

function updateNet(){ const el=document.getElementById('netStatus'); if(navigator.onLine){el.innerText='🟢 Online'; el.className='ml-auto text-[10px] px-2 py-1 rounded-full bg-green-100 text-green-700'; syncQueue();} else {el.innerText='🔴 Offline'; el.className='ml-auto text-[10px] px-2 py-1 rounded-full bg-red-100 text-red-700';} }
window.addEventListener('online', updateNet); window.addEventListener('offline', updateNet); updateNet();

async function keepAwake(){ try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') keepAwake(); });

function login(){
  let pin=document.getElementById('pinInput').value.trim();
  if(pin.length<4){ document.getElementById('loginErr').innerText='4 сан жаз!'; return; }
  db.ref('osh/pins/'+pin).once('value', s=>{
    if(!s.exists()){ document.getElementById('loginErr').innerText='❌ ПИН табылган жок!'; return; }
    let data=s.val();
    // Device Lock күчөтүлгөн
    if(data.deviceId && data.deviceId!==getDeviceId() && data.deviceId.length>5){
      document.getElementById('loginErr').innerText='❌ Бул ПИН башка телефондо! Админ Сброс кылсын.';
      return;
    }
    if(!data.deviceId){ db.ref('osh/pins/'+pin).update({deviceId:getDeviceId()}); }
    localStorage.setItem('myPin1100', pin);
    myPin=pin;
    startApp(data);
  });
}
function getDeviceId(){ let id=localStorage.getItem('deviceId1100'); if(!id){ id='dev_'+Math.random().toString(36).slice(2,10)+'_'+Date.now(); localStorage.setItem('deviceId1100', id);} return id; }
function logout(){ if(confirm('Чыгасызбы?')){ localStorage.removeItem('myPin1100'); location.reload(); } }
function startApp(pinData){
  myData=pinData;
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('mainBox').classList.remove('hidden');
  document.getElementById('wName').innerText=pinData.name;
  document.getElementById('wDept').innerText=pinData.bolum;
  keepAwake();
  startGPS();
}
function startGPS(){
  if(!navigator.geolocation){ document.getElementById('statusCard').innerText='❌ GPS жок'; return; }
  document.getElementById('gpsText').innerText='📡 GPS изделүүдө...';
  watchId=navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
}
let lastSent=0;
function onPos(p){
  let lat=p.coords.latitude, lng=p.coords.longitude, acc=Math.round(p.coords.accuracy);
  document.getElementById('gpsText').innerText=lat.toFixed(5)+','+lng.toFixed(5);
  document.getElementById('accText').innerText=acc+'м';
  // Батарея үнөмдөө: тактык 80м ден начар болсо жөнөтпөйбүз
  if(acc>80){ document.getElementById('statusCard').className='mt-3 p-4 rounded-xl text-center font-bold text-[18px] bg-yellow-100 text-yellow-800'; document.getElementById('statusCard').innerText='📶 Тактык начар ('+acc+'м) - ачык асманга чык'; return; }
  if(Date.now()-lastSent<15000) return; // 15 сек сайын гана жөнөт
  lastSent=Date.now();
  let payload={pin:myPin, name:myData.name, bolum:myData.bolum, lat:lat, lng:lng, acc:acc, ts:Date.now(), deviceId:getDeviceId()};
  // Offline логика
  if(!navigator.onLine){ queue.push(payload); saveQueue(); return; }
  sendToFirebase(payload);
  // Бүгүнкү кирүү/чыгуу убактысын көрсөтүү
  let today=new Date().toISOString().slice(0,10);
  db.ref('osh/logs/'+today+'/'+myPin).once('value', s=>{
    if(s.exists()){ let l=s.val(); document.getElementById('tIn').innerText=l.firstIn||'--:--'; document.getElementById('tOut').innerText=l.lastOut||'--:--'; }
  });
  document.getElementById('statusCard').className='mt-3 p-4 rounded-xl text-center font-bold text-[18px] bg-green-100 text-green-800 pulse';
  document.getElementById('statusCard').innerText='🟢 Байланышта - '+new Date().toLocaleTimeString();
}
function sendToFirebase(pl){
  let today=new Date().toISOString().slice(0,10);
  db.ref('osh/workers/'+pl.pin).set(pl);
  db.ref('osh/logs/'+today+'/'+pl.pin+'/lastSeen').set(Date.now());
  db.ref('osh/logs/'+today+'/'+pl.pin+'/lastLat').set(pl.lat);
  db.ref('osh/logs/'+today+'/'+pl.pin+'/lastLng').set(pl.lng);
  // firstIn автомат
  db.ref('osh/logs/'+today+'/'+pl.pin+'/firstIn').once('value', s=>{ if(!s.exists()) db.ref('osh/logs/'+today+'/'+pl.pin+'/firstIn').set(new Date().toLocaleTimeString()); });
}
function onErr(e){ document.getElementById('statusCard').className='mt-3 p-4 rounded-xl text-center font-bold bg-red-100 text-red-800'; document.getElementById('statusCard').innerText='❌ GPS ката: '+e.message+' - Геолокацияны күйгүзүңүз'; }
function saveQueue(){ localStorage.setItem('gpsQueue1100', JSON.stringify(queue)); document.getElementById('queueInfo').classList.remove('hidden'); document.getElementById('qCount').innerText=queue.length; }
function syncQueue(){ if(queue.length==0 ||!navigator.onLine) return; queue.forEach(sendToFirebase); queue=[]; saveQueue(); document.getElementById('queueInfo').classList.add('hidden'); }

// Авто кирүү
if(myPin){ db.ref('osh/pins/'+myPin).once('value', s=>{ if(s.exists()) startApp(s.val()); else localStorage.removeItem('myPin1100'); }); }
</script>
</body>
</html>
