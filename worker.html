<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жумушчу</title><style>body{margin:0;font-family:Inter,sans-serif;background:#f6f7fb;padding:14px;text-align:center} .card{background:#fff;border-radius:16px;padding:18px;border:1px solid #eef2f7;max-width:400px;margin:20px auto} .btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;font-size:16px;cursor:pointer} .btn-green{background:#16a34a;color:#fff} .btn-red{background:#fee2e2;color:#dc2626} .dot{width:14px;height:14px;border-radius:50%;display:inline-block} .inp{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0}</style></head><body><div class="card"><h2>🏥 Кадамжай ЖДПБ</h2><div id="step1"><p>Аты-жөнүңүздү жазыңыз</p><input id="name" class="inp" placeholder="Мисалы: Иматали"><input id="dept" class="inp" placeholder="Бөлүм (милдеттүү эмес)"><button class="btn btn-green" onclick="start()">📍 Жумушту баштоо</button></div><div id="step2" style="display:none"><h3 id="hello"></h3><div style="font-size:48px;margin:10px">📍</div><p id="status">GPS күтүлүүдө...</p><p><span class="dot" id="dot" style="background:#94a3b8"></span> <b id="txt">Байланыш жок</b></p><p style="color:#64748b;font-size:12px">Аймактын ичинде болсоңуз автомат <b>Жумушта</b> болуп саналасыз</p><div style="background:#f8fafc;padding:10px;border-radius:10px;font-size:12px;margin-top:10px"><div>Бөлүм: <b id="myDept">-</b></div><div>График: <b id="myTime">-</b></div><div>Акыркы: <b id="last">-</b></div></div><button class="btn btn-red" style="margin-top:12px" onclick="stop()">⏹ Токтотуу</button></div></div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};
firebase.initializeApp(cfg);const db=firebase.database();
let watchId=null,myId=null;
function start(){
let n=document.getElementById('name').value.trim();if(!n){alert('Атыңызды жазыңыз');return;}
myId=n.toLowerCase().replace(/[^a-z0-9а-яёөүң]+/gi,'_');localStorage.setItem('kadamjai_myid',myId);localStorage.setItem('kadamjai_myname',n);
document.getElementById('step1').style.display='none';document.getElementById('step2').style.display='block';document.getElementById('hello').innerText='Салам, '+n+'!';
if(!navigator.geolocation){alert('GPS жок');return;}
watchId=navigator.geolocation.watchPosition(pos=>{
let lat=pos.coords.latitude,lng=pos.coords.longitude;
db.ref('osh/workers/'+myId).set({name:n,lat:lat,lng:lng,dept:document.getElementById('dept').value||'',ts:Date.now()});
document.getElementById('status').innerText=`📍 ${lat.toFixed(5)}, ${lng.toFixed(5)}`;document.getElementById('last').innerText=new Date().toLocaleTimeString('ky-KG');
document.getElementById('dot').style.background='#16a34a';document.getElementById('txt').innerText='Жөнөтүлүүдө... ✅';
// Бөлүмүн текшер
db.ref('osh/assign_v3/'+myId).on('value',s=>{let v=s.val();if(v){document.getElementById('myDept').innerText=v.deptId;document.getElementById('myTime').innerText=v.start+' - '+v.end;}});
},err=>{document.getElementById('status').innerText='GPS ката: '+err.message;},{enableHighAccuracy:true,maximumAge:0,timeout:10000});
}
function stop(){if(watchId)navigator.geolocation.clearWatch(watchId);db.ref('osh/workers/'+myId).remove();location.reload();}
window.onload=()=>{let saved=localStorage.getItem('kadamjai_myname');if(saved){document.getElementById('name').value=saved;}}
</script></body></html>
