<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Жумушка кирүү</title>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<style>
body{font-family:sans-serif;background:#f8fafc;margin:0;padding:20px}
.box{background:white;padding:20px;border-radius:16px;max-width:400px;margin:auto;box-shadow:0 4px 12px rgba(0,0,0,.1)}
input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ddd;font-size:16px}
button{background:#111;color:white;border:0}
#status{margin-top:12px;padding:10px;background:#ecfdf5;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div class="box">
<h2>📍 Кадамжай ЖДПБ</h2>
<input id="name" placeholder="Аты-жөнүңүз">
<select id="dept"><option>Бөлүмдөр жүктөлүүдө...</option></select>
<button onclick="startWork()">Жумушту баштоо</button>
<div id="status">Бөлүмдөр админден жүктөлүүдө...</div>
</div>
<script>
const firebaseConfig={databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();
let workerId=localStorage.getItem('workerId')||'w_'+Date.now();
localStorage.setItem('workerId',workerId);
db.ref('osh/departments').on('value',snap=>{
  const depts=snap.val()||{};
  const sel=document.getElementById('dept');
  const saved=localStorage.getItem('workerDept');
  sel.innerHTML='';
  Object.entries(depts).forEach(([id,info])=>{
    const opt=document.createElement('option'); opt.value=id; opt.textContent=info.name;
    if(id===saved) opt.selected=true; sel.appendChild(opt);
  });
  document.getElementById('status').innerText='✅ '+Object.keys(depts).length+' бөлүм жүктөлдү';
});
function startWork(){
 const name=document.getElementById('name').value.trim();
 const dept=document.getElementById('dept').value;
 if(!name){alert('Атыңызды жазыңыз');return;}
 localStorage.setItem('workerName',name); localStorage.setItem('workerDept',dept);
 if(navigator.geolocation){
   navigator.geolocation.watchPosition(pos=>{
     db.ref('osh/workers/'+workerId).set({name:name,deptId:dept,lat:pos.coords.latitude,lng:pos.coords.longitude,lastSeen:Date.now(),online:true});
     document.getElementById('status').innerText='📡 Жөнөтүлдү: '+pos.coords.latitude.toFixed(5);
   },e=>{document.getElementById('status').innerText='❌ Уруксат бериңиз: '+e.message},{enableHighAccuracy:true});
 }
}
window.onload=()=>{const n=localStorage.getItem('workerName'); if(n) document.getElementById('name').value=n;}
</script>
</body>
</html>
