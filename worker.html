<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жумушчу - Кадамжай</title><style>body{margin:0;font-family:Inter,sans-serif;background:#f6f7fb;padding:14px;text-align:center}.card{background:#fff;border-radius:16px;padding:18px;border:1px solid #eef2f7;max-width:400px;margin:20px auto}.btn{width:100%;padding:14px;border-radius:12px;border:0;font-weight:800;font-size:16px;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.inp,.sel{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0;font-size:15px;box-sizing:border-box}</style></head><body><div class="card"><h2>🏥 Кадамжай ЖДПБ</h2>
<div id="step1">
<input id="name" class="inp" placeholder="Аты-жөнүңүз: Мисалы Иматали">
<select id="dept" class="sel"><option value="">Бөлүм тандаңыз... ⏳</option></select>
<button class="btn btn-green" onclick="start()">📍 Жумушту баштоо</button>
<p id="info" style="font-size:12px;color:#64748b"></p>
</div>
<div id="step2" style="display:none"><h3 id="hello"></h3><div style="font-size:48px">📍</div><p id="status">GPS...</p><p><b id="myDept">-</b></p><p id="last" style="font-size:12px;color:#64748b"></p><button class="btn" style="background:#fee2e2;color:#dc2626;margin-top:12px" onclick="stop()">⏹ Токтотуу</button></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const cfg={apiKey:"AIzaSyBQWMBefKxYWiPQnJVhCANZLqkz2Vnt2VME",authDomain:"gps-tracker-osh.firebaseapp.com",databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com",projectId:"gps-tracker-osh"};
firebase.initializeApp(cfg);const db=firebase.database();
let watchId=null,myId=null;
let deptsList={};

// БӨЛҮМДӨРДҮ АДМИНДЕН АВТОМАТ ТАРТУУ
function loadDepts(){
  const paths=['osh/depts','osh/departments','osh/depts_v3','osh/config/departments'];
  let found=false;
  paths.forEach(p=>{
    db.ref(p).on('value',s=>{
      let v=s.val(); if(!v) return;
      let list={};
      if(Array.isArray(v)){ v.forEach(x=>{ if(x) { let id=x.id||x.name; list[id]=x.name||x; } }); }
      else { Object.keys(v).forEach(k=>{ list[k]=v[k].name||v[k].title||v[k]||k; }); }
      if(Object.keys(list).length>0){ deptsList={...deptsList,...list}; renderDepts(); found=true; }
    });
  });
  // Эгер 3 сек эч нерсе келбесе демо бөлүмдөр
  setTimeout(()=>{ if(!found && Object.keys(deptsList).length==0){
    deptsList={"Терапия":"Терапия","Хирургия":"Хирургия","Балдар":"Балдар бөлүмү","Администрация":"Администрация"}; renderDepts();
  }},3000);
}
function renderDepts(){
  let sel=document.getElementById('dept');
  let cur=sel.value;
  sel.innerHTML='<option value="">Бөлүм тандаңыз...</option>';
  Object.keys(deptsList).forEach(id=>{
    let o=document.createElement('option'); o.value=id; o.textContent=deptsList[id]; sel.appendChild(o);
  });
  if(cur) sel.value=cur;
  document.getElementById('info').innerText=Object.keys(deptsList).length+' бөлүм табылды ✅';
}
loadDepts();

function start(){
  let n=document.getElementById('name').value.trim();
  let d=document.getElementById('dept').value;
  if(!n){alert('Атыңызды жазыңыз');return;}
  if(!d){alert('Бөлүм тандаңыз');return;}
  myId=n.toLowerCase().replace(/[^a-z0-9а-яёөүң]+/gi,'_');
  let savedId=localStorage.getItem('kadamjai_myid');
  let savedDept=localStorage.getItem('kadamjai_mydept');
  // ЭКИНЧИ ЖОЛУ БАШКА БӨЛҮМ ТАНДАСА
  if(savedId && savedDept && savedId===myId && savedDept!==d){
    alert('⚠️ Сиз башка бөлүмдү тандадыңыз ('+savedDept+' → '+d+').\nАдминге кайрылыңыз! Админ панельден гана өзгөртө алат.');
    document.getElementById('dept').value=savedDept;
    return;
  }
  localStorage.setItem('kadamjai_myid',myId);
  localStorage.setItem('kadamjai_myname',n);
  localStorage.setItem('kadamjai_mydept',d);

  // АДМИНГЕ АВТОМАТ ЖАЗУУ - ЭМИ АДМИН ИЗДЕБЕЙТ
  db.ref('osh/assign_v3/'+myId).set({deptId:d,deptName:deptsList[d]||d,start:"08:00",end:"18:00",autoAssigned:true,ts:Date.now()});

  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('hello').innerText='Салам, '+n+'!';
  document.getElementById('myDept').innerText='Бөлүм: '+(deptsList[d]||d);

  watchId=navigator.geolocation.watchPosition(pos=>{
    let lat=pos.coords.latitude,lng=pos.coords.longitude;
    db.ref('osh/workers/'+myId).set({name:n,dept:d,deptName:deptsList[d]||d,lat:lat,lng:lng,ts:Date.now()});
    document.getElementById('status').innerText=`📍 ${lat.toFixed(5)}, ${lng.toFixed(5)} ✅`;
    document.getElementById('last').innerText=new Date().toLocaleTimeString('ky-KG');
  },err=>{document.getElementById('status').innerText='GPS ката: '+err.message;},{enableHighAccuracy:true});
}
function stop(){ if(watchId) navigator.geolocation.clearWatch(watchId); if(myId) db.ref('osh/workers/'+myId).remove(); localStorage.clear(); location.reload(); }
window.onload=()=>{
  let sn=localStorage.getItem('kadamjai_myname'); let sd=localStorage.getItem('kadamjai_mydept');
  if(sn) document.getElementById('name').value=sn;
  if(sd) setTimeout(()=>{document.getElementById('dept').value=sd;},500);
}
</script></body></html>
