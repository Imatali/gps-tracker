<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Катталуу</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{font-family:system-ui;background:#f1f5f9;padding:16px;margin:0}.box{background:#fff;max-width:400px;margin:20px auto;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001}input,select,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:1px solid #ddd;font-size:16px}button{background:#1d4ed8;color:#fff;border:0;font-weight:700;font-size:17px}button:disabled{background:#94a3b8}#status{font-size:13px;margin-top:10px;padding:8px;background:#f8fafc;border-radius:8px}</style>
</head>
<body>
<div class="box">
<h3>📍 Жумушка катталуу</h3>
<input id="name" placeholder="Аты-жөнүңүз (мисалы Асанов А.)">
<select id="deptSel"><option>Бөлүмдөр жүктөлүүдө...</option></select>
<div id="status">📡 GPS күтүлүүдө... Уруксат бериңиз</div>
<button id="btn" onclick="register()">Катталуу</button>
</div>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let departments=[], lat=0, lng=0, hasGPS=false;
let sel=document.getElementById('deptSel');

db.ref('osh/departments').on('value',snap=>{
 let v=snap.val(); if(!v) return;
 departments = Array.isArray(v) ? v.filter(Boolean) : Object.values(v);
 sel.innerHTML='';
 departments.forEach(d=>{
  let o=document.createElement('option');
  o.value=d.id;
  o.textContent=d.name;
  o.dataset.name=d.name;
  sel.appendChild(o);
 });
});

navigator.geolocation.watchPosition(p=>{
 lat=p.coords.latitude; lng=p.coords.longitude; hasGPS=true;
 document.getElementById('status').innerHTML='✅ GPS табылды: '+lat.toFixed(5);
 document.getElementById('btn').disabled=false;
}, e=>{
 document.getElementById('status').innerHTML='❌ GPS жок. Телефондон Локацияны күйгүзүп, браузерге уруксат бериңиз';
},{enableHighAccuracy:true, timeout:10000});

function register(){
 let name=document.getElementById('name').value.trim();
 let depId=sel.value;
 let depName=sel.options[sel.selectedIndex]?.dataset.name || sel.options[sel.selectedIndex]?.textContent;
 if(!name){ alert('Атыңызды жазыңыз'); return; }
 if(!hasGPS){ alert('GPS табылбай жатат, 5 секунд күтө туруңуз'); return; }
 if(!depId){ alert('Бөлүм тандалган жок'); return; }
 
 let id = 'w_'+Date.now()+'_'+Math.floor(Math.random()*1000);
 document.getElementById('btn').innerText='Катталууда...';
 db.ref('osh/workers/'+id).set({
  name:name, bolum:depName, deptId: String(depId),
  lat:lat, lng:lng, inside:true, time:Date.now()
 }).then(()=>{
  alert('✅ '+depName+' бөлүмүнө ийгиликтүү катталдыңыз!');
  document.getElementById('btn').innerText='✅ Катталды';
  setInterval(()=>{ if(lat) db.ref('osh/workers/'+id).update({lat:lat,lng:lng,time:Date.now()}); },15000);
 }).catch(e=>{ alert('Ката: '+e.message); document.getElementById('btn').innerText='Катталуу'; });
}
</script>
</body>
</html>
