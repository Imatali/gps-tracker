<!DOCTYPE html>
<html lang="ky"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Жумушчу ФИНАЛ</title><style>body{font-family:Arial;background:#f0fdf4;padding:12px} .card{background:#fff;padding:16px;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.08);max-width:420px;margin:0 auto} input{padding:14px;border:2px solid #bbf7d0;border-radius:12px;width:100%;font-size:18px;text-align:center;letter-spacing:4px} button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px} .b{background:#16a34a;color:#fff} .r{background:#fee2e2;color:#991b1b}</style></head><body>
<div class="card" id="login"><h2 style="text-align:center">🔐 ПИН киргизиңиз</h2><input id="pin" placeholder="____" maxlength="10"><button class="b" onclick="doLogin()">Кирүү</button><div id="msg" style="color:#dc2626;text-align:center;margin-top:10px;font-size:13px"></div><div style="text-align:center;margin-top:12px;font-size:11px;color:#888">Эскертүү: бекитүү жок, ПИН жазса эле кирет</div></div>
<div class="card" id="work" style="display:none"><div style="display:flex;justify-content:space-between"><div><b id="wname"></b><br><small id="wdept"></small></div><button class="r" style="width:auto;padding:6px 10px" onclick="logout()">Чыгуу</button></div><div style="background:#f0fdf4;border:2px dashed #16a34a;border-radius:12px;padding:14px;text-align:center;margin-top:14px"><div id="status">📍 Даяр</div><div id="coords" style="font-size:12px;color:#666;margin-top:6px"></div><button class="b" id="btnStart" onclick="start()">▶️ Ишти баштоо</button><button class="r" id="btnStop" onclick="stop()" style="display:none">⏹️ Токтотуу</button></div></div>
<script>
function getWorkers(){return JSON.parse(localStorage.getItem('gps_workers')||'[]')}
function find(pin){return getWorkers().find(w=>w.pin===pin)}
function doLogin(){let pin=document.getElementById('pin').value.trim();if(!pin)return;let w=find(pin);if(!w){document.getElementById('msg').innerText='❌ ПИН табылбады. Админкадан кошуңуз: '+pin;return}localStorage.setItem('current_pin',pin);showWork(w)}
function showWork(w){document.getElementById('login').style.display='none';document.getElementById('work').style.display='block';document.getElementById('wname').innerText=w.name;document.getElementById('wdept').innerText=w.dept+' | ПИН:'+w.pin}
function logout(){localStorage.removeItem('current_pin');location.reload()}
let watch=null;
function start(){if(!navigator.geolocation)return alert('GPS жок');document.getElementById('status').innerText='🟢 Иштеп жатат...';document.getElementById('btnStart').style.display='none';document.getElementById('btnStop').style.display='block';watch=navigator.geolocation.watchPosition(p=>{let c=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);document.getElementById('coords').innerText=c+' | ±'+Math.round(p.coords.accuracy)+'м';let pos=JSON.parse(localStorage.getItem('gps_pos')||'{}');pos[localStorage.getItem('current_pin')]={lat:p.coords.latitude,lng:p.coords.longitude,time:Date.now()};localStorage.setItem('gps_pos',JSON.stringify(pos))},e=>{document.getElementById('status').innerText='❌ GPS ката: '+e.message},{enableHighAccuracy:true})}
function stop(){if(watch)navigator.geolocation.clearWatch(watch);document.getElementById('status').innerText='⏸️ Токтоду';document.getElementById('btnStart').style.display='block';document.getElementById('btnStop').style.display='none'}
let cur=localStorage.getItem('current_pin');if(cur){let w=find(cur);if(w)showWork(w)}
</script></body></html>
