<script>
//... Firebase init ошол эле...
function assignToDept(workerId, deptId, workerName){
  // Эски белгилерди толук тазалоо
  const cleanDept = deptId.replace(/[\u200B-\u200D\uFEFF]/g,'').trim().toLowerCase();
  // ALLOWED текшерүү
  const allowedIds = ['admin','buh','gsv1','gsv2','gsv3','kdo','terapia'];
  if(!allowedIds.includes(cleanDept)){ alert('Туура эмес бөлүм!'); return; }

  const ref = firebase.database().ref('osh/workers/'+workerId);
  ref.set({
    name: workerName,
    deptId: cleanDept,
    ts: Date.now()
  });
  // Эски assign/assign_v3 ларды өчүр
  firebase.database().ref('osh/assign/'+workerId).remove();
  firebase.database().ref('osh/assign_v3/'+workerId).remove();
  firebase.database().ref('assign/'+workerId).remove();
  firebase.database().ref('assign_v3/'+workerId).remove();
}
</script>
