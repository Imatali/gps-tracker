<!DOCTYPE html>
<html lang="ky"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Жумушчу v1300 Telegram READY</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-[#f0f9ff] p-3 font-sans">
<div class="max-w-[500px] mx-auto">
<div id="loginBox" class="bg-white p-5 rounded-2xl shadow mt-10">
<h1 class="font-black text-[18px] text-center">👷 Кадамжай ЖДПБ</h1>
<p class="text-center text-[12px] text-gray-500">v1300 TELEGRAM READY • Аймак көзөмөл иштейт</p>
<input id="pinInput" type="number" placeholder="ПИН кодуңуз" class="w-full border-2 rounded-xl px-4 py-3 mt-4 text-center text-[18px] font-bold">
<button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold mt-3">Кирүү →</button>
</div>
<div id="workBox" class="hidden">
<div class="bg-white p-4 rounded-xl shadow">
<div class="flex justify-between items-center"><div><div id="wName" class="font-black text-[16px]"></div><div id="wDept" class="text-[12px] text-gray-500"></div><div id="wPin" class="text-[11px] text-gray-400"></div></div><button onclick="logout()" class="bg-gray-100 px-3 py-1.5 rounded-lg text-[12px]">Чыгуу</button></div>
<div id="statusBox" class="mt-3 p-3 rounded-xl text-center font-bold text-[13px] bg-gray-50 border">📍 GPS күтүлүүдө...</div>
<div id="alertBox" class="hidden mt-2 p-3 rounded-xl bg-red-100 border border-red-300 text-red-800 text-[13px] font-bold text-center">🚨 Сиз жумуш аймагыңыздан чыгып кеттиңиз!<br><span class="text-[11px]">Админге Telegram кетти</span></div>
<div class="grid grid-cols-2 gap-2 mt-3"><div class="bg-blue-50 p-2 rounded-xl text-center"><div class="text-[10px]">КИРДИ</div><div id="tIn" class="font-black">-</div></div><div class="bg-orange-50 p-2 rounded-xl text-center"><div class="text-[10px]">ЧЫКТЫ</div><div id="tOut" class="font-black">-</div></div></div>
<div class="flex gap-2 mt-3"><button onclick="sendIn()" class="flex-1 bg-green-600 text-white py-2.5 rounded-xl font-bold text-[13px]">✅ Келдим</button><button onclick="sendOut()" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl font-bold text-[13px]">🏃 Кеттим</button></div>
<div class="mt-3"><div class="text-[12px] font-bold mb-1">📍 Карта - <span id="areaInfo" class="text-[11px] text-gray-500"></span></div><div id="map" style="height:300px; border-radius:12px; border:2px solid #e5e7eb;"></div><div class="text-[10px] text-gray-500 mt-1">🟢 Ичинде болсоңуз жашыл, 🔴 Сыртта кызыл + Telegram</div></div>
</div>
</div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const BOT_TOKEN = "8872817102:AAH-XGiI_Xua43xG6n-5Aahvb4n2fDRoJvk";
const CHAT_ID = "340097572";
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let myPin='', myName='', myDept='', myDeviceId=localStorage.getItem('deviceId')||'dev_'+Math.random().toString(36).slice(2)+'_'+Date.now();
localStorage.setItem('deviceId', myDeviceId);
let watchId=null, deptGeo=null, map=null, myMarker=null, areaLayer=null, lastAlertTime=0;

function login(){
  let pin=document.getElementById('pinInput').value.trim();
  if(!pin) return alert('ПИН жаз');
  db.ref('osh/pins/'+pin).once('value',s=>{
    let data=s.val();
    if(!data) return alert('❌ ПИН жок');
    if(data.deviceId && data.deviceId!=myDeviceId) return alert('❌ Башка телефонго байланган');
    db.ref('osh/pins/'+pin).update({deviceId:myDeviceId});
    myPin=pin; myName=data.name; myDept=data.bolum;
    localStorage.setItem('myPin',pin);
    showWork();
  });
}
function showWork(){
  document.getElementById('loginBox').classList.add('hidden');
  document.getElementById('workBox').classList.remove('hidden');
  document.getElementById('wName').innerText=myName;
  document.getElementById('wDept').innerText=myDept;
  document.getElementById('wPin').innerText='ПИН: '+myPin;
  map=L.map('map').setView([40.103,71.74],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
  db.ref('osh/deptAreas/'+myDept).once('value',snap=>{
    let geo=snap.val();
    if(geo){
      deptGeo=geo;
      areaLayer=L.geoJSON(geo,{style:{color:'#ff6600',weight:3,fillOpacity:0.15}}).addTo(map);
      map.fitBounds(areaLayer.getBounds(),{padding:[20,20]});
      document.getElementById('areaInfo').innerText='Аймак: '+myDept;
    }
  });
  if(navigator.geolocation){
    watchId=navigator.geolocation.watchPosition(onPos, e=>{ document.getElementById('statusBox').innerText='❌ GPS: '+e.message; }, {enableHighAccuracy:true, maximumAge:3000, timeout:15000});
  }
  let todayStr=new Date().toISOString().slice(0,10);
  db.ref('osh/logs/'+todayStr+'/'+myPin).on('value',s=>{
    let l=s.val()||{};
    document.getElementById('tIn').innerText=l.timeIn||'-';
    document.getElementById('tOut').innerText=l.timeOut||'-';
  });
}
function onPos(pos){
  let lat=pos.coords.latitude, lng=pos.coords.longitude, acc=pos.coords.accuracy;
  if(!myMarker){ myMarker=L.marker([lat,lng]).addTo(map); }else{ myMarker.setLatLng([lat,lng]); }
  db.ref('osh/workers/'+myDeviceId).set({name:myName, pin:myPin, bolum:myDept, lat, lng, accuracy:acc, lastTime:new Date().toLocaleTimeString(), deviceId:myDeviceId});
  if(deptGeo){
    let pt=turf.point([lng,lat]);
    let inside=turf.booleanPointInPolygon(pt, deptGeo);
    if(inside){
      document.getElementById('statusBox').innerHTML='🟢 Аймактын ичиндесиз • '+Math.round(acc)+'м';
      document.getElementById('statusBox').className='mt-3 p-3 rounded-xl text-center font-bold text-[13px] bg-green-50 border border-green-200 text-green-800';
      document.getElementById('alertBox').classList.add('hidden');
      myMarker.setIcon(L.divIcon({html:'<div style="width:16px;height:16px;background:#16a34a;border:3px solid white;border-radius:50%;box-shadow:0 0 6px green"></div>'}));
    }else{
      document.getElementById('statusBox').innerHTML='🔴 Аймактан сырттасыз! • '+Math.round(acc)+'м';
      document.getElementById('statusBox').className='mt-3 p-3 rounded-xl text-center font-bold text-[13px] bg-red-50 border border-red-300 text-red-800';
      document.getElementById('alertBox').classList.remove('hidden');
      myMarker.setIcon(L.divIcon({html:'<div style="width:16px;height:16px;background:#dc2626;border:3px solid white;border-radius:50%;box-shadow:0 0 6px red"></div>'}));
      let now=Date.now();
      if(now-lastAlertTime > 600000){ sendTelegramAlert(lat,lng); lastAlertTime=now; }
      if(navigator.vibrate) navigator.vibrate([500,200,500]);
    }
  }
}
function sendTelegramAlert(lat,lng){
  let text=`🚨 *Аймактан чыгуу!*%0A👤 ${myName}%0A🏢 ${myDept}%0A🔑 ПИН ${myPin}%0A📍 https://maps.google.com/?q=${lat},${lng}%0A⏰ ${new Date().toLocaleString('ky-KG')}%0A%0A_Сиз жумуш аймагыңыздан чыгып кеттиңиз!_`;
  let url=`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&parse_mode=Markdown&text=${text}`;
  fetch(url).then(r=>r.json()).then(j=>{
    db.ref('osh/alerts').push({name:myName, pin:myPin, dept:myDept, lat, lng, time:new Date().toLocaleString(), type:'OUT_OF_ZONE'});
  });
}
function sendIn(){ let now=new Date(); let todayStr=now.toISOString().slice(0,10); let timeStr=now.toLocaleTimeString('ky-KG',{hour:'2-digit',minute:'2-digit'}); db.ref('osh/logs/'+todayStr+'/'+myPin).update({timeIn:timeStr, date:todayStr, late: now.getHours()>9}); alert('✅ '+timeStr); }
function sendOut(){ let now=new Date(); let todayStr=now.toISOString().slice(0,10); let timeStr=now.toLocaleTimeString('ky-KG',{hour:'2-digit',minute:'2-digit'}); db.ref('osh/logs/'+todayStr+'/'+myPin).update({timeOut:timeStr, earlyLeave: now.getHours()<17}); alert('🏃 '+timeStr); }
function logout(){ if(watchId) navigator.geolocation.clearWatch(watchId); localStorage.removeItem('myPin'); location.reload(); }
let savedPin=localStorage.getItem('myPin'); if(savedPin){ document.getElementById('pinInput').value=savedPin; login(); }
</script>
</body></html>
