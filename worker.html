<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Катталуу - ПИН</title>
<style>body{font-family:system-ui;background:#f1f5f9;padding:16px;margin:0}.box{background:#fff;max-width:400px;margin:20px auto;padding:20px;border-radius:16px;box-shadow:0 2px 10px #0001}input,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:1px solid #ddd;font-size:18px}button{background:#1d4ed8;color:#fff;border:0;font-weight:700}button.out{background:#ef4444}button:disabled{background:#94a3b8}#log{font-size:13px;background:#f8fafc;padding:10px;border-radius:8px;margin-top:12px}</style>
</head>
<body>
<div class="box">
<h3 id="title">📍 Жумушка келдим</h3>
<p id="hint" style="font-size:13px;color:#64748b">Админ берген 4 орундуу ПИНди жазыңыз</p>
<input id="pin" type="tel" maxlength="4" placeholder="ПИН: 1234">
<button id="btn" onclick="handleMain()">Кирүү жана катталуу</button>
<div id="log">GPS даяр...</div>
<div id="info"></div>
<button id="outBtn" onclick="leaveWork()" style="display:none" class="out">🚪 Жумуштан кеттим</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let lat=40.105,lng=71.73;
navigator.geolocation.watchPosition(p=>{lat=p.coords.latitude; lng=p.coords.longitude; document.getElementById('log').innerText='GPS даяр: '+lat.toFixed(4);},{},{enableHighAccuracy:true});

let deviceId=localStorage.getItem('deviceId');
if(!deviceId){ deviceId='d_'+Math.random().toString(36).slice(2)+Date.now(); localStorage.setItem('deviceId',deviceId); }

let myPin=localStorage.getItem('myPin');
let myWorkerKey=localStorage.getItem('myWorkerId');
let myName=localStorage.getItem('myName');

function updateUI(){
  if(myPin && myWorkerKey){
    document.getElementById('title').innerText='✅ Жумуштасыз';
    document.getElementById('hint').innerText=myName+' катары катталгансыз';
    document.getElementById('pin').style.display='none';
    document.getElementById('btn').style.display='none';
    document.getElementById('outBtn').style.display='block';
    document.getElementById('info').innerHTML='<div style="background:#dcfce7;padding:12px;border-radius:10px">✅ <b>'+myName+'</b><br>Админ сизди картадан көрүп жатат.<br>Кеткенде астынкы баскычты басыңыз.</div>';
  }
}
updateUI();

function handleMain(){
  let pin=document.getElementById('pin').value.trim();
  if(pin.length!==4){ alert('4 орундуу ПИН'); return; }
  if(myPin && myPin!==pin){ alert('❌ Бул телефон '+myName+' үчүн кулпуланган.'); return; }
  let btn=document.getElementById('btn'); btn.disabled=true; btn.innerText='Текшерүүдө...';
  db.ref('osh/pins/'+pin).once('value').then(s=>{
    let d=s.val(); if(!d) throw new Error('Мындай ПИН жок');
    if(d.deviceId && d.deviceId!==deviceId) throw new Error('Бул ПИН башка телефондо колдонулууда');
    let ref; if(myWorkerKey) ref=db.ref('osh/workers/'+myWorkerKey); else { ref=db.ref('osh/workers').push(); myWorkerKey=ref.key; }
    return ref.set({name:d.name,bolum:d.bolum,deptId:String(d.deptId),lat:lat,lng:lng,inside:true,time:Date.now(),pin:pin,deviceId:deviceId}).then(()=>{
      db.ref('osh/pins/'+pin+'/deviceId').set(deviceId);
      localStorage.setItem('myPin',pin); localStorage.setItem('myWorkerId',myWorkerKey); localStorage.setItem('myName',d.name);
      myPin=pin; myName=d.name; updateUI(); document.getElementById('log').innerText='✅ Катталды';
    });
  }).catch(e=>{ alert(e.message); btn.disabled=false; btn.innerText='Кирүү жана катталуу'; document.getElementById('log').innerText=e.message; });
}

function leaveWork(){
  if(!myWorkerKey) return;
  if(!confirm('Жумуштан кеткениңизди тастыктайсызбы?')) return;
  db.ref('osh/workers/'+myWorkerKey).remove().then(()=>{
    document.getElementById('log').innerText='🚪 Чыгып кеттиңиз. Эртең ушул эле ПИН менен киресиз.';
    document.getElementById('info').innerHTML='<div style="background:#fef3c7;padding:12px;border-radius:10px">🚪 Жумуштан чыктыңыз.<br>Телефон '+myName+' үчүн кулпу бойдон калат.</div>';
    // worker жазуусун өчүрөбүз, бирок ПИН жана телефон кулпусу калат - эртең кайра кире алат
    document.getElementById('outBtn').style.display='none';
    document.getElementById('pin').style.display='block'; document.getElementById('pin').value=myPin;
    document.getElementById('btn').style.display='block'; document.getElementById('btn').innerText='🔄 Кайра жумушка келдим';
    myWorkerKey=null; localStorage.removeItem('myWorkerId'); // erteng kayra push bolot
    setTimeout(()=>{ document.getElementById('title').innerText='📍 Жумушка келдим'; updateUI(); },2000);
  });
}
</script>
</body>
</html>
