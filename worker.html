<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Катталуу - ПИН</title>
<style>body{font-family:system-ui;background:#f1f5f9;padding:16px;margin:0}.box{background:#fff;max-width:400px;margin:20px auto;padding:20px;border-radius:16px;box-shadow:0 2px 10px #0001}input,button{width:100%;padding:14px;margin-top:12px;border-radius:10px;border:1px solid #ddd;font-size:18px;letter-spacing:2px}button{background:#1d4ed8;color:#fff;border:0;font-weight:700}button:disabled{background:#94a3b8}#log{font-size:13px;background:#f8fafc;padding:10px;border-radius:8px;margin-top:12px;white-space:pre-wrap}</style>
</head>
<body>
<div class="box">
<h3>📍 Жумушка келдим</h3>
<p style="font-size:13px;color:#64748b">Админ берген 4 орундуу ПИНди жазыңыз</p>
<input id="pin" type="tel" maxlength="4" placeholder="ПИН: 1234">
<button id="btn" onclick="login()">Кирүү жана катталуу</button>
<div id="log">Даяр...</div>
<div id="info" style="margin-top:12px"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let lat=40.105,lng=71.73;
navigator.geolocation.watchPosition(p=>{lat=p.coords.latitude; lng=p.coords.longitude; document.getElementById('log').innerText='GPS даяр: '+lat.toFixed(4);},e=>{document.getElementById('log').innerText='GPS күтүлүүдө...'}, {enableHighAccuracy:true});

// Туруктуу телефон ID
let deviceId = localStorage.getItem('deviceId');
if(!deviceId){ deviceId='d_'+Math.random().toString(36).slice(2)+Date.now(); localStorage.setItem('deviceId',deviceId); }

let myPin = localStorage.getItem('myPin');
let myWorkerKey = localStorage.getItem('myWorkerId');
if(myPin){
  document.getElementById('pin').value=myPin;
  document.getElementById('info').innerHTML='<div style="background:#dcfce7;padding:10px;border-radius:8px;font-size:13px">Бул телефон <b>'+localStorage.getItem('myName')+'</b> үчүн кулпуланган.<br>Башка ПИН жазсаңыз бөгөттөлөт.</div>';
}

function login(){
  let pin=document.getElementById('pin').value.trim();
  if(pin.length!==4){ alert('4 орундуу ПИН жазыңыз'); return; }

  // 1. Бул телефон башка ПИНге кулпуланганбы?
  if(myPin && myPin!==pin){
    alert('❌ Бул телефон '+localStorage.getItem('myName')+' үчүн кулпуланган.\nБашка адамды бул телефондон каттай албайсыз.\nАдмин гана сброс кыла алат.');
    return;
  }

  let btn=document.getElementById('btn'); btn.disabled=true; btn.innerText='Текшерүүдө...';
  document.getElementById('log').innerText='ПИН текшерүүдө: '+pin;

  db.ref('osh/pins/'+pin).once('value').then(snap=>{
    let data=snap.val();
    if(!data){ throw new Error('❌ Мындай ПИН жок. Админден сураңыз.'); }
    // 2. Бул ПИН башка телефондо колдонулганбы?
    if(data.deviceId && data.deviceId!==deviceId){
      throw new Error('❌ Бул ПИН башка телефондо колдонулуп жатат ('+data.name+').\n1 ПИН = 1 телефон.');
    }
    // 3. Баары туура - каттайбыз
    let workerRef;
    if(myWorkerKey){ workerRef=db.ref('osh/workers/'+myWorkerKey); }
    else { workerRef=db.ref('osh/workers').push(); myWorkerKey=workerRef.key; }

    return workerRef.set({
      name:data.name, bolum:data.bolum, deptId:String(data.deptId),
      lat:lat, lng:lng, inside:true, time:Date.now(), pin:pin, deviceId:deviceId
    }).then(()=>{
      // ПИНди телефонго байлоо
      db.ref('osh/pins/'+pin+'/deviceId').set(deviceId);
      db.ref('osh/pins/'+pin+'/lastSeen').set(Date.now());
      localStorage.setItem('myPin',pin);
      localStorage.setItem('myWorkerId',myWorkerKey);
      localStorage.setItem('myName',data.name);
      myPin=pin;
      document.getElementById('log').innerText='✅ '+data.name+' катталды!';
      document.getElementById('info').innerHTML='<div style="background:#dcfce7;padding:12px;border-radius:10px">✅ <b>'+data.name+'</b><br>'+data.bolum+'<br>Катталды. Эми бул телефон сизге кулпуланды.</div>';
      btn.innerText='✅ Катталды';
      btn.disabled=false;
    });
  }).catch(e=>{
    document.getElementById('log').innerText=e.message;
    btn.disabled=false; btn.innerText='Кирүү жана катталуу';
    alert(e.message);
  });
}
</script>
</body>
</html>
