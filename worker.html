<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Катталуу - Кадамжай ЖДПБ</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{font-family:system-ui;background:#f1f5f9;margin:0;padding:16px}.box{background:#fff;max-width:400px;margin:20px auto;padding:20px;border-radius:12px;box-shadow:0 2px 8px #0001}input,select,button{width:100%;padding:12px;margin-top:10px;border-radius:8px;border:1px solid #ddd;font-size:16px}button{background:#1d4ed8;color:#fff;border:0;font-weight:700}</style>
</head>
<body>
<div class="box">
<h3>📍 Жумушка катталуу</h3>
<input id="name" placeholder="Аты-жөнүңүз (мисалы Асанов)">
<select id="deptSel"></select>
<div id="status" style="font-size:13px;margin-top:8px;color:#64748b">GPS күтүлүүдө...</div>
<button onclick="register()">Катталуу жана ишти баштоо</button>
</div>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();

// АДМИНДЕ КОШУЛГАН БАРДЫК БӨЛҮМДҮ ОКУЙТ
let departments = JSON.parse(localStorage.getItem('departments')||'null') || [
{name:"Администрация"},{name:"Бухгалтерия"},{name:"КДО"},{name:"Терапия"},
{name:"ГСВ №1"},{name:"ГСВ №2"},{name:"ГСВ №3"},{name:"ГСВ №7"},
];
let sel=document.getElementById('deptSel');
function loadDepts(){
 sel.innerHTML='';
 departments.forEach(d=>{
  let o=document.createElement('option'); o.value=d.name; o.text=d.name; sel.appendChild(o);
 });
 // URL да ?dept=ГСВ №9 болсо ошону танда
 let urlDept = new URLSearchParams(location.search).get('dept');
 if(urlDept) sel.value=urlDept;
}
loadDepts();

let lat=0,lng=0;
navigator.geolocation.watchPosition(p=>{
 lat=p.coords.latitude; lng=p.coords.longitude;
 document.getElementById('status').innerText='✅ GPS табылды: '+lat.toFixed(4)+', '+lng.toFixed(4);
}, e=>{document.getElementById('status').innerText='❌ GPS уруксат бериңиз';}, {enableHighAccuracy:true});

function register(){
 let name=document.getElementById('name').value.trim();
 let bolum=document.getElementById('deptSel').value;
 if(!name) return alert('Атыңызды жазыңыз');
 if(!lat) return alert('GPS табылбай жатат, уруксат бериңиз');
 let id=btoa(name+Date.now()).replace(/=/g,'');
 db.ref('osh/workers/'+id).set({
  name:name, bolum:bolum, deptId: departments.find(d=>d.name==bolum)?.id||0,
  lat:lat, lng:lng, inside:true, time:Date.now()
 }).then(()=>{
  alert('✅ '+bolum+' бөлүмүнө катталдыңыз!');
  // GPS тиричилик
  setInterval(()=>{ if(lat) db.ref('osh/workers/'+id).update({lat:lat,lng:lng,time:Date.now()}); }, 10000);
 });
}
</script>
</body>
</html>
