<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Аймак чийүү</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/><link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"/><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script><script src="https://cdn.tailwindcss.com"></script></head><body class="p-2 bg-[#f8fafc] font-sans"><div class="bg-white p-3 rounded-xl shadow mb-2 flex justify-between items-center"><div><a id="back" href="admin.html" class="text-blue-600 text-sm">← Артка</a><h1 id="title" class="font-bold text-[16px]">📐 Аймак чийүү</h1><p class="text-[11px] text-gray-500">Бул бөлүм үчүн өзүнчө аймак чийилет</p></div><button onclick="save()" class="bg-green-600 text-white px-5 py-2 rounded-lg font-bold">💾 Сактоо</button></div><div id="map" style="height:80vh" class="rounded-xl border bg-white"></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
const dept=new URLSearchParams(location.search).get('d')||new URLSearchParams(location.search).get('dept')||'Администрация';
document.getElementById('title').innerText='📐 '+dept+' аймагы';document.getElementById('back').href='dept.html?d='+encodeURIComponent(dept)+'&v=1011';
let map=L.map('map').setView([40.128,71.726],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let drawn=new L.FeatureGroup();map.addLayer(drawn);let ctrl=new L.Control.Draw({edit:{featureGroup:drawn},draw:{polygon:true,circle:true,rectangle:true,marker:false,polyline:false,circlemarker:false}});map.addControl(ctrl);
map.on(L.Draw.Event.CREATED,e=>{drawn.clearLayers();drawn.addLayer(e.layer)});
// ушул бөлүмдүн мурунку аймагын жүктөө
db.ref('osh/settings/geofences/'+dept).once('value',s=>{let v=s.val();if(!v)return;if(v.polygon)L.polygon(v.polygon,{color:'green'}).addTo(drawn);else if(v.center)L.circle([v.center.lat,v.center.lng],{radius:v.radius}).addTo(drawn)});
function save(){let l=null;drawn.eachLayer(x=>l=x);if(!l)return alert('Адегенде чий!');let data={};if(l instanceof L.Polygon||l instanceof L.Rectangle)data.polygon=l.getLatLngs()[0].map(p=>[p.lat,p.lng]);else if(l instanceof L.Circle){data.center={lat:l.getLatLng().lat,lng:l.getLatLng().lng};data.radius=l.getRadius()}db.ref('osh/settings/geofences/'+dept).set(data).then(()=>{alert(dept+' үчүн сакталды!');location.href='dept.html?d='+encodeURIComponent(dept)+'&v=1011'})}
</script></body></html>
