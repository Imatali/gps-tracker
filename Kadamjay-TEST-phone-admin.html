<!doctype html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадамжай TEST — телефонду ырастоо</title><style>body{font:16px system-ui;background:#f2f5fa;padding:20px;color:#172033}main{max-width:480px;margin:30px auto;background:#fff;padding:24px;border-radius:16px}input,button{width:100%;box-sizing:border-box;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #bbb;font:inherit}button{background:#205c9d;color:#fff;border:0;cursor:pointer}button:disabled{opacity:.55}#result{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f9;padding:12px;border-radius:8px}small{color:#526070}</style></head><body><main><h2>TEST — телефон байланышы</h2><p>Бул панель <b>gps-tracker-test</b> үчүн гана. PIN жана каттоо тарыхы өзгөртүлбөйт.</p><label>Администратор ачкычы<input id="key" type="password" autocomplete="off" placeholder="ADMIN_API_KEY"></label><label>Кызматкердин 4 орундуу TEST PIN коду<input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></label><button id="status">Байланыштын абалын көрүү</button><button id="reset">Телефонду кайра байлоого уруксат берүү</button><p id="result" role="status">Алгач байланыштын абалын текшериңиз.</p><small>Ачкыч жана PIN браузерде сакталбайт. Бул баракты GitHub Pages'тагы imatali.github.io доменинен ачыңыз. file:// аркылуу ачканда CORS тоскоол болушу мүмкүн.</small></main><script>
const base='https://gps-tracker-test.umataly.workers.dev';const $=id=>document.getElementById(id);let lastPin=null;
async function request(path,method='GET',body){const key=$('key').value.trim(),pin=$('pin').value.trim();if(key.length<16)throw Error('ADMIN_API_KEY киргизиңиз');if(!/^\d{4}$/.test(pin))throw Error('4 орундуу TEST PIN киргизиңиз');const r=await fetch(base+path,{method,headers:{'X-Admin-Key':key,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});let data;try{data=await r.json()}catch{throw Error('Сервер JSON жооп берген жок: HTTP '+r.status)}if(!r.ok)throw Error('HTTP '+r.status+': '+(data.error||'белгисиз ката'));return data}
$('status').onclick=async()=>{try{$('result').textContent='Текшерилүүдө...';const pin=$('pin').value.trim();const d=await request('/device-binding-status-test?pin='+encodeURIComponent(pin));lastPin=pin;$('result').textContent='Кызматкер: '+(d.name||'—')+'\nD1 катталган: '+(d.registeredInD1?'Ооба':'Жок')+'\nТелефон: '+d.deviceStatus+'\nЭскертүү: '+(d.note||'жок')}catch(e){lastPin=null;$('result').textContent=e.message}};
$('reset').onclick=async()=>{const pin=$('pin').value.trim();if(pin!==lastPin){$('result').textContent='Алгач ушул PIN үчүн «Байланыштын абалын көрүү» баскычын басыңыз.';return}if(!confirm('Дал ушул TEST кызматкердин телефон байланышын бошотуп, эски сессияларын токтотууга уруксат бересизби?'))return;const btn=$('reset');btn.disabled=true;try{const d=await request('/device-reset-test','POST',{pin,confirm:'RESET_DEVICE'});$('result').textContent=d.success?'TEST телефон байланышы бошотулду. Эми кызматкер ошол эле PIN менен телефондон кирсин.':'Жооп түшүнүксүз';lastPin=null}catch(e){$('result').textContent=e.message}finally{btn.disabled=false}};
</script></body></html>
