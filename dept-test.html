<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кадамжай ЖДПБ — ТЕСТТИК БӨЛҮМ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f1f5f9;color:#172033}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px;background:#fff;box-shadow:0 2px 6px #0001}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.orange{background:#f97316;color:#fff}.green{background:#16a34a;color:#fff}.red{background:#dc2626;color:#fff}.dark{background:#1f2937;color:#fff}.main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:10px;padding:10px}.card{background:#fff;border-radius:12px;padding:12px;min-width:0}.worker{padding:10px;border:1px solid #e2e8f0;border-radius:9px;margin-top:8px;background:#f8fafc}.muted{font-size:12px;color:#64748b}#map{height:75vh;border-radius:10px}#msg{font-size:12px;margin-top:8px;padding:8px;background:#dbeafe;border-radius:8px}#status{font-size:12px;color:#64748b;margin-top:8px}@media(max-width:700px){.main{grid-template-columns:1fr}#map{height:50vh}}
#authGate{position:fixed;inset:0;z-index:10000;background:#f1f5f9;display:flex;align-items:center;justify-content:center;padding:16px}#authBox{width:min(430px,100%);background:white;border-radius:16px;padding:24px;box-shadow:0 8px 24px #0002}#authBox input{width:100%;padding:13px;margin:7px 0;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}#authBox button{width:100%;padding:12px;margin-top:8px}#authError{font-size:13px;color:#b91c1c;min-height:22px;overflow-wrap:anywhere}#authUser{font-size:12px;color:#475569;margin-top:5px}
</style>
</head>
<body>
<div id="authGate"><div id="authBox"><h2>🔒 Администратордун кирүүсү</h2><p id="authInfo">Firebase текшерилүүдө...</p><form id="authForm" hidden><input id="authEmail" type="email" autocomplete="username" placeholder="Электрондук почта" required><input id="authPassword" type="password" autocomplete="current-password" placeholder="Сырсөз" required><button class="btn green" type="submit">Кирүү</button></form><p id="authError" role="alert"></p><button class="btn dark" id="authReturn" type="button">← Админ барагына кайтуу</button></div></div>
<div class="head"><div><strong id="dName">Бөлүм</strong><div class="muted">Firebase боюнча бөлүм • v1107 (аймактарды оңдоо)</div></div><div><select id="areaType" class="btn dark">
  <option value="work">🟦 Жумуш аймагы</option>
  <option value="registration">🟩 Каттоочу аймак</option>
  <option value="home">🟥 Үй аймагы (PIN)</option>
</select> <button class="btn orange" id="drawBtn">📐 Чийүүнү баштоо</button> <button class="btn dark" id="finishBtn" disabled>✅ Чийүүнү бүтүрүү</button> <button class="btn dark" id="undoBtn" disabled>↶ Акыркы чекит</button> <button class="btn green" id="saveBtn">💾 Сактоо</button> <button class="btn red" id="clearBtn">🗑️ Өчүр</button> <button class="btn dark" id="backBtn">← Админ</button> <button class="btn dark" id="logoutBtn">Чыгуу</button></div></div>
<div class="main"><div class="card"><strong>👥 <span id="dLabel"></span> — <span id="wCnt">0</span> кызматкер</strong><div id="status">Firebase'ден жүктөлүүдө...</div><div id="wList"></div></div><div class="card"><div id="map"></div><div id="msg">Карта жүктөлүүдө...</div></div></div>
<script>
'use strict';
const params = new URLSearchParams(location.search);
const deptId = params.get('d');
const title = document.getElementById('dName');
const label = document.getElementById('dLabel');
const status = document.getElementById('status');
const count = document.getElementById('wCnt');
const workerList = document.getElementById('wList');
const msg = document.getElementById('msg');
const areaTypeSelect = document.getElementById('areaType');
let selectedAreaType = 'work';
let unsavedAreaChanges = false;

areaTypeSelect.addEventListener('change', function() {
  if (drawing) {
    areaTypeSelect.value = selectedAreaType;
    alert('Адегенде чийүүнү бүтүрүңүз же токтотуңуз');
    return;
  }

if (unsavedAreaChanges) {
  areaTypeSelect.value = selectedAreaType;
  alert('⚠️ Адегенде чийилген аймакты Firebaseге сактаңыз.');
  return;
}
  
  selectedAreaType = areaTypeSelect.value;
  updateAreaVisibility();
  msg.textContent = selectedAreaType === 'home' ? 'Үй аймагы: кызматкерди тандаңыз. Эски туура эмес аймактарды сактабаңыз.' : 'Аймак режими алмаштырылды.';
});
const normalize = value => String(value == null ? '' : value).normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase();
if (!deptId) { title.textContent='Бөлүм көрсөтүлгөн жок'; status.textContent='admin.html аркылуу бөлүмдү тандаңыз (d параметри жок).'; }
else { title.textContent=deptId; label.textContent=deptId; }
const storageKey = 'gps_test_area_' + deptId;
// Бөлүмдүн аталышы Firebase ачкычына коопсуз айландырылат.
const areaPath = 'test/deptAreas/byName/' + encodeURIComponent(deptId || '');
const registrationAreaPath = 'test/registrationAreas/byName/' + encodeURIComponent(deptId || '');
const ADMIN_UID = 'vfP722NnRdRuvIO9wo9EIGBD1HG2';
const firebaseConfig = {
  apiKey: "AIzaSyD8Q91LRES_kA7BR0wtuG9rKVxbVwgCBHs",
  authDomain: "gps-tracker-kadamjay-test.firebaseapp.com",
  databaseURL: "https://gps-tracker-kadamjay-test-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "gps-tracker-kadamjay-test",
  storageBucket: "gps-tracker-kadamjay-test.firebasestorage.app",
  messagingSenderId: "915651621107",
  appId: "1:915651621107:web:2eccd5fb1a1fad73914786"
};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db=firebase.database();
const auth=firebase.auth();
let adminAuthorized=false;
let dataListening=false;
function requireAdmin(){
  if(!adminAuthorized || !auth.currentUser || auth.currentUser.uid!==ADMIN_UID){
    throw new Error('Администратордун уруксаты талап кылынат');
  }
}
const authGate=document.getElementById('authGate');
const authInfo=document.getElementById('authInfo');
const authForm=document.getElementById('authForm');
const authError=document.getElementById('authError');
document.getElementById('authReturn').onclick=()=>{
  alert('Бул тесттик барак. Негизги администратор барагына өтүүгө болбойт.');
};
document.getElementById('logoutBtn').onclick=()=>auth.signOut();
authForm.onsubmit=async e=>{
  e.preventDefault();
  authError.textContent='';
  const submit=authForm.querySelector('button[type=submit]');
  submit.disabled=true;
  try{
    await auth.signInWithEmailAndPassword(document.getElementById('authEmail').value.trim(),document.getElementById('authPassword').value);
    document.getElementById('authPassword').value='';
  }catch(err){authError.textContent='Кирүү катасы: '+err.message;}
  finally{submit.disabled=false;}
};
auth.onAuthStateChanged(user=>{
  adminAuthorized=!!user && user.uid===ADMIN_UID;
  if(adminAuthorized){
    authError.textContent='';
    authGate.style.display='none';
    if(!dataListening){dataListening=true;startDataListeners();}
    setTimeout(()=>map.invalidateSize(),100);
  }else{
    authGate.style.display='flex';
    authForm.hidden=false;
    authInfo.textContent=user?'Бул аккаунтка администратор укугу берилген эмес.':'Администратор аккаунтуңуз менен кириңиз.';
    if(user && user.uid!==ADMIN_UID) auth.signOut().catch(()=>{});
    
if (dataListening) {
  db.ref('test/pins').off();
  db.ref('test/attendance').off();
  db.ref(areaPath).off();
  db.ref(registrationAreaPath).off();
  dataListening = false;
}
workerMarkers.clearLayers();
clearRegistrationAreas();
unsavedAreaChanges = false;

workerList.replaceChildren();
replaceAreas([]);
  }
},err=>{authGate.style.display='flex';authForm.hidden=false;authInfo.textContent='Firebase текшерүү катасы';authError.textContent=err.message;});
let remoteLoaded = false;
let remoteAreas = null;
const map = L.map('map',{doubleClickZoom:false}).setView([40.114,71.74],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let areas=[];
let registrationAreas = [];
  

map.createPane('workerPane');
map.getPane('workerPane').style.zIndex = 650;

const workerMarkers = L.layerGroup().addTo(map);


function showWorkerLocations(data) {
  workerMarkers.clearLayers();

  const latest = {};

  Object.values(data || {}).forEach(item => {
    if (!item || !item.pin || !item.time) return;

    const pin = String(item.pin);
    const lat = Number(item.lat);
    const lng = Number(item.lng);

    if (item.lat == null || item.lng == null ||
        !Number.isFinite(lat) || !Number.isFinite(lng) ||
        Math.abs(lat) > 90 || Math.abs(lng) > 180) return;

    if (!latest[pin] || Number(item.time) > Number(latest[pin].time)) {
      latest[pin] = item;
    }
  });

  Object.values(latest).forEach(item => {
    if (normalize(item.bolum) !== normalize(deptId)) return;

    const isWorking = item.type === 'in';
    const color = isWorking ? '#16a34a' : '#dc2626';
    const time = new Date(Number(item.time)).toLocaleString('ky-KG');

    const marker = L.circleMarker(
      [Number(item.lat), Number(item.lng)],
      {
        pane: 'workerPane',
        radius: 9,
        color: '#ffffff',
        weight: 2,
        fillColor: color,
        fillOpacity: 1
      }
    ).addTo(workerMarkers);

    const popup = document.createElement('div');
    const name = document.createElement('strong');
    name.textContent = item.name || 'Кызматкер';

    const details = document.createElement('div');
    details.textContent =
      (isWorking ? '🟢 Жумушта' : '🔴 Жумуштан кеткен') +
      ' | Акыркы GPS: ' + time;

    popup.append(name, details);
    marker.bindPopup(popup);
  });
}

let tempPoly=null;
let drawing=false;
let points=[];
const finishBtn=document.getElementById('finishBtn');
const undoBtn=document.getElementById('undoBtn');
const drawBtn=document.getElementById('drawBtn');
function safeText(node,value){node.textContent=String(value==null?'':value);}
let selectedWorkerPin = null;
  
  function addWorker(name,pin,department){
  const item=document.createElement('div');item.className='worker';
  const main=document.createElement('strong');safeText(main,name||'Аты жок');
  const sub=document.createElement('div');sub.className='muted';safeText(sub,'PIN: '+pin+' • '+department);
  item.onclick = () => {
  if (drawing || unsavedAreaChanges) {
    alert('Адегенде чийүүнү бүтүрүп, өзгөртүүнү сактаңыз.');
    return;
  }
  selectedWorkerPin = String(pin);
  loadHomeArea(selectedWorkerPin);
  document.querySelectorAll('.worker').forEach(el => {
  el.style.background = '';
  el.style.border = '';
});
item.style.background = '#dcfce7';
item.style.border = '2px solid #16a34a';
};
  item.append(main,sub);workerList.appendChild(item);
}
function showWorkers(data){
  workerList.replaceChildren();
  const entries=Object.entries(data||{});
  const list=entries.filter(([pin,w])=>{
    if(!w||typeof w!=='object')return false;
    // Админ түзгөн PIN жазуусунда bolum бөлүмдүн негизги аталышы.
    const name=w.bolum||w.dept||w.department||'';
    return normalize(name)===normalize(deptId);
  });
  count.textContent=String(list.length);
  status.textContent='Firebase: '+entries.length+' PIN текшерилди';
  if(!list.length){const empty=document.createElement('div');empty.className='muted';empty.style.marginTop='12px';empty.textContent='Бул бөлүмдө кызматкер табылган жок. Админ панелинен PIN жазуусунун бөлүмүн текшериңиз.';workerList.appendChild(empty);}
  list.forEach(([pin,w])=>addWorker(w.name,pin,w.bolum||w.dept||''));
}

function startDataListeners() {
  try {
    requireAdmin();

    if (!deptId) return;

    db.ref('test/pins').on('value', snap => {
      showWorkers(snap.val());
    }, error => {
      status.textContent = 'Firebase PIN окуу катасы: ' + error.message;
    });

    db.ref('test/attendance').on('value', snap => {
      showWorkerLocations(snap.val());
    }, error => {
      status.textContent = 'GPS маалыматтарын окуу катасы: ' + error.message;
    });

    loadAreas();
    loadRegistrationAreas();

  } catch (error) {
    status.textContent = 'Firebase баштоо катасы: ' + error.message;
  }
}

function savedAreas(){
 try{const raw=JSON.parse(localStorage.getItem(storageKey)||'[]');if(!Array.isArray(raw)||!raw.length)return[];return typeof raw[0]?.[0]==='number'?[raw]:raw;}catch{return[];}
}
function addRegistrationPolygon(coords) {
  if (!Array.isArray(coords) || coords.length < 3) return;

  const polygon = L.polygon(coords, {
    color: '#16a34a',
    fillColor: '#86efac',
    fillOpacity: 0.35,
    weight: 3
  }).addTo(map);

  registrationAreas.push(polygon);
  updateAreaVisibility();
}
function clearRegistrationAreas() {
  registrationAreas.forEach(polygon => map.removeLayer(polygon));
  registrationAreas = [];
}
  
function replaceRegistrationAreas(data) {
  clearRegistrationAreas();

  if (!Array.isArray(data)) return;

  data.forEach(addRegistrationPolygon);
}
  
function addPolygon(coords){if(!Array.isArray(coords)||coords.length<3)return;const p=L.polygon(coords,{color:'#ff6a00',fillColor:'#ff9a3d',fillOpacity:.35,weight:3}).addTo(map);areas.push(p);updateAreaVisibility();}
function replaceAreas(data){
  areas.forEach(p=>map.removeLayer(p));areas=[];
  (Array.isArray(data)?data:[]).forEach(addPolygon);
  if(areas.length && selectedAreaType === 'work')map.fitBounds(L.featureGroup(areas).getBounds().pad(.2));
  updateAreaVisibility();
}
let homeAreas = [];

function clearHomeAreas() {
  homeAreas.forEach(polygon => map.removeLayer(polygon));
  homeAreas = [];
}
  function addHomePolygon(coords) {
  if (!Array.isArray(coords) || coords.length < 3) return;

  const polygon = L.polygon(coords, {
    color: '#2563eb',
    fillColor: '#93c5fd',
    fillOpacity: 0.35,
    weight: 3
  }).addTo(map);

  homeAreas.push(polygon);
  updateAreaVisibility();
}
// Режимдер бири-биринин полигондорун көрсөтпөйт.
function updateAreaVisibility() {
  const sets = [
    [areas, selectedAreaType === 'work'],
    [registrationAreas, selectedAreaType === 'registration'],
    [homeAreas, selectedAreaType === 'home']
  ];
  sets.forEach(([polygons, visible]) => polygons.forEach(p => {
    if (visible && !map.hasLayer(p)) p.addTo(map);
    if (!visible && map.hasLayer(p)) map.removeLayer(p);
  }));
}
let homeLoadSequence = 0;
function loadHomeArea(pin) {
  const sequence = ++homeLoadSequence;
  clearHomeAreas();
  if (!pin) return;
  db.ref('test/homeAreas/byPin/' + pin).once('value')
    .then(snap => {
      if (sequence !== homeLoadSequence || selectedWorkerPin !== pin) return;
      const data = snap.val();
      if (!data || !Array.isArray(data.polygons)) {
        msg.textContent = 'Бул кызматкерге үй аймагы сакталган эмес.';
        return;
      }
      data.polygons.forEach(addHomePolygon);
      updateAreaVisibility();
      if (selectedAreaType === 'home' && homeAreas.length) {
        map.fitBounds(L.featureGroup(homeAreas).getBounds().pad(.2));
      }
      msg.textContent = 'PIN ' + pin + ': ' + homeAreas.length + ' үй аймагы жүктөлдү. Тууралыгын текшериңиз.';
    })
    .catch(error => {
      msg.textContent = 'Үй аймагын окуу катасы: ' + error.message;
      console.error(error);
    });
}
function loadRegistrationAreas() {
  if (!deptId) return;

  db.ref(registrationAreaPath).on('value', snap => {
    const value = snap.val();
    const polygons = value && Array.isArray(value.polygons)
      ? value.polygons
      : [];

  replaceRegistrationAreas(polygons);
    
  if (polygons.length > 0) {
  msg.textContent = '✅ Каттоочу аймак Firebaseден жүктөлдү';
}
  }, error => {
    msg.textContent = '❌ Каттоочу аймакты окуу катасы: ' + error.message;
  });
}
  
function loadAreas(){
  if(!deptId)return;
  msg.textContent='Firebase GPS аймагы жүктөлүүдө...';
  db.ref(areaPath).on('value',snap=>{
    const value=snap.val();
    remoteLoaded=true;
    if(value && Array.isArray(value.polygons)){
      remoteAreas=value.polygons;
      if(!drawing && !unsavedAreaChanges){replaceAreas(remoteAreas);msg.textContent='✅ Firebase: '+areas.length+' аймак жүктөлдү';}
    }else{
      remoteAreas=null;
      if(!drawing && !unsavedAreaChanges){replaceAreas(savedAreas());msg.textContent='Firebase\'де аймак жок. Бул браузердеги эски аймак көрсөтүлдү. Firebase\'ге көчүрүү үчүн «Сактоо» басыңыз.';}
    }
  },err=>{msg.textContent='❌ Firebase аймагын окуу катасы: '+err.message;});
}
function updateDrawButtons(){
  finishBtn.disabled=!drawing||points.length<3;
  undoBtn.disabled=!drawing||points.length===0;
  drawBtn.textContent=drawing?'✖ Чийүүнү токтотуу':'📐 Чийүүнү баштоо';
}
function previewPoints(){
    const drawColor = selectedAreaType === 'registration'
    ? '#16a34a'
    : '#f97316';
  
  if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}
  if(points.length===1)tempPoly=L.circleMarker(points[0],{radius:7,color:drawColor}).addTo(map);
  else if(points.length===2)tempPoly=L.polyline(points,{color:drawColor,weight:3,dashArray:'6,6'}).addTo(map);
  else if(points.length>=3)tempPoly=L.polygon(points,{color:drawColor,weight:3,dashArray:'6,6',fillOpacity:.2}).addTo(map);
  updateDrawButtons();
}
function stopDrawing(){
  map.off('click',addPoint);
  drawing=false;
  map.doubleClickZoom.enable();
  updateDrawButtons();
}
function addPoint(e){
  if(!drawing)return;
  points.push([e.latlng.lat,e.latlng.lng]);
  previewPoints();
  msg.textContent=points.length+' чекит коюлду. Кеминде 3 чекиттен кийин «Чийүүнү бүтүрүү» басыңыз.';
}
function finishDrawing(){
  if(points.length<3){msg.textContent='⚠️ Кеминде 3 чекит коюңуз';return;}
  const completed=points.map(p=>p.slice());
  stopDrawing();
  if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}
  points=[];
  if (selectedAreaType === 'registration') {
  addRegistrationPolygon(completed);
} else if (selectedAreaType === 'work') {
  addPolygon(completed);
  } else if (selectedAreaType === 'home') {
  addHomePolygon(completed);
} else {
  msg.textContent = '⚠️ Үй аймагын чийүү азырынча даяр эмес.';
  return;
}
  updateAreaVisibility();
  unsavedAreaChanges = true;
  msg.textContent='✅ Аймак чийилди ('+completed.length+' чекит). Эми «Сактоо» басыңыз.';
}
drawBtn.onclick=()=>{
  if (selectedAreaType === 'home' && !selectedWorkerPin) {
  alert('Алгач сол жактан кызматкерди тандаңыз');
  return;
}
  if(drawing){stopDrawing();if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}points=[];msg.textContent='Чийүү токтотулду';return;}
  if (selectedAreaType === 'home' && homeAreas.length) {
    if (!confirm('Эски үй аймагын картадан убактылуу алып, жаңы аймакты чийесизби? Firebaseдеги эски маалымат «Сактоо» басылганча өзгөрбөйт.')) return;
    ++homeLoadSequence;
    clearHomeAreas();
  }
  drawing=true;points=[];
  if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}
  map.doubleClickZoom.disable();
  map.on('click',addPoint);
  updateDrawButtons();
  msg.textContent='📍 Картанын үстүнөн чекиттерди бирден басыңыз (телефондо да болот). Анан «Чийүүнү бүтүрүү» басыңыз.';
  setTimeout(()=>map.invalidateSize(),100);
};
finishBtn.onclick=finishDrawing;
undoBtn.onclick=()=>{
  if(!drawing||!points.length)return;
  points.pop();previewPoints();
  msg.textContent=points.length+' чекит калды. Чийүүнү улантыңыз.';
};
setTimeout(()=>map.invalidateSize(),250);
window.addEventListener('resize',()=>map.invalidateSize());
async function saveRegistrationAreas() {
  requireAdmin();

  if (!deptId) throw new Error('Бөлүм тандалган эмес');
  if (!registrationAreas.length) {
    throw new Error('Каттоочу аймак чийиле элек');
  }

  const polygons = registrationAreas.map(polygon =>
    polygon.getLatLngs()[0].map(point => [point.lat, point.lng])
  );

  await db.ref(registrationAreaPath).set({
    department: deptId,
    polygons: polygons,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}
document.getElementById('saveBtn').onclick=async()=>{

}
  try{requireAdmin();}catch(e){alert(e.message);return;}

async function deleteRegistrationAreas() {
  requireAdmin();
  
  if (unsavedAreaChanges) {
  throw new Error('Адегенде чийилген аймакты сактаңыз.');
}

  if (!deptId) {
    throw new Error('Бөлүм тандалган эмес');
  }

  if (!confirm('Каттоочу аймакты Firebaseден өчүрөсүзбү?')) {
    return false;
  }

  await db.ref(registrationAreaPath).remove();
  clearRegistrationAreas();
  unsavedAreaChanges = false;

   return true;
}
document.getElementById('clearBtn').onclick=async()=>{
  if (selectedAreaType === 'registration') {
    try {
      if (drawing) {
        throw new Error('Адегенде чийүүнү бүтүрүңүз');
      }

      const deleted = await deleteRegistrationAreas();

      if (deleted) {
        msg.textContent = '✅ Каттоочу аймак өчүрүлдү';
      }
    } catch (error) {
      alert('Өчүрүү катасы: ' + error.message);
    }
    return;
  }
  
  if (selectedAreaType !== 'work') {
    alert('Бул аймакты өчүрүү функциясы азырынча даяр эмес');
    return;
  }
  
  try{requireAdmin();}catch(e){alert(e.message);return;}
  if(!deptId || !remoteLoaded)return;
  if(!confirm(deptId+' бөлүмүнүн Firebase GPS аймактарын өчүрөсүзбү?'))return;
  try{
    await db.ref(areaPath).remove();
    unsavedAreaChanges = false;
    localStorage.removeItem(storageKey);
    stopDrawing();if(tempPoly){map.removeLayer(tempPoly);tempPoly=null;}points=[];
    replaceAreas([]);msg.textContent="Аймак Firebaseден өчүрүлдү";
  }catch(e){alert('Өчүрүү катасы: '+e.message);}
};
document.getElementById('backBtn').onclick=()=>{
  alert('Бул тесттик барак. Негизги администратор барагына өтүүгө болбойт.');
};
