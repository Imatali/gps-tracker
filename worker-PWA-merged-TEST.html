<!DOCTYPE html>

<head>

<style>
body {
  font-family:system-ui,-apple-system,sans-serif;
  background:#f1f5f9;
  padding:16px;
  margin:0;
}
.box {
  background:#fff;
  max-width:400px;
  margin:20px auto;
  padding:20px;
  border-radius:16px;
  box-shadow:0 4px 20px #0001;
}
input,button {
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:18px;
  box-sizing:border-box;
}
button {
  background:#1d4ed8;
  color:#fff;
  border:0;
  font-weight:700;
  cursor:pointer;
}
button:disabled {background:#94a3b8}
button.out {
  background:#ef4444;
  display:none;
  margin-top:16px;
}

  font-size:13px;
  background:#f8fafc;
  padding:10px;
  border-radius:8px;
  margin-top:12px;
  min-height:20px;
  word-break:break-word;
}
.small-link {
  display:block;
  text-align:center;
  margin-top:20px;
  font-size:13px;
  color:#64748b;
  text-decoration:underline;
  cursor:pointer;
}
</style>
</head>

<body>
<div class="box">
  <h3 id="title">📍 Жумушка келдим</h3>

  <input id="pin" type="tel" inputmode="numeric"
         maxlength="4" placeholder="4 орундуу ПИН">

  <button id="btn" onclick="login()">Кирүү</button>
  <button id="previewBtn" type="button" onclick="previewSchedule()" style="background:#e0e7ff;color:#1e40af">📅 Графикти көрүү</button>

  <div id="log">📅 Графикти GPSсиз көрүүгө болот.</div>
  <div id="info"></div>
  <div id="scheduleInfo" style="font-size:13px;background:#eff6ff;border-radius:8px;padding:10px;margin-top:12px;display:none"></div>

  <button id="lunchOutBtn" type="button" onclick="markLunch('lunch_out')" style="display:none;background:#f59e0b;color:#111827">🍽️ Обедке кеттим</button>
  <button id="lunchInBtn" type="button" onclick="markLunch('lunch_in')" style="display:none;background:#0d9488">✅ Обедтен келдим</button>

  <button id="outBtn" class="out" onclick="leaveWork()">
    🚪 Жумуштан кеттим
  </button>

   <div style="font-size:10px;color:#aaa;margin-top:12px;text-align:center">
    v444 GPS жаңыртуу + Firebase + 7 күндүк график
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>
const logEl = document.getElementById('log');
const btn = document.getElementById('btn');
const pinInput = document.getElementById('pin');
const outBtn = document.getElementById('outBtn');
const lunchOutBtn = document.getElementById('lunchOutBtn');
const lunchInBtn = document.getElementById('lunchInBtn');
const previewBtn = document.getElementById('previewBtn');

const log = text => {
  logEl.innerText = text;
};

let db;
let authReady = null;
let gpsReady = false;
let gpsLat = null;
let gpsLng = null;
let busy = false;

try {
  // Өзүнчө Firebase app админ панелинин кирүү сессиясын бузбайт.
  const workerApp = firebase.apps.find(app => app.name === 'worker-v1105') || firebase.initializeApp({
    apiKey: "AIzaSyBQWMBefKYWiPQnJVHcANZLqkz2Vnt2VME",
    authDomain: "gps-tracker-osh.firebaseapp.com",
    databaseURL: "https://gps-tracker-osh-default-rtdb.firebaseio.com",
    projectId: "gps-tracker-osh",
    appId: "1:588347508048:web:1b6fd5417ff8f4e5f29855"
  }, 'worker-v1105');

  db = workerApp.database();
  const workerAuth = workerApp.auth();
  // Жумушчу сессиясы ушул өтмөктө гана сакталат.
  authReady = workerAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
    .then(() => workerAuth.currentUser || workerAuth.signInAnonymously())
    .then(user => {
      if (!user) throw new Error('Анонимдүү кирүү ишке ашкан жок');
      return user;
    });
  authReady.catch(error => {
    log('❌ Firebase Authentication: ' + error.message + '. Firebase Console → Authentication → Sign-in method → Anonymous функциясын күйгүзүңүз.');
  });

  let deviceId = localStorage.getItem('deviceId');

  if (!deviceId) {
    deviceId = 'd_' +
      (crypto.randomUUID
        ? crypto.randomUUID()
        : Math.random().toString(36).slice(2) +
          Date.now().toString(36));

    localStorage.setItem('deviceId', deviceId);
  }

  // GPS: ойдон чыгарылган координаталар колдонулбайт
  function getGPS() {
    return new Promise((resolve, reject) => {
      if (!navigator.geolocation) {
        reject(new Error('Бул түзмөк GPS колдобойт'));
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          if (!Number.isFinite(lat) ||
              !Number.isFinite(lng)) {
            reject(new Error('GPS координаталары туура эмес'));
            return;
          }

          gpsLat = lat;
          gpsLng = lng;
          gpsReady = true;

          resolve({
            lat: lat,
            lng: lng,
            accuracy: position.coords.accuracy
          });
        },
        error => {
          gpsReady = false;

          const messages = {
            1: 'GPS уруксатын бериңиз',
            2: 'GPS жайгашкан жерди аныктай алган жок',
            3: 'GPS күтүү убактысы бүттү'
          };

          reject(new Error(
            messages[error.code] || 'GPS катасы'
          ));
        },
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 0
        }
      );
    });
  }

  // GPS барак ачылганда алынбайт: графикти көрүү GPS уруксатын талап кылбайт.
  log('📅 Графикти GPSсиз көрүүгө болот. Жумушка катталууда GPS текшерилет.');

  // График көрүү үчүн да, каттоо окуясына колдонулган графикти тиркөө үчүн да окулат.
  const scheduleFallback = {start:'08:30',lunchS:'12:00',lunchE:'13:00',end:'17:30',workDays:[1,2,3,4,5]};
  let scheduleRequest = 0;
  function localDateKey(date = new Date()) {
    const n = v => String(v).padStart(2,'0');
    return date.getFullYear()+'-'+n(date.getMonth()+1)+'-'+n(date.getDate());
  }
  function cleanSchedule(value) {
    if (!value || !Array.isArray(value.workDays)) return null;
    if (!['start','lunchS','lunchE','end'].every(k => /^\d{2}:\d{2}$/.test(value[k]||''))) return null;
    return value;
  }
  // Каттоо учурунда ошол күнгө колдонулган графиктин көчүрмөсүн сактайбыз.
  async function resolveAttendanceSchedule(pin, pinData, when) {
    const dateKey = localDateKey(new Date(when));
    const deptKey = encodeURIComponent(pinData.bolum || '');
    const [workerSnap, deptSnap, defaultSnap] = await Promise.all([
      db.ref('osh/workerSchedules/' + pin).get(),
      db.ref('osh/deptSchedules/' + deptKey).get(),
      db.ref('osh/settings/defaultSchedule').get()
    ]);
    const config = workerSnap.val() || {};
    const temporary = config.temporary;
    let schedule = null, source = '';
    if (temporary && temporary.from <= dateKey && dateKey <= temporary.to && cleanSchedule(temporary.schedule)) {
      schedule = temporary.schedule; source = 'Убактылуу';
    } else if (config.mode === 'custom' && cleanSchedule(config.permanent)) {
      schedule = config.permanent; source = 'Жеке туруктуу';
    } else if ((config.mode === 'legacy' || !config.mode) && cleanSchedule(pinData.schedule)) {
      schedule = pinData.schedule; source = 'Мурдагы PIN';
    }
    if (!schedule && cleanSchedule(deptSnap.val())) {
      schedule = deptSnap.val(); source = 'Бөлүм';
    }
    if (!schedule) {
      schedule = cleanSchedule(defaultSnap.val()) || scheduleFallback;
      source = 'Жалпы';
    }
    return {schedule: {
      start:schedule.start, lunchS:schedule.lunchS, lunchE:schedule.lunchE,
      end:schedule.end, workDays:schedule.workDays.map(Number)
    }, source, date:dateKey};
  }

  async function showTodaySchedule(pin, preview = false) {
    const box = document.getElementById('scheduleInfo');
    const request = ++scheduleRequest;
    if (!pin) { box.style.display='none'; return; }
    box.style.display='block';
    box.textContent='📅 7 күндүк график жүктөлүүдө...';
    try {
      await authReady;
      const pinSnap = await db.ref('osh/pins/'+pin).get();
      const pinData = pinSnap.val();
      if (!pinData) throw new Error('PIN маалыматы табылган жок');
      const deptKey = encodeURIComponent(pinData.bolum||'');
      const [workerSnap, deptSnap, defaultSnap] = await Promise.all([
        db.ref('osh/workerSchedules/'+pin).get(),
        db.ref('osh/deptSchedules/'+deptKey).get(),
        db.ref('osh/settings/defaultSchedule').get()
      ]);
      if (request !== scheduleRequest || (!preview && (localStorage.getItem('myPin') !== pin || !localStorage.getItem('myWorkerId')))) return;
      const config = workerSnap.val() || {};
      const temporary = config.temporary;
      const today = new Date();
      const weekdays = ['Жек','Дүй','Шей','Шар','Бей','Жума','Ише'];
      const lines = [];
      for (let i = 0; i < 7; i++) {
        const day = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
        const dateKey = localDateKey(day);
        let schedule = null;
        let source = '';
        if (temporary && temporary.from <= dateKey && dateKey <= temporary.to && cleanSchedule(temporary.schedule)) {
          schedule = temporary.schedule;
          source = 'Убактылуу график';
        } else if (config.mode === 'custom' && cleanSchedule(config.permanent)) {
          schedule = config.permanent;
          source = 'Жеке туруктуу график';
        } else if ((config.mode === 'legacy' || !config.mode) && cleanSchedule(pinData.schedule)) {
          schedule = pinData.schedule;
          source = 'Мурдагы PIN графиги';
        }
        if (!schedule && cleanSchedule(deptSnap.val())) {
          schedule = deptSnap.val();
          source = 'Бөлүмдүн графиги';
        }
        if (!schedule) {
          schedule = cleanSchedule(defaultSnap.val()) || scheduleFallback;
          source = 'Жалпы график';
        }
        const dateLabel = String(day.getDate()).padStart(2, '0') + '.' + String(day.getMonth()+1).padStart(2, '0');
        const label = `${dateLabel} (${weekdays[day.getDay()]})`;
        const hours = schedule.workDays.includes(day.getDay())
          ? `${schedule.start}–${schedule.lunchS}, ${schedule.lunchE}–${schedule.end}`
          : 'Эс алуу күнү';
        lines.push(`${label}: ${hours} — ${source}`);
      }
      if (request !== scheduleRequest) return;
      box.style.whiteSpace = 'pre-line';
      box.textContent = '📅 Алдыдагы 7 күндүн графиги\n' + lines.join('\n');
    } catch (error) {
      if (request === scheduleRequest) box.textContent='⚠️ Графикти жүктөө мүмкүн болгон жок. Каттоо функциясы өзгөргөн жок.';
    }
  }

  // Маалымат көрүү гана: attendance/workers жазылбайт жана deviceId байланыштырылбайт.
  window.previewSchedule = async function() {
    if (busy) return;
    const pin = pinInput.value.trim();
    if (!/^\d{4}$/.test(pin)) {
      alert('Графикти көрүү үчүн 4 орундуу ПИН жазыңыз');
      return;
    }
    const oldPin = localStorage.getItem('myPin');
    if (oldPin && oldPin !== pin) {
      alert('Бул түзмөктө башка PIN сакталган. Администраторго кайрылыңыз.');
      return;
    }
    previewBtn.disabled = true;
    try {
      await showTodaySchedule(pin, true);
    } finally {
      previewBtn.disabled = false;
    }
  };

  // GPS heartbeat: каттоо тарыхынан өзүнчө, тиркеме активдүү болгондо гана.
  const GPS_POLL_MS = 60 * 1000;
  let gpsPollTimer = null;
  let gpsPollBusy = false;
  let gpsPollWorkerId = null;

  async function sendGpsHeartbeat() {
    if (gpsPollBusy || busy || document.hidden || !navigator.onLine) return;
    const pin = localStorage.getItem('myPin');
    const workerId = localStorage.getItem('myWorkerId');
    if (!pin || !workerId || workerId !== gpsPollWorkerId) return;
    gpsPollBusy = true;
    try {
      await authReady;
      const pos = await getGPS();
      if (localStorage.getItem('myWorkerId') !== workerId) return;
      // Так эмес координатаны «жаңы ишенимдүү GPS» катары сактабайбыз.
      if (!Number.isFinite(Number(pos.accuracy)) || pos.accuracy > MAX_GPS_ACCURACY || pos.accuracy <= 0) return;
      const ref = db.ref('osh/gpsStatus/byPin/' + pin);
      await ref.set({
        workerId, lat: pos.lat, lng: pos.lng,
        accuracy: pos.accuracy,
        updatedAt: firebase.database.ServerValue.TIMESTAMP
      });
    } catch (err) {
      // GPS өчкөндө акыркы ийгиликтүү текшерүүнүн убактысын жаңыртпайбыз.
      console.warn('GPS жаңыртуу ишке ашкан жок:', err.message);
    } finally {
      gpsPollBusy = false;
    }
  }

  function stopGpsHeartbeat() {
    if (gpsPollTimer !== null) clearInterval(gpsPollTimer);
    gpsPollTimer = null;
    gpsPollWorkerId = null;
  }
  function startGpsHeartbeat() {
    const workerId = localStorage.getItem('myWorkerId');
    if (!workerId) { stopGpsHeartbeat(); return; }
    if (gpsPollWorkerId === workerId && gpsPollTimer !== null) return;
    stopGpsHeartbeat();
    gpsPollWorkerId = workerId;
    gpsPollTimer = setInterval(sendGpsHeartbeat, GPS_POLL_MS);
    // Каттоодон же тиркеме кайра ачылгандан кийин GPSти жаңыртуу.
    setTimeout(sendGpsHeartbeat, 0);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && gpsPollWorkerId) sendGpsHeartbeat();
  });
  window.addEventListener('online', () => {
    if (gpsPollWorkerId) sendGpsHeartbeat();
  });

  function refreshUI() {
    const myPin = localStorage.getItem('myPin');
    const myWorkerId = localStorage.getItem('myWorkerId');
    const myName = localStorage.getItem('myName');

    if (myPin && myWorkerId) {
      document.getElementById('title').innerText =
        '✅ Жумуштасыз: ' + (myName || '') +
        ' (' + myPin + ')';

      pinInput.style.display = 'none';
      btn.style.display = 'none';
      outBtn.style.display = 'block';
      refreshLunchButtons(myPin, myWorkerId);
      previewBtn.style.display = 'none';
      showTodaySchedule(myPin);
      startGpsHeartbeat();
    } else {
      stopGpsHeartbeat();
      document.getElementById('title').innerText =
        '📍 Жумушка келдим';

      pinInput.style.display = 'block';
      btn.style.display = 'block';
      btn.disabled = false;
      btn.innerText = 'Кирүү';
      outBtn.style.display = 'none';
      lunchOutBtn.style.display = 'none';
      lunchInBtn.style.display = 'none';
      previewBtn.style.display = 'block';
      ++scheduleRequest;
      document.getElementById('scheduleInfo').style.display = 'none';

      const savedPin = localStorage.getItem('myPin');

      if (savedPin) {
        pinInput.value = savedPin;
      }
    }
  }

  function setBusy(value) {
    busy = value;
    btn.disabled = value;
    outBtn.disabled = value;
    previewBtn.disabled = value;
    lunchOutBtn.disabled = value;
    lunchInBtn.disabled = value;

    if (value) {
      btn.innerText = 'Күтүңүз...';
    } else {
      btn.innerText = 'Кирүү';
    }
  }

  
  // GPS аймагын текшерүү: dept.html v1103 менен бирдей Firebase жолу.
  const MAX_GPS_ACCURACY = 100; // метр

  function pointOnSegment(x, y, ax, ay, bx, by) {
    const cross = (x-ax)*(by-ay)-(y-ay)*(bx-ax);
    if (Math.abs(cross) > 1e-10) return false;
    return x >= Math.min(ax,bx)-1e-10 && x <= Math.max(ax,bx)+1e-10 &&
           y >= Math.min(ay,by)-1e-10 && y <= Math.max(ay,by)+1e-10;
  }

  function pointInPolygon(lat, lng, ring) {
    if (!Array.isArray(ring) || ring.length < 3) return false;
    let inside = false;
    for (let i=0, j=ring.length-1; i<ring.length; j=i++) {
      const a=ring[i], b=ring[j];
      if (!Array.isArray(a) || !Array.isArray(b) || a.length<2 || b.length<2) return false;
      const ay=Number(a[0]), ax=Number(a[1]), by=Number(b[0]), bx=Number(b[1]);
      if (![ay,ax,by,bx].every(Number.isFinite)) return false;
      if (pointOnSegment(lng,lat,ax,ay,bx,by)) return true;
      if ((ay>lat)!==(by>lat) && lng < (bx-ax)*(lat-ay)/(by-ay)+ax) inside=!inside;
    }
    return inside;
  }

  async function verifyWorkArea(department, position) {
    if (!department || !department.trim()) throw new Error('PIN үчүн бөлүм көрсөтүлгөн эмес. Админге кайрылыңыз.');
    const accuracy = Number(position.accuracy);
    if (!Number.isFinite(accuracy) || accuracy <= 0 || accuracy > MAX_GPS_ACCURACY) {
      throw new Error('GPS тактыгы жетишсиз (' + Math.round(accuracy || 0) + ' м). Ачык жерге чыгып, кайра аракет кылыңыз.');
    }
    const path = 'osh/deptAreas/byName/' + encodeURIComponent(department);
    const snapshot = await db.ref(path).get();
    const saved = snapshot.val();
    if (!saved || !Array.isArray(saved.polygons) || !saved.polygons.length) {
      throw new Error('«' + department + '» бөлүмүнүн GPS аймагы Firebase\'ге сакталган эмес. Админге кайрылыңыз.');
    }
    const allowed = saved.polygons.some(ring => pointInPolygon(position.lat,position.lng,ring));
    if (!allowed) throw new Error('⛔ Сиз «' + department + '» бөлүмүнүн белгиленген GPS аймагынан тышкары турасыз. Катталууга уруксат жок.');
    return path;
  }

  window.login = async function() {
    if (busy) return;

    const pin = pinInput.value.trim();

    if (!/^\d{4}$/.test(pin)) {
      alert('4 орундуу ПИН жазыңыз');
      return;
    }

    setBusy(true);

    try {
      await authReady;
      // Катталуунун алдында GPS кайра алынат
      log('📡 GPS текшерилүүдө...');
      const position = await getGPS();

      const oldPin = localStorage.getItem('myPin');

      if (oldPin && oldPin !== pin) {
  throw new Error(
    'Бул телефондо башка PIN сакталган. PINди алмаштыруу үчүн администраторго кайрылыңыз.'
  );
}

log('🔎 ПИН текшерилүүдө...');

      const pinSnap = await db.ref('osh/pins/' + pin).get();
      const data = pinSnap.val();

      if (!data) {
        throw new Error('Бул ПИН табылган жок');
      }

      if (data.deviceId && data.deviceId !== deviceId) {
        throw new Error(
          'Бул ПИН башка телефонго байланышкан: ' +
          (data.name || '')
        );
      }

      if (!data.name) {
        throw new Error('Кызматкердин аты көрсөтүлгөн эмес');
      }

      // PIN бөлүмүнүн сакталган GPS аймагына туура келерин текшеребиз.
      // Ийгиликсиз болсо Firebase'ге катталуу жазылбайт.
      log('🗺️ Бөлүмдүн GPS аймагы текшерилүүдө...');
      const areaPath = await verifyWorkArea(data.bolum || '', position);

      const workerKey =
        db.ref('osh/workers').push().key;

      const now = Date.now();
      // График окулбаса каттоону жалган график менен жазбайбыз.
      const attendanceSchedule = await resolveAttendanceSchedule(pin, data, now);

      const workerData = {
        name: data.name,
        bolum: data.bolum || '',
        deptId: String(data.deptId || 1),
        lat: position.lat,
        lng: position.lng,
        inside: true,
        time: now,
        pin: pin,
        deviceId: deviceId,
        gpsAccuracy: position.accuracy,
        areaCheck: 'inside',
        areaPath: areaPath
      };

      // Кызматкердин учурдагы абалы сакталат
      await db.ref('osh/workers/' + workerKey)
        .set(workerData);

      // PIN жана телефон байланышы сакталат
      await db.ref('osh/pins/' + pin).update({
        deviceId: deviceId,
        lastSeen: now
      });

      // Келүү тарыхына өзүнчө окуя кошулат
      await db.ref('osh/attendance').push().set({
        type: 'in',
        workerId: workerKey,
        name: data.name,
        pin: pin,
        bolum: data.bolum || '',
        deptId: String(data.deptId || 1),
        time: now,
        lat: position.lat,
        lng: position.lng,
        gpsAccuracy: position.accuracy,
        areaCheck: 'inside',
        areaPath: areaPath,
        deviceId: deviceId,
        appliedSchedule: attendanceSchedule.schedule,
        scheduleSource: attendanceSchedule.source,
        scheduleDate: attendanceSchedule.date
      });

      localStorage.setItem('myPin', pin);
      localStorage.setItem('myWorkerId', workerKey);
      localStorage.setItem('myName', data.name);

      log('✅ Жумушка келүү катталды: ' + data.name);
      refreshUI();

    } catch (error) {
      log('❌ ' + error.message);
      alert(error.message);
    } finally {
      setBusy(false);
    }
  };

  // Lunch events are recorded separately. Existing in/out events and working-hour calculations stay unchanged.
  let lunchRefreshSerial = 0;
  const kgDay = ms => new Date(Number(ms) + 6*3600000).toISOString().slice(0,10);
  const currentKgDay = () => kgDay(Date.now());
  const lunchEventToday = e => e && Number.isFinite(Number(e.time)) && kgDay(e.time) === currentKgDay();
  async function refreshLunchButtons(pin, workerId) {
    const serial = ++lunchRefreshSerial;
    lunchOutBtn.style.display = 'none';
    lunchInBtn.style.display = 'none';
    if (!pin || !workerId) return;
    try {
      await authReady;
      // Read a bounded set of recent events without requiring a Firebase workerId index.
      const snap = await db.ref('osh/attendance').limitToLast(500).get();
      if (serial !== lunchRefreshSerial || localStorage.getItem('myWorkerId') !== workerId) return;
      let last = null;
      snap.forEach(child => {
        const e = child.val();
        if (!e || e.workerId !== workerId || !lunchEventToday(e) || (e.type !== 'lunch_out' && e.type !== 'lunch_in')) return;
        if (!last || Number(e.time) > Number(last.time)) last = e;
      });
      const onLunch = last && last.type === 'lunch_out';
      lunchOutBtn.style.display = onLunch ? 'none' : 'block';
      lunchInBtn.style.display = onLunch ? 'block' : 'none';
    } catch (err) {
      log('⚠️ Түшкү тыныгуунун абалы окулган жок: ' + err.message);
    }
  }

  window.markLunch = async function(type) {
    if (busy || !['lunch_out', 'lunch_in'].includes(type)) return;
    const pin = localStorage.getItem('myPin');
    const workerId = localStorage.getItem('myWorkerId');
    if (!pin || !workerId) { alert('Адегенде жумушка келүүнү каттаңыз'); return; }
    setBusy(true);
    try {
      await authReady;
      const workerSnap = await db.ref('osh/workers/' + workerId).get();
      const worker = workerSnap.val();
      if (!worker || worker.inside === false) throw new Error('Активдүү жумуш каттоосу табылган жок');
      // Re-check last event to avoid duplicate taps and stale buttons.
      const snap = await db.ref('osh/attendance').limitToLast(500).get();
      let last = null;
      snap.forEach(child => {
        const e = child.val();
        if (e && e.workerId === workerId && lunchEventToday(e) && (e.type === 'lunch_out' || e.type === 'lunch_in') && (!last || Number(e.time) > Number(last.time))) last = e;
      });
      if (type === 'lunch_out' && last && last.type === 'lunch_out') throw new Error('Түшкү тыныгуу мурда эле башталган');
      if (type === 'lunch_in' && (!last || last.type !== 'lunch_out')) throw new Error('Түшкү тыныгуу башталган эмес');
      const position = await getGPS();
      await db.ref('osh/attendance').push().set({
        type, workerId, pin, name: worker.name || localStorage.getItem('myName') || '',
        bolum: worker.bolum || '', deptId: String(worker.deptId || 1),
        time: Date.now(), deviceId, lat: position.lat, lng: position.lng,
        gpsAccuracy: position.accuracy
      });
      log(type === 'lunch_out' ? '🍽️ Обедке кетүү катталды' : '✅ Обедтен келүү катталды');
      await refreshLunchButtons(pin, workerId);
    } catch (err) {
      log('❌ ' + err.message);
      alert(err.message);
    } finally { setBusy(false); }
  };

  window.leaveWork = async function() {
    if (busy) return;

    const pin = localStorage.getItem('myPin');
    const workerId = localStorage.getItem('myWorkerId');

    if (!pin || !workerId) {
      alert('Активдүү каттоо табылган жок');
      return;
    }

    if (!confirm('Жумуштан кетүүнү белгилейсизби?')) {
      return;
    }

    setBusy(true);
    log('📡 Жумуштан кетүү катталууда...');

    try {
      await authReady;
      const workerRef = db.ref('osh/workers/' + workerId);
      const snap = await workerRef.get();
      const worker = snap.val();

      if (!worker) {
        throw new Error('Кызматкердин маалыматы табылган жок');
      }

      let position = null;

      try {
        position = await getGPS();
      } catch (gpsError) {
        // GPS жок болсо, жалган координата жазылбайт.
        log('⚠️ GPS алынган жок. Кетүү убактысы сакталууда...');
      }

      const now = Date.now();

      const updates = {
        inside: false,
        leaveTime: now
      };

      if (position) {
        updates.lat = position.lat;
        updates.lng = position.lng;
        updates.gpsAccuracy = position.accuracy;
      }

      // Жазуу өчүрүлбөйт, статусу өзгөрөт
      await workerRef.update(updates);

      const event = {
        type: 'out',
        workerId: workerId,
        name: worker.name || localStorage.getItem('myName') || '',
        pin: pin,
        bolum: worker.bolum || '',
        deptId: String(worker.deptId || 1),
        time: now,
        deviceId: deviceId
      };

      if (position) {
        event.lat = position.lat;
        event.lng = position.lng;
        event.gpsAccuracy = position.accuracy;
      }

      // Кетүү тарыхына окуя кошулат
      await db.ref('osh/attendance').push().set(event);

      ++lunchRefreshSerial;
      lunchOutBtn.style.display = 'none';
      lunchInBtn.style.display = 'none';
      stopGpsHeartbeat();
      // Эски heartbeat башка каттоого тиешелүү болуп калбашы үчүн тазалайбыз.
      await db.ref('osh/gpsStatus/byPin/' + pin).remove().catch(err => console.warn('GPS абалын тазалоо:', err.message));
      localStorage.removeItem('myWorkerId');

      log('🚪 Жумуштан кетүү катталды');
      refreshUI();

    } catch (error) {
      log('❌ ' + error.message);
      alert('Ката: ' + error.message);
    } finally {
      setBusy(false);
    }
  };

  refreshUI();

} catch (error) {
  log('Firebase катасы: ' + error.message);
}
</script>
<script>
// PWA каттоо: PIN, GPS жана Firebase логикасынан өзүнчө.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .catch(error => console.warn('PWA каттоо ишке ашкан жок:', error));
  });
}
</script>
</body>
