<!doctype html>
<html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кадамжай ЖДПБ — уруксат арыздары (TEST v1119)</title>
<style>body{font-family:system-ui,sans-serif;background:#f1f5f9;margin:0;padding:18px;color:#0f172a}.card{max-width:520px;margin:16px auto;background:white;border-radius:14px;padding:20px;box-shadow:0 3px 14px #0001}label{display:block;margin:14px 0 5px}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;border:1px solid #cbd5e1;font:inherit}button{background:#1d4ed8;color:white;border:0;margin-top:14px;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:wait}textarea{min-height:84px}#message,#listMessage{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}.muted{color:#475569;font-size:13px}.notice{background:#eff6ff;padding:12px;border-radius:9px} .status{padding:9px 0;border-bottom:1px solid #e2e8f0}</style></head>
<body><main class="card"><h2>📝 Уруксат арыздары</h2><p class="notice"><strong>TEST v1119</strong> — бул баракча тесттик Worker'ге гана кайрылат. Жумушка келүү/кетүү жана негизги Firebase каттоосу бул версияда өчүрүлгөн.</p><label for="pin">Кызматкердин 4 орундуу PIN коду</label><input id="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="4 орундуу PIN"><p class="muted">Бул тесттик версия мурдагыдай эле тесттик түзмөк идентификаторун колдонот. Чыныгы кызматкерлер үчүн колдонбоңуз.</p></main>
<section class="card"><h3>Арыз жөнөтүү</h3><label for="from">Кетүү убактысы</label><input id="from" type="datetime-local"><label for="to">Кайтуу убактысы</label><input id="to" type="datetime-local"><label for="reason">Себеби</label><textarea id="reason" maxlength="1000" placeholder="Себебин жазыңыз"></textarea><button id="send" type="button">📤 Арыз жөнөтүү</button><div id="message" role="status" aria-live="polite"></div></section>
<section class="card"><h3>Менин арыздарым</h3><button id="list" type="button">📋 Статустарды көрүү</button><div id="listMessage" role="status" aria-live="polite"></div><div id="items"></div></section>
<script>
'use strict';
const API='https://gps-tracker-test.umataly.workers.dev';
// v1118 тесттик серверине шайкештиги үчүн өзгөртүлгөн жок.
const TEST_DEVICE_ID='TEST-PHONE-001';
const el=id=>document.getElementById(id);
function pinValue(){const pin=el('pin').value.trim();if(!/^\d{4}$/.test(pin))throw new Error('4 орундуу PIN киргизиңиз');return pin;}
function errorMessage(e){if(e instanceof TypeError)return 'Тармак же CORS катасы (Failed to fetch). Баракчаны HTTPS аркылуу ачыңыз жана тесттик Worker CORS жөндөөлөрүн текшериңиз.';return e.message||'Белгисиз ката';}
async function post(path,payload){const response=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let data;try{data=await response.json();}catch{throw new Error('Сервер JSON эмес жооп кайтарды (HTTP '+response.status+')');}if(!response.ok)throw new Error((data.error||'Сервер катасы')+' (HTTP '+response.status+')');return data;}
function busy(id,on){el(id).disabled=on;}
el('send').addEventListener('click',async()=>{if(el('send').disabled)return;busy('send',true);el('message').textContent='Жөнөтүлүүдө...';try{const pin=pinValue(),from=el('from').value,to=el('to').value,reason=el('reason').value.trim();if(!from||!to||!reason)throw new Error('Бардык талааларды толтуруңуз');if(new Date(to)<=new Date(from))throw new Error('Кайтуу убактысы кетүү убактысынан кийин болушу керек');const result=await post('/permission-request',{pin,deviceId:TEST_DEVICE_ID,from,to,reason});el('message').textContent='✅ Арыз тесттик серверге жөнөтүлдү'+(result.id?' (№'+result.id+')':'')+'.';}catch(e){el('message').textContent='❌ '+errorMessage(e);}finally{busy('send',false);}});
el('list').addEventListener('click',async()=>{if(el('list').disabled)return;busy('list',true);el('items').replaceChildren();el('listMessage').textContent='Жүктөлүүдө...';try{const pin=pinValue();const data=await post('/my-permissions',{pin,deviceId:TEST_DEVICE_ID});if(!data.success||!Array.isArray(data.requests))throw new Error(data.error||'Жооп форматы туура эмес');el('listMessage').textContent=data.requests.length?'Арыздар: '+data.requests.length:'Арыздар табылган жок';const names={pending:'Каралууда',approved:'Бекитилди',rejected:'Четке кагылды'};for(const r of data.requests){const div=document.createElement('div');div.className='status';div.textContent='Арыз №'+r.id+' — '+(names[r.status]||r.status);el('items').append(div);}}catch(e){el('listMessage').textContent='❌ '+errorMessage(e);}finally{busy('list',false);}});
</script></body></html>
