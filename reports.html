<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Отчет v1100 IDEAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="icon" href="icon.png?v=1100">
<style>@media print{.no-print{display:none} }</style>
</head>
<body class="bg-[#f8fafc] p-3 font-sans">
<div class="max-w-[1400px] mx-auto">
<div class="bg-white p-4 rounded-xl shadow-sm mb-3 no-print">
<div class="flex justify-between items-center flex-wrap gap-2">
<div class="flex items-center gap-2"><img src="logo.png?v=1100" class="w-8 h-8 rounded-full border"><h1 class="font-black text-[15px]">📊 Отчет - Кадамжай ЖДПБ <span class="bg-purple-100 text-purple-700 text-[10px] px-2 py-0.5 rounded-full ml-1">v1100 IDEAL</span></h1></div>
<div class="flex gap-2">
<a href="admin.html?v=1100" class="bg-gray-100 border px-3 py-2 rounded-lg text-[13px]">← Админ</a>
<a href="worker.html?v=1100" target="_blank" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-[13px]">👷 Жумушчу</a>
</div>
</div>
<div class="grid grid-cols-1 md:grid-cols-4 gap-2 mt-4">
<input id="dateInput" type="date" class="border p-2.5 rounded-lg text-[13px]">
<select id="deptFilter" class="border p-2.5 rounded-lg text-[13px]"><option value="">Бардык бөлүмдөр</option></select>
<input id="searchInput" oninput="renderTable()" placeholder="🔍 Аты / ПИН издөө..." class="border p-2.5 rounded-lg text-[13px] bg-yellow-50">
<div class="flex gap-2"><button onclick="loadData()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg text-[13px] font-bold flex-1">🔄 Жүктөө</button><button onclick="exportExcel()" class="bg-green-600 text-white px-3 py-2.5 rounded-lg text-[13px]">📥 Excel</button><button onclick="window.print()" class="bg-gray-600 text-white px-3 py-2.5 rounded-lg text-[13px]">🖨️ PDF</button></div>
</div>
<div class="grid grid-cols-4 gap-2 mt-3">
<div class="bg-blue-50 border border-blue-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold">БАРДЫГЫ</div><div id="c_all" class="text-[22px] font-black">0</div></div>
<div class="bg-green-50 border border-green-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold">КЕЛДИ</div><div id="c_in" class="text-[22px] font-black text-green-700">0</div></div>
<div class="bg-orange-50 border border-orange-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold">КЕЧИКТИ</div><div id="c_late" class="text-[22px] font-black text-orange-700">0</div></div>
<div class="bg-red-50 border border-red-200 p-2 rounded-xl text-center"><div class="text-[10px] font-bold">КЕЛБЕДИ</div><div id="c_abs" class="text-[22px] font-black text-red-700">0</div></div>
</div>
</div>

<div class="bg-white rounded-xl shadow-sm overflow-hidden">
<div class="p-3 border-b flex justify-between items-center"><h3 class="font-bold text-[13px]">📋 <span id="reportDate">Бүгүн</span> - Отчет</h3><span class="text-[11px] text-gray-500" id="reportInfo"></span></div>
<div class="overflow-auto">
<table class="w-full text-[12px]" id="reportTable">
<thead class="bg-gray-50 text-[11px] sticky top-0"><tr><th class="p-2 text-left">№</th><th class="p-2 text-left">Аты-жөнү</th><th class="p-2">Бөлүм</th><th class="p-2">ПИН</th><th class="p-2">Кирди</th><th class="p-2">Чыкты</th><th class="p-2">Статус</th><th class="p-2">Тел</th></tr></thead>
<tbody id="tbody"><tr><td colspan=8 class="p-6 text-center text-gray-400">Күндү тандап "Жүктөө" басыңыз</td></tr></tbody>
</table>
</div>
</div>
<div class="text-center text-[11px] text-gray-400 mt-3">v1100 IDEAL • reports.html • Кадамжай ЖДПБ</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});
const db=firebase.database();
let depts=JSON.parse(localStorage.getItem('myDepts')||'["Администрация","Бухгалтерия","КДО","Терапия","ГСВ №1","ГСВ №2","ГСВ №3","ГСВ №7"]');
let allPins={}, allLogs={};
document.getElementById('deptFilter').innerHTML='<option value="">Бардык бөлүмдөр</option>'+depts.map(d=>`<option>${d}</option>`).join('');
document.getElementById('dateInput').valueAsDate=new Date();

function loadData(){
  let date=document.getElementById('dateInput').value;
  if(!date){ alert('Күндү танда!'); return; }
  document.getElementById('reportDate').innerText=new Date(date).toLocaleDateString('ky-KG');
  document.getElementById('tbody').innerHTML='<tr><td colspan=8 class="p-6 text-center">⏳ Жүктөлүүдө...</td></tr>';
  Promise.all([db.ref('osh/pins').once('value'), db.ref('osh/logs/'+date).once('value')]).then(([pinsSnap, logsSnap])=>{
    allPins=pinsSnap.val()||{};
    allLogs=logsSnap.val()||{};
    renderTable();
  });
}
function renderTable(){
  let deptF=document.getElementById('deptFilter').value;
  let search=(document.getElementById('searchInput').value||'').toLowerCase();
  let rows=[]; let c_all=0, c_in=0, c_late=0, c_abs=0;
  Object.entries(allPins).forEach(([pin, info])=>{
    if(deptF && info.bolum!==deptF) return;
    if(search &&!(info.name.toLowerCase().includes(search) || pin.includes(search) || info.bolum.toLowerCase().includes(search))) return;
    c_all++;
    let log=allLogs[pin];
    let firstIn=log?.firstIn||'-';
    let lastOut=log?.lastOut||'-';
    let status='❌ Келбеди'; let cls='bg-red-50 text-red-700';
    if(log){
      c_in++;
      if(log.late){ status='🕘 Кечикти'; cls='bg-orange-100 text-orange-800'; c_late++; }
      else if(log.earlyLeave){ status='🏃 Эрте кетти'; cls='bg-blue-100 text-blue-800'; }
      else if(log.lunchEarly || log.lunchLate){ status='🍽️ Обет бузуу'; cls='bg-yellow-100 text-yellow-800'; }
      else { status='✅ Убагында'; cls='bg-green-100 text-green-700'; }
    } else { c_abs++; }
    let phone=info.deviceId?`✅ ${info.deviceId.slice(0,6)}`:'❌';
    rows.push({pin, info, firstIn, lastOut, status, cls, phone});
  });
  document.getElementById('c_all').innerText=c_all;
  document.getElementById('c_in').innerText=c_in;
  document.getElementById('c_late').innerText=c_late;
  document.getElementById('c_abs').innerText=c_abs;
  document.getElementById('reportInfo').innerText=`Табылды: ${rows.length}`;
  let html='';
  rows.forEach((r,i)=>{
    html+=`<tr class="border-t hover:bg-gray-50"><td class="p-2">${i+1}</td><td class="p-2 font-medium">${r.info.name}</td><td class="p-2">${r.info.bolum}</td><td class="p-2 font-bold">${r.pin}</td><td class="p-2">${r.firstIn}</td><td class="p-2">${r.lastOut}</td><td class="p-2"><span class="px-2 py-1 rounded-full text-[11px] font-bold ${r.cls}">${r.status}</span></td><td class="p-2 text-[11px]">${r.phone}</td></tr>`;
  });
  if(rows.length==0) html='<tr><td colspan=8 class="p-6 text-center text-gray-400">Маалымат жок</td></tr>';
  document.getElementById('tbody').innerHTML=html;
}
function exportExcel(){
  let table=document.getElementById('reportTable').outerHTML;
  let blob=new Blob(['<html><head><meta charset="utf-8"></head><body>'+table+'</body></html>'], {type:'application/vnd.ms-excel'});
  let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='otchet_'+document.getElementById('dateInput').value+'_v1100.xls'; a.click();
}
document.getElementById('deptFilter').addEventListener('change', renderTable);
loadData();
</script>
</body>
</html>
