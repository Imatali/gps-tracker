<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчеттор v1020</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f8fafc] p-3 font-sans"><div class="max-w-[1200px] mx-auto"><div class="bg-white p-4 rounded-xl shadow mb-3"><div class="flex justify-between items-center flex-wrap gap-2"><div><a href="admin.html?v=1020" class="text-blue-600 text-sm">← Админка</a><h1 class="font-bold text-[20px]">📊 Отчеттор v1020</h1></div><div class="flex gap-2 items-center"><input id="date" type="date" class="border p-2 rounded-lg text-sm"><button onclick="exportExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-[11px] font-bold">📥 Excel</button><button onclick="exportTabel()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-[11px] font-bold">📊 Табель</button></div></div><div class="flex gap-2 mt-3 flex-wrap"><button onclick="setR('day')" id="r_day" class="bg-gray-100 px-3 py-1.5 rounded-full text-[12px]">Күндүк</button><button onclick="setR('week')" id="r_week" class="bg-gray-100 px-3 py-1.5 rounded-full text-[12px]">Жумалык</button><button onclick="setR('month')" id="r_month" class="bg-black text-white px-3 py-1.5 rounded-full text-[12px]">Айлык</button><select id="deptFilter" onchange="load()" class="border rounded-lg px-2 py-1 text-[12px]"><option value="all">Баардык бөлүм</option></select></div></div><div id="summary" class="grid grid-cols-4 gap-2 mb-3"></div><div id="report" class="space-y-2"></div></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
let mode='month', lastData=[], lastDates=[], allPinsCache={};
document.getElementById('date').valueAsDate=new Date();
function setR(m){mode=m;document.querySelectorAll('[id^=r_]').forEach(b=>b.className='bg-gray-100 px-3 py-1.5 rounded-full text-[12px]');document.getElementById('r_'+m).className='bg-black text-white px-3 py-1.5 rounded-full text-[12px]';load()}
function hmToMin(hm){let [h,m]=hm.split(':').map(Number);return h*60+m}
function minToHM(min){let h=Math.floor(min/60),m=min%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m}
function formatDate(d){return d.toISOString().split('T')[0]}
function getDates(){let base=new Date(document.getElementById('date').value);let dates=[];if(mode=='day')dates=[formatDate(base)];else if(mode=='week'){for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()-base.getDay()+i);dates.push(formatDate(d))}}else if(mode=='month'){let y=base.getFullYear(),m=base.getMonth();let days=new Date(y,m+1,0).getDate();for(let i=1;i<=days;i++){let d=new Date(y,m,i);dates.push(formatDate(d))}}return dates;}
function calcWorkedHours(logs){if(logs.length<2) return 0; logs.sort((a,b)=>a.t-b.t); let total=0, lastIn=null; for(let l of logs){ if(l.inside &&!lastIn) lastIn=l.t; if(!l.inside && lastIn){ total+= (l.t-lastIn); lastIn=null; }} return total/3600000; }
db.ref('osh/pins').once('value',s=>{let v=s.val()||{};let depts=new Set(Object.values(v).map(x=>x.bolum));let sel=document.getElementById('deptFilter');depts.forEach(d=>{let o=document.createElement('option');o.value=d;o.innerText=d;sel.appendChild(o)})})
async function load(){let dept=document.getElementById('deptFilter').value; let pinsSnap=await db.ref('osh/pins').once('value'); let pins=pinsSnap.val()||{}; allPinsCache=pins; let all=Object.entries(pins).filter(([k,v])=>dept=='all'||v.bolum==dept); let dates=getDates(); lastDates=dates; let html=""; lastData=[]; let c1=0,c2=0,c3=0,c4=0; for(let [pin,info] of all){let sched=info.schedule||{start:'08:00',lunchS:'12:00',lunchE:'13:00',end:'17:00'}; let allLogs=[]; for(let d of dates){let ls=await db.ref(`osh/logs/${d}/${pin}`).once('value'); let lv=Object.values(ls.val()||{}); lv.forEach(l=>allLogs.push({...l,date:d}));} allLogs.sort((a,b)=>a.t-b.t); let row={pin,name:info.name,bolum:info.bolum,D:'',E:'',F:'',G:'',H:'',I:''}; if(!allLogs.length){row.H=mode=='day'?dates[0]:'Келген жок'; row.I='0 саат'; html+=`<div class="bg-white p-3 rounded-xl border-l-4 border-l-gray-400"><b>${info.name} #${pin}</b> <span class="text-[11px] text-red-500">Келген жок</span></div>`; c4++; lastData.push(row); continue;} let status=[]; let firstIn=allLogs.find(l=>l.inside); if(firstIn){let ft=new Date(firstIn.t); let mins=ft.getHours()*60+ft.getMinutes(); if(mins>hmToMin(sched.start)+5){row.D=minToHM(mins); status.push(`🔴 ${row.D}`); c1++;}} let lunchOut=allLogs.find(l=>!l.inside && new Date(l.t).getHours()>=11 && new Date(l.t).getHours()<=14); if(lunchOut){let ft=new Date(lunchOut.t); let mins=ft.getHours()*60+ft.getMinutes(); if(mins < hmToMin(sched.lunchS)-5){row.E=minToHM(mins); c2++;} let lunchIn=allLogs.find(l=>l.inside && l.t>lunchOut.t); if(lunchIn){let ft2=new Date(lunchIn.t); let mins2=ft2.getHours()*60+ft2.getMinutes(); if(mins2 > hmToMin(sched.lunchE)+5){row.F=minToHM(mins2); c3++;}}} let lastOut=[...allLogs].reverse().find(l=>!l.inside); if(lastOut){let ft=new Date(lastOut.t); let mins=ft.getHours()*60+ft.getMinutes(); if(mins < hmToMin(sched.end)-15){row.G=minToHM(mins);}} let hours=calcWorkedHours(allLogs); row.I=hours.toFixed(1)+' саат'; lastData.push(row);} document.getElementById('summary').innerHTML=`<div class="bg-red-50 p-2 rounded-xl"><div class="text-[10px]">Кеч</div><b>${c1}</b></div><div class="bg-yellow-50 p-2 rounded-xl"><div class="text-[10px]">Обедке</div><b>${c2}</b></div><div class="bg-orange-50 p-2 rounded-xl"><div class="text-[10px]">Кеч кайтты</div><b>${c3}</b></div><div class="bg-gray-100 p-2 rounded-xl"><div class="text-[10px]">Келбеген</div><b>${c4}</b></div>`; document.getElementById('report').innerHTML='<div class="text-[11px] text-gray-400 text-center">Табель даяр, 📊 Табель баскычын басыңыз</div>';}
function exportExcel(){if(!lastData.length) return alert('Отчет бош'); let table=`<table border="1"><tr style="background:#e2e8f0;font-weight:bold;"><th>PIN</th><th>Аты</th><th>Бөлүм</th><th>Эрте менен кечикти</th><th>Обедке эрте кетти</th><th>Обеттен кеч келди</th><th>Жумуштан эрте кетти</th><th>Жумушка келген жок</th><th>Канча убакыт иштеди</th></tr>`; lastData.forEach(d=>{table+=`<tr><td>${d.pin}</td><td>${d.name}</td><td>${d.bolum}</td><td>${d.D||''}</td><td>${d.E||''}</td><td>${d.F||''}</td><td>${d.G||''}</td><td style="color:red;">${d.H||''}</td><td style="font-weight:bold;">${d.I||''}</td></tr>`;}); table+='</table>'; let blob=new Blob(['\uFEFF<html><head><meta charset="utf-8"></head><body>'+table+'</body></html>'],{type:'application/vnd.ms-excel'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`otchet_${document.getElementById('date').value}_${mode}.xls`; a.click();}
async function exportTabel(){
 if(!lastDates.length) return alert('Алгач отчет жүктөлсүн');
 let dept=document.getElementById('deptFilter').value;
 let pins=Object.entries(allPinsCache).filter(([k,v])=>dept=='all'||v.bolum==dept);
 let baseDate=new Date(document.getElementById('date').value);
 let monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
 let title = `Табель - ${monthNames[baseDate.getMonth()]} ${baseDate.getFullYear()}`;

 // D3 тен баштап числолор: 1,2,3...
 let daysInMonth = lastDates.length;
 let dayNumbers = lastDates.map(d=> new Date(d).getDate());

 let table = `<table border="1">`;
 // 1-строка: Табель + ай
 table += `<tr><td colspan="${3+daysInMonth+2}" style="font-size:14pt;font-weight:bold;text-align:center;">${title}</td></tr>`;
 // 2-строка: бош
 table += `<tr><td colspan="${3+daysInMonth+2}"></td></tr>`;
 // 3-строка: A3,B3,C3 + D3 тен баштап числолор
 table += `<tr style="background:#e2e8f0;font-weight:bold;"><th>A</th><th>B</th><th>C</th>`;
 table += `<th>PIN</th><th>Аты</th><th>Бөлүм</th>`;
 // Эми D3 = 1-чи число, E3 = 2-чи...
 // Талабың боюнча: D3 ячейкасынан баштап числолор, ошондуктан 3 колонкадан кийин
 // Бирок Excelде A=PIn, B=Аты, C=Бөлүм, D=1, E=2...
 // Ошондуктан кайра түзөбүз:
 table = `<table border="1">`;
 table += `<tr><td colspan="${3+daysInMonth+2}" style="font-size:14pt;font-weight:bold;background:#dbeafe;text-align:center;">${title}</td></tr>`;
 table += `<tr></tr>`;
 table += `<tr style="background:#e2e8f0;font-weight:bold;text-align:center;"><td style="width:60px;">PIN</td><td style="width:150px;">Аты</td><td style="width:120px;">Бөлүм</td>`;
 dayNumbers.forEach(num=>{ table+=`<td style="width:30px;">${num}</td>`; });
 table+=`<td>Жалпы саат</td><td>Жалпы күн</td></tr>`;

 for(let [pin,info] of pins){
  let rowData=[];
  let totalH=0, totalDays=0;
  let tds=`<td>${pin}</td><td>${info.name}</td><td>${info.bolum}</td>`;
  for(let d of lastDates){
   let ls=await db.ref(`osh/logs/${d}/${pin}`).once('value'); let lv=Object.values(ls.val()||{});
   if(!lv.length){ tds+=`<td style="background:#fee2e2;"></td>`; continue; }
   let h=calcWorkedHours(lv);
   if(h>0.5){ totalH+=h; totalDays++; tds+=`<td style="background:#dcfce7;">${h.toFixed(1)}</td>`; } else tds+=`<td></td>`;
  }
  tds+=`<td style="font-weight:bold;">${totalH.toFixed(1)}</td><td>${totalDays}</td>`;
  table+=`<tr>${tds}</tr>`;
 }
 table+='</table>';
 let blob=new Blob(['\uFEFF<html><head><meta charset="utf-8"></head><body>'+table+'</body></html>'],{type:'application/vnd.ms-excel'});
 let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`${title}.xls`; a.click();
}
load();
</script></body></html>
