<!DOCTYPE html><html lang="ky"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчеттор v1014</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-[#f8fafc] p-3 font-sans"><div class="max-w-[1200px] mx-auto"><div class="bg-white p-4 rounded-xl shadow mb-3"><div class="flex justify-between items-center flex-wrap gap-2"><div><a href="admin.html?v=1014" class="text-blue-600 text-sm">← Админка</a><h1 class="font-bold text-[20px]">📊 Отчеттор</h1></div><div class="flex gap-2 items-center"><input id="date" type="date" class="border p-2 rounded-lg text-sm"><button onclick="exportExcel()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-[12px] font-bold shadow">📥 Excel</button></div></div><div class="flex gap-2 mt-3 flex-wrap"><button onclick="setR('day')" id="r_day" class="bg-black text-white px-3 py-1.5 rounded-full text-[12px]">Күндүк</button><button onclick="setR('week')" id="r_week" class="bg-gray-100 px-3 py-1.5 rounded-full text-[12px]">Жумалык</button><button onclick="setR('month')" id="r_month" class="bg-gray-100 px-3 py-1.5 rounded-full text-[12px]">Айлык</button><select id="deptFilter" onchange="load()" class="border rounded-lg px-2 py-1 text-[12px]"><option value="all">Баардык бөлүм</option></select></div></div><div id="summary" class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-3"></div><div id="report" class="space-y-2"></div></div><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script><script>
firebase.initializeApp({databaseURL:"https://gps-tracker-osh-default-rtdb.firebaseio.com"});const db=firebase.database();
let mode='day', lastData=[];
document.getElementById('date').valueAsDate=new Date();
function setR(m){mode=m;document.querySelectorAll('[id^=r_]').forEach(b=>b.className='bg-gray-100 px-3 py-1.5 rounded-full text-[12px]');document.getElementById('r_'+m).className='bg-black text-white px-3 py-1.5 rounded-full text-[12px]';load()}
function hmToMin(hm){let [h,m]=hm.split(':').map(Number);return h*60+m}
function minToHM(min){let h=Math.floor(min/60),m=min%60;return (h<10?'0':'')+h+':'+(m<10?'0':'')+m}
function formatDate(d){return d.toISOString().split('T')[0]}
function getDates(){let base=new Date(document.getElementById('date').value);let dates=[];if(mode=='day')dates=[formatDate(base)];else if(mode=='week'){for(let i=0;i<7;i++){let d=new Date(base);d.setDate(base.getDate()-base.getDay()+i);dates.push(formatDate(d))}}else if(mode=='month'){let y=base.getFullYear(),m=base.getMonth();let days=new Date(y,m+1,0).getDate();for(let i=1;i<=days;i++){let d=new Date(y,m,i);dates.push(formatDate(d))}}return dates;}
db.ref('osh/pins').once('value',s=>{let v=s.val()||{};let depts=new Set(Object.values(v).map(x=>x.bolum));let sel=document.getElementById('deptFilter');depts.forEach(d=>{let o=document.createElement('option');o.value=d;o.innerText=d;sel.appendChild(o)})})
async function load(){let dept=document.getElementById('deptFilter').value;let pinsSnap=await db.ref('osh/pins').once('value');let pins=pinsSnap.val()||{};let all=Object.entries(pins).filter(([k,v])=>dept=='all'||v.bolum==dept);let dates=getDates();let html="";let late=0,earlyLunch=0,lateLunch=0,earlyLeave=0;lastData=[];for(let [pin,info] of all){let sched=info.schedule||{start:'08:00',lunchS:'12:00',lunchE:'13:00',end:'17:00'};let allLogs=[];for(let d of dates){let ls=await db.ref(`osh/logs/${d}/${pin}`).once('value');let lv=Object.values(ls.val()||{});lv.forEach(l=>allLogs.push({...l,date:d}));}allLogs.sort((a,b)=>a.t-b.t);if(!allLogs.length){html+=`<div class="bg-white p-3 rounded-xl border-l-4 border-l-gray-300"><div class="font-bold text-[13px]">${info.name} #${pin} <span class="text-[10px] text-gray-400">${info.bolum}</span></div><div class="text-[11px] text-gray-400">Маалымат жок (бүгүн жумушка келе элек)</div></div>`;lastData.push({pin,name:info.name,bolum:info.bolum,status:'Маалымат жок'});continue;}let status=[],cls='border-l-green-500',excelRow={pin,name:info.name,bolum:info.bolum};let firstIn=allLogs.find(l=>l.inside);let lastOut=[...allLogs].reverse().find(l=>!l.inside);if(firstIn){let ft=new Date(firstIn.t);let mins=ft.getHours()*60+ft.getMinutes();let diff=mins-hmToMin(sched.start);excelRow.keldi=minToHM(mins);if(diff>5){status.push(`🔴 Кечикти: ${diff} мүн (${minToHM(mins)} / ${sched.start})`);excelRow.kechikti=diff;cls='border-l-red-500';late++;}else{status.push(`🟢 Келди: ${minToHM(mins)}`);excelRow.kechikti=0}}if(lastOut){let ft=new Date(lastOut.t);let mins=ft.getHours()*60+ft.getMinutes();excelRow.ketti=minToHM(mins);if(mins < hmToMin(sched.end)-5){status.push(`🔴 Эрте кетти: ${minToHM(mins)} / ${sched.end}`);excelRow.erteKetti='Ооба';earlyLeave++;}else excelRow.erteKetti='Жок'}let lunchOut=allLogs.find(l=>!l.inside && new Date(l.t).getHours()>=11 && new Date(l.t).getHours()<=14);if(lunchOut){let ft=new Date(lunchOut.t);let mins=ft.getHours()*60+ft.getMinutes();if(mins < hmToMin(sched.lunchS)-5){status.push(`🟡 Обетке эрте: ${minToHM(mins)}`);earlyLunch++;}}let lunchIn=lunchOut?allLogs.find(l=>l.inside && l.t>lunchOut.t):null;if(lunchIn){let ft=new Date(lunchIn.t);let mins=ft.getHours()*60+ft.getMinutes();if(mins > hmToMin(sched.lunchE)+5){status.push(`🟠 Обеттен кеч: ${minToHM(mins)}`);lateLunch++;}}lastData.push({pin,name:info.name,bolum:info.bolum,...excelRow,full:status.join(' | ')});html+=`<div class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${cls}"><div class="flex justify-between"><div class="font-bold text-[13px]">${info.name} <span class="text-[10px] text-gray-500">#${pin} • ${info.bolum}</span></div><div class="text-[10px] text-gray-400">${sched.start}-${sched.end}</div></div><div class="mt-1 space-y-1 text-[11px]">${status.map(s=>`<div>${s}</div>`).join('')}</div></div>`;}document.getElementById('summary').innerHTML=`<div class="bg-red-50 p-3 rounded-xl"><div class="text-[11px] text-red-500">Кечиккен</div><div class="font-bold text-[18px]">${late}</div></div><div class="bg-yellow-50 p-3 rounded-xl"><div class="text-[11px] text-yellow-600">Обетке эрте</div><div class="font-bold">${earlyLunch}</div></div><div class="bg-orange-50 p-3 rounded-xl"><div class="text-[11px] text-orange-600">Обеттен кеч</div><div class="font-bold">${lateLunch}</div></div><div class="bg-gray-100 p-3 rounded-xl"><div class="text-[11px]">Эрте кеткен</div><div class="font-bold">${earlyLeave}</div></div>`;document.getElementById('report').innerHTML=html||'<div class="bg-white p-6 rounded-xl text-center text-gray-400">Маалымат жок</div>';}
function exportExcel(){if(!lastData.length)return alert('Отчет бош');let header=['PIN','Аты','Бөлүм','Келди','Кечиккен (мүн)','Кетти','Эрте кетти','Толук статус'];let rows=lastData.map(d=>[d.pin,d.name,d.bolum,d.keldi||'',d.kechikti||'',d.ketti||'',d.erteKetti||'',d.full||d.status||'']);let csv=[header,...rows].map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');let blob=new Blob([`\uFEFF${csv}`],{type:'text/csv;charset=utf-8;'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`otchet_${document.getElementById('date').value}_${mode}.csv`;a.click();}
load();
</script></body></html>
