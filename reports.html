<!DOCTYPE html>
<html lang="ky">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отчет - Кадамжай ЖДПБ v1100 IDEAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#f8fafc;padding:12px}
.header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:10px;flex-wrap:wrap;gap:8px}
.filters{display:grid;grid-template-columns:220px 1fr 1.2fr 180px 100px 100px;gap:8px;margin-bottom:10px}
@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}}
.input{padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;background:#fff;width:100%;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{padding:14px;border-radius:12px;text-align:center}
.stat small{font-size:11px;font-weight:bold;color:#64748b}
.stat b{display:block;font-size:22px;margin-top:4px}
.c-blue{background:#eff6ff;border:1px solid #bfdbfe}.c-blue b{color:#1e293b}
.c-green{background:#f0fdf4;border:1px solid #bbf7d0}.c-green b{color:#15803d}
.c-orange{background:#fff7ed;border:1px solid #fed7aa}.c-orange b{color:#c2410c}
.c-red{background:#fef2f2;border:1px solid #fecaca}.c-red b{color:#dc2626}
.table-wrap{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 10px;text-align:left;background:#f8fafc;color:#475569;font-size:11px;border-bottom:1px solid #e2e8f0}
td{padding:10px;border-bottom:1px solid #f1f5f9}
.badge{padding:4px 10px;border-radius:12px;font-size:11px;font-weight:bold;display:inline-flex;gap:4px;align-items:center}
.b-late{background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.b-ok{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.btn{padding:10px 14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:13px}
.btn-blue{background:#2563eb;color:#fff}.btn-green{background:#16a34a;color:#fff}.btn-dark{background:#334155;color:#fff}
.v1100{background:#e9d5ff;color:#6d28d9;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;align-items:center;gap:10px"><div style="width:32px;height:32px;background:#dcfce7;border-radius:50%;display:flex;align-items:center;justify-content:center">🌍</div><b>Отчет - Кадамжай ЖДПБ</b> <span class="v1100">v1100 IDEAL</span></div>
<div style="display:flex;gap:8px"><button class="btn" style="background:#f1f5f9" onclick="location.href='admin.html'">← Админ</button><button class="btn" style="background:#dcfce7;color:#166534" onclick="location.href='worker.html'">👷 Жумушчу</button></div>
</div>

<div class="filters">
<input class="input" type="date" id="date" value="2026-10-10">
<select class="input" id="deptFilter" onchange="render()"><option value="all">Бардык бөлүмдөр</option><option>ГСВ №10</option><option>Администрация</option><option>ГСВ №5</option></select>
<input class="input" id="search" placeholder="🔍 Аты / ПИН издөө..." oninput="render()" style="background:#fefce8">
<button class="btn btn-blue" onclick="render()">🔃 Жүктөө</button>
<button class="btn btn-green" onclick="exportExcel()">📥 Excel</button>
<button class="btn btn-dark" onclick="window.print()">🖨️ PDF</button>
</div>

<div class="stats">
<div class="stat c-blue"><small>БАРДЫГЫ</small><b id="s_all">2</b></div>
<div class="stat c-green"><small>КЕЛДИ</small><b id="s_in">2</b></div>
<div class="stat c-orange"><small>КЕЧИКТИ</small><b id="s_late">1</b></div>
<div class="stat c-red"><small>КЕЛБЕДИ</small><b id="s_abs">0</b></div>
</div>

<div class="table-wrap">
<div style="padding:10px 14px;display:flex;justify-content:space-between;border-bottom:1px solid #f1f5f9"><b style="font-size:13px">📋 <span id="dateLabel">10.10.2026</span> - Отчет</b><small style="color:#94a3b8">Табылды: <span id="found">2</span></small></div>
<table>
<thead><tr><th>№</th><th>Аты-жөнү</th><th>Бөлүм</th><th>ПИН</th><th>Кирди</th><th>Чыкты</th><th>Статус</th><th>Тел</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>

<div style="text-align:center;color:#94a3b8;font-size:11px;margin-top:10px">v1100 IDEAL • reports.html • Кадамжай ЖДПБ</div>

<script>
let workers=[];
try{ workers=JSON.parse(localStorage.getItem('gps_workers')||'[]'); }catch(e){}
if(!workers.length) workers=[{name:'Иматали',dept:'ГСВ №10',pin:'1420',timeIn:'',timeOut:'',status:'late',phone:'d_arwn'},{name:'Тилек',dept:'Администрация',pin:'3841',timeIn:'',timeOut:'',status:'ok',phone:'dev_63'}];

function render(){
 let dept=document.getElementById('deptFilter').value;
 let q=document.getElementById('search').value.toLowerCase();
 let date=document.getElementById('date').value;
 document.getElementById('dateLabel').innerText=date.split('-').reverse().join('.');
 let filtered=workers.filter(w=>{
  if(dept!=='all' && w.dept!==dept) return false;
  if(q &&!((w.name||'').toLowerCase().includes(q) || (w.pin||'').includes(q))) return false;
  return true;
 });
 let late=filtered.filter(w=>w.status==='late').length;
 let html='';
 filtered.forEach((w,i)=>{
  let badge=w.status==='late'?'<span class="badge b-late">🕒 Кечикти</span>':'<span class="badge b-ok">✅ Убагында</span>';
  html+=`<tr><td>${i+1}</td><td><b>${w.name}</b></td><td>${w.dept}</td><td><b>${w.pin}</b></td><td>-</td><td>-</td><td>${badge}</td><td>✅ ${w.phone||''}</td></tr>`;
 });
 document.getElementById('tbody').innerHTML=html;
 document.getElementById('s_all').innerText=filtered.length;
 document.getElementById('s_in').innerText=filtered.length;
 document.getElementById('s_late').innerText=late;
 document.getElementById('s_abs').innerText=0;
 document.getElementById('found').innerText=filtered.length;
}
function exportExcel(){
 let csv='№,Аты,Бөлүм,ПИН,Статус,Тел\n';
 workers.forEach((w,i)=>{ csv+=`${i+1},${w.name},${w.dept},${w.pin},${w.status},${w.phone}\n`; });
 let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='otchet_'+document.getElementById('date').value+'.csv'; a.click();
}
render();
</script>
</body>
</html>
